buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Resolve the UniTrack core SDK (io.unitrack:sdk) from mavenLocal — we publish
// the locally-fixed core there with `./gradlew :unitrack:publishToMavenLocal`,
// so the RN module's `implementation 'io.unitrack:sdk:1.0.0'` picks up the
// device-tested fixes (HTTP transport, JNI, db_path escape, screen names).
allprojects {
    repositories {
        mavenLocal()
    }
}

<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>UniTrack · User Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#E7EAF1;
  --card:#F3F6FB;
  --card-2:#EDF0F6;
  --navy:#33415C;
  --ink:#5B6478;
  --muted:#9AA4B6;
  --line:#DCE1EB;
  --pink:#FF5C86;   --pink2:#FF8E72;
  --orange:#FF9F2E; --orange2:#FFC44B;
  --green:#1FC57B;  --green2:#46D6A6;
  --blue:#4D9DFF;   --blue2:#73B8FF;
  --red:#FF5C6C;
  --sh-out: 16px 16px 34px rgba(176,185,205,0.55), -12px -12px 26px rgba(255,255,255,0.55);
  --sh-sm: 8px 8px 18px rgba(176,185,205,0.50), -7px -7px 15px rgba(255,255,255,0.55);
  --sh-inset: inset 5px 5px 11px rgba(176,185,205,0.55), inset -5px -5px 11px rgba(255,255,255,0.50);
  --sh-press: inset 4px 4px 9px rgba(176,185,205,0.6), inset -4px -4px 9px rgba(255,255,255,0.5);
  --sh-float: 0 24px 48px rgba(120,132,160,0.30);
}
*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ height:100%; }
body{ font-family:'Poppins',system-ui,sans-serif; background:var(--bg); color:var(--ink); line-height:1.5; overflow:hidden; }
.mono{ font-family:'JetBrains Mono',monospace; }
button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }

.app{ height:100vh; display:flex; flex-direction:column; padding:18px 22px 18px; gap:14px; }
.app.fullscreen{ padding:0; gap:0; }
.app.fullscreen .topbar{ display:none; }
.app.fullscreen .canvas-wrap{ border-radius:0; }
.app.fullscreen .exit-full{ display:flex; }

/* compact topbar */
.topbar{ display:flex; align-items:center; gap:12px; flex-shrink:0; padding:0 4px; }
.topbar .back{ display:inline-flex; align-items:center; gap:7px; padding:9px 14px; border-radius:12px;
  background:var(--card); box-shadow:var(--sh-sm); color:var(--navy); font-weight:600; font-size:13.5px; transition:box-shadow .15s; }
.topbar .back:hover{ box-shadow:var(--sh-press); }

.idchip{ display:inline-flex; align-items:center; gap:10px; padding:7px 14px; border-radius:13px;
  background:var(--card); box-shadow:var(--sh-sm); font-family:'JetBrains Mono',monospace; font-size:13px;
  font-weight:500; color:var(--navy); }
.trk-mini{ display:inline-flex; align-items:center; gap:8px; padding:5px 11px; border-radius:9px;
  background:rgba(255,92,108,0.10); box-shadow:inset 0 0 0 1.5px rgba(255,92,108,0.30);
  font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:700; color:var(--red); }
.trk-mini .cp{ width:22px; height:22px; border-radius:6px; background:var(--card); box-shadow:var(--sh-sm);
  display:flex; align-items:center; justify-content:center; color:var(--muted); cursor:pointer; }
.trk-mini .cp:hover{ color:var(--navy); }
.idsep{ color:var(--muted); }
.uid{ color:var(--ink); font-weight:500; }

/* zoom cluster + buttons share same height */
.zoom, .reset{ margin-left:0; }
.exit-full{ position:absolute; top:18px; right:18px; width:42px; height:42px; border-radius:13px;
  background:var(--card); box-shadow:var(--sh-sm); color:var(--navy); display:none; align-items:center; justify-content:center;
  z-index:5; transition:box-shadow .12s; }
.exit-full:hover{ box-shadow:var(--sh-press); }

/* legend floating bottom-left of canvas */
.legend-float{ position:absolute; bottom:14px; left:14px; display:flex; align-items:center; gap:16px;
  padding:7px 13px; border-radius:11px; background:var(--card); box-shadow:var(--sh-sm);
  font-size:12px; font-weight:500; color:var(--ink); z-index:3; pointer-events:none; }
.legend-float .li{ display:inline-flex; align-items:center; gap:6px; }
.legend-float .sw{ width:12px; height:12px; border-radius:4px; }

/* ---------- breadcrumb ---------- */
.crumb{ display:flex; align-items:center; gap:14px; flex-shrink:0; padding:0 4px; }
.crumb .back{ display:inline-flex; align-items:center; gap:8px; padding:9px 16px; border-radius:13px;
  background:var(--card); box-shadow:var(--sh-sm); color:var(--navy); font-weight:600; font-size:14px; transition:box-shadow .15s; }
.crumb .back:hover{ box-shadow:var(--sh-press); }
.crumb .ttl{ font-size:16px; color:var(--muted); font-weight:500; }
.crumb .ttl b{ color:var(--navy); font-weight:700; }

/* ---------- header card ---------- */
.header{ background:var(--card); border-radius:22px; box-shadow:var(--sh-out); padding:18px 26px;
  display:flex; align-items:center; gap:30px; flex-shrink:0; }
.field{ display:flex; flex-direction:column; gap:4px; min-width:0; }
.field .lbl{ font-size:11px; font-weight:700; letter-spacing:1.4px; text-transform:uppercase; color:var(--muted); }
.field .val{ font-family:'JetBrains Mono',monospace; font-size:15px; font-weight:500; color:var(--navy); white-space:nowrap; }
.field.sess .val{ font-size:14px; }
.trk{ display:inline-flex; align-items:center; gap:9px; padding:7px 13px; border-radius:11px;
  background:rgba(255,92,108,0.10); box-shadow:inset 0 0 0 1.5px rgba(255,92,108,0.30);
  font-family:'JetBrains Mono',monospace; font-size:14px; font-weight:700; color:var(--red); }
.trk .cp{ width:24px; height:24px; border-radius:7px; background:var(--card); box-shadow:var(--sh-sm);
  display:flex; align-items:center; justify-content:center; color:var(--muted); cursor:pointer; }
.trk .cp:hover{ color:var(--navy); }
.header .acts{ margin-left:auto; display:flex; gap:12px; flex-shrink:0; }
.btn{ display:inline-flex; align-items:center; gap:8px; padding:11px 18px; border-radius:13px;
  background:var(--card); box-shadow:var(--sh-sm); font-weight:600; font-size:14px; color:var(--navy); transition:box-shadow .15s; }
.btn:hover{ box-shadow:var(--sh-press); }
.btn.danger{ color:var(--red); }
.divx{ width:1.5px; align-self:stretch; background:var(--line); margin:4px 0; }

/* ---------- toolbar ---------- */
.toolbar{ display:flex; align-items:center; gap:18px; flex-shrink:0; padding:0 2px; }
.zoom{ display:flex; align-items:center; gap:4px; padding:6px; border-radius:15px; background:var(--card); box-shadow:var(--sh-sm); }
.zoom button{ width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center;
  color:var(--navy); font-size:20px; font-weight:600; transition:box-shadow .12s; }
.zoom button:hover{ box-shadow:var(--sh-press); }
.zoom .pct{ width:62px; text-align:center; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px; color:var(--navy); }
.reset{ display:inline-flex; align-items:center; gap:8px; padding:10px 18px; border-radius:13px;
  background:var(--card); box-shadow:var(--sh-sm); color:var(--navy); font-weight:600; font-size:14px; transition:box-shadow .12s; }
.reset:hover{ box-shadow:var(--sh-press); }
.hint{ font-size:13.5px; color:var(--muted); font-weight:500; }
.hint b{ color:var(--ink); font-weight:600; }

.stats{ margin-left:auto; display:flex; align-items:stretch; gap:0; background:var(--card); border-radius:16px; box-shadow:var(--sh-sm); padding:10px 6px; }
.stat{ display:flex; flex-direction:column; align-items:center; gap:2px; padding:2px 20px; }
.stat + .stat{ border-left:1.5px solid var(--line); }
.stat .k{ font-size:10.5px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--muted); white-space:nowrap; }
.stat .v{ font-family:'JetBrains Mono',monospace; font-size:18px; font-weight:700; color:var(--navy); }
.stat .v.ok{ color:var(--green); }

/* ---------- canvas ---------- */
.canvas-wrap{ flex:1; min-height:0; border-radius:24px; background:var(--card-2);
  box-shadow:var(--sh-inset); padding:30px; overflow:auto; position:relative; }
.canvas-wrap::-webkit-scrollbar{ height:12px; width:12px; }
.canvas-wrap::-webkit-scrollbar-thumb{ background:#CSomethingD; border-radius:8px; }
.canvas-wrap::-webkit-scrollbar-thumb{ background:rgba(154,164,182,0.45); border-radius:8px; border:3px solid var(--card-2); }
.track{ display:flex; flex-direction:column; gap:80px; width:max-content; min-width:100%; min-height:100%;
  transform-origin:left center; transition:transform .2s ease; padding:30px 4px 10px; position:relative; }
.row{ display:flex; align-items:center; gap:0; }
.row.branch-row{ padding-left:432px; position:relative; }
.branchSvg{ position:absolute; left:0; top:0; pointer-events:none; overflow:visible; }
.node.branch{ position:relative; }
.node.branch::before{ content:'NHÁNH'; position:absolute; top:-12px; left:18px;
  background:linear-gradient(135deg,var(--orange),var(--orange2));
  color:#fff; font-size:10px; font-weight:700; letter-spacing:1.2px;
  padding:3px 10px; border-radius:7px;
  box-shadow:0 4px 10px rgba(255,159,46,0.40); }
.node.branch .nbadge{ background:linear-gradient(135deg,var(--orange),var(--orange2));
  box-shadow:0 8px 16px rgba(255,159,46,0.40); }
.conn.branch-conn .clbl{ background:rgba(255,159,46,0.15); color:var(--orange);
  box-shadow:inset 0 0 0 1.5px rgba(255,159,46,0.32); }
.conn.branch-conn svg{ color:var(--orange); }

/* node card */
.node{ width:336px; flex-shrink:0; background:var(--card); border-radius:22px; box-shadow:var(--sh-sm);
  padding:18px 20px 16px; cursor:pointer; transition:transform .18s, box-shadow .18s; position:relative; }
.node:hover{ transform:translateY(-4px); box-shadow:var(--sh-out); }
.node.sel{ box-shadow:0 0 0 2.5px var(--blue), var(--sh-out); }
.node-top{ display:flex; align-items:center; gap:12px; }
.nbadge{ width:34px; height:34px; border-radius:11px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg,var(--blue),var(--blue2)); color:#fff; font-weight:700; font-size:17px;
  box-shadow:0 8px 16px rgba(77,157,255,0.40); }
.node.dest .nbadge{ background:linear-gradient(135deg,var(--green),var(--green2)); box-shadow:0 8px 16px rgba(40,196,126,0.38); }
.nname{ font-size:18px; font-weight:700; color:var(--navy); letter-spacing:-0.2px; }
.ndur{ margin-left:auto; display:inline-flex; align-items:center; gap:6px; font-family:'JetBrains Mono',monospace;
  font-size:14px; font-weight:700; color:var(--navy); }
.ndur svg{ color:var(--orange); }
.ntime{ font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--muted); margin-top:7px; padding-left:1px; }
.napi{ display:flex; align-items:center; gap:8px; margin-top:14px; font-family:'JetBrains Mono',monospace;
  font-size:12px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; color:var(--blue); }
.napi svg{ width:14px; height:14px; }
.apis{ margin-top:9px; display:flex; flex-direction:column; gap:2px; }
.api{ display:flex; align-items:center; gap:10px; padding:6px 8px; border-radius:9px; transition:background .12s; }
.api:hover{ background:var(--card-2); }
.meth{ font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; padding:3px 7px; border-radius:6px; flex-shrink:0; width:42px; text-align:center; }
.meth.get{ background:rgba(77,157,255,0.14); color:#2F7BD6; }
.meth.post{ background:rgba(255,92,134,0.14); color:#E0436A; }
.path{ font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0; }
.lat{ display:flex; align-items:center; gap:6px; flex-shrink:0; font-family:'JetBrains Mono',monospace; font-size:12.5px; font-weight:500; color:var(--muted); }
.dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.dot.g{ background:var(--green); } .dot.o{ background:var(--orange); } .dot.r{ background:var(--red); }
.tapfoot{ margin-top:13px; padding:10px 14px; border-radius:12px; background:var(--card-2); box-shadow:var(--sh-inset);
  display:flex; align-items:center; gap:9px; font-family:'JetBrains Mono',monospace; font-size:12.5px; font-weight:700; color:var(--navy); }
.tapfoot .em{ font-size:14px; }
.tapfoot.dest{ color:var(--green); }

/* connector */
.conn{ flex-shrink:0; width:96px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px; position:relative; }
.conn .clbl{ font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; color:var(--muted);
  background:var(--card); box-shadow:var(--sh-sm); border-radius:8px; padding:4px 9px; white-space:nowrap; max-width:120px; overflow:hidden; text-overflow:ellipsis; }
.conn svg{ color:var(--blue); }

/* ---------- legend ---------- */
.legend{ display:flex; align-items:center; gap:26px; flex-shrink:0; padding:2px 6px; font-size:13.5px; font-weight:500; color:var(--ink); white-space:nowrap; }
.legend .li{ display:flex; align-items:center; gap:9px; }
.legend .sw{ width:14px; height:14px; border-radius:5px; }
.legend .arrowli{ color:var(--muted); display:flex; align-items:center; gap:8px; }

/* ---------- drawer ---------- */
.scrim{ position:fixed; inset:0; background:rgba(46,54,80,0.30); backdrop-filter:blur(2px); opacity:0; pointer-events:none; transition:opacity .25s; z-index:40; }
.scrim.show{ opacity:1; pointer-events:auto; }
.drawer{ position:fixed; top:0; right:0; height:100vh; width:460px; max-width:92vw; background:var(--bg);
  box-shadow:var(--sh-float); transform:translateX(100%); transition:transform .28s cubic-bezier(.4,0,.2,1); z-index:50;
  display:flex; flex-direction:column; }
.drawer.show{ transform:translateX(0); }
.dr-head{ padding:26px 28px 18px; border-bottom:1.5px solid var(--line); position:relative; flex-shrink:0; }
.dr-accent{ position:absolute; top:0; left:0; right:0; height:5px; background:linear-gradient(90deg,var(--blue),var(--blue2)); }
.dr-accent.dest{ background:linear-gradient(90deg,var(--green),var(--green2)); }
.dr-accent.branch{ background:linear-gradient(90deg,var(--orange),var(--orange2)); }
.dr-name .nbadge.branch{ background:linear-gradient(135deg,var(--orange),var(--orange2)); box-shadow:0 8px 16px rgba(255,159,46,0.40); }
.dr-close{ position:absolute; top:20px; right:22px; width:38px; height:38px; border-radius:12px; background:var(--card);
  box-shadow:var(--sh-sm); display:flex; align-items:center; justify-content:center; color:var(--navy); transition:box-shadow .12s; }
.dr-close:hover{ box-shadow:var(--sh-press); }
.dr-name{ display:flex; align-items:center; gap:12px; }
.dr-name .nbadge{ width:38px; height:38px; font-size:18px; }
.dr-name h2{ font-size:24px; font-weight:700; color:var(--navy); letter-spacing:-0.4px; }
.dr-time{ font-family:'JetBrains Mono',monospace; font-size:13.5px; color:var(--muted); margin-top:10px; }
.dr-time b{ color:var(--orange); font-weight:700; }
.dr-chips{ display:flex; gap:9px; margin-top:16px; flex-wrap:wrap; }
.chip{ display:inline-flex; align-items:center; gap:7px; padding:7px 13px; border-radius:999px; white-space:nowrap;
  font-size:13px; font-weight:600; box-shadow:var(--sh-sm); background:var(--card); color:var(--navy); }
.chip.green{ background:rgba(31,197,123,0.12); color:#0E9B5C; box-shadow:none; }
.chip.blue{ background:rgba(77,157,255,0.12); color:#2F7BD6; box-shadow:none; }
.chip.purple{ background:rgba(140,120,240,0.14); color:#6D5AD6; box-shadow:none; }
.dr-body{ flex:1; overflow-y:auto; padding:22px 28px 32px; }
.kv{ display:grid; grid-template-columns:auto 1fr; gap:13px 18px; }
.kv .k{ font-size:14px; color:var(--muted); font-weight:500; }
.kv .v{ font-family:'JetBrains Mono',monospace; font-size:15px; font-weight:700; color:var(--navy); text-align:right; }
.kv .v.sub{ font-weight:500; color:var(--ink); font-size:14px; }
.sec-h{ display:flex; align-items:center; gap:9px; margin-top:26px; margin-bottom:13px;
  font-size:15px; font-weight:700; color:var(--blue); }
.sec-h.green{ color:var(--green); } .sec-h.purple{ color:#6D5AD6; }
.sec-h svg{ width:17px; height:17px; }
.apirow{ display:flex; align-items:center; gap:12px; padding:13px 15px; border-radius:14px; background:var(--card); box-shadow:var(--sh-sm); margin-bottom:10px; }
.apirow .path{ font-size:13.5px; }
.apirow .st{ font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700; padding:3px 9px; border-radius:7px;
  background:rgba(31,197,123,0.14); color:#0E9B5C; flex-shrink:0; }
.apirow .ms{ font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:700; color:var(--navy); flex-shrink:0; min-width:54px; text-align:right; }
.taprow{ display:flex; align-items:center; gap:13px; padding:15px 16px; border-radius:14px; background:var(--card);
  box-shadow:inset 0 0 0 1.5px rgba(140,120,240,0.28); }
.taprow .tg{ font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; padding:5px 10px; border-radius:8px;
  background:rgba(140,120,240,0.15); color:#6D5AD6; flex-shrink:0; }
.taprow .tx{ flex:1; min-width:0; }
.taprow .tx .id{ font-family:'JetBrains Mono',monospace; font-size:13.5px; font-weight:700; color:var(--navy); }
.taprow .tx .to{ font-size:13px; color:var(--ink); margin-top:2px; }
.taprow .dl{ font-family:'JetBrains Mono',monospace; font-size:12.5px; font-weight:600; color:var(--muted); flex-shrink:0; }
.dest-note{ display:flex; align-items:center; gap:12px; padding:16px 18px; border-radius:14px;
  background:rgba(31,197,123,0.10); color:#0E9B5C; font-weight:600; font-size:15px; }
.dr-empty{ height:18px; }
</style>
</head>
<body>

<div class="app">
  <!-- COMPACT TOPBAR: back · ids · zoom · fullscreen -->
  <div class="topbar">
    <button class="back" id="btnBack"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Sessions</button>

    <!-- chip [tracking_id · userid] -->
    <div class="idchip">
      <span class="trk-mini">a3c14e2f-bb87-4d2e-9912-1c79b8a09b8d
        <span class="cp" title="Copy tracking_id"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></span>
      </span>
      <span class="idsep">·</span>
      <span class="uid">user 584252dd-c117-4e35-9bbf-fe034dde4fce</span>
    </div>

    <!-- zoom cluster + fullscreen -->
    <div class="zoom">
      <button id="zout" title="Thu nhỏ">−</button>
      <span class="pct" id="zpct">100%</span>
      <button id="zin" title="Phóng to">+</button>
    </div>
    <button class="reset" id="zreset" title="Reset zoom"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
    <button class="reset" id="zfull" title="Toàn màn hình (F)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9V3h6"/><path d="M21 9V3h-6"/><path d="M3 15v6h6"/><path d="M21 15v6h-6"/></svg></button>
  </div>

  <!-- CANVAS — chiếm phần lớn màn hình -->
  <div class="canvas-wrap" id="canvasWrap">
    <div class="track" id="track"></div>

    <!-- floating legend pinned bottom-left -->
    <div class="legend-float">
      <span class="li"><span class="sw" style="background:var(--green);"></span>2xx</span>
      <span class="li"><span class="sw" style="background:var(--orange);"></span>chậm</span>
      <span class="li"><span class="sw" style="background:var(--red);"></span>4xx/5xx</span>
      <span class="li"><span class="sw" style="background:var(--orange);border-radius:50%;width:8px;height:8px;"></span>nhánh phụ</span>
    </div>
    <!-- floating exit-fullscreen button -->
    <button class="exit-full" id="zexit" title="Thoát toàn màn hình (Esc)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h6v6"/><path d="M20 10h-6V4"/><path d="M14 10l7-7"/><path d="M3 21l7-7"/></svg></button>
  </div>
</div>

<!-- drawer -->
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="dr-head">
    <div class="dr-accent" id="drAccent"></div>
    <button class="dr-close" id="drClose"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <div class="dr-name"><div class="nbadge" id="drBadge">4</div><h2 id="drTitle">CameraEventsVC</h2></div>
    <div class="dr-time" id="drTime"></div>
    <div class="dr-chips" id="drChips"></div>
  </div>
  <div class="dr-body" id="drBody"></div>
</aside>

<script>
const NODES = [
  {
    name:"HomeVC", dur:"3.21s", enter:"10:00:00.000", exit:"10:00:03.215", fgSec:"3.21",
    apis:[
      {m:"GET", p:"/api/v3/home/feed", full:"/api/v3/home/feed", ms:312, st:200},
      {m:"GET", p:"/api/v3/user/profile", full:"/api/v3/user/profile", ms:148, st:200},
      {m:"GET", p:"/api/v3/notifications/unread", full:"/api/v3/notifications/unread", ms:96, st:200},
      {m:"GET", p:"/api/v3/banners/active", full:"/api/v3/banners/active", ms:124, st:200},
    ],
    tap:{id:"tap_tab_security", to:'"An ninh"', delay:"0.28s"},
  },
  {
    name:"SecurityVC", sub:"An ninh tab", dur:"2.11s", enter:"10:00:03.495", exit:"10:00:05.602", fgSec:"2.11",
    apis:[
      {m:"GET", p:"/api/v3/cameras/list", full:"/api/v3/cameras/list", ms:268, st:200},
      {m:"GET", p:"/api/v3/cameras/online-status", full:"/api/v3/cameras/online-status", ms:184, st:200},
      {m:"POST", p:"/api/v3/mqtt/connect-info", full:"/api/v3/mqtt/connect-info/{session}", ms:207, st:200},
    ],
    tap:{id:"tap_camera_item[0]", to:'"Camera phòng khách"', delay:"0.31s"},
  },
  {
    name:"LiveCameraVC", dur:"3.57s", enter:"10:00:05.912", exit:"10:00:09.483", fgSec:"3.57",
    apis:[
      {m:"GET", p:"/api/v3/camera/{id}/info", full:"/api/v3/camera/{id}/info", ms:156, st:200},
      {m:"GET", p:"/api/v3/camera/{id}/events", full:"/api/v3/camera/{id}/events?range=live", ms:1240, st:200, slow:true},
      {m:"POST", p:"/api/v3/camera/{id}/stream/start", full:"/api/v3/camera/{id}/stream/start", ms:201, st:200},
      {m:"POST", p:"/api/v3/camera/{id}/stream/keepalive", full:"/api/v3/camera/{id}/stream/keepalive", ms:98, st:200},
    ],
    tap:{id:"btn_playback", to:'"Phát lại"', delay:"0.22s"},
  },
  {
    name:"CameraEventsVC", dur:"1.59s", enter:"10:00:09.705", exit:"10:00:11.298", fgSec:"1.59",
    apis:[
      {m:"GET", p:"/api/v3/camera/{id}/events?from=…&to=…", full:"/api/v3/camera/{id}/events?from=…&to=…", ms:489, st:200},
      {m:"GET", p:"/api/v3/camera/{id}/thumbnails", full:"/api/v3/camera/{id}/thumbnails", ms:287, st:200},
    ],
    tap:{id:"tap_event_item[2]", to:'"Sự kiện 09:42"', delay:"0.18s"},
  },
  {
    name:"PlaybackVC", dur:"0.94s", enter:"10:00:11.478", exit:"10:00:12.420", fgSec:"0.94", dest:true,
    apis:[
      {m:"GET", p:"/api/v3/event/{id}/playback-url", full:"/api/v3/event/{id}/playback-url", ms:208, st:200},
      {m:"GET", p:"/api/v3/event/{id}/meta", full:"/api/v3/event/{id}/meta", ms:92, st:200},
      {m:"POST", p:"/api/v3/event/{id}/playback/start", full:"/api/v3/event/{id}/playback/start", ms:141, st:200},
    ],
    tap:null,
  },
];

// Nhánh phụ: user tap icon thông báo ở SecurityVC -> xem list noti ->
// tap noti camera -> push thẳng tới PlaybackVC (cùng đích, đường khác)
const BRANCH = {
  // anchor: tap chip ngoài card SecurityVC dẫn xuống nhánh
  fromIdx: 1,   // SecurityVC
  toIdx: 4,     // PlaybackVC
  branchTap: { id:"tap_noti_icon", to:'"🔔 thông báo"', delay:"0.11s" },
  node:{
    name:"NotificationListVC", dur:"1.38s", enter:"10:00:05.715", exit:"10:00:07.090", fgSec:"1.38",
    apis:[
      {m:"GET", p:"/api/v3/notifications", full:"/api/v3/notifications?page=1", ms:534, st:200},
      {m:"GET", p:"/api/v3/notifications/preview", full:"/api/v3/notifications/preview", ms:198, st:200},
      {m:"POST", p:"/api/v3/notifications/mark-seen", full:"/api/v3/notifications/mark-seen", ms:91, st:200},
    ],
    tap:{ id:"tap_noti_item", to:'"Camera phát hiện chuyển động"', delay:"0.39s" },
  },
};

const ICON_CLOCK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
const ICON_GLOBE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18z"/></svg>';
const ICON_TAP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11.5V5a2 2 0 0 1 4 0v6"/><path d="M13 8a2 2 0 0 1 4 0v4"/><path d="M17 9.5a2 2 0 0 1 4 0V16a6 6 0 0 1-6 6h-2a8 8 0 0 1-7-4l-2.5-4a2 2 0 0 1 3.5-2L13 13"/></svg>';
const ARROW = '<svg width="40" height="16" viewBox="0 0 40 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8h32"/><path d="M28 3l6 5-6 5"/></svg>';

function dotClass(a){ if(a.st>=400) return 'r'; if(a.slow||a.ms>1000) return 'o'; return 'g'; }
function apiTotal(n){ return n.apis.reduce((s,a)=>s+a.ms,0); }
function pctOf(n){ return Math.round(apiTotal(n)/ (parseFloat(n.fgSec)*1000) * 100); }

const track = document.getElementById('track');
function nodeHtml(n, labelIdx, isBranchNode){
  const apisHtml = n.apis.map(a=>`
    <div class="api">
      <span class="meth ${a.m.toLowerCase()}">${a.m}</span>
      <span class="path" title="${a.full}">${a.p}</span>
      <span class="lat"><span class="dot ${dotClass(a)}"></span>${a.ms}ms</span>
    </div>`).join('');
  const foot = n.tap
    ? `<div class="tapfoot"><span class="em">👆</span>${n.tap.id} → ${n.tap.to}</div>`
    : `<div class="tapfoot dest"><span class="em">🎯</span>Đích đến của flow</div>`;
  const classes = ['node'];
  if(n.dest) classes.push('dest');
  if(isBranchNode) classes.push('branch');
  return `
    <div class="${classes.join(' ')}" data-i="${labelIdx.dataI}">
      <div class="node-top">
        <div class="nbadge">${labelIdx.label}</div>
        <div class="nname">${n.name}${n.sub?` <span style="font-weight:500;color:var(--muted);font-size:14px;">(${n.sub})</span>`:''}</div>
        <div class="ndur">${ICON_CLOCK}${n.dur}</div>
      </div>
      <div class="ntime">${n.enter} → ${n.exit}</div>
      <div class="napi">${ICON_GLOBE}${n.apis.length} API call</div>
      <div class="apis">${apisHtml}</div>
      ${foot}
    </div>`;
}

function renderFlow(){
  // MAIN ROW
  let mainHtml = '';
  NODES.forEach((n,i)=>{
    mainHtml += nodeHtml(n, {label:String(i+1), dataI:'M'+i});
    if(i < NODES.length-1){
      const lbl = n.tap ? n.tap.to.replace(/"/g,'') : 'navigate';
      mainHtml += `<div class="conn"><span class="clbl">${lbl}</span>${ARROW}</div>`;
    }
  });

  // BRANCH ROW: connector "branch-out" → node B1 → connector back-up
  const branchTapLbl = BRANCH.branchTap.to.replace(/"/g,'');
  const branchNodeTapLbl = BRANCH.node.tap.to.replace(/"/g,'');
  const branchHtml = `
    <div class="conn branch-conn"><span class="clbl">${branchTapLbl}</span>${ARROW}</div>
    ${nodeHtml(BRANCH.node, {label:'B1', dataI:'B0'}, true)}
    <div class="conn branch-conn"><span class="clbl">${branchNodeTapLbl}</span>${ARROW}</div>
  `;

  track.innerHTML = `
    <div class="row main-row" id="rowMain">${mainHtml}</div>
    <div class="row branch-row" id="rowBranch">${branchHtml}</div>
  `;
  drawBranchArcs();
  track.querySelectorAll('.node').forEach(el=>{
    el.addEventListener('click', ()=> openDrawer(el.dataset.i));
  });
}

function drawBranchArcs(){
  // Vẽ 2 SVG arc: từ đáy SecurityVC xuống đầu B1 (fork), từ đáy B1 cong lên đáy PlaybackVC (merge)
  const old = track.querySelector('.branchSvg');
  if (old) old.remove();
  const sec = track.querySelector(`[data-i="M${BRANCH.fromIdx}"]`);
  const dest = track.querySelector(`[data-i="M${BRANCH.toIdx}"]`);
  const branchNode = track.querySelector('[data-i="B0"]');
  if (!sec || !dest || !branchNode) return;

  const tRect = track.getBoundingClientRect();
  const sRect = sec.getBoundingClientRect();
  const dRect = dest.getBoundingClientRect();
  const bRect = branchNode.getBoundingClientRect();

  // toạ độ tương đối track
  const sx = sRect.left + sRect.width/2 - tRect.left;
  const sy = sRect.bottom - tRect.top;
  const dx = dRect.left + dRect.width/2 - tRect.left;
  const dy = dRect.bottom - tRect.top;
  const bx1 = bRect.left + bRect.width/2 - tRect.left;
  const by1 = bRect.top - tRect.top;

  // path 1: Security bottom → B1 top (cong xuống bên trái)
  const c1y = (sy + by1) / 2 + 30;
  const path1 = `M ${sx} ${sy} C ${sx} ${c1y}, ${bx1} ${c1y - 30}, ${bx1} ${by1 - 8}`;

  // path 2: B1 bottom → Playback bottom (vòng dưới và lên)
  const bx2 = bRect.right - tRect.left;
  const by2 = bRect.bottom - tRect.top;
  const c2y = Math.max(by2, dy) + 80;
  const path2 = `M ${bx2 - 16} ${by2} C ${bx2 + 60} ${c2y}, ${dx} ${c2y}, ${dx} ${dy + 8}`;

  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('class', 'branchSvg');
  svg.setAttribute('width', tRect.width);
  svg.setAttribute('height', tRect.height);
  svg.style.width = tRect.width + 'px';
  svg.style.height = tRect.height + 'px';

  // defs marker arrow orange
  const defs = document.createElementNS(svgNS, 'defs');
  defs.innerHTML = `
    <marker id="arrOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#FF9F2E"/>
    </marker>`;
  svg.appendChild(defs);

  const mkPath = (d) => {
    const p = document.createElementNS(svgNS, 'path');
    p.setAttribute('d', d);
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke', '#FF9F2E');
    p.setAttribute('stroke-width', '2.6');
    p.setAttribute('stroke-dasharray', '7 5');
    p.setAttribute('stroke-linecap', 'round');
    p.setAttribute('marker-end', 'url(#arrOrange)');
    return p;
  };
  svg.appendChild(mkPath(path1));
  svg.appendChild(mkPath(path2));

  track.appendChild(svg);
}

renderFlow();
window.addEventListener('resize', drawBranchArcs);

/* ---------- drawer ---------- */
const drawer = document.getElementById('drawer');
const scrim = document.getElementById('scrim');
let selEl = null;

function openDrawer(key){
  let n, label, isBranch=false;
  if (key === 'B0') { n = BRANCH.node; label = 'B1'; isBranch = true; }
  else {
    const i = parseInt(key.slice(1), 10);
    n = NODES[i];
    label = String(i+1);
  }
  document.querySelectorAll('.node').forEach(e=>e.classList.remove('sel'));
  selEl = track.querySelector(`.node[data-i="${key}"]`);
  if(selEl) selEl.classList.add('sel');

  document.getElementById('drBadge').textContent = label;
  document.getElementById('drBadge').className = 'nbadge';
  document.getElementById('drAccent').className = 'dr-accent' + (n.dest?' dest':'') + (isBranch?' branch':'');
  if(n.dest) document.getElementById('drBadge').classList.add('dest');
  if(isBranch) document.getElementById('drBadge').classList.add('branch');
  document.getElementById('drTitle').textContent = n.name + (n.sub?` (${n.sub})`:'');
  document.getElementById('drTime').innerHTML = `${n.enter} → ${n.exit} · <b>${n.dur}</b>${isBranch?' · <span style="color:var(--orange);font-weight:700">NHÁNH PHỤ</span>':''}`;

  const ok = n.apis.filter(a=>a.st<400).length;
  document.getElementById('drChips').innerHTML = `
    <span class="chip green">${ICONwrap(ICON_GLOBE)} ${n.apis.length} API</span>
    <span class="chip blue">${ok}/${n.apis.length} 2xx</span>
    <span class="chip purple">${ICONwrap(ICON_TAP)} ${n.tap?1:0} tap</span>`;

  const tot = apiTotal(n);
  let body = `
    <div class="kv">
      <span class="k">Enter</span><span class="v">${n.enter}</span>
      <span class="k">Exit</span><span class="v">${n.exit}</span>
      <span class="k">Foreground</span><span class="v">${n.fgSec} giây</span>
      <span class="k">API total</span><span class="v sub">${tot}ms cộng dồn (${pctOf(n)}% thời gian màn)</span>
    </div>
    <div class="sec-h">${ICONwrap(ICON_GLOBE)} API calls (${n.apis.length})</div>`;
  body += n.apis.map(a=>`
    <div class="apirow">
      <span class="meth ${a.m.toLowerCase()}">${a.m}</span>
      <span class="path" title="${a.full}">${a.full}</span>
      <span class="st">${a.st}</span>
      <span class="ms">${a.ms}ms</span>
    </div>`).join('');

  if(n.tap){
    body += `<div class="sec-h purple">${ICONwrap(ICON_TAP)} Tap dẫn sang màn kế</div>
      <div class="taprow">
        <span class="tg">TAP</span>
        <div class="tx"><div class="id">${n.tap.id}</div><div class="to">→ ${n.tap.to}</div></div>
        <span class="dl">delay ${n.tap.delay}</span>
      </div>`;
  } else {
    body += `<div class="sec-h green">${ICONwrap('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg>')} Kết thúc hành trình</div>
      <div class="dest-note"><span style="font-size:18px;">🎯</span>Đích đến của flow — user đã mở playback thành công.</div>`;
  }
  body += '<div class="dr-empty"></div>';
  document.getElementById('drBody').innerHTML = body;

  drawer.classList.add('show');
  scrim.classList.add('show');
  drawer.setAttribute('aria-hidden','false');
}
function ICONwrap(svg){ return `<span style="display:inline-flex;width:16px;height:16px;">${svg.replace('<svg','<svg width=\"16\" height=\"16\"')}</span>`; }

function closeDrawer(){
  drawer.classList.remove('show');
  scrim.classList.remove('show');
  drawer.setAttribute('aria-hidden','true');
  document.querySelectorAll('.node').forEach(e=>e.classList.remove('sel'));
}
document.getElementById('drClose').addEventListener('click', closeDrawer);
scrim.addEventListener('click', closeDrawer);
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeDrawer(); });

/* ---------- zoom ---------- */
let zoom = 1;
const ZMIN=0.6, ZMAX=1.4, ZSTEP=0.1;
function applyZoom(){
  track.style.transform = `scale(${zoom})`;
  document.getElementById('zpct').textContent = Math.round(zoom*100)+'%';
}
document.getElementById('zin').addEventListener('click', ()=>{ zoom=Math.min(ZMAX,+(zoom+ZSTEP).toFixed(2)); applyZoom(); });
document.getElementById('zout').addEventListener('click', ()=>{ zoom=Math.max(ZMIN,+(zoom-ZSTEP).toFixed(2)); applyZoom(); });
document.getElementById('zreset').addEventListener('click', ()=>{ zoom=1; applyZoom(); document.getElementById('canvasWrap').scrollLeft=0; });

const wrap = document.getElementById('canvasWrap');
wrap.addEventListener('wheel', e=>{
  if(e.ctrlKey || e.metaKey){ e.preventDefault();
    zoom = Math.min(ZMAX, Math.max(ZMIN, +(zoom - Math.sign(e.deltaY)*ZSTEP).toFixed(2))); applyZoom();
  }
},{passive:false});

/* drag to pan */
let dragging=false, sx=0, sl=0, st0=0, sy=0, moved=false;
wrap.addEventListener('pointerdown', e=>{
  if(e.target.closest('.node')) return;
  dragging=true; moved=false; sx=e.clientX; sy=e.clientY; sl=wrap.scrollLeft; st0=wrap.scrollTop; wrap.setPointerCapture(e.pointerId);
  wrap.style.cursor='grabbing';
});
wrap.addEventListener('pointermove', e=>{
  if(!dragging) return;
  wrap.scrollLeft = sl - (e.clientX-sx);
  wrap.scrollTop = st0 - (e.clientY-sy);
  if(Math.abs(e.clientX-sx)>4) moved=true;
});
wrap.addEventListener('pointerup', e=>{ dragging=false; wrap.style.cursor=''; });
wrap.addEventListener('pointerleave', ()=>{ dragging=false; wrap.style.cursor=''; });

/* ---------- fullscreen toggle ---------- */
const appEl = document.querySelector('.app');
function toggleFullscreen(){
  const on = appEl.classList.toggle('fullscreen');
  // re-draw branch arcs sau khi resize
  requestAnimationFrame(drawBranchArcs);
}
document.getElementById('zfull').addEventListener('click', toggleFullscreen);
document.getElementById('zexit').addEventListener('click', toggleFullscreen);

document.addEventListener('keydown', e=>{
  if (e.key === 'f' || e.key === 'F') {
    if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
    toggleFullscreen();
  }
  if (e.key === 'Escape' && appEl.classList.contains('fullscreen')) {
    // ESC trong fullscreen → thoát fullscreen trước rồi mới đóng drawer
    if (drawer.classList.contains('show')) return; // để drawer xử lý
    toggleFullscreen();
  }
});
</script>
</body>
</html>

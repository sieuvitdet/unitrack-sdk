plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
}

android {
    namespace 'com.unitrack.sdk.snowplow'
    compileSdk 34

    defaultConfig {
        minSdk 21
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions { jvmTarget = '11' }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    // Core SDK (the AnalyticsProvider interface).
    implementation project(':unitrack')
    // The real Snowplow Android tracker.
    implementation 'com.snowplowanalytics:snowplow-android-tracker:6.0.0'
}

publishing {
    publications {
        release(MavenPublication) {
            groupId    = 'com.github.sieuvitdet.unitrack-sdk'
            artifactId = 'unitrack-snowplow'
            version    = project.findProperty('VERSION_NAME') ?: '1.0.0'
            afterEvaluate { from components.release }
        }
    }
}

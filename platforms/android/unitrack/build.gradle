plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
}

android {
    namespace 'com.unitrack.sdk'
    compileSdk 34
    ndkVersion '26.1.10909125'

    defaultConfig {
        minSdk 21
        targetSdk 34
        consumerProguardFiles 'consumer-rules.pro'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        externalNativeBuild {
            cmake {
                // Core uses try/catch (e.g. ut_init in capi.cpp), so exceptions
                // must stay enabled — do NOT add -fno-exceptions here.
                cppFlags '-std=c++17', '-fvisibility=hidden'
                arguments '-DUT_USE_BUNDLED_SQLITE=OFF',
                          '-DUT_USE_LIBCURL=OFF',
                          '-DCMAKE_BUILD_TYPE=Release'
            }
        }
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions { jvmTarget = '11' }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    implementation 'androidx.fragment:fragment:1.6.2'
    // @Keep annotation for R8/ProGuard rules on JNI-called classes (NativeBridge).
    implementation 'androidx.annotation:annotation:1.7.1'
    compileOnly    'com.squareup.okhttp3:okhttp:4.12.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:core:1.5.0'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
}

// Published to JitPack as `com.github.sieuvitdet.unitrack-sdk:unitrack:<tag>`.
// JitPack overrides groupId from the repo coordinates at build time; what
// matters here is artifactId = module name so the demo's gradle dependency
// resolves the right submodule.
publishing {
    publications {
        release(MavenPublication) {
            groupId    = 'com.github.sieuvitdet.unitrack-sdk'
            artifactId = 'unitrack'
            version    = project.findProperty('VERSION_NAME') ?: '1.0.0'
            afterEvaluate { from components.release }
        }
    }
}

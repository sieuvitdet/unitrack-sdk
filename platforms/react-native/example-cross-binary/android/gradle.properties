android.useAndroidX=true
android.enableJetifier=false
org.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError

# Bật co-resident: RN plugin sẽ dùng compileOnly cho unitrack-sdk vì host app
# đã link JitPack version trực tiếp. Toggle → false để REPRO duplicate class
# error (log expected: "Type com.unitrack.sdk.UniTrack is defined multiple times").
unitrack.skipVendor=true

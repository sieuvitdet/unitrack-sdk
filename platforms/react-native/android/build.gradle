apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

// Co-resident mode (skipVendor): khi host Android app ALREADY link native
// UniTrack Maven (vd app native nhúng RN + app đã có UniTrack riêng cho UIKit-
// equivalent), kéo cùng FQN `com.unitrack.sdk.UniTrack` sẽ gây Gradle duplicate
// class error. Set `unitrack.skipVendor=true` trong gradle.properties hoặc
// `-Punitrack.skipVendor=true` ở command line → RN plugin đổi sang `compileOnly`
// → code RN bridge (RNUniTrackModule.kt) vẫn compile được nhưng KHÔNG ship
// runtime binary. Host app phải supply UniTrack Maven qua dependencies block.
def skipVendor = providers.gradleProperty('unitrack.skipVendor')
    .map { it.toBoolean() }.getOrElse(false)

if (skipVendor) {
    logger.lifecycle("[unitrack-rn] skipVendor=true — host app phải supply " +
        "com.github.sieuvitdet.unitrack-sdk:unitrack ở dependencies block")
}

android {
    namespace 'com.unitrack.rn'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34
    }

    // RN 0.85 / AGP compiles Java at 17; keep Kotlin's jvmTarget in lockstep
    // (Gradle 9 fails the build on a Java-17 / Kotlin-11 mismatch).
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

// JitPack repo required for the UniTrack Android SDK dep below — host apps
// also need this in their settings.gradle (mirror what the docs tell them).
repositories {
    google()
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation 'com.facebook.react:react-native:+'
    // UniTrack Android SDK — published to JitPack from the same monorepo.
    // - skipVendor=false (default): implementation → binary + kotlin class
    //   được kéo vào RN plugin. Standalone RN app dùng path này.
    // - skipVendor=true: chỉ compileOnly để RN bridge code (UniTrack.foo(...))
    //   compile được. Host native app supply runtime binary → 1 singleton
    //   UniTrack duy nhất trong process.
    if (skipVendor) {
        compileOnly 'com.github.sieuvitdet:unitrack-sdk:0.3.37'
    } else {
        implementation 'com.github.sieuvitdet:unitrack-sdk:0.3.37'
    }
}

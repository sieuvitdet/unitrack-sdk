name: unitrack
description: UniTrack — universal mobile analytics SDK for Flutter. Auto-captures screens, taps, network, crashes, OOM, JSON errors.
version: 1.0.0
homepage: https://github.com/unitrack/sdk

environment:
  # 3.0+ required for the records language feature used in _applyRules.
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.unitrack.flutter
        pluginClass: UniTrackPlugin
      ios:
        pluginClass: UniTrackPlugin

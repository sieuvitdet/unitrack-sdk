name: unitrack
description: >-
  UniTrack — universal mobile analytics SDK for Flutter. Auto-captures screens,
  taps, network calls, crashes, OOM warnings, and JSON parse errors with a
  persistent offline queue, session journey, and W3C trace propagation.
version: 1.1.3
homepage: https://github.com/sieuvitdet/unitrack-sdk
repository: https://github.com/sieuvitdet/unitrack-sdk
issue_tracker: https://github.com/sieuvitdet/unitrack-sdk/issues
topics:
  - analytics
  - tracking
  - telemetry
  - observability
  - mobile

environment:
  # 3.0+ required for the records language feature used in _applyRules.
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.unitrack.flutter
        pluginClass: UniTrackPlugin
      ios:
        pluginClass: UniTrackPlugin

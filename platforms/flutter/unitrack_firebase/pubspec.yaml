name: unitrack_firebase
description: >-
  Firebase provider for UniTrack. Forwards UniTrack events to Firebase Analytics,
  plus optional helpers for Messaging (FCM token + push notification tracking),
  Crashlytics (non-fatal error recording), and Remote Config resolution.
version: 1.0.0
homepage: https://github.com/sieuvitdet/unitrack-sdk
repository: https://github.com/sieuvitdet/unitrack-sdk
issue_tracker: https://github.com/sieuvitdet/unitrack-sdk/issues
topics:
  - analytics
  - firebase
  - tracking
  - telemetry
  - mobile

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  # UniTrack core (provides AnalyticsProvider interface + UniTrack.track facade).
  unitrack: ^1.0.0
  # Firebase. The app must add google-services.json (android/app) and
  # GoogleService-Info.plist (ios/Runner). This package only calls
  # Firebase.initializeApp() + logEvent / token getters.
  # Wide ranges so this provider works with whatever Firebase major the host
  # app pins (vd MobiX uses firebase_core 4.x / firebase_analytics 12.x).
  firebase_core: '>=2.0.0 <5.0.0'
  firebase_analytics: '>=10.0.0 <13.0.0'
  firebase_messaging: '>=14.0.0 <16.0.0'
  firebase_crashlytics: '>=3.0.0 <5.0.0'
  firebase_remote_config: '>=4.0.0 <6.0.0'

dev_dependencies:
  flutter_lints: ^3.0.0

# Local dev override — pub.dev IGNORES dependency_overrides at publish time,
# so the published package still pins `unitrack: ^1.0.0`. This block only
# lets `flutter pub get` resolve while unitrack 1.0.0 isn't on pub.dev yet
# (chicken-and-egg: provider depends on main; main publishes first; until
# then this override points pub get at the sibling folder).
# Remove or keep — won't affect downstream apps.
dependency_overrides:
  unitrack:
    path: ../

name: unitrack_firebase_example
description: Minimal Firebase provider sample for UniTrack.
publish_to: none
version: 1.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: '>=2.0.0 <5.0.0'
  unitrack: ^1.0.0
  unitrack_firebase:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# Local-only: pull both packages from sibling folders so example builds
# before they're published. Pub.dev ignores dependency_overrides when
# publishing the parent (unitrack_firebase), so consumers see the hosted
# spec ^1.0.0.
dependency_overrides:
  unitrack:
    path: ../../

flutter:
  uses-material-design: true

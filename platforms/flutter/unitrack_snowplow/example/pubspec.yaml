name: unitrack_snowplow_example
description: Minimal Snowplow provider sample for UniTrack.
publish_to: none
version: 1.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  unitrack: ^1.0.0
  unitrack_snowplow:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# Local-only: pull both packages from sibling folders so example builds
# before they're published. Pub.dev ignores dependency_overrides when
# publishing the parent (unitrack_snowplow), so consumers see the hosted
# spec ^1.0.0.
dependency_overrides:
  unitrack:
    path: ../../

flutter:
  uses-material-design: true

name: unitrack_snowplow
description: >-
  Snowplow provider for UniTrack. Forwards UniTrack events to a Snowplow
  collector with built-in convention layer, auto-attached user_context and
  application_context entities, and per-event Iglu schema resolution.
version: 1.1.0
homepage: https://github.com/sieuvitdet/unitrack-sdk
repository: https://github.com/sieuvitdet/unitrack-sdk
issue_tracker: https://github.com/sieuvitdet/unitrack-sdk/issues
topics:
  - analytics
  - snowplow
  - tracking
  - telemetry
  - mobile

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  # UniTrack core (provides AnalyticsProvider interface + UniTrack.track facade).
  # 1.2.0 needed for `UniTrackRemoteConfig.snowplowEntityURIs` (fromPortal()
  # factory đọc field này) + `UniTrackConfig.fromMap`.
  unitrack: ^1.2.0
  # Snowplow Flutter tracker — used to package + forward events to the
  # configured collector. Wide range to keep the host app's choice flexible.
  snowplow_tracker: '>=0.7.0 <2.0.0'

dev_dependencies:
  flutter_lints: ^3.0.0

# Local dev override — pub.dev IGNORES dependency_overrides at publish time,
# so the published package still pins `unitrack: ^1.0.0`. This block only
# lets `flutter pub get` resolve while unitrack 1.0.0 isn't on pub.dev yet
# (chicken-and-egg: provider depends on main; main publishes first; until
# then this override points pub get at the sibling folder).
# Remove or keep — won't affect downstream apps.
dependency_overrides:
  unitrack:
    path: ../

  // ── center: load journey → wireframe + timeline ──
  await renderIDEMain(pid, sid);
}

// Build the left sidebar outline for the CURRENT session: one collapsible
// block per screen with the time range, duration, and a compact summary of
// each event that fired on that screen. Reuses buildSessionTree() so the
// outline stays in lockstep with the middle pane's timeline.
function renderSessionOutline(pid, sid, session, allSessions){
  const listEl = document.getElementById('ideList');
  if(!listEl) return;
  const journey = (session && Array.isArray(session.journey)) ? session.journey : [];
  const segs = buildSessionTree(journey);

  const headHtml = `
    <div style="padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;background:var(--panel)">
      <button class="btn ghost sm" id="ideBackList" title="Danh sách session" style="padding:4px 8px;font-size:11px">← Danh sách</button>
      <span class="mono" style="color:var(--accent2);font-size:12px">${shortSid(sid)}</span>
      ${session && session.crashed ? '<span style="color:var(--danger)">⚠</span>' : ''}
      <span class="muted" style="font-size:11px;margin-left:auto">${segs.length} màn</span>
    </div>`;

  const MAX_SHOWN = 6;
  // Reverse so the NEWEST screen sits at the top of the sidebar — matches the
  // way an IDE log pane shows recent activity first. data-seg keeps the
  // ORIGINAL chronological index so clicking still maps to the right segs[i]
  // and the middle pane scrollIntoView lands on the correct card.
  const orderedSegs = segs.map((seg, idx) => ({ seg, idx })).reverse();
  const screenBlocksHtml = orderedSegs.length ? orderedSegs.map(({ seg, idx }) => {
    const dur = (seg.started_at && seg.ended_at) ? (seg.ended_at - seg.started_at) : 0;
    const range = (seg.started_at && seg.ended_at)
      ? `${fmtTime(seg.started_at)} → ${fmtTime(seg.ended_at)}`
      : '';
    const shown = seg.actions.slice(0, MAX_SHOWN);
    const overflow = seg.actions.length - shown.length;
    const actionLinesHtml = shown.map(a => {
      if(a.standaloneNet){
        const net = a.networks[0];
        const path = net && net.url ? (()=>{ try{return new URL(net.url).pathname;}catch(_){return net.url;}})() : '(no url)';
        return `<div style="font-size:11px;color:var(--muted);padding:2px 0">• network <span class="mono" style="color:var(--text)">${esc(net?.method||'')} ${esc(path)}</span> <span style="color:${statusColor(net?.status)}">${net?.status??''}</span></div>`;
      }
      const tapLabel = a.element_key ? ` <span class="mono" style="color:var(--text)">${esc(a.element_key)}</span>` : '';
      const netSuffix = (a.networks && a.networks.length) ? ` <span class="muted">+${a.networks.length} net</span>` : '';
      const navLine = a.navigatesTo
        ? `<div style="font-size:10px;color:var(--accent2);padding:1px 0 1px 12px">↳ ${esc(a.navigatesTo)}</div>`
        : '';
      return `<div style="font-size:11px;color:var(--muted);padding:2px 0">• ${esc(a.event_name)}${tapLabel}${netSuffix}${navLine}</div>`;
    }).join('');
    const overflowHtml = overflow > 0 ? `<div class="muted" style="font-size:10px;padding:2px 0;font-style:italic">+${overflow} event nữa</div>` : '';
    const dot = seg.crashed ? '#dc2626' : (seg.passive ? '#94a3b8' : '#5b8cff');
    return `<div class="ide-outline-seg" data-seg="${idx}" style="padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer">
      <div style="display:flex;gap:6px;align-items:center">
        <span style="color:${dot}">📱</span>
        <span class="mono" style="color:var(--text);font-size:12px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(seg.screen)}">${esc(seg.screen)}</span>
        <span class="muted" style="font-size:10px">${dur ? fmtDur(dur) : ''}</span>
      </div>
      ${range ? `<div class="muted" style="font-size:10px;margin-top:2px">${range}</div>` : ''}
      <div style="margin-top:6px">${actionLinesHtml || '<div class="muted" style="font-size:11px;padding:2px 0;font-style:italic">• chỉ đi qua, không tương tác</div>'}${overflowHtml}</div>
    </div>`;
  }).join('') : '<div class="empty" style="font-size:12px;padding:14px">Không có màn nào trong session</div>';

  listEl.innerHTML = headHtml + screenBlocksHtml;

  // Back to flat session list.
  const backBtn = document.getElementById('ideBackList');
  if(backBtn) backBtn.onclick = ()=> renderSessionListInOutline(pid, sid, allSessions);

  // Clicking a screen scrolls the middle pane to the matching .ide-row card.
  // Middle cards carry data-i (segment index) — renderIDEMain renders in the
  // same segs[] order so the indices line up 1:1. Highlight the clicked
  // outline entry so the operator doesn't lose context after scroll.
  listEl.querySelectorAll('.ide-outline-seg').forEach(el => {
    el.onclick = () => {
      const idx = el.dataset.seg;
      const main = document.getElementById('ideMain');
      const row = main && main.querySelector(`.ide-row[data-i="${idx}"]`);
      if(row) row.scrollIntoView({behavior:'smooth', block:'start'});
      listEl.querySelectorAll('.ide-outline-seg').forEach(x => x.style.background = '');
      el.style.background = 'var(--panel2)';
    };
  });
}

// Restore the flat session list inside the left sidebar (used by the
// "← Danh sách" button in the outline header). Kept here so the outline can
// swap views without re-running openSessionIDE — keeps the middle pane intact.
function renderSessionListInOutline(pid, currentSid, sessions){
  const listEl = document.getElementById('ideList');
  if(!listEl) return;
  listEl.innerHTML = (sessions||[]).map(s => {
    const active = s.session_id === currentSid;
    const dot = s.crashed ? '#dc2626' : (s.ended_reason === 'inferred_terminate' ? '#f59e0b' : '#5b8cff');
    return `<div class="ide-sess" data-sid="${esc(s.session_id)}" style="padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:12px;${active?'background:var(--panel2);border-left:3px solid var(--accent)':'border-left:3px solid transparent'}">
      <div style="display:flex;gap:6px;align-items:center">
        <span style="color:${dot}">●</span>
        <span class="mono" style="color:var(--accent2)">${shortSid(s.session_id)}</span>
        <span class="muted" style="margin-left:auto;font-size:10px">${fmtDur(s.duration_ms)}</span>
      </div>
      <div class="muted" style="font-size:10px;margin-top:2px">${s.screen_count||0} màn · ${s.event_count||0} event</div>
      <div class="muted" style="font-size:10px">${s.started_at?fmtTime(s.started_at):''}</div>
    </div>`;
  }).join('') || '<div class="empty" style="font-size:12px">Chưa có session</div>';
  listEl.querySelectorAll('.ide-sess').forEach(el => {
    el.onclick = () => openSessionIDE(pid, el.dataset.sid);
  });
}

// Filter mode for the middle pane: '' = show all, 'crash' = only crash/bug
// screens, or a free-text query from the search box.
let _ideFilter = { mode:'', q:'' };
// Apply the current search query + crash filter to the rendered rows.
function applyIDEFilter(){
  const main = document.getElementById('ideMain'); if(!main) return;
  const q = (document.getElementById('ideSearch')?.value || '').trim().toLowerCase();
  _ideFilter.q = q;
  const onlyCrash = _ideFilter.mode==='crash';
  let shown = 0;
  main.querySelectorAll('.ide-row').forEach(row=>{
    const hay = row.dataset.search || '';
    const isCrash = row.dataset.crash === '1';
    const ok = (!q || hay.includes(q)) && (!onlyCrash || isCrash);
    row.style.display = ok ? '' : 'none';
    if(ok) shown++;
  });
  const empty = main.querySelector('#ideNoMatch');
  if(empty) empty.style.display = shown? 'none':'block';
}

// Render the middle pane: a vertical timeline (real-time scaled) with screen
// cards; consecutive "passed-through" screens collapse into one stack card.
async function renderIDEMain(pid, sid){
  const main = document.getElementById('ideMain');
  main.innerHTML = '<div class="muted" style="padding:20px;font-size:12px">Đang tải…</div>';
  let s;
  try { s = await api(`/api/projects/${pid}/sessions/${encodeURIComponent(sid)}`); }
  catch(e){ main.innerHTML='<div style="color:var(--danger);padding:20px">Không tải được session</div>'; return; }
  const segs = buildSessionTree(s.journey||[]);
  window._ideSegs = segs;

  // A screen has a "bug" if it crashed, or any action on it is an error/parse
  // failure (json_parse_error doesn't set seg.crashed but is still a code bug).
  const ERR = new Set(['crash','application_error','json_parse_error']);
  const hasBug = (seg)=> seg.crashed || seg.actions.some(a=>ERR.has(a.event_name));
  let bugCount = 0;

  // ── Build a screen graph: each UNIQUE screen is one node, transitions are
  // edges. The old timeline rendered one row per visit which exploded into
  // hundreds of cards for long sessions; a session that bounces around 12
  // screens many times now collapses into 12 nodes + the edges between them,
  // which is what the operator actually wants to see.
  //
  // Node data per screen: visit count, total events, crash flag, first visit
  // timestamp (used for layout ordering — entry screens land on top).
  // Edge data per directed pair (A → B): how many times that transition fired
  // (so a heavy "Home → Camera" gets a thicker arrow than a rare "Home →
  // Settings"). Edges keep ORIGINAL ordering so the layout can do a BFS from
  // the entry screen and arrange depth left→right.
  const nodes = new Map();   // screen → { screen, visits, events, crashed, passive, firstTs, segIdxs[] }
  const edges = new Map();   // "from→to" → { from, to, count, isBack, lastTransitionAction }
  segs.forEach((seg, i) => {
    let n = nodes.get(seg.screen);
    if(!n){
      n = { screen: seg.screen, visits: 0, events: 0, crashed: false,
            passive: true, firstTs: seg.started_at || 0, segIdxs: [] };
      nodes.set(seg.screen, n);
    }
    n.visits++;
    n.events += seg.actions.length;
    if(hasBug(seg)) n.crashed = true;
    if(!seg.passive) n.passive = false;
    n.segIdxs.push(i);
    // Edge to the NEXT seg in chronological order — if the next segment is a
    // different screen, that's a transition (push / back / replace). Keep
    // ordering so we can tag back-edges (the destination has a smaller
    // firstTs than the source) with a different arrow style.
    const next = segs[i+1];
    if(next && next.screen !== seg.screen){
      const key = seg.screen + '→' + next.screen;
      let e = edges.get(key);
      if(!e){
        e = { from: seg.screen, to: next.screen, count: 0, navActions: [] };
        edges.set(key, e);
      }
      e.count++;
      // Did a button on `seg` carry navigatesTo === next.screen? Pull the
      // element_key so the edge label shows what caused the transition (vd
      // "by tap loginBtn"). Multiple matching taps just take the first one.
      if(!e.navActions.length){
        const tapNav = seg.actions.find(a => a.navigatesTo === next.screen);
        if(tapNav && tapNav.element_key) e.navActions.push(tapNav.element_key);
      }
    }
  });
  if(nodes.size) bugCount = Array.from(nodes.values()).filter(n=>n.crashed).length;
  // Expose graph state so the right-pane detail panel can list incoming /
  // outgoing transitions for the clicked screen (the data lived only inside
  // this closure before — now showIDEDetailScreen can render "← came from"
  // / "↳ navigate to" sections without rebuilding the graph).
  window._ideGraphEdges = Array.from(edges.values());

  // BFS layout from the entry screen so the graph reads left→right by depth.
  // Each level becomes a column; nodes at the same depth stack vertically.
  // Back-edges (to a node already laid out at a smaller depth) curve around
  // — they're the "← back" arrows the operator sees as upstream loops.
  const entryScreen = segs.length ? segs[0].screen : null;
  const depth = new Map();
  const queue = entryScreen ? [entryScreen] : [];
  if(entryScreen) depth.set(entryScreen, 0);
  while(queue.length){
    const cur = queue.shift();
    const d = depth.get(cur);
    for(const e of edges.values()){
      if(e.from !== cur) continue;
      if(!depth.has(e.to)){
        depth.set(e.to, d + 1);
        queue.push(e.to);
      }
    }
  }
  // Anything unreached (rare — happens when journey has gaps) gets stacked
  // at the end so we don't drop them.
  let maxDepth = 0;
  for(const v of depth.values()) if(v > maxDepth) maxDepth = v;
  for(const s of nodes.keys()) if(!depth.has(s)){ maxDepth++; depth.set(s, maxDepth); }
  // Group nodes by depth and order within a depth by first-visit time so the
  // earlier branch lands on top. SVG y axis grows downward.
  const cols = [];
  for(const [scr, d] of depth) {
    (cols[d] = cols[d] || []).push(scr);
  }
  cols.forEach(col => col.sort((a, b) => nodes.get(a).firstTs - nodes.get(b).firstTs));

  // SVG geometry. Each cell is fixed-size; the viewBox is sized to fit. Pan
  // happens via the container's overflow:auto, zoom via CSS transform on
  // the inner group (wired below).
  // Bumped NODE_H to fit the activity breakdown rows (title + up to 5 lines:
  // "Nx ghé", "network [n]", "click [n]", "error [n]", "other [n]"). ROW_GAP
  // grew to keep vertical spacing breathable now that each node is taller.
  const NODE_W = 220, NODE_H = 116, COL_GAP = 80, ROW_GAP = 32;
  const cellW = NODE_W + COL_GAP, cellH = NODE_H + ROW_GAP;
  const colCount = cols.length;
  const rowCount = cols.reduce((m, c) => Math.max(m, c.length), 1);
  const svgW = Math.max(900, colCount * cellW + 80);
  const svgH = Math.max(420, rowCount * cellH + 80);
  const nodePos = new Map();   // screen → {x, y, cx, cy}
  cols.forEach((col, d) => {
    const colH = col.length * cellH;
    const startY = (svgH - colH) / 2 + 16;
    col.forEach((scr, j) => {
      const x = 40 + d * cellW;
      const y = startY + j * cellH;
      nodePos.set(scr, { x, y, cx: x + NODE_W/2, cy: y + NODE_H/2 });
    });
  });

  // Render nodes as SVG groups, one per UNIQUE screen. The inner card shows a
  // breakdown of WHAT happened on that screen (network N, click M, …) instead
  // of a flat total — operators care about the SHAPE of activity (mostly
  // tapping vs mostly waiting on APIs), not just the headline number.
  // Activity buckets are summed across every visit to the screen so an
  // 11-visit Home with 5 networks + 10 clicks aggregates correctly.
  const nodeSvg = Array.from(nodes.values()).map(n => {
    const p = nodePos.get(n.screen);
    const segIdx = n.segIdxs[0];
    const lbl = screenLabel(n.screen);
    // Per-bucket counts across every visit (network / click / error / other).
    let netCount = 0, clickCount = 0, errCount = 0, otherCount = 0;
    const hayParts = [n.screen, lbl];
    for(const idx of n.segIdxs){
      for(const a of segs[idx].actions){
        if(a.element_key) hayParts.push(a.element_key);
        if(a.event_name) hayParts.push(a.event_name);
        for(const nr of a.networks){
          netCount++;
          if(nr.url) hayParts.push(nr.url);
        }
        if(a.standaloneNet){
          // already counted via the networks loop above; don't double count
          // the standalone wrapper itself.
        } else if(isTapName(a.event_name)){
          clickCount++;
        } else if(a.event_name==='crash'||a.event_name==='application_error'||a.event_name==='json_parse_error'){
          errCount++;
        } else {
          otherCount++;
        }
      }
    }
    const hay = hayParts.join(' ').toLowerCase();
    const strokeColor = n.crashed ? 'var(--danger)' : (n.passive ? 'var(--muted)' : 'var(--accent)');
    const fillColor   = n.crashed ? 'rgba(220,38,38,.12)' : 'var(--panel)';
    const isEntry = n.screen === entryScreen;
    // Build the activity rows. Only show buckets with at least one event so
    // a screen that's pure-network doesn't waste a line on "click [0]".
    const rows = [];
    rows.push({label: `${n.visits}× ghé`, color: 'var(--muted)'});
    if(netCount)   rows.push({label: `network [${netCount}]`,  color: '#79c0ff'});
    if(clickCount) rows.push({label: `click [${clickCount}]`,  color: '#5b8cff'});
    if(errCount)   rows.push({label: `error [${errCount}]`,    color: 'var(--danger)'});
    if(otherCount) rows.push({label: `other [${otherCount}]`,  color: 'var(--muted)'});
    // Vertical layout starting under the title (y+38 = title baseline + label).
    // Each row consumes 14px so the card grows naturally with more buckets.
    const rowLines = rows.map((r, idx) => {
      const yy = p.y + 40 + idx * 14;
      return `<text x="${p.cx}" y="${yy}" text-anchor="middle" fill="${r.color}" font-size="11">${esc(r.label)}</text>`;
    }).join('');
    return `<g class="ide-row" data-i="${segIdx}" data-crash="${n.crashed?'1':'0'}" data-search="${esc(hay)}" style="cursor:pointer">
      <rect class="ide-card" x="${p.x}" y="${p.y}" width="${NODE_W}" height="${NODE_H}" rx="10"
        fill="${fillColor}" stroke="${strokeColor}" stroke-width="1.5"/>
      <text x="${p.cx}" y="${p.y+22}" text-anchor="middle" fill="var(--text)" font-size="13" font-weight="700">
        ${n.crashed?'⚠ ':''}📱 ${esc(n.screen.length>26?n.screen.slice(0,25)+'…':n.screen)}
      </text>
      ${rowLines}
      ${isEntry?`<rect x="${p.x+6}" y="${p.y+6}" width="40" height="14" rx="7" fill="var(--accent)" fill-opacity=".18" stroke="var(--accent)" stroke-width="1"/><text x="${p.x+26}" y="${p.y+16}" text-anchor="middle" fill="var(--accent)" font-size="9" font-weight="700">START</text>`:''}
    </g>`;
  }).join('');

  // Edges: thin lines — visual clutter was the #1 complaint. Drop edge labels
  // entirely; the operator can click a node and see "navigate to X" in the
  // right pane. Forward arrows curve from right side of `from` to left side
  // of `to`; back-edges loop up-and-over to keep them visually distinct from
  // forward flow. Thickness is FIXED (1.0 / 0.8 px) so a screen visited many
  // times doesn't blast a fat arrow across the canvas.
  const edgeSvg = Array.from(edges.values()).map((e) => {
    const a = nodePos.get(e.from), b = nodePos.get(e.to);
    if(!a || !b) return '';
    const isBack = depth.get(e.to) <= depth.get(e.from);
    const color = isBack ? '#64748b' : '#5b8cff';
    const opacity = isBack ? 0.4 : 0.55;
    const x1 = a.x + NODE_W, y1 = a.cy;
    const x2 = b.x,          y2 = b.cy;
    const dx = Math.max(40, Math.abs(x2 - x1) / 2);
    const path = isBack
      ? `M ${x1} ${y1} C ${x1 + 40} ${y1 - 60}, ${x2 - 40} ${y2 - 60}, ${x2} ${y2}`
      : `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
    return `<path class="ide-edge" d="${path}" fill="none" stroke="${color}" stroke-width="${isBack?0.8:1}"
      stroke-opacity="${opacity}" marker-end="url(#ideArrow${isBack?'Back':'Fwd'})"/>`;
  }).join('');

  main.innerHTML = `
    <div id="ideGraphWrap" style="height:100%;overflow:auto;position:relative;background:var(--bg);cursor:grab;user-select:none;-webkit-user-select:none">
      <!-- Zoom controls (floating top-right). Position:sticky so the buttons
           travel with the scroll viewport, not the giant SVG canvas. -->
      <div id="ideGraphZoom" style="position:sticky;top:10px;float:right;margin:10px 12px 0 0;z-index:2;display:flex;flex-direction:column;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px;box-shadow:0 2px 8px rgba(0,0,0,.18)">
        <button id="ideGraphZoomIn"  title="Phóng to (⌘/Ctrl + cuộn)" style="width:28px;height:28px;font-size:16px;font-weight:700;border:none;background:var(--bg);color:var(--text);border-radius:6px;cursor:pointer">+</button>
        <button id="ideGraphZoomOut" title="Thu nhỏ"                   style="width:28px;height:28px;font-size:16px;font-weight:700;border:none;background:var(--bg);color:var(--text);border-radius:6px;cursor:pointer">−</button>
        <button id="ideGraphZoomFit" title="Vừa khung"                 style="width:28px;height:28px;font-size:10px;font-weight:700;border:none;background:var(--bg);color:var(--text);border-radius:6px;cursor:pointer">fit</button>
        <div id="ideGraphZoomPct" style="font-size:10px;text-align:center;color:var(--muted);padding:2px 0">100%</div>
      </div>
      <div id="ideGraphInner" style="padding:14px;transform-origin:0 0;transition:transform .12s ease-out;cursor:grab">
        <svg id="ideGraph" viewBox="0 0 ${svgW} ${svgH}" width="${svgW}" height="${svgH}" style="display:block">
          <defs>
            <!-- Tiny arrowhead so the line tip doesn't visually outweigh the
                 edge body. refX placed at the very tip so the marker doesn't
                 overlap the destination node's stroke. -->
            <marker id="ideArrowFwd" viewBox="0 0 6 6" refX="5.5" refY="3" markerWidth="4" markerHeight="4" orient="auto">
              <path d="M0,0 L6,3 L0,6 Z" fill="#5b8cff" fill-opacity=".7"/>
            </marker>
            <marker id="ideArrowBack" viewBox="0 0 6 6" refX="5.5" refY="3" markerWidth="3.5" markerHeight="3.5" orient="auto">
              <path d="M0,0 L6,3 L0,6 Z" fill="#64748b" fill-opacity=".55"/>
            </marker>
          </defs>
          ${edgeSvg}
          ${nodeSvg}
        </svg>
      </div>
      <div id="ideNoMatch" class="muted" style="display:none;padding:20px;font-size:12px;position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:8px">Không có màn nào khớp bộ lọc.</div>
    </div>`;
  // ── Graph zoom + pan wiring ──────────────────────────────────────────────
  // CSS transform-based zoom on the inner wrapper so the SVG viewBox stays
  // intact (the click handlers below depend on node coordinates being raw,
  // not pre-scaled). Pan is provided by the outer container's overflow:auto
  // + a click-and-drag handler that updates scrollLeft / scrollTop.
  const graphWrap  = document.getElementById('ideGraphWrap');
  const graphInner = document.getElementById('ideGraphInner');
  const zoomPctEl  = document.getElementById('ideGraphZoomPct');
  let zoom = 1;
  const ZOOM_MIN = 0.25, ZOOM_MAX = 3;
  const applyZoom = () => {
    if(!graphInner) return;
    graphInner.style.transform = `scale(${zoom})`;
    // The wrapper's scrollable size must follow the scaled inner size so
    // overflow:auto exposes the panning region; scale() alone doesn't reflow.
    graphInner.style.width  = (svgW * zoom + 28) + 'px';
    graphInner.style.height = (svgH * zoom + 28) + 'px';
    if(zoomPctEl) zoomPctEl.textContent = Math.round(zoom * 100) + '%';
  };
  const setZoom = (next, pivotX, pivotY) => {
    const prev = zoom;
    zoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, next));
    if(zoom === prev) return;
    // Keep the cursor pivot point steady on screen — adjust scroll by the
    // delta between the old and new pixel position of that pivot.
    if(pivotX != null && pivotY != null){
      const rect = graphWrap.getBoundingClientRect();
      const sx = (graphWrap.scrollLeft + (pivotX - rect.left)) / prev;
      const sy = (graphWrap.scrollTop  + (pivotY - rect.top))  / prev;
      applyZoom();
      graphWrap.scrollLeft = sx * zoom - (pivotX - rect.left);
      graphWrap.scrollTop  = sy * zoom - (pivotY - rect.top);
    } else {
      applyZoom();
    }
  };
  const fitZoom = () => {
    const wW = graphWrap.clientWidth  - 32;
    const wH = graphWrap.clientHeight - 32;
    const f = Math.min(wW / svgW, wH / svgH, 1);
    zoom = Math.max(ZOOM_MIN, f);
    applyZoom();
    graphWrap.scrollLeft = 0;
    graphWrap.scrollTop = 0;
  };
  applyZoom();
  document.getElementById('ideGraphZoomIn').onclick  = () => setZoom(zoom * 1.25);
  document.getElementById('ideGraphZoomOut').onclick = () => setZoom(zoom / 1.25);
  document.getElementById('ideGraphZoomFit').onclick = () => fitZoom();
  // Cmd/Ctrl + wheel zooms; plain wheel scrolls (let the browser handle it).
  // Trackpad pinch on macOS arrives as ctrlKey wheel events, so this covers
  // both desktop ctrl+scroll and Mac pinch gestures naturally.
  graphWrap.addEventListener('wheel', (ev) => {
    if(!(ev.ctrlKey || ev.metaKey)) return;
    ev.preventDefault();
    const factor = ev.deltaY < 0 ? 1.1 : 1/1.1;
    setZoom(zoom * factor, ev.clientX, ev.clientY);
  }, { passive: false });
  // Click-and-drag pan — bound on the SCROLLING container (graphWrap), not
  // the inner SVG, so we can adjust scrollLeft/scrollTop directly without
  // fighting SVG event capture. Track drag state on the wrapper itself so a
  // re-render of the IDE doesn't leave stale handlers on window.
  // We also bail on .ide-row taps (let the click bubble) and toolbar clicks.
  // pointermove + setPointerCapture keeps the drag alive even when the cursor
  // briefly slips outside graphWrap.
  let dragState = null;
  graphWrap.addEventListener('pointerdown', (ev) => {
    if(ev.button !== 0) return;   // left click only
    if(ev.target.closest('.ide-row')) return;
    if(ev.target.closest('#ideGraphZoom')) return;
    dragState = {
      x: ev.clientX, y: ev.clientY,
      sl: graphWrap.scrollLeft, st: graphWrap.scrollTop,
      pid: ev.pointerId,
    };
    try { graphWrap.setPointerCapture(ev.pointerId); } catch(_){}
    graphInner.style.cursor = 'grabbing';
    ev.preventDefault();
  });
  graphWrap.addEventListener('pointermove', (ev) => {
    if(!dragState || dragState.pid !== ev.pointerId) return;
    graphWrap.scrollLeft = dragState.sl - (ev.clientX - dragState.x);
    graphWrap.scrollTop  = dragState.st - (ev.clientY - dragState.y);
    ev.preventDefault();
  });
  const endDrag = (ev) => {
    if(!dragState) return;
    try { graphWrap.releasePointerCapture(dragState.pid); } catch(_){}
    dragState = null;
    graphInner.style.cursor = 'grab';
  };
  graphWrap.addEventListener('pointerup',     endDrag);
  graphWrap.addEventListener('pointercancel', endDrag);
  graphWrap.addEventListener('pointerleave',  endDrag);

  // alignArrows is dead-code under the graph layout (no HTML chevrons exist
  // any more — SVG markers handle arrowheads). Kept as a no-op so any leftover
  // resize listener wiring still finds the symbol; can be deleted in a later
  // pass once we're sure nothing else references it.
  const alignArrows = () => {};
  const _alignArrowsDeadBlock = () => { // kept under a no-op gate so the rest
                                         // of the closure still parses without
                                         // touching the now-removed chevron
                                         // measurement code.
    main.querySelectorAll('.ide-arrow').forEach((arr) => {
      const prevRow = arr.previousElementSibling;
      if (!prevRow) return;
      const rail = prevRow.querySelector('.ide-row-rail');
      const spacer = arr.querySelector('.ide-arrow-spacer');
      const chevron = arr.querySelector('.ide-arrow-chevron');
      if (!rail || !spacer || !chevron) return;
      const arrLeft = arr.getBoundingClientRect().left;
      const railRect = rail.getBoundingClientRect();
      const railCenter = railRect.left + railRect.width / 2;
      const chevW = chevron.getBoundingClientRect().width;
      const w = railCenter - arrLeft - chevW / 2;
      spacer.style.width = Math.max(0, w) + 'px';
    });
  };
  // First pass — fonts may not have loaded yet, so re-measure on next frame and
  // again after fonts are ready (chevron width depends on font metrics).
  alignArrows();
  requestAnimationFrame(alignArrows);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(alignArrows);
  // Re-align on window resize.
  if (main._alignArrows) window.removeEventListener('resize', main._alignArrows);
  main._alignArrows = alignArrows;
  window.addEventListener('resize', alignArrows);

  // App name lives on the session's device blob (ingest captures one event's
  // `device` JSON, /sessions/:sid surfaces it). Stick it at the head of the
  // ideMeta line when present so the operator sees "Mobi X Staging · 12 màn"
  // instead of just counts.
  const ideAppName = s.device && s.device.app_name ? s.device.app_name : '';
  document.getElementById('ideMeta').textContent =
    (ideAppName ? ideAppName + ' · ' : '')
    + `${segs.length} màn · ${fmtDur(s.duration_ms)} · ${s.ended_reason}`;

  // Crash/bug badge in the header — click toggles the "only buggy screens" filter.
  const badge = document.getElementById('ideCrashBadge');
  if(badge){
    if(bugCount){
      const on = _ideFilter.mode==='crash';
      badge.innerHTML = `<span id="ideCrashToggle" title="Bấm để lọc màn crash/bug" style="cursor:pointer;user-select:none;font-size:12px;font-weight:600;border-radius:20px;padding:3px 11px;background:${on?'var(--danger)':'var(--danger)22'};color:${on?'#fff':'var(--danger)'};border:1px solid var(--danger)">⚠ ${bugCount} crash/bug${on?' ✕':''}</span>`;
      document.getElementById('ideCrashToggle').onclick = ()=>{
        _ideFilter.mode = _ideFilter.mode==='crash' ? '' : 'crash';
        renderIDEMain(pid, sid);   // re-render to refresh the badge state + rows
      };
    } else { badge.innerHTML = ''; }
  }

  // Click a graph node → highlight + show that screen's detail in the right
  // pane. Each NODE represents a unique screen that may have been visited
  // many times — pass a MERGED seg containing every visit's actions / nets
  // (sorted chronologically) so the detail panel reflects the whole picture,
  // not just the first visit. Without the merge, network bubbles for visits
  // 2..N silently disappeared from the side panel even though the graph node
  // counted them.
  main.querySelectorAll('.ide-row').forEach(el => {
    el.onclick = () => {
      main.querySelectorAll('.ide-row .ide-card').forEach(c => {
        c.setAttribute('stroke-width', '1.5');
      });
      const card = el.querySelector('.ide-card');
      if(card) card.setAttribute('stroke-width', '3');
      const segIdx = +el.dataset.i;
      const firstSeg = segs[segIdx];
      // Find every segment matching the same screen and merge their actions
      // into one combined seg (firstSeg already covers its own visit; we
      // append visits 2..N here so the right panel sees the full timeline).
      const sameScreenSegs = segs.filter(g => g.screen === firstSeg.screen);
      const allActions = [];
      let earliest = Infinity, latest = -Infinity;
      let crashed = false;
      for(const g of sameScreenSegs){
        for(const a of g.actions) allActions.push(a);
        if(g.started_at && g.started_at < earliest) earliest = g.started_at;
        if(g.ended_at   && g.ended_at   > latest)   latest = g.ended_at;
        if(g.crashed) crashed = true;
      }
      allActions.sort((a, b) => (a.ts || 0) - (b.ts || 0));
      const mergedSeg = {
        ...firstSeg,
        actions: allActions,
        started_at: earliest === Infinity ? firstSeg.started_at : earliest,
        ended_at:   latest === -Infinity  ? firstSeg.ended_at   : latest,
        crashed,
        visits: sameScreenSegs.length,
      };
      showIDEDetailScreen(mergedSeg);
      if (_ideReplay && !_ideReplay.paused) ideReplayPause();
    };
  });

  // Re-apply any active search query + crash filter to the freshly rendered rows.
  applyIDEFilter();

  // Wire the replay bar to this session's segments. Replay drives the SAME DOM
  // rows the user can also click — no parallel timeline, no separate cursor —
  // so search/filter highlights stay consistent.
  ideReplayBind(pid, sid, segs);
}

// ── IDE session replay engine ─────────────────────────────────────────────
// Drives the middle timeline at real (or scaled) timing so the operator can
// "watch the session happen" without scrubbing manually. The user can pause
// with the Play button (toggles to Pause), jump with the seek slider, or pick
// a fixed speed. "Auto" targets a total play time of ~12s regardless of
// session length so 3-hour sessions become watchable.
let _ideReplay = null;   // { segs, dur, t0, accum, paused, speedRaw, raf, pid, sid }
const IDE_AUTO_TARGET_MS = 12_000;   // tune to taste

function ideReplayBind(pid, sid, segs) {
  // Reset any prior replay state attached to the previous session.
  ideReplayCleanup();

  const playable = segs.filter(s => s.started_at != null);
  const enable = playable.length >= 2;   // single-screen session = nothing to "play"
  const playBtn = document.getElementById('idePlay');
  const stopBtn = document.getElementById('ideStop');
  const seekEl  = document.getElementById('ideSeek');
  const speedEl = document.getElementById('ideSpeed');
  const nowEl   = document.getElementById('ideNow');
  if (!playBtn) return;

  for (const el of [playBtn, stopBtn, seekEl]) el.disabled = !enable;
  if (!enable) {
    nowEl.textContent = playable.length ? '— phiên 1 màn, không có gì để replay —'
                                        : '— chưa có timestamp —';
    return;
  }

  // Real-time duration of the journey (last segment start – first segment start).
  const t0 = playable[0].started_at;
  const tN = playable[playable.length - 1].started_at;
  const dur = Math.max(1, tN - t0);

  _ideReplay = { pid, sid, segs: playable, t0, dur, accum: 0,
                 paused: true, speedRaw: speedEl.value, raf: 0, lastFrame: 0 };
  nowEl.textContent = '0% · 0ms / ' + fmtDur(dur);
  seekEl.value = 0;

  playBtn.onclick = () => {
    if (!_ideReplay) return;
    if (_ideReplay.paused) ideReplayResume();
    else                   ideReplayPause();
  };
  stopBtn.onclick = () => ideReplayStop();
  speedEl.onchange = () => {
    if (!_ideReplay) return;
    _ideReplay.speedRaw = speedEl.value;
  };
  // Dragging the seek bar pauses + jumps; release continues if was playing.
  seekEl.oninput = () => {
    if (!_ideReplay) return;
    const pct = parseFloat(seekEl.value) / 100;
    _ideReplay.accum = pct * _ideReplay.dur;
    ideReplayApply();   // visual update without advancing time
  };
}

// Pick the scale: "auto" maps total real duration → IDE_AUTO_TARGET_MS, with
// a floor of 1× (don't slow down short sessions) and a ceiling of 500× (very
// long sessions stay at 500× rather than blurring past). Numeric values use
// the dropdown verbatim (1× = real time, 50× = 50ms per real second, …).
function ideReplaySpeed() {
  if (!_ideReplay) return 1;
  const raw = _ideReplay.speedRaw;
  if (raw === 'auto') {
    return Math.max(1, Math.min(500, _ideReplay.dur / IDE_AUTO_TARGET_MS));
  }
  return Math.max(0.1, parseFloat(raw) || 1);
}

function ideReplayResume() {
  if (!_ideReplay || !_ideReplay.paused) return;
  _ideReplay.paused = false;
  _ideReplay.lastFrame = performance.now();
  document.getElementById('idePlay').textContent = '⏸ Pause';
  const tick = (now) => {
    const st = _ideReplay; if (!st || st.paused) return;
    const dt = now - st.lastFrame;
    st.lastFrame = now;
    st.accum = Math.min(st.dur, st.accum + dt * ideReplaySpeed());
    ideReplayApply();
    if (st.accum >= st.dur) { ideReplayPause(); return; }
    st.raf = requestAnimationFrame(tick);
  };
  _ideReplay.raf = requestAnimationFrame(tick);
}
function ideReplayPause() {
  if (!_ideReplay) return;
  _ideReplay.paused = true;
  if (_ideReplay.raf) cancelAnimationFrame(_ideReplay.raf);
  _ideReplay.raf = 0;
  const btn = document.getElementById('idePlay');
  if (btn) btn.textContent = '▶ Play';
}
function ideReplayStop() {
  if (!_ideReplay) return;
  ideReplayPause();
  _ideReplay.accum = 0;
  ideReplayApply();
}
function ideReplayCleanup() {
  if (_ideReplay && _ideReplay.raf) cancelAnimationFrame(_ideReplay.raf);
  _ideReplay = null;
  // Drop any replay highlight so a re-render doesn't show stale outlines.
  document.querySelectorAll('.ide-row .ide-card.ide-replay-on')
    .forEach(el => el.classList.remove('ide-replay-on'));
}

// Find the segment that's "active" at the current accumulated time, update
// the seek slider + label, highlight that row, and scroll it into view.
// The timeline is rendered newest-on-top, so the active row moves UP as
// replay advances — natural reading order for "watch what just happened".
function ideReplayApply() {
  const st = _ideReplay; if (!st) return;
  const tNow = st.t0 + st.accum;
  // Pick the latest segment whose started_at <= tNow. Binary-search would be
  // cleaner but segs here are <100 in practice; linear is fast enough.
  let idx = 0;
  for (let i = 0; i < st.segs.length; i++) {
    if (st.segs[i].started_at <= tNow) idx = i; else break;
  }
  const main = document.getElementById('ideMain');
  if (!main) return;
  // The middle pane is rendered from window._ideSegs (full segment array).
  // `st.segs` is the subset with timestamps; map back by object identity
  // because filter() preserved the references.
  const seg = st.segs[idx];
  const row = [...main.querySelectorAll('.ide-row')].find(r => {
    const i = +r.dataset.i;
    return window._ideSegs && window._ideSegs[i] === seg;
  });

  main.querySelectorAll('.ide-row .ide-card.ide-replay-on')
    .forEach(el => el.classList.remove('ide-replay-on'));
  if (row) {
    const card = row.querySelector('.ide-card');
    if (card) card.classList.add('ide-replay-on');
    // Keep the active row centred-ish in view; behavior:smooth would lag at
    // high speed, so jump instantly and let the eye track.
    row.scrollIntoView({ block: 'center', behavior: 'auto' });
  }

  const seekEl = document.getElementById('ideSeek');
  if (seekEl && document.activeElement !== seekEl) {
    seekEl.value = (st.accum / st.dur * 100).toFixed(1);
  }
  const nowEl = document.getElementById('ideNow');
  if (nowEl) {
    const speed = ideReplaySpeed();
    const speedTxt = st.speedRaw === 'auto' ? `${speed.toFixed(0)}× (auto)` : `${st.speedRaw}×`;
    nowEl.textContent =
      `${Math.round(st.accum / st.dur * 100)}% · ${fmtDur(st.accum)} / ${fmtDur(st.dur)} · ${speedTxt}`;
  }
}

// Right pane: detail of one screen — its actions + nested network calls.
function showIDEDetailScreen(seg){
  const d = document.getElementById('ideDetail');
  const _acts=[], _nets=[];
  const tEvt = (n)=>new Date(n).toLocaleTimeString('vi-VN',{hour12:false});
  const netChip = (networks, ctx)=>{
    const gid=_nets.length; _nets.push({networks, action:ctx});
    const hasErr = networks.some(n=>n.net_error||(n.status>=400));
    const c = hasErr?'var(--warn)':'#79c0ff';
    return `<span class="ide-net" data-gid="${gid}" style="display:inline-block;cursor:pointer;background:${c}22;border:1px solid ${c}66;color:${c};border-radius:6px;padding:1px 8px;font-size:11px;font-weight:600">🌐 network [${networks.length}]${hasErr?' ⚠':''}</span>`;
  };
  const screenNets=[]; const realActs=[];
  for(const a of seg.actions){ if(a.standaloneNet) screenNets.push(...a.networks); else realActs.push(a); }
  const actHtml = realActs.map(a=>{
    const isTap=isTapName(a.event_name);
    const danger=a.event_name==='crash'||a.event_name==='application_error'||a.event_name==='json_parse_error';
    let icon,label,color;
    if(isTap){icon='👆';label=a.element_key||'(button)';color='#5b8cff';}
    else {icon=danger?'⚠':'•';label=a.event_name;color=danger?'var(--danger)':'var(--text)';}
    const hasDetail = danger || (a.props && Object.keys(a.props).length);
    const aid=_acts.length; if(hasDetail)_acts.push(a);
    const childNet=a.networks.length?`<div style="padding:3px 0 1px 20px">${netChip(a.networks,label)}</div>`:'';
    // Navigation hint: when buildSessionTree attributed the next screen to
    // this tap (last tap before a fast screen transition), show
    // "→ <NextScreen>" so the operator can tell at a glance which buttons
    // push a screen vs which just fire local UI / network.
    const navHint = a.navigatesTo
      ? `<div style="padding:2px 0 0 20px;font-size:11px;color:var(--accent2)">↳ navigate to <span class="mono" style="color:var(--text)">${esc(a.navigatesTo)}</span></div>`
      : '';
    return `<div style="padding:5px 0;border-bottom:1px solid var(--line)">
      <div style="display:flex;gap:8px;align-items:center;font-size:12px">
        <span class="${hasDetail?'ide-act':''}" ${hasDetail?`data-aid="${aid}"`:''} style="color:${color};font-weight:600;${hasDetail?'cursor:pointer':''}">${icon} ${esc(label)}${hasDetail?` <span class="muted" style="font-weight:400;font-size:10px">${danger?'xem lỗi':'chi tiết'} ⓘ</span>`:''}</span>
        <span class="muted mono" style="margin-left:auto;font-size:10px">${a.ts?tEvt(a.ts):''}</span>
      </div>${childNet}${navHint}</div>`;
  }).join('');
  const screenNetHtml = screenNets.length?`<div style="padding:5px 0;border-bottom:1px solid var(--line)"><span class="muted">┄</span> ${netChip(screenNets, seg.screen)}</div>`:'';
  const lbl = screenLabel(seg.screen);

  d.innerHTML = `<h3 style="margin:0 0 2px;font-size:14px">${seg.crashed?'⚠ ':''}📱 ${esc(seg.screen)}</h3>
    ${lbl?`<div style="font-size:12px;color:var(--accent2);margin-bottom:4px">${esc(lbl)}</div>`:''}
    <div class="muted" style="font-size:11px;margin-bottom:10px">${fmtTime(seg.started_at)} → ${fmtTime(seg.ended_at)} · ${fmtDur((seg.ended_at||0)-(seg.started_at||0))}</div>
    ${screenNetHtml}${actHtml||'<div class="muted" style="font-size:12px">— không có hành động —</div>'}`;
  d.querySelectorAll('.ide-act').forEach(el=>el.onclick=(e)=>{e.stopPropagation();showActionDetail(_acts[+el.dataset.aid]);});
  d.querySelectorAll('.ide-net').forEach(el=>el.onclick=(e)=>{e.stopPropagation();showSwfNetGroup(_nets[+el.dataset.gid]);});
}

// Popup showing an action's properties, or — for crash/error/parse failures —
// a human-readable cause + which button triggered it + bad-data preview.
// Tear down EVERY action/network detail dialog in the DOM (not just the first
// match by id) and REMOVE the elements — a non-modal fallback box or a stray
// duplicate left a second popup behind the modal that couldn't be closed.
function closeAllUtilDialogs(){
  document.querySelectorAll('#actDlg, #netListDlg, dialog.ut-util-dlg').forEach(d=>{
    try { if(d.open) d.close(); } catch(_){}
    d.remove();
  });
}

function showActionDetail(a){
  if(!a) return;
  // Tear down all util dialogs first, then build fresh (see closeAllUtilDialogs).
  closeAllUtilDialogs();
  const dlg = document.createElement('dialog'); dlg.id='actDlg'; dlg.className='ut-util-dlg';
  dlg.style.cssText='width:460px;z-index:100';
  document.body.appendChild(dlg);
  const p = a.props || {};
  const isCrash = a.event_name==='crash';
  const isParse = a.event_name==='json_parse_error';
  const isErr   = a.event_name==='application_error' || isCrash || isParse;

  const isTap = isTapName(a.event_name);
  // Common context: when did this fire + on what screen + what triggered any
  // followups (network attribution). Shown above the specifics block so the
  // operator can grok "when/where" before the deeper details.
  const ctxRows = [];
  if (a.ts) ctxRows.push(['Thời điểm', new Date(a.ts).toLocaleString('vi-VN', { hour12: false }) + ` (${a.ts})`]);
  const screen = (a.props && (a.props.screen || a.props.screen_name)) || null;
  if (screen) ctxRows.push(['Màn hình', screen]);
  if (a.element_key) ctxRows.push(['Element key', a.element_key]);
  if (a.props && a.props.element_type) ctxRows.push(['Element type', a.props.element_type]);
  // class_name / framework / package come from Phase 2 of the audit fix —
  // every platform now stamps them on the tap event. Surfacing the FQCN
  // lets the operator tell "MaterialButton" from "MyCustomButton" at a
  // glance, and `package` tells whether the source is the framework or
  // the app's own code.
  if (a.props && a.props.class_name && a.props.class_name !== a.props.element_type) {
    ctxRows.push(['Class', a.props.class_name]);
  }
  if (a.props && a.props.framework) ctxRows.push(['Framework', a.props.framework]);
  if (a.props && a.props.package) ctxRows.push(['Package', a.props.package]);
  if (a.props && a.props.label && a.props.label !== a.element_key) ctxRows.push(['Label', a.props.label]);
  if (a.props && a.props.trace_id) ctxRows.push(['trace_id', a.props.trace_id]);
  if (a.props && a.props.span_id)  ctxRows.push(['span_id',  a.props.span_id]);
  if (a.triggeredBy) ctxRows.push(['Gây ra bởi', a.triggeredBy]);
  // Followup network calls — set by buildSessionTree when networks fired
  // within NET_WINDOW_MS of this action. Tap → API → response chain is the
  // most useful "what happened next" view for a tap.
  const followups = (a.networks || []).filter((n) => !!n);
  if (followups.length) ctxRows.push(['API gọi sau đó', `${followups.length} call`]);

  // For taps, the bottom-of-popup business-rule + provider-forward sections
  // do most of the work. Put a small "🏷️ Gán event nghiệp vụ →" hint near
  // the bottom of the body so the user knows the rewrite tool is one click
  // away. Wire it up after dlg is open (below).
  let body = '';
  if(isErr){
    // Diagnose the cause from the properties the SDK sent up.
    let cause, kind;
    if(isParse){
      kind = 'Parse sai dữ liệu';
      cause = p.error || p.error_message || 'Không parse được dữ liệu';
    } else if(isCrash){
      kind = 'Crash (native)';
      cause = p.signal_name ? `Tín hiệu ${p.signal_name}` : (p.message || 'Ứng dụng dừng đột ngột');
    } else {
      kind = (p.fatal===true||p.fatal==='true') ? 'Lỗi nghiêm trọng' : 'Lỗi ứng dụng';
      cause = p.message || p.error || 'Không rõ';
    }
    const rows = [
      ['Loại lỗi', kind],
      ['Nguyên nhân', cause],
      ['Domain/Module', p.domain || p.target_type || null],
      ['Do bấm nút', a.triggeredBy || null],   // set by caller when known
      ['On launch', isCrash ? (p.crash_on_launch ? 'có' : 'không') : null],
    ].filter(([,v])=>v!=null && v!=='');
    body = `<div class="kv" style="grid-template-columns:120px 1fr">
      ${rows.map(([k,v])=>`<div class="key">${k}</div><div style="${k==='Nguyên nhân'?'color:var(--danger);font-weight:600':''}">${esc(v)}</div>`).join('')}
    </div>`;
    if(isParse && (p.data_preview||p.data)){
      body += `<div class="key" style="margin-top:8px">Dữ liệu lỗi (preview)</div>
        <pre style="background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:11px;white-space:pre-wrap;word-break:break-all">${esc(p.data_preview||p.data)}</pre>`;
    }
    if(isCrash && p.stack_trace){
      body += `<div class="key" style="margin-top:8px">Stack trace</div>
        <pre style="background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:11px;max-height:200px;overflow:auto;white-space:pre-wrap">${esc(p.stack_trace)}</pre>`;
    }
    // Always show the raw properties too (collapsed feel).
    body += `<div class="key" style="margin-top:10px">Properties</div>
      <pre style="background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:11px;white-space:pre-wrap;word-break:break-word;max-height:160px;overflow:auto">${esc(JSON.stringify(p,null,2))}</pre>`;
  } else {
    // Context block first — when / where / element type / trace id — then the
    // raw properties (everything the SDK captured for this tap). Two zones so
    // an operator scanning for "where did this come from" doesn't have to dig
    // through every key.
    const ctxHtml = ctxRows.length
      ? `<div class="key" style="margin-bottom:4px">Ngữ cảnh</div>
         <div class="kv" style="grid-template-columns:140px 1fr;margin-bottom:10px;font-size:12px">
           ${ctxRows.map(([k,v]) =>
             `<div class="key">${esc(k)}</div><div class="mono" style="word-break:break-all">${esc(String(v))}</div>`).join('')}
         </div>`
      : '';

    // Followup network preview (top 5). Useful for taps: shows the API chain
    // the button kicked off without forcing the operator to leave the popup.
    let netHtml = '';
    if (followups.length) {
      const rows = followups.slice(0, 5).map((n) => {
        const path = n.url ? (() => { try { return new URL(n.url).pathname; } catch (_) { return n.url; } })() : '—';
        const ok = n.status >= 200 && n.status < 400;
        const c = n.net_error || !ok ? 'var(--danger)' : '#79c0ff';
        return `<div style="display:flex;gap:8px;font-size:11px;padding:2px 0">
          <span style="color:#79c0ff;font-weight:600">${esc(n.method || '')}</span>
          <span class="mono" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(n.url || path)}">${esc(path)}</span>
          <span style="color:${c};font-weight:700">${n.net_error ? '✕' : (n.status || '—')}</span>
        </div>`;
      }).join('');
      netHtml = `<div class="key" style="margin-top:6px">API gọi sau đó (${followups.length})</div>
        <div style="background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 10px">${rows}${
          followups.length > 5 ? `<div class="muted" style="font-size:11px;padding-top:4px">+${followups.length - 5} call khác — xem chi tiết trong session timeline</div>` : ''
        }</div>`;
    }

    // Notification-specific surfacing: pull the payload (`data`) into a
    // pretty pre block + show notification_id as its own row. Otherwise the
    // payload prints as one giant JSON-stringified line at the bottom of
    // "Properties khác" and the routing keys are unreadable.
    const isNotification = a.event_name === 'notification';
    let notifHtml = '';
    if (isNotification) {
      const nRows = [];
      if (p.state) nRows.push(['state', p.state]);
      if (p.action) nRows.push(['action', p.action]);
      if (p.notification_id) nRows.push(['notification_id', p.notification_id]);
      if (p.title) nRows.push(['title', p.title]);
      if (p.body)  nRows.push(['body',  p.body]);
      const dataObj = (p.data && typeof p.data === 'object') ? p.data : null;
      notifHtml = `<div class="key" style="margin-top:6px">Notification</div>
        <div class="kv" style="grid-template-columns:140px 1fr;font-size:12px">${
          nRows.map(([k, v]) =>
            `<div class="key">${esc(k)}</div><div class="mono" style="word-break:break-all">${esc(String(v))}</div>`).join('')
        }</div>
        ${dataObj ? `<div class="key" style="margin-top:8px">Payload (data)</div>
          <pre style="background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;font-size:11px;white-space:pre-wrap;word-break:break-word;max-height:240px;overflow:auto">${esc(JSON.stringify(dataObj, null, 2))}</pre>` : ''}`;
    }

    // Raw properties (everything else). Hide the keys we already promoted
    // into the context block so the operator isn't reading them twice. The
    // notification fields are promoted too so the JSON dump doesn't repeat them.
    const promoted = new Set(['screen','screen_name','element','element_key','element_type','label','trace_id','span_id','class_name','framework','package',
      ...(isNotification ? ['state','action','notification_id','title','body','data'] : [])]);
    const rest = Object.fromEntries(Object.entries(p).filter(([k]) => !promoted.has(k)));
    const propsHtml = Object.keys(rest).length
      ? `<div class="key" style="margin-top:10px">Properties khác</div>
         <div class="kv" style="grid-template-columns:140px 1fr;font-size:11px">${
           Object.entries(rest).map(([k,v]) =>
             `<div class="key">${esc(k)}</div><div class="mono" style="word-break:break-all">${esc(typeof v==='object'?JSON.stringify(v):String(v))}</div>`).join('')
         }</div>`
      : (ctxRows.length ? '' : '<div class="muted">Sự kiện này không truyền properties.</div>');

    // (Removed) "Map sang Snowplow (server-side)" button — the SDK now ships
    // Snowplow events directly so the portal no longer needs to relay taps
    // under a renamed schema. Apps wire UniTrack.track(<event_name>) at the
    // call site and SnowplowProvider takes care of the forward.
    body = ctxHtml + notifHtml + netHtml + propsHtml;
  }

  const titleColor = isErr ? 'var(--danger)' : 'var(--accent2)';
  dlg.innerHTML = `
    <div class="dlg-h" style="color:${titleColor}">${isErr?'⚠ ':''}${esc(a.event_name)}${a.element_key?` · ${esc(a.element_key)}`:''}
      <button class="act-close" style="background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer">×</button></div>
    <div class="dlg-b">${body}<div id="actProvBlock" style="margin-top:14px"></div></div>`;
  try { dlg.showModal(); } catch(_){ dlg.setAttribute('open',''); }
  // Pull per-provider mirrors (Snowplow + Firebase) for this event so the
  // operator sees EXACTLY what each provider received. Fire-and-forget — the
  // dialog renders without it; this just augments when it lands.
  loadProviderMirrors(a).catch((_)=>{});
  // Close = remove element (✕ + backdrop), so no stray dialog lingers in the DOM.
  const kill = ()=>{ try{ dlg.close(); }catch(_){}; dlg.remove(); };
  dlg.querySelector('.act-close').onclick = kill;
  dlg.onclick = (e)=>{ if(e.target === dlg) kill(); };

  // (Removed) actSpFwdBtn wiring — the server-side Snowplow mapping shortcut
  // was retired alongside its dialog. See showActionDetail for the markup
  // change that dropped the button.
}


// Crash report dialog — opens from the Crashes card on the project overview.
// Two views in one dialog:
//   1) Group list: signature (message + screen) ordered by frequency, with
//      session/user counts.
//   2) Group detail (when an item is expanded): one representative crash's
//      message + stack + properties + the 5 most recent sessions hit (each
//      a deep-link into the session IDE).
async function openCrashReportDialog(pid) {
  closeAllUtilDialogs();
  const dlg = document.createElement('dialog'); dlg.id = 'crashDlg'; dlg.className = 'ut-util-dlg';
  dlg.style.cssText = 'width:880px;max-width:96vw;max-height:88vh;padding:0;z-index:110;'
    + 'display:flex;flex-direction:column;overflow:hidden';
  dlg.innerHTML = `
    <div class="dlg-h" style="flex:0 0 auto;color:var(--danger)">⚠ Báo cáo crash
      <button class="cr-close" style="background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer">×</button></div>
    <div class="dlg-b" style="flex:1 1 auto;min-height:0;overflow-y:auto;padding:14px 16px" id="crashBody">
      <div class="muted" style="font-size:12px">Đang tải…</div>
    </div>`;
  document.body.appendChild(dlg);
  try { dlg.showModal(); } catch (_) { dlg.setAttribute('open',''); }
  const kill = () => { try { dlg.close(); } catch (_) {} dlg.remove(); };
  dlg.querySelector('.cr-close').onclick = kill;
  dlg.onclick = (e) => { if (e.target === dlg) kill(); };

  let data;
  try { data = await api(`/api/projects/${pid}/crashes`); }
  catch (e) {
    document.getElementById('crashBody').innerHTML =
      `<div style="color:var(--danger)">Không tải được crash report: ${esc(e.message || e)}</div>`;
    return;
  }
  renderCrashReport(pid, data, kill);
}

function renderCrashReport(pid, data, killFn) {
  const body = document.getElementById('crashBody');
  if (!body) return;
  // Override the inherited `.dlg-b` flex-column on this container — flex
  // siblings get height:0 by default in a vertical flex layout and that
  // collapsed every crash row to a thin line (the "16 rows, no content"
  // symptom). Block layout lets each row claim its natural height.
  body.style.display = 'block';
  body.style.gap = '0';
  if (!data.groups || !data.groups.length) {
    body.innerHTML = '<div class="muted">Không có crash nào (data.total_crashes = 0).</div>';
    return;
  }
  const fmtAgo = (ts) => {
    const d = Date.now() - ts;
    if (d < 60_000) return Math.round(d / 1000) + 's trước';
    if (d < 3600_000) return Math.round(d / 60_000) + ' phút trước';
    if (d < 86400_000) return Math.round(d / 3600_000) + ' giờ trước';
    return Math.round(d / 86400_000) + ' ngày trước';
  };
  // Header summary: total + group count.
  const header = `
    <div style="display:flex;gap:16px;align-items:baseline;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--line)">
      <div><span style="font-size:24px;font-weight:700;color:var(--danger)">${data.total_crashes}</span>
        <span class="muted" style="font-size:11px;margin-left:4px">tổng crash</span></div>
      <div><span style="font-size:18px;font-weight:600">${data.group_count}</span>
        <span class="muted" style="font-size:11px;margin-left:4px">loại lỗi khác nhau</span></div>
      <span class="muted" style="font-size:11px;margin-left:auto">Sắp xếp theo tần suất</span>
    </div>`;
  // Each group rendered collapsed; expand toggles the detail panel inline.
  const groups = data.groups.map((g, i) => {
    const sessionsHtml = g.recent_sessions.map((s) => `
      <a class="cr-sess" data-sid="${esc(s.session_id)}"
         style="display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border:1px solid var(--line);
                border-radius:14px;font-size:11px;cursor:pointer;background:var(--bg);text-decoration:none;color:var(--text)">
        <span class="mono" style="color:var(--accent2)">${esc(shortSid(s.session_id))}</span>
        <span class="muted">${s.user_id ? esc(s.user_id) + ' · ' : ''}${fmtAgo(s.timestamp)}</span>
      </a>`).join('');
    // Pull the stack out of the sample's properties (if any) — present at
    // crash time as `stack_trace` (Flutter exception) or `stack` (native).
    const p = g.sample.properties || {};
    const stack = p.stack_trace || p.stack || p.callstack || null;
    const extraProps = Object.fromEntries(
      Object.entries(p).filter(([k]) => !['stack_trace','stack','callstack','message','error','exception','signal_name','screen','screen_name','session_id','user_id'].includes(k))
    );
    const propsHtml = Object.keys(extraProps).length
      ? `<div class="key" style="margin-top:10px">Properties khác</div>
         <div class="kv" style="grid-template-columns:140px 1fr;font-size:11px">${
           Object.entries(extraProps).map(([k, v]) =>
             `<div class="key">${esc(k)}</div><div class="mono" style="word-break:break-all">${esc(typeof v === 'object' ? JSON.stringify(v) : String(v))}</div>`).join('')
         }</div>`
      : '';
    return `
      <div class="cr-group" data-i="${i}" style="border:1px solid var(--line);border-radius:8px;margin-bottom:10px;overflow:hidden">
        <div class="cr-head" data-i="${i}" style="display:flex;gap:10px;align-items:center;padding:10px 14px;cursor:pointer;background:var(--panel)">
          <span style="color:var(--danger);font-size:16px;flex-shrink:0">⚠</span>
          <div style="flex:1;min-width:0">
            <div style="font-weight:600;font-size:13px;color:var(--danger);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(g.message)}">${esc(g.message)}</div>
            <div class="muted" style="font-size:11px;margin-top:2px">
              📱 <span class="mono">${esc(g.screen)}</span> ·
              ${g.platform || ''}
            </div>
          </div>
          <div style="text-align:right;flex-shrink:0">
            <div><span style="font-size:18px;font-weight:700;color:var(--danger)">${g.count}</span>
              <span class="muted" style="font-size:10px">crash</span></div>
            <div class="muted" style="font-size:10px">${g.session_count} session · ${g.user_count} user</div>
          </div>
          <span class="cr-caret" style="color:var(--muted);font-size:14px;width:14px;text-align:center">▸</span>
        </div>
        <div class="cr-detail" data-i="${i}" style="display:none;padding:12px 14px;border-top:1px solid var(--line);background:var(--bg)">
          <div class="muted" style="font-size:11px;margin-bottom:8px">
            Lần đầu: <span class="mono">${fmtTime(g.first_seen)}</span> ·
            Gần nhất: <span class="mono">${fmtTime(g.last_seen)}</span> ·
            App version: <span class="mono">${esc(g.sample.app_version || '—')}</span>
          </div>
          ${stack ? `<div class="key">Stack trace</div>
            <pre style="background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;
                        font-size:11px;max-height:280px;overflow:auto;white-space:pre-wrap;word-break:break-word;margin:4px 0 10px">${esc(stack)}</pre>` : ''}
          ${propsHtml}
          ${g.recent_sessions.length ? `<div class="key" style="margin-top:12px">Session gần nhất bị crash</div>
            <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px">${sessionsHtml}</div>
            <div class="muted" style="font-size:10px;margin-top:6px">Bấm 1 session để mở session detail</div>` : ''}
        </div>
      </div>`;
  }).join('');
  body.innerHTML = header + groups;

  // Wire expand/collapse + session deep-link.
  body.querySelectorAll('.cr-head').forEach((h) => {
    h.onclick = () => {
      const i = h.dataset.i;
      const detail = body.querySelector(`.cr-detail[data-i="${i}"]`);
      const caret  = h.querySelector('.cr-caret');
      const open = detail.style.display === 'none' || !detail.style.display;
      detail.style.display = open ? 'block' : 'none';
      if (caret) caret.textContent = open ? '▾' : '▸';
    };
  });
  body.querySelectorAll('.cr-sess').forEach((a) => {
    a.onclick = (ev) => {
      ev.preventDefault();
      // Close the crash dialog so the IDE overlay isn't fighting it for focus.
      if (killFn) killFn();
      openSessionIDE(pid, a.dataset.sid).catch(() => {});
    };
  });
}

// User-list dialog — opens from the Users card on the project overview.
// Session layout (wireframe) dialog — fetch each screen the SDK captured
// for this session and render the view tree as a nested SVG outline.
// Per Phase 7 of the audit fix: the SDK posts `screen_layout` events with
// either a gzipped JSON tree (iOS/Android/Flutter) or a raw JSON tree (RN);
// the server decodes both into a uniform {screen, tree} shape exposed at
// GET /api/projects/:id/sessions/:sid/layouts.
async function openLayoutDialog(pid, sid) {

    <div style="flex:0 0 auto;display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel);align-items:center;font-size:12px;flex-wrap:wrap">
      <span class="muted">Màn:</span>
      <select id="layPick" style="background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--text);padding:5px 8px;font-size:12px;min-width:240px"></select>
      <span id="layMeta" class="muted" style="font-size:11px"></span>
      <span style="flex:1"></span>

    document.getElementById('layBody').innerHTML = renderWireframeSvg(lay.tree, { labels: labelsToggle.checked });
  };
  pick.onchange = render;
  labelsToggle.onchange = render;
  render();
}

// Render a tree node (from the SDK wireframe) as nested SVG <rect>s + labels.
// The tree carries absolute window coordinates on iOS/Android; React Native
// fibers send 0/0 so the renderer falls back to a flow layout (auto-grid).
function renderWireframeSvg(tree, opts = {}) {
  if (!tree) return '<div class="muted">Empty tree.</div>';
  // Detect "no real coordinates" — every w/h zero means RN fiber path. In
  // that case fall back to a simple indented text listing of the tree.
  const hasFrames = (() => {
    let yes = false;
    const visit = (n) => {
      if (!n) return;
      if ((n.w || 0) > 0 && (n.h || 0) > 0) yes = true;
      (n.children || []).forEach(visit);
    };
    visit(tree);
    return yes;
  })();

  if (!hasFrames) {
    // Indented tree — RN doesn't carry frames. Useful debug listing.
    const lines = [];
    const walk = (n, depth) => {
      const pad = '· '.repeat(depth);
      const lbl = n.text ? ` <span style="color:var(--accent2)">"${esc(n.text)}"</span>` : '';
      lines.push(`<div class="mono" style="font-size:11px;line-height:1.5">${pad}<b>${esc(n.type)}</b>${lbl}</div>`);
      (n.children || []).forEach((c) => walk(c, depth + 1));
    };
    walk(tree, 0);
    return `<div class="muted" style="font-size:11px;margin-bottom:8px">React Native — không có toạ độ, hiển thị dạng cây.</div>${lines.join('')}`;
  }

  // Viewport = the root view's size (Flutter MaterialApp / iOS UIWindow /
  // Android decorView). The SDK walks DEPTH-FIRST so the root is always the
  // first node — fall back to a sane mobile size if root.w/h missing.
  const vpW = (tree.w && tree.w > 0) ? tree.w : 414;
  const vpH = (tree.h && tree.h > 0) ? tree.h : 896;

  // Frame SVG at a fixed display height (480px) and width keeping aspect
  // ratio so the dialog doesn't stretch. Add 12px chrome padding on each
  // side. Coordinates from the SDK are window-relative (top-left = 0,0),
  // so we just scale uniformly.
  const displayH = 600;
  const scale = displayH / vpH;
  const svgW = Math.round(vpW * scale) + 24;
  const svgH = displayH + 24;
  const offX = 12, offY = 12;

  // Pass 1 — collect every node with a measurable frame. We render them in
  // a flat list (not recursive nesting) so the stroke of a parent never
  // sits underneath a child's stroke. Sort by area DESC so big containers
  // render first and small leaves on top (the normal "back-to-front" order).
  const items = [];
  const walk = (n, depth) => {
    if (!n) return;
    const w = n.w || 0, h = n.h || 0;
    if (w > 0 && h > 0) items.push({ n, depth, area: w * h });
    (n.children || []).forEach((c) => walk(c, depth + 1));
  };
  walk(tree, 0);
  items.sort((a, b) => b.area - a.area);

  // Categorise each node by its widget/view TYPE so layout containers vs
  // visible widgets get different visual weight. Containers (Padding,
  // SizedBox, Column, Row, Stack, Container, …) are skeletons of the
  // layout grid — render with a faint dashed outline so they don't fight
  // for attention. Everything else (Text, Image, IconButton, Card, …) is
  // a "visible" leaf — render with a stronger stroke + light fill.
  const isContainer = (type) => {
    if (!type) return true;
    const t = String(type);
    // The `(.*)?` tail catches generic-typed variants (e.g. State<Foo>,
    // _ColumnState<…>) without the regex engine choking on a `<` inside
    // a character class — older versions of `<...>` syntax rejected it.
    return /^_?(Padding|SizedBox|Column|Row|Stack|Container|Flex|Expanded|Align|Center|Positioned|Wrap|Flexible|Material|MaterialApp|Scaffold|SafeArea|Directionality|MediaQuery|LayoutBuilder|Theme|Builder|RepaintBoundary|ClipR|Transform|Offstage|Visibility|FractionallySizedBox|ConstrainedBox|DecoratedBox|Provider|Consumer|Selector|Listener|GestureDetector|Semantics|NotificationListener|FocusScope|Focus|Localizations|IconTheme|IconButtonTheme|DefaultTextStyle|InheritedTheme|HeroController|Navigator|Overlay|MediaQueryFromWindow|RootRestorationScope|UnitToBuildLayer|RawGestureDetector|MouseRegion|AbsorbPointer|IgnorePointer|InteractiveViewer|SliverPadding|SliverList|SliverFillRemaining|CustomMultiChildLayout|SliverToBoxAdapter|CustomScrollView)(?:.*)?$|^(?:View|ViewGroup|FrameLayout|LinearLayout|RelativeLayout|ConstraintLayout|CoordinatorLayout|AppBarLayout|UIView|UIStackView|UIViewController|FlutterView)$/.test(t);
  };

  // Cap rendered count for performance. 2000 nodes ≈ ~120KB SVG which is
  // still snappy; below that we draw everything.
  const RENDER_CAP = 2000;
  const overflow = items.length > RENDER_CAP;
  const rendered = items.slice(0, RENDER_CAP);

  const rects = [];
  const labels = [];
  for (const { n, depth } of rendered) {
    const x = Math.round(n.x * scale) + offX;
    const y = Math.round(n.y * scale) + offY;
    const w = Math.max(1, Math.round(n.w * scale));
    const h = Math.max(1, Math.round(n.h * scale));
    // Hide truly off-screen nodes — Flutter often lays out scrolled-out
    // lists at huge y values. They make the SVG taller than the viewport
    // for no reason.
    if (x > svgW || y > svgH || x + w < 0 || y + h < 0) continue;

    const container = isContainer(n.type);
    if (container) {
      // Dashed faint outline only — no fill. Doesn't fight with visible
      // widgets layered on top.
      rects.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2"
        fill="none" stroke="rgba(120,140,180,0.28)" stroke-width="0.6"
        stroke-dasharray="2,3">
        <title>${esc(n.type || '')} · ${n.w}×${n.h}</title>
      </rect>`);
    } else {
      // Visible widget: light slate fill + crisp stroke. Hue keyed by
      // depth so different layout levels read distinctly without being loud.
      const hue = (200 + depth * 30) % 360;
      rects.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3"
        fill="hsla(${hue},35%,55%,0.10)" stroke="hsla(${hue},55%,65%,0.85)" stroke-width="1">
        <title>${esc(n.type || '')}${n.text ? ` — "${esc(n.text)}"` : ''} · ${n.w}×${n.h}</title>
      </rect>`);
      // Text labels only on visible-widget rects (containers are skeleton).
      if (opts.labels && n.text && w > 30 && h > 14) {
        const txt = String(n.text);
        labels.push(`<text x="${x + 4}" y="${y + 11}" font-size="9.5"
          fill="var(--text)" font-family="ui-sans-serif">${esc(txt.length > 28 ? txt.slice(0, 27) + '…' : txt)}</text>`);
      }
    }
  }

  // Phone-frame chrome: a rounded outline at viewport size so the operator
  // sees the actual screen dimensions instead of just floating rects.
  const frameW = Math.round(vpW * scale);
  const frameH = Math.round(vpH * scale);
  const frame = `<rect x="${offX}" y="${offY}" width="${frameW}" height="${frameH}"
    rx="14" fill="rgba(255,255,255,0.02)" stroke="rgba(180,200,230,0.4)" stroke-width="1.5"/>`;

  const overflowBadge = overflow
    ? `<text x="${offX + 8}" y="${offY + frameH - 10}" font-size="10" fill="var(--warn)">
         ⚠ Hiển thị ${RENDER_CAP}/${items.length} node (truncated)
       </text>`
    : '';

  return `<svg viewBox="0 0 ${svgW} ${svgH}" width="${svgW}" height="${svgH}"
    style="background:var(--panel);border:1px solid var(--line);border-radius:6px;display:block;max-width:100%">${frame}${rects.join('')}${labels.join('')}${overflowBadge}</svg>`;
}

// Same data source as the existing user <select> in the Sessions/wireframe
// toolbar, but with search + click-to-filter so picking a user takes the
// operator straight to that user's sessions.
async function openUsersDialog(pid) {
  closeAllUtilDialogs();
  const dlg = document.createElement('dialog'); dlg.id = 'usersDlg'; dlg.className = 'ut-util-dlg';
  dlg.style.cssText = 'width:640px;max-width:96vw;max-height:84vh;padding:0;z-index:110;'
    + 'display:flex;flex-direction:column;overflow:hidden';
  dlg.innerHTML = `
    <div class="dlg-h" style="flex:0 0 auto">👥 Danh sách user
      <button class="usr-close" style="background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer">×</button></div>
    <div style="flex:0 0 auto;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)">
      <input id="usrSearch" placeholder="🔎 Tìm theo user_id / username / epcode…" autocomplete="off"
        style="width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:8px 12px;font-size:13px">
    </div>
    <div class="dlg-b" id="usrList" style="flex:1 1 auto;min-height:0;overflow-y:auto;padding:6px 0">
      <div class="muted" style="font-size:12px;padding:14px">Đang tải…</div>
    </div>`;
  document.body.appendChild(dlg);
  try { dlg.showModal(); } catch (_) { dlg.setAttribute('open', ''); }
  const kill = () => { try { dlg.close(); } catch (_) {} dlg.remove(); };
  dlg.querySelector('.usr-close').onclick = kill;
  dlg.onclick = (e) => { if (e.target === dlg) kill(); };

  let users = [];
  try {
    const data = await api(`/api/projects/${pid}/users`);
    users = (data && data.users) || [];
  } catch (e) {
    document.getElementById('usrList').innerHTML =
      `<div style="color:var(--danger);padding:14px">Không tải được user list: ${esc(e.message || e)}</div>`;
    return;
  }
  if (!users.length) {
    document.getElementById('usrList').innerHTML =
      '<div class="muted" style="padding:14px">Project chưa có user nào (chưa có event nào kèm user_id).</div>';
    return;
  }

  // Reusable row renderer — called on initial render + on each search keystroke.
  // Match against user_id + username + epcode (lowercase, substring).
  const fmtAgo = (ts) => {
    if (!ts) return '—';
    const d = Date.now() - ts;
    if (d < 60_000) return Math.round(d / 1000) + 's';
    if (d < 3600_000) return Math.round(d / 60_000) + ' phút';
    if (d < 86400_000) return Math.round(d / 3600_000) + ' giờ';
    return Math.round(d / 86400_000) + ' ngày';
  };
  const renderList = (q) => {
    const list = document.getElementById('usrList');
    const needle = (q || '').toLowerCase().trim();
    const filtered = needle
      ? users.filter((u) => {
          const hay = [u.user_id, u.username, u.epcode].filter(Boolean).join(' ').toLowerCase();
          return hay.includes(needle);
        })
      : users;
    if (!filtered.length) {
      list.innerHTML = '<div class="muted" style="padding:14px;font-size:12px">Không user nào khớp.</div>';
      return;
    }
    list.innerHTML = filtered.map((u) => {
      const display = u.username && u.username !== u.user_id
        ? `${esc(u.username)} <span class="muted" style="font-weight:400">· ${esc(u.user_id)}</span>`
        : esc(u.user_id);
      const sub = [
        u.epcode ? `EP <span class="mono">${esc(u.epcode)}</span>` : null,
        u.session_count ? `${u.session_count} session` : null,
        u.event_count ? `${u.event_count} event` : null,
        u.last_seen ? `gặp gần nhất ${fmtAgo(u.last_seen)} trước` : null,
      ].filter(Boolean).join(' · ');
      return `
        <div class="usr-row" data-uid="${esc(u.user_id)}"
          style="display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--line)">
          <div style="width:36px;height:36px;border-radius:50%;background:var(--bg);border:1px solid var(--line);
                      display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;color:var(--accent2)">
            ${esc((u.username || u.user_id || '?').slice(0, 1).toUpperCase())}
          </div>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${display}</div>
            <div class="muted" style="font-size:11px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${sub || '(no metadata)'}</div>
          </div>
          <div style="text-align:right;flex-shrink:0">
            <div><span style="font-size:18px;font-weight:700;color:var(--accent)">${u.session_count || 0}</span></div>
            <div class="muted" style="font-size:10px">session</div>
          </div>
        </div>`;
    }).join('');
    list.querySelectorAll('.usr-row').forEach((row) => {
      row.onclick = () => {
        // Pick this user → close dialog, set the global user filter, and switch
        // to the Sessions tab so the right pane updates immediately.
        _userFilter = row.dataset.uid;
        kill();
        go({ name: 'project', pid, tab: 'sessions' });
      };
    });
  };
  renderList('');

  // Debounced search — keeps typing snappy on a big user list.
  const inp = document.getElementById('usrSearch');
  inp.focus();
  inp.oninput = () => {
    clearTimeout(inp._h);
    inp._h = setTimeout(() => renderList(inp.value), 120);
  };
  // Enter on a single match → pick it.
  inp.onkeydown = (ev) => {
    if (ev.key !== 'Enter') return;
    const rows = document.querySelectorAll('#usrList .usr-row');
    if (rows.length === 1) rows[0].click();
  };
}

// Fetch + render the per-provider payload of this event ("what was forwarded
// to Snowplow / Firebase next to what UniTrack stored"). Hits the existing
// /event-detail endpoint which returns { event_name, providers: { unitrack,
// snowplow, firebase } }. Renders inside #actProvBlock (created by
// showActionDetail) so we don't need to know about the dialog plumbing.
async function loadProviderMirrors(a) {
  const block = document.getElementById('actProvBlock');
  if (!block) return;
  // Need a project context — route.pid is the same one the session was opened
  // from (the IDE overlay always lives inside a project view).
  const pid = route?.pid; if (!pid || !a || !a.event_name) return;
  // Session id is plumbed onto the action by the IDE renderer (data-sid on
  // the row); fall back to undefined so the endpoint at least filters by name.
  const sid = a.sid || a.session_id || _ideState?.sid || '';
  const qs = `session=${encodeURIComponent(sid)}&name=${encodeURIComponent(a.event_name)}&ts=${a.ts||0}`;

  block.innerHTML = '<div class="muted" style="font-size:11px">Đang tải provider forwards…</div>';
  let resp;
  try { resp = await api(`/api/projects/${pid}/event-detail?${qs}`); }
  catch (_) { block.innerHTML = ''; return; }

  // Drop the "unitrack" entry — that's the row we're already showing as
  // properties above. We only care about external mirrors (snowplow + firebase).
  // Sort so Snowplow first, Firebase second (alphabetical works).
  const provs = resp.providers || {};
  const others = Object.keys(provs).filter((p) => p !== 'unitrack').sort();
  if (!others.length) { block.innerHTML = ''; return; }

  const colorFor = (p) => p === 'snowplow' ? '#f59e0b' : p === 'firebase' ? '#fbbc05' : 'var(--accent)';
  const iconFor  = (p) => p === 'snowplow' ? '❄' : p === 'firebase' ? '🔥' : '•';

  const tabs = others.map((p, i) => `
    <button class="ap-tab" data-p="${p}"
      style="background:none;border:none;border-bottom:2px solid ${i===0?colorFor(p):'transparent'};
             color:${i===0?colorFor(p):'var(--muted)'};font-weight:600;font-size:12px;
             padding:6px 10px;cursor:pointer;letter-spacing:.3px">
      ${iconFor(p)} ${p}
    </button>`).join('');
  const panes = others.map((p, i) => {
    const d = provs[p];
    // Snowplow mirror has _sp_type/_sp_schema/_sp_category etc — pull them out
    // into a clear header so the operator can see "this went out as a
    // self_describing event with schema iglu:...".
    const props = d.properties || {};
    let header = '';
    if (p === 'snowplow') {
      const t = props._sp_type;
      if (t === 'self_describing') {
        header = `<div class="muted" style="font-size:11px;margin-bottom:6px">
          gửi dưới dạng <b style="color:${colorFor(p)}">self-describing</b><br>
          <span class="mono" style="word-break:break-all">${esc(props._sp_schema || '')}</span></div>`;
      } else if (t === 'structured') {
        header = `<div class="muted" style="font-size:11px;margin-bottom:6px">
          gửi dưới dạng <b style="color:${colorFor(p)}">structured</b>
          (category=${esc(props._sp_category||'')}, action=${esc(props._sp_action||'')})</div>`;
      }
    } else if (p === 'firebase') {
      header = `<div class="muted" style="font-size:11px;margin-bottom:6px">
        Firebase Analytics event — <span class="mono">${esc(d.event_name || a.event_name)}</span></div>`;
    }
    // Show every key/value the provider received as a kv table (skip the
    // _sp_* meta we already surfaced in the header).
    const rows = Object.entries(props)
      .filter(([k]) => !(p === 'snowplow' && k.startsWith('_sp_')))
      .map(([k, v]) => `<div class="key">${esc(k)}</div><div class="mono" style="word-break:break-all">${
        esc(typeof v === 'object' ? JSON.stringify(v) : String(v))
      }</div>`).join('');
    const kvHtml = rows
      ? `<div class="kv" style="grid-template-columns:140px 1fr;font-size:11px">${rows}</div>`
      : '<div class="muted" style="font-size:11px">(không có properties)</div>';
    return `<div class="ap-pane" data-p="${p}" style="display:${i===0?'block':'none'};padding-top:10px">
      ${header}${kvHtml}
      <div class="muted" style="font-size:10px;margin-top:8px">
        Gửi lúc: <span class="mono">${d.timestamp ? fmtTime(d.timestamp) : '—'}</span>
      </div>
    </div>`;
  }).join('');

  block.innerHTML = `
    <div class="key" style="margin-bottom:6px">📤 Đã forward tới ${others.length} provider</div>
    <div style="border:1px solid var(--line);border-radius:8px;background:var(--bg);overflow:hidden">
      <div style="display:flex;gap:0;border-bottom:1px solid var(--line)">${tabs}</div>
      <div style="padding:8px 12px 12px">${panes}</div>
    </div>`;

  // Tab switching — flip borders + display in one pass so the user can compare
  // snowplow vs firebase by clicking.
  block.querySelectorAll('.ap-tab').forEach((btn) => {
    btn.onclick = () => {
      const p = btn.dataset.p;
      block.querySelectorAll('.ap-tab').forEach((b) => {
        b.style.borderBottomColor = b.dataset.p === p ? colorFor(b.dataset.p) : 'transparent';
        b.style.color = b.dataset.p === p ? colorFor(b.dataset.p) : 'var(--muted)';
      });
      block.querySelectorAll('.ap-pane').forEach((pane) => {
        pane.style.display = pane.dataset.p === p ? 'block' : 'none';
      });
    };
  });
}

// ── Per-session wireframe: a detailed flow graph of ONE session ────────────
// Layout is a vertical sequence of screen lanes; inside each lane the actions
// (button taps / network calls) are nodes laid left→right in time order, with
// network children hanging under their triggering action. Clicking a network
// node shows its URL + status. Rendered in a full-screen overlay.
let _swfActions = [];   // action nodes (clickable), indexed by id
let _swfNetGroups = [];  // grouped network lists, indexed by id
// Per-session wireframe as a node-link GRAPH (screens + actions + grouped
// network nodes) on a pannable/zoomable canvas. N network calls under one
// action collapse into a single "🌐 [N]" node; clicking it opens a list drawer.
function openSessionWireframe(segs, sid){
  _swfActions = []; _swfNetGroups = [];
  // ── render each screen as a PHONE-FRAME mockup ────────────────────────
  // A frame is a tall rounded rect (a device screen). Inside, blocks stack
  // top→bottom in interaction order: a title bar (class name), a "{N api call}"
  // block, then button-labels / actions. Frames sit left→right, joined by thin
  // arrows. The whole thing lives on the pannable/zoomable canvas.
  const PHONE_W = 280, FRAME_GAP = 90, PAD = 16, BLOCK_H = 42, BLOCK_GAP = 12, TOP = 60, TITLE_H = 44;
  const frames = [];   // {x, y, w, h, svg}
  let fx = 50;
  segs.forEach((seg)=>{
    // Build the inner blocks for this screen.
    let by = TOP + TITLE_H + 14;   // first block y (below title)
    let inner = '';
    // Screen-level network (standalone calls) → one "{N api call}" block on top.
    const standalone = [];
    seg.actions.forEach(a=>{ if(a.standaloneNet) standalone.push(...a.networks); });
    const blockW = PHONE_W - PAD*2;
    const addNetBlock = (networks, ctxLabel)=>{
      const gid = _swfNetGroups.length; _swfNetGroups.push({ networks, action: ctxLabel });
      const hasErr = networks.some(n=>n.net_error || (n.status>=400));
      const c = hasErr ? '#f59e0b' : '#79c0ff';
      inner += `<g class="swf-netgroup" data-gid="${gid}" style="cursor:pointer">
        <rect x="${fx+PAD}" y="${by}" width="${blockW}" height="${BLOCK_H}" rx="8" fill="${c}1f" stroke="${c}" stroke-width="1.4" stroke-dasharray="4,3"/>
        <text x="${fx+PHONE_W/2}" y="${by+BLOCK_H/2+4}" text-anchor="middle" fill="${c}" font-size="12" font-weight="700">{ ${networks.length} api call${hasErr?' ⚠':''} }</text></g>`;
      by += BLOCK_H + BLOCK_GAP;
    };
    if(standalone.length) addNetBlock(standalone, seg.screen);

    seg.actions.forEach(a=>{
      if(a.standaloneNet) return;   // already in the top net block
      const aid = _swfActions.length; _swfActions.push({ ...a, sid });
      const isTap = a.event_name==='tap';
      const danger = a.event_name==='crash'||a.event_name==='application_error'||a.event_name==='json_parse_error';
      const c = danger?'#dc2626':(isTap?'#27d796':'#8b94a7');
      // A button-style block (rounded, looks like a UI control).
      const label = isTap ? (a.element_key||'button') : a.event_name;
      const icon = danger?'⚠ ':(isTap?'':'• ');
      inner += `<g class="swf-act" data-aid="${aid}" style="cursor:pointer">
        <rect x="${fx+PAD}" y="${by}" width="${blockW}" height="${BLOCK_H}" rx="${isTap?20:8}" fill="${c}22" stroke="${c}" stroke-width="1.5"/>
        <text x="${fx+PHONE_W/2}" y="${by+BLOCK_H/2+4}" text-anchor="middle" fill="var(--text)" font-size="12" font-weight="600">${esc(icon)}${esc(label.length>28?label.slice(0,27)+'…':label)}</text></g>`;
      by += BLOCK_H + BLOCK_GAP;
      // Network triggered by this action → a small "{N api}" block indented under it.
      if(a.networks.length){
        const gid = _swfNetGroups.length; _swfNetGroups.push({ networks:a.networks, action:label });
        const hasErr = a.networks.some(n=>n.net_error || (n.status>=400));
        const c2 = hasErr ? '#f59e0b' : '#79c0ff';
        inner += `<g class="swf-netgroup" data-gid="${gid}" style="cursor:pointer">
          <rect x="${fx+PAD+24}" y="${by}" width="${blockW-24}" height="${BLOCK_H-8}" rx="6" fill="${c2}18" stroke="${c2}" stroke-width="1.2" stroke-dasharray="3,3"/>
          <text x="${fx+PAD+24+(blockW-24)/2}" y="${by+(BLOCK_H-8)/2+4}" text-anchor="middle" fill="${c2}" font-size="11" font-weight="600">↳ { ${a.networks.length} api }${hasErr?' ⚠':''}</text></g>`;
        by += (BLOCK_H-8) + BLOCK_GAP;
      }
    });

    const frameH = Math.max(by + PAD - TOP, 360);
    frames.push({ x:fx, y:TOP, w:PHONE_W, h:frameH, crashed:seg.crashed, screen:seg.screen, inner });
    fx += PHONE_W + FRAME_GAP;
  });

  const canvasW = fx + 60;
  const canvasH = Math.max(...frames.map(f=>f.y+f.h), 400) + 60;

  // Thin arrows between consecutive phone frames (screen → screen flow).
  const edgeSvg = frames.slice(0,-1).map((f,i)=>{
    const a=f, b=frames[i+1];
    const x1=a.x+a.w, y1=a.y+60, x2=b.x, y2=b.y+60;
    return `<path d="M${x1},${y1} C${x1+FRAME_GAP/2},${y1} ${x2-FRAME_GAP/2},${y2} ${x2},${y2}" fill="none" stroke="#5b8cff" stroke-width="1.4" stroke-opacity="0.6" marker-end="url(#swfArrow)"/>`;
  }).join('');

  // Phone frames (device chrome + title bar + inner blocks).
  const nodeSvg = frames.map(f=>{
    const sc = f.crashed ? '#dc2626' : '#3a4358';
    const title = f.screen.length>26 ? f.screen.slice(0,25)+'…' : f.screen;
    return `<g>
      <rect x="${f.x}" y="${f.y}" width="${f.w}" height="${f.h}" rx="22" fill="var(--panel)" stroke="${sc}" stroke-width="2"/>
      <rect x="${f.x}" y="${f.y}" width="${f.w}" height="${TITLE_H}" rx="22" fill="${f.crashed?'#dc2626':'#5b8cff'}22"/>
      <rect x="${f.x}" y="${f.y+TITLE_H-12}" width="${f.w}" height="12" fill="${f.crashed?'#dc2626':'#5b8cff'}22"/>
      <text x="${f.x+f.w/2}" y="${f.y+TITLE_H/2+5}" text-anchor="middle" fill="var(--text)" font-size="13" font-weight="700">${f.crashed?'⚠ ':''}📱 ${esc(title)}</text>
      ${f.inner}
    </g>`;
  }).join('');

  let ov = document.getElementById('swfOverlay');
  if(!ov){
    ov = document.createElement('div'); ov.id='swfOverlay';
    ov.style.cssText='position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column';
    document.body.appendChild(ov);
  }
  ov.style.display='flex';
  ov.innerHTML = `
    <div style="display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel)">
      <b>Wireframe session ${shortSid(sid)}</b>
      <span class="muted" style="font-size:12px">${segs.length} màn · kéo để di chuyển, cuộn để zoom · click node để xem chi tiết</span>
      <button class="btn ghost sm" id="swfZoomOut" style="margin-left:auto">−</button>
      <button class="btn ghost sm" id="swfZoomIn">+</button>
      <button class="btn ghost sm" id="swfFit">Fit</button>
      <button class="btn ghost sm" id="swfClose">✕ Đóng</button>
    </div>
    <div style="flex:1;display:flex;overflow:hidden">
      <div id="swfCanvas" style="flex:1;overflow:hidden;background:var(--bg);cursor:grab;position:relative">
        <svg id="swfSvg" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
          <defs><marker id="swfArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#5b8cff" opacity="0.7"/></marker></defs>
          <g id="swfViewport">${edgeSvg}${nodeSvg}</g>
        </svg>
      </div>
      <div id="swfDetail" style="width:400px;border-left:1px solid var(--line);background:var(--panel);padding:16px;overflow:auto">
        <div class="muted" style="font-size:12px">Click một node:<br>• action → properties + payload Snowplow/Firebase<br>• 🌐 [N] → danh sách network call (expand từng cái)</div>
      </div>
    </div>`;

  // ── pan + zoom ────────────────────────────────────────────────────────
  const vp = document.getElementById('swfViewport');
  const canvas = document.getElementById('swfCanvas');
  let scale=1, tx=0, ty=0, dragging=false, sx0=0, sy0=0, tx0=0, ty0=0;
  const apply = ()=>{ vp.setAttribute('transform', `translate(${tx},${ty}) scale(${scale})`); };
  const fit = ()=>{
    const rect = canvas.getBoundingClientRect();
    scale = Math.min(1, (rect.width-40)/canvasW, (rect.height-40)/canvasH);
    if(!isFinite(scale)||scale<=0) scale=0.6;
    tx = 20; ty = 20; apply();
  };
  canvas.onmousedown = (e)=>{ dragging=true; sx0=e.clientX; sy0=e.clientY; tx0=tx; ty0=ty; canvas.style.cursor='grabbing'; };
  window.addEventListener('mousemove', (e)=>{ if(!dragging)return; tx=tx0+(e.clientX-sx0); ty=ty0+(e.clientY-sy0); apply(); });
  window.addEventListener('mouseup', ()=>{ dragging=false; canvas.style.cursor='grab'; });
  canvas.onwheel = (e)=>{ e.preventDefault();
    const rect=canvas.getBoundingClientRect();
    const mx=e.clientX-rect.left, my=e.clientY-rect.top;
    const f = e.deltaY<0 ? 1.12 : 1/1.12;
    const ns = Math.max(0.2, Math.min(2.5, scale*f));
    // zoom toward cursor
    tx = mx - (mx-tx)*(ns/scale); ty = my - (my-ty)*(ns/scale); scale=ns; apply();
  };
  document.getElementById('swfZoomIn').onclick = ()=>{ scale=Math.min(2.5,scale*1.2); apply(); };
  document.getElementById('swfZoomOut').onclick = ()=>{ scale=Math.max(0.2,scale/1.2); apply(); };
  document.getElementById('swfFit').onclick = fit;
  document.getElementById('swfClose').onclick = ()=>{ ov.style.display='none'; };
  setTimeout(fit, 30);

  // ── node clicks ───────────────────────────────────────────────────────
  ov.querySelectorAll('.swf-act').forEach(g=>{
    g.onclick = (e)=>{ e.stopPropagation(); showSwfEventDetail(_swfActions[+g.dataset.aid]); };
  });
  ov.querySelectorAll('.swf-netgroup').forEach(g=>{
    g.onclick = (e)=>{ e.stopPropagation(); showSwfNetGroup(_swfNetGroups[+g.dataset.gid]); };
  });
}

// Network group drawer: list of N calls, each expand/collapse to see url + IO.
function showSwfNetGroup(group){
  const rows = group.networks.map((n,i)=>{
    const c = n.net_error ? 'var(--danger)' : statusColor(n.status);
    const path = n.url ? (()=>{ try{ return new URL(n.url).pathname; }catch(_){ return n.url; } })() : (n.url||'(no url)');
    const statusTxt = n.net_error ? '✕' : (n.status!=null?n.status:'—');
    return `<div style="flex:0 0 auto;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;overflow:hidden">
      <div class="swf-netrow" data-i="${i}" style="display:flex;gap:8px;align-items:center;padding:8px 10px;cursor:pointer;font-size:12px;min-height:20px">
        <span style="color:#79c0ff">${esc(n.method||'')}</span>
        <span class="mono" title="${esc(n.url||path)}" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(path)}</span>
        <span style="color:${c};font-weight:700">${statusTxt}</span>
        <span class="muted" style="font-size:10px">▾</span>
      </div>
      <div class="swf-netbody" data-i="${i}" style="display:none;padding:8px 10px;border-top:1px solid var(--line)">
        <div class="kv" style="grid-template-columns:80px 1fr;font-size:11px">
          <div class="key">Method</div><div class="mono">${esc(n.method||'—')}</div>
          <div class="key">Status</div><div class="mono" style="color:${c};font-weight:700">${n.net_error?('✕ '+esc(n.net_error)):(n.status!=null?n.status:'—')}</div>
          <div class="key">Duration</div><div class="mono">${n.duration_ms!=null?n.duration_ms+' ms':'—'}</div>
          <div class="key">Thời gian</div><div class="mono">${n.ts?fmtTime(n.ts):'—'}</div>
        </div>
        <div class="key" style="margin-top:6px;font-size:11px">URL</div>
        <div class="mono" style="word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;margin-top:2px;font-size:11px">${esc(n.url||'—')}</div>
        ${n.request_body!=null?`<div class="key" style="margin-top:6px;font-size:11px">Request body (input)</div><pre style="background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;margin-top:2px;font-size:10px;white-space:pre-wrap;word-break:break-word;max-height:160px;overflow:auto">${esc(n.request_body)}</pre>`:''}
        ${n.response_body!=null?`<div class="key" style="margin-top:6px;font-size:11px">Response body (output)</div><pre style="background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;margin-top:2px;font-size:10px;white-space:pre-wrap;word-break:break-word;max-height:160px;overflow:auto">${esc(n.response_body)}</pre>`:''}
        ${n.req_bytes!=null||n.resp_bytes!=null?`<div class="muted" style="font-size:10px;margin-top:4px">req ${n.req_bytes??'—'}b · resp ${n.resp_bytes??'—'}b</div>`:''}
      </div>
    </div>`;
  }).join('');
  // Wrap rows in a plain block so the parent flex-column (.dlg-b) can't shrink
  // each row to a sliver (the bug: 40 rows collapsed to ~2px tall each).
  const inner = `<div style="display:block"><div class="muted" style="font-size:11px;margin-bottom:8px">từ: ${esc(group.action)}</div>${rows}</div>`;

  // Always use a single modal dialog (works from the session drawer AND from
  // the wireframe overlay). One source of truth → no stacked/stuck popups, and
  // the ✕ / backdrop always closes it.
  // Tear down ALL existing util dialogs first (modal + any stray non-modal box),
  // then build one fresh. Reusing a still-`open` <dialog> makes showModal() throw
  // InvalidStateError → the browser drops it into the page flow as an
  // un-closeable box behind the modal (the two-popup bug).
  closeAllUtilDialogs();
  const dlg = document.createElement('dialog'); dlg.id='netListDlg'; dlg.className='ut-util-dlg';
  // High z-index + appended to <body> so it sits on the top layer above the IDE
  // overlay (z-index 40) regardless of where it was triggered from.
  // Width upped from 560 → 920 so long API paths
  // (/service/mobinet/gateway/transition-deployment/api/v1/...) read end-to-end
  // without ellipsis. Capped at 96vw so it still fits on narrow screens.
  dlg.style.cssText='width:920px;max-width:96vw;max-height:85vh;padding:0;z-index:100;'
    +'display:flex;flex-direction:column;overflow:hidden';
  dlg.innerHTML = `<div class="dlg-h" style="flex:0 0 auto">🌐 ${group.networks.length} network call
    <button class="swf-net-close" style="background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer">×</button></div>
    <div class="dlg-b" style="flex:1 1 auto;min-height:0;max-height:none;overflow-y:auto">${inner}</div>`;
  document.body.appendChild(dlg);
  try { dlg.showModal(); } catch(_){ dlg.setAttribute('open',''); }
  // Close = remove the element entirely (✕ button and backdrop click).
  const kill = ()=>{ try{ dlg.close(); }catch(_){}; dlg.remove(); };
  dlg.querySelector('.swf-net-close').onclick = kill;
  dlg.onclick = (e)=>{ if(e.target === dlg) kill(); };  // click outside (backdrop)
  const container = dlg;
  container.querySelectorAll('.swf-netrow').forEach(r=>{
    r.onclick = ()=>{
      const body = container.querySelector(`.swf-netbody[data-i="${r.dataset.i}"]`);
      body.style.display = body.style.display==='none' ? 'block':'none';
    };
  });
}

// Render an event node's detail into the wireframe side panel: unitrack
// properties + the exact JSON payload forwarded to Snowplow / Firebase.
async function showSwfEventDetail(a){
  const panel = document.getElementById('swfDetail');
  panel.innerHTML = '<div class="muted" style="font-size:12px">Đang tải...</div>';
  let detail = { providers:{} };
  try {
    detail = await api(`/api/projects/${route.pid}/event-detail?session=${encodeURIComponent(a.sid||'')}&name=${encodeURIComponent(a.event_name)}&ts=${a.ts||0}`);
  } catch(e){ panel.innerHTML='<div style="color:var(--danger)">Không tải được chi tiết</div>'; return; }
  const provs = detail.providers || {};
  const order = ['unitrack','snowplow','firebase'];
  const colors = { unitrack:'#2563eb', snowplow:'#16a34a', firebase:'#d97706' };
  const present = order.filter(p=>provs[p]);
  const danger = a.event_name==='crash'||a.event_name==='application_error'||a.event_name==='json_parse_error';

  let head = `<h3 style="margin:0 0 4px;font-size:14px;color:${danger?'var(--danger)':'var(--text)'}">${danger?'⚠ ':''}${esc(a.event_name)}</h3>`;
  if(a.element_key) head += `<div class="muted mono" style="font-size:11px;margin-bottom:4px">${esc(a.element_key)}</div>`;
  if(a.triggeredBy) head += `<div style="font-size:11px;margin-bottom:6px">Do bấm: <b>${esc(a.triggeredBy)}</b></div>`;

  // Provider tabs.
  const tabs = present.map((p,i)=>`<span class="swfP" data-p="${p}" style="cursor:pointer;font-size:11px;padding:3px 10px;border-radius:6px;margin-right:4px;background:${i===0?colors[p]:'var(--panel2)'};color:${i===0?'#fff':'var(--muted)'}">${p}</span>`).join('');

  const renderProv = (p)=>{
    const d = provs[p]; if(!d) return '<div class="muted">— không gửi tới nguồn này —</div>';
    return `<pre style="background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:11px;white-space:pre-wrap;word-break:break-word;max-height:60vh;overflow:auto">${esc(JSON.stringify(d.properties,null,2))}</pre>`;
  };

  panel.innerHTML = head
    + (present.length?`<div style="margin:8px 0">${tabs}</div><div id="swfProvBody">${renderProv(present[0])}</div>`
                     :'<div class="muted">Không có dữ liệu provider.</div>');
  panel.querySelectorAll('.swfP').forEach(t=>{
    t.onclick = ()=>{
      panel.querySelectorAll('.swfP').forEach(x=>{ x.style.background='var(--panel2)'; x.style.color='var(--muted)'; });
      t.style.background=colors[t.dataset.p]; t.style.color='#fff';
      document.getElementById('swfProvBody').innerHTML = renderProv(t.dataset.p);
    };
  });
}

let _logProvider='';
let _logScreenFilter='';
let _logEventFilter='';
let _logSearchQuery='';
async function renderLogs(pid){
  const allRows=await api(`/api/projects/${pid}/events?limit=500`);

  let filtered=allRows;
  if(_logScreenFilter) filtered=filtered.filter(r=>(r.screen_name||r.screen||'')===_logScreenFilter);
  if(_logEventFilter) filtered=filtered.filter(r=>r.event_name===_logEventFilter);
  if(_logProvider) filtered=filtered.filter(r=>(r.provider||'unitrack')===_logProvider);
  if(_logSearchQuery){
    const q=_logSearchQuery.toLowerCase();
    filtered=filtered.filter(r=>{
      const props=typeof r.properties==='string'?JSON.parse(r.properties):r.properties;
      const propsStr=JSON.stringify(props).toLowerCase();
      return r.screen_name?.toLowerCase().includes(q)||r.element_key?.toLowerCase().includes(q)||propsStr.includes(q)||r.event_name.toLowerCase().includes(q);
    });
  }

  const screens=[...new Set(allRows.map(r=>r.screen_name||r.screen||'').filter(s=>s))].sort();
  const eventNames=[...new Set(allRows.map(r=>r.event_name))].sort();

  const tab=(p,label)=>`<span class="spv ${_logProvider===p?'on':''}" data-p="${p}" style="cursor:pointer;font-size:12px;padding:3px 10px;border-radius:6px;${_logProvider===p?'background:var(--accent);color:#fff':'background:var(--panel2);color:var(--muted)'}">${label}</span>`;

  $('#tabBody').innerHTML=`
    <div class="filter-bar">
      <span class="muted" style="align-self:center;font-size:12px">Nguồn:</span>
      ${tab('','Tất cả')} ${tab('unitrack','UniTrack')} ${tab('snowplow','Snowplow')} ${tab('firebase','Firebase')}
    </div>
    <div class="filter-bar" style="flex-direction:column;gap:8px;padding:14px">
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">
        <div>
          <label>Screen</label>
          <select id="filterScreen" style="width:100%">
            <option value="">Tất cả</option>
            ${screens.map(s=>`<option value="${esc(s)}" ${_logScreenFilter===s?'selected':''}>${esc(s)}</option>`).join('')}
          </select>
        </div>
        <div>
          <label>Event name</label>
          <select id="filterEvent" style="width:100%">
            <option value="">Tất cả</option>
            ${eventNames.map(e=>`<option value="${esc(e)}" ${_logEventFilter===e?'selected':''}>${esc(e)}</option>`).join('')}
          </select>
        </div>
        <div>
          <label>Search (tên/key)</label>
          <input id="filterSearch" placeholder="element, url..." value="${esc(_logSearchQuery)}" style="width:100%"/>
        </div>
      </div>
      <div class="muted" style="font-size:11px">Hiện ${filtered.length}/${allRows.length} event</div>
    </div>
    <div style="max-height:58vh;overflow:auto"><table>
    <thead><tr><th>Event</th><th>Nguồn</th><th>Screen</th><th>Element</th><th>Plat</th><th>Time</th></tr></thead>
    <tbody>${filtered.length?filtered.map((r,i)=>`
      <tr class="click ev" data-i="${i}" onclick="openDrawer(window._filteredRows[${i}])">
        <td><span class="badge ${esc(r.event_name)}">${esc(r.event_name)}</span>${evTag(r)}</td>
        <td>${providerBadge(r.provider)}</td>
        <td>${esc(r.screen_name||r.screen)||'<span class=muted>—</span>'}</td>
        <td class="mono">${esc(r.element_key)||'<span class=muted>—</span>'}</td>
        <td class="muted">${esc(r.platform)||'—'}</td>
        <td class="mono muted">${fmtAgo(r.timestamp)}</td>
      </tr>`).join(''):'<tr><td colspan=6 class=empty>Không có event phù hợp.</td></tr>'}
    </tbody></table></div>`;

  window._filteredRows=filtered;
  document.querySelectorAll('.spv').forEach(s=>s.onclick=()=>{ _logProvider=s.dataset.p; renderLogs(pid); });
  $('#filterScreen').onchange=()=>{ _logScreenFilter=$('#filterScreen').value; renderLogs(pid); };
  $('#filterEvent').onchange=()=>{ _logEventFilter=$('#filterEvent').value; renderLogs(pid); };
  $('#filterSearch').oninput=()=>{ _logSearchQuery=$('#filterSearch').value; renderLogs(pid); };
}

async function renderTree(pid){
  const [rows, cfg] = await Promise.all([
    api(`/api/projects/${pid}/events?limit=2000`),
    api(`/api/projects/${pid}/config`),
  ]);
  const rules = cfg.rules || [];
  const ruleFor = (ev, screen, elem) => rules.find(r =>
    r.match_event===ev &&
    (!r.match_screen || r.match_screen===screen) &&
    (!r.match_element_key || r.match_element_key===elem));

  const LIFECYCLE = '(App lifecycle / pre-UI)';
  const cleanScreen = (s) => s ? String(s).split('.').pop() : '';

  const tree = {};
  for(const r of rows){
    const screen = cleanScreen(r.screen_name || r.screen) || LIFECYCLE;
    let p=r.properties; if(typeof p==='string'){try{p=JSON.parse(p)}catch(_){p={}}}
    const elem = r.element_key || (p&&(p.url))|| '';
    const type = (p&&p.extra&&p.extra.type) || r.class_name || '';
    const leafKey = r.event_name + (elem?('|'+elem):'');
    tree[screen] = tree[screen] || {};
    const leaf = tree[screen][leafKey] || {event_name:r.event_name, screen, element:elem, type, hits:0, last:0};
    leaf.hits++; if(r.timestamp>leaf.last) leaf.last=r.timestamp;
    tree[screen][leafKey]=leaf;
  }

  const screens = Object.keys(tree).sort((a,b)=>
    a===LIFECYCLE?1 : b===LIFECYCLE?-1 : a.localeCompare(b));

  $('#tabBody').innerHTML = `
    <div style="padding:14px 16px">
      <div class="muted" style="font-size:12px;margin-bottom:10px">
        Cấu trúc: <b>màn hình</b> (cha) → <b>event</b> (con). Bấm "gán" → dialog popup để map tên + suggest event từ convention.
      </div>
      ${screens.length? screens.map(s=>{
        const leaves = Object.values(tree[s]).sort((a,b)=>b.hits-a.hits);
        return `<div class="treeScreen" style="margin-bottom:10px">
          <div class="row" style="gap:8px;padding:8px 10px;background:var(--panel2);border-radius:8px;cursor:pointer;user-select:none" data-screen>
            <span style="font-weight:600">▾ ${esc(s)}</span>
            <span class="pill">${leaves.length} event</span>
          </div>
          <div class="treeKids" style="padding:4px 0 4px 16px;display:none">
            ${leaves.map((l,i)=>{
              const rule = ruleFor(l.event_name, l.screen, l.element);
              return `<div class="row" style="gap:10px;padding:5px 8px;justify-content:space-between">
                <div style="flex:1">
                  <span class="badge ${esc(l.event_name)}">${esc(l.event_name)}</span>
                  ${l.element?`<span class="mono muted" style="font-size:11px"> ${esc(l.element)}</span>`:''}
                  ${rule?` <span style="color:var(--accent2);font-size:11px">→ ${esc(rule.to_name)}</span>`:''}
                </div>
                <div class="row" style="gap:8px">
                  <span class="pill">${l.hits} hits</span>
                  <button class="btn ghost sm treeAssign" data-ev="${esc(l.event_name)}" data-screen="${esc(l.screen)}" data-elem="${esc(l.element)}">${rule?'sửa':'gán'}</button>
                  ${rule?`<button class="btn ghost sm treeUnassign" data-to="${esc(rule.to_name)}">×</button>`:''}
                </div>
              </div>`;
            }).join('')}
          </div>
        </div>`;
      }).join('') : '<div class="empty">Chưa có log. Chạy app để thu event.</div>'}
    </div>`;

  document.querySelectorAll('.treeScreen > [data-screen]').forEach(h=>h.onclick=()=>{
    const k=h.nextElementSibling;
    const show=k.style.display==='none';
    k.style.display = show?'block':'none';
    const sp=h.querySelector('span');
    sp.textContent = sp.textContent.replace(/^[▾▸]/, show?'▾':'▸');
  });

  document.querySelectorAll('.treeAssign').forEach(b=>b.onclick=async()=>{
    const ev=b.dataset.ev, screen=b.dataset.screen, elem=b.dataset.elem;
    const existing=ruleFor(ev,screen,elem);
    const allEventNames=[...new Set(rules.map(r=>r.to_name))].sort();

    window._treeMapInfo={ev,screen,elem,existing,pid,rules,LIFECYCLE};
    $('#treeMappingInfo').textContent=`Map "${ev}"${elem?' ['+elem+']':''} trên "${screen||LIFECYCLE}"`;
    $('#treeMapName').value=existing?.to_name||'';
    $('#treeMapSchema').value=(existing?.add_props?._schema)||'';

    const suggest=$('#treeNameSuggest');
    $('#treeMapName').oninput=()=>{
      const val=$('#treeMapName').value.toLowerCase();
      const matches=allEventNames.filter(n=>n.toLowerCase().includes(val)).slice(0,8);
      suggest.innerHTML=matches.map(n=>`<div class="item" onclick="$('#treeMapName').value='${esc(n)}';$('#treeNameSuggest').style.display='none'">${esc(n)}</div>`).join('');
      suggest.style.display=matches.length?'block':'none';
    };

    $('#treeSaveMap').onclick=async()=>{
      const toName=$('#treeMapName').value.trim();
      if(!toName){ toast('Nhập tên sự kiện','err'); return; }
      const schema=$('#treeMapSchema').value.trim();

      const next = rules.filter(r=>!(r.match_event===ev && (r.match_screen||'')===(screen||'') && (r.match_element_key||'')===(elem||'')));
      const rule = { match_event:ev, to_name:toName };
      if(screen && screen!==LIFECYCLE) rule.match_screen=screen;
      if(elem) rule.match_element_key=elem;
      if(schema) rule.add_props={ _schema:schema };
      next.push(rule);

      await api(`/api/projects/${pid}/config`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({rules:next})});
      toast('Đã lưu rule');
      $('#treeMappingDlg').close();
      renderTree(pid);
    };

    $('#treeMappingDlg').showModal();
  });

  document.querySelectorAll('.treeUnassign').forEach(b=>b.onclick=async()=>{
    const next=rules.filter(r=>r.to_name!==b.dataset.to);
    await api(`/api/projects/${pid}/config`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({rules:next})});
    toast('Đã gỡ rule'); renderTree(pid);
  });
}

function openDrawer(r){
  if(!r)return;
  $('#dBadge').textContent=r.event_name;$('#dBadge').className='badge '+r.event_name;$('#dId').textContent=r.event_id;
  $('#dKv').innerHTML=[['screen',r.screen_name||r.screen],['class',r.class_name],['element',r.element_key],['session',r.session_id],['user',r.user_id],['platform',r.platform],['app version',r.app_version],['time',fmtTime(r.timestamp)]]
    .map(([k,v])=>`<div class="key">${k}</div><div class="mono">${esc(v)||'<span class=muted>—</span>'}</div>`).join('');
  // Restore event-drawer layout (the session drawer repurposes these blocks).
  $('#dDeviceH').textContent='DEVICE'; $('#dPropsH').style.display=''; $('#dProps').style.display='';
  const block=$('#dDevice');
  block.style.whiteSpace='pre-wrap'; block.style.background=''; block.style.border=''; block.style.padding='';
  block.textContent=r.device?JSON.stringify(r.device,null,2):'— (chưa có metadata)';
  $('#dProps').textContent=JSON.stringify(r.properties,null,2);
  $('#drawer').classList.add('open');$('#scrim').classList.add('open');
}
$('#dClose').onclick=()=>{$('#drawer').classList.remove('open');$('#scrim').classList.remove('open');};
$('#scrim').onclick=()=>$('#dClose').click();

setInterval(()=>{ if(me&&route.name==='project'&&route.tab==='logs'&&!$('#drawer').classList.contains('open')) renderLogs(route.pid); },5000);

let me=null;
async function boot(){
  // Show login form immediately — no blank screen while waiting for /auth/me
  const isSignup=/[?&]signup=1/.test(location.search);
  renderAuth(isSignup?'signup':'login');
  // Then check if already logged in — if yes, replace with dashboard
  try{
    const r=await fetch(BASE+'/auth/me');
    if(r.ok){ me=await r.json(); onAuthed(); }
  }catch(e){}
}
function onAuthed(){
  $('#nav').hidden=false;
  $('#userBox').hidden=false;
  $('#userEmail').textContent=me.email+(me.role==='admin'?' (admin)':'');
  $('#navCmsWrap').style.display = me.role==='admin' ? '' : 'none';
  // Honor a deep-link from Telegram (or anywhere) if the URL has a hash route;
  // otherwise fall back to the role default (admin → CMS, user → projects).
  const fromHash = hashToRoute();
  if(fromHash){
    // Non-admins can't see the CMS — if they were sent a #/cms link, drop them on projects.
    if(fromHash.name==='cms' && me.role!=='admin') go({name:'projects'});
    else go(fromHash);
    return;
  }
  go({name: me.role==='admin' ? 'cms' : 'projects'});
}
$('#logout').onclick=async()=>{
  try{ await fetch(BASE+'/auth/logout',{method:'POST'}); }catch(e){}
  me=null;
  renderAuth('login');
};

function renderAuth(mode){
  $('#nav').hidden=true; $('#userBox').hidden=true; $('#crumb').textContent='';
  $('#view').innerHTML=`
    <div style="max-width:380px;margin:8vh auto">
      <div class="panel" style="padding:0">
        <h2>${mode==='login'?'Đăng nhập':'Đăng ký tài khoản'}</h2>
        <div style="padding:18px;display:flex;flex-direction:column;gap:12px">
          <div><label>Email</label><input id="aEmail" type="email" placeholder="ban@email.com" style="width:100%"/></div>
          <div><label>Mật khẩu</label><input id="aPass" type="password" placeholder="••••••" style="width:100%"/></div>
          <div id="aErr" style="color:var(--danger);font-size:13px;min-height:16px"></div>
          <button class="btn" id="aSubmit">${mode==='login'?'Đăng nhập':'Đăng ký'}</button>
          <div class="muted" style="font-size:13px;text-align:center">
            ${mode==='login'
              ? 'Chưa có tài khoản? <a id="toSignup" style="cursor:pointer">Đăng ký</a>'
              : 'Đã có tài khoản? <a id="toLogin" style="cursor:pointer">Đăng nhập</a>'}
          </div>
        </div>
      </div>
    </div>`;
  bindAuthForm(mode);
}

function bindAuthForm(mode){
  const submit=async()=>{
    const email=$('#aEmail').value.trim(), password=$('#aPass').value;
    if(!email||!password) return;
    const btn=$('#aSubmit'); if(btn) btn.disabled=true;
    const r=await fetch(`${BASE}/auth/${mode}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    const d=await r.json().catch(()=>({}));
    if(r.ok){ me=d; onAuthed(); }
    else{
      const errEl=$('#aErr'); if(errEl) errEl.textContent={invalid_credentials:'Sai email hoặc mật khẩu',email_taken:'Email đã tồn tại',weak_password:'Mật khẩu tối thiểu 6 ký tự',invalid_email:'Email không hợp lệ'}[d.error]||'Lỗi, thử lại';
      if(btn) btn.disabled=false;
    }
  };
  const btn=$('#aSubmit'); if(btn) btn.onclick=submit;
  const passEl=$('#aPass'); if(passEl) passEl.onkeydown=(e)=>{if(e.key==='Enter')submit();};
  const toSignup=$('#toSignup'); if(toSignup) toSignup.onclick=()=>renderAuth('signup');
  const toLogin=$('#toLogin'); if(toLogin) toLogin.onclick=()=>renderAuth('login');
}

boot();
</script>

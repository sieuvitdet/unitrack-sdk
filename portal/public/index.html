<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<title>Mobix · Event Tracking</title>
<style>
  :root{--bg:#0b0e14;--panel:#141925;--panel2:#1b2231;--line:#283044;--text:#e6e9ef;
    --muted:#8b94a7;--accent:#5b8cff;--accent2:#27d796;--warn:#ffb454;--danger:#ff6b6b;--chip:#222a3a;}
  *{box-sizing:border-box;}
  body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);}
  a{color:var(--accent);text-decoration:none;cursor:pointer;}
  header{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5;}
  header .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:700;color:#08111f;}
  header h1{font-size:16px;margin:0;font-weight:600;}
  header .crumb{color:var(--muted);font-size:13px;margin-left:4px;}
  header .live{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);}
  [hidden]{display:none !important;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--accent2);animation:pulse 2s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(39,215,150,.5)}70%{box-shadow:0 0 0 8px rgba(39,215,150,0)}100%{box-shadow:0 0 0 0 rgba(39,215,150,0)}}
  /* Big animated chevron drawn BETWEEN two screen cards in the IDE timeline.
     The arrow is centered under the dot of the row ABOVE it. Because the row
     layout can shift (3-pane IDE vs fullscreen vs narrow window), we don't
     guess CSS widths — JS measures the dot at render time and sets the spacer
     width so the chevron lands exactly under it. */
  .ide-arrow{display:flex;align-items:center;pointer-events:none;
    animation:ideArrowBob 1.2s ease-in-out infinite}
  /* flex:0 0 auto so the inline `width:Npx` set by JS actually takes effect
     (flex-basis 0 would override `width`). */
  .ide-arrow .ide-arrow-spacer{flex:0 0 auto;width:0}
  .ide-arrow .ide-arrow-chevron{color:var(--accent);font-size:16px;line-height:1;
    text-shadow:0 0 4px rgba(91,140,255,.45)}
  @keyframes ideArrowBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  @media (prefers-reduced-motion: reduce){.ide-arrow{animation:none}}
  /* Replay highlight on the currently-playing row. Animated outline so it
     reads as a moving spotlight even when scrolling is instant. */
  .ide-card.ide-replay-on{outline:2px solid var(--accent);outline-offset:1px;
    box-shadow:0 0 0 4px rgba(91,140,255,.18);transition:box-shadow .15s}
  /* Wireframe (flow/heatmap) fullscreen + pan/zoom.
     Flex column so filter-bar + wf-grid share the viewport without spilling —
     the replay control bar sits in row 2 of wf-grid, and if wf-grid swallowed
     the full 100vh on top of the filter bar, the controls fell below the
     fold and looked "missing" in fullscreen. */
  #wfWrap.wf-fs{position:fixed;inset:0;z-index:45;background:var(--bg);max-height:none!important;padding:0;
    display:flex;flex-direction:column}
  #wfWrap.wf-fs .filter-bar{flex:0 0 auto;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
  #wfWrap.wf-fs .wf-grid{flex:1 1 auto;height:auto;max-height:none!important;min-height:0}
  /* Bottom replay bar gets a subtle highlight in fullscreen so it's clearly
     part of the chrome (otherwise it can read as just another panel). */
  #wfWrap.wf-fs #wfCtrl{box-shadow:0 -2px 8px rgba(0,0,0,.18)}
  .wf-pan{position:relative;overflow:hidden;cursor:grab;background:var(--bg)}
  .wf-pan.dragging{cursor:grabbing}
  .wf-pan #wfSvg{transform-origin:0 0;will-change:transform}
  .wf-zoom{position:absolute;top:10px;left:10px;z-index:6;display:flex;flex-direction:column;gap:4px}
  .wf-zoom button{width:30px;height:30px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:6px;cursor:pointer;font-size:15px;line-height:1}
  .wrap{padding:22px;max-width:1400px;margin:0 auto;}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;transition:opacity .15s;}
  .btn:hover{opacity:.9;}
  .btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line);}
  .btn.sm{padding:5px 10px;font-size:12px;}
  .btn.danger{background:var(--danger);}
  input,select,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font-size:13px;outline:none;}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:18px;}
  .panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0;padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:20px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;}
  .card .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px;}
  .card .v{font-size:24px;font-weight:700;margin-top:6px;}
  /* Clickable summary card (e.g. Crashes → opens the crash report dialog).
     Hover gives a subtle lift so the affordance reads without a button look. */
  .card-clickable{transition:border-color .15s, transform .15s, box-shadow .15s}
  .card-clickable:hover{border-color:var(--danger);transform:translateY(-1px);
    box-shadow:0 4px 14px rgba(220,38,38,.18)}
  /* Same lift, accent (blue) framing — used by neutral drill-downs like Users. */
  .card-clickable-accent:hover{border-color:var(--accent);box-shadow:0 4px 14px rgba(91,140,255,.18)}
  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line);}
  td{padding:9px 14px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top;}
  tr.click:hover{background:var(--panel2);cursor:pointer;}
  tr.click{cursor:pointer;transition:background .1s;}
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;background:var(--chip);color:var(--accent);white-space:nowrap;}
  .badge.flutter{color:#7ee787;}.badge.native_ios{color:#a5a5ff;}.badge.native_android{color:#7ee787;}.badge.react_native{color:#79c0ff;}
  .badge.crash,.badge.json_parse_error,.badge.network_error{color:var(--danger);background:#2a1620;}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;}
  .muted{color:var(--muted);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start;}
  @media(max-width:920px){.grid2{grid-template-columns:1fr;}}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .keybox{background:#0e1320;border:1px dashed var(--line);border-radius:8px;padding:8px 10px;font-family:ui-monospace,monospace;font-size:12px;color:var(--accent2);word-break:break-all;}
  .tabs{display:flex;gap:6px;padding:0 16px;border-bottom:1px solid var(--line);}
  .tab{padding:11px 12px;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;}
  .tab.active{color:var(--text);border-bottom-color:var(--accent);}
  .empty{padding:40px;text-align:center;color:var(--muted);}
  .deflist{display:flex;flex-direction:column;gap:8px;padding:14px 16px;}
  .def{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;cursor:grab;display:flex;justify-content:space-between;align-items:center;}
  .def:active{cursor:grabbing;}
  .def .nm{font-weight:600;color:var(--accent2);}
  .elrow{transition:background .15s;}
  .elrow.drop{background:rgba(91,140,255,.18);outline:2px dashed var(--accent);}
  .pill{background:var(--chip);border-radius:6px;padding:1px 8px;font-size:11px;}
  dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:0;width:480px;max-width:92vw;}
  dialog::backdrop{background:rgba(0,0,0,.5);}
  .dlg-h{padding:16px;border-bottom:1px solid var(--line);font-weight:600;display:flex;justify-content:space-between;align-items:center;}
  .dlg-b{padding:16px;display:flex;flex-direction:column;gap:12px;max-height:60vh;overflow-y:auto;}
  .dlg-f{padding:14px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}
  label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px;}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(860px,70vw);max-width:96vw;background:var(--panel);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .2s;z-index:20;display:flex;flex-direction:column;}
  @media(max-width:760px){.drawer{width:96vw;}}
  .drawer.open{transform:translateX(0);}
  .drawer .dh{display:flex;align-items:center;gap:10px;padding:16px;border-bottom:1px solid var(--line);}
  .drawer .dh button{margin-left:auto;background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;}
  .drawer .db{padding:16px;overflow:auto;}
  .drawer pre{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:12px;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;overflow-x:hidden;}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:15;display:none;}
  .scrim.open{display:block;}
  .kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;margin-bottom:14px;font-size:13px;}
  .kv .key{color:var(--muted);}
  .kv .mono{word-break:break-word;overflow-wrap:anywhere;}
  .filter-bar{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .filter-bar input,.filter-bar select{height:32px;font-size:12px;padding:6px 10px;}
  .autocomplete-list{position:absolute;background:var(--panel2);border:1px solid var(--line);border-radius:6px;max-height:200px;overflow-y:auto;z-index:10;min-width:200px;}
  .autocomplete-list .item{padding:8px 12px;cursor:pointer;font-size:12px;}
  .autocomplete-list .item:hover{background:var(--panel);color:var(--accent2);}
  .relative{position:relative;}
</style>
</head>
<body>
<header>
  <div class="logo">M</div>
  <h1>Event Tracking</h1>
  <span class="crumb" id="crumb"></span>
  <span style="margin-left:18px" id="nav" hidden><a id="navProjects">Dự án</a> <span id="navCmsWrap">· <a id="navCms">CMS tổng quan</a></span></span>
  <div class="live" id="userBox" hidden><span class="muted" id="userEmail"></span> · <a id="logout">Đăng xuất</a></div>
</header>
<div class="wrap" id="view">
  <div style="max-width:380px;margin:8vh auto;display:none" id="bootSplash">
    <div class="panel" style="padding:20px;text-align:center;color:var(--muted)">Đang tải...</div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer">
  <div class="dh"><span class="badge" id="dBadge">event</span><span class="mono muted" id="dId"></span><button id="dClose">×</button></div>
  <div class="db">
    <div class="kv" id="dKv"></div>
    <h2 id="dDeviceH" style="font-size:12px;color:var(--muted);margin:0 0 6px">DEVICE</h2><pre id="dDevice"></pre>
    <h2 id="dPropsH" style="font-size:12px;color:var(--muted);margin:14px 0 6px">PROPERTIES</h2><pre id="dProps"></pre>
  </div>
</div>

<dialog id="projDlg">
  <div class="dlg-h">Tạo dự án mới<button onclick="projDlg.close()" style="background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer">×</button></div>
  <div class="dlg-b">
    <div><label>Tên dự án</label><input id="pName" placeholder="Mobix Shop" style="width:100%"/></div>
    <div><label>App bundle / package</label><input id="pBundle" placeholder="asia.mobix.shop" style="width:100%"/></div>
    <div><label>Loại source</label>
      <select id="pType" style="width:100%">
        <option value="native_ios">Native iOS</option>
        <option value="native_android">Native Android</option>
        <option value="flutter">Flutter</option>
        <option value="react_native">React Native</option>
      </select></div>
  </div>
  <div class="dlg-f"><button class="btn ghost" onclick="projDlg.close()">Huỷ</button><button class="btn" id="pCreate">Tạo</button></div>
</dialog>

<dialog id="treeMappingDlg">
  <div class="dlg-h">Gán event<button onclick="treeMappingDlg.close()" style="background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer">×</button></div>
  <div class="dlg-b">
    <div class="muted" style="font-size:12px;margin-bottom:10px" id="treeMappingInfo"></div>
    <div><label>Tên nghiệp vụ</label>
      <div class="relative">
        <input id="treeMapName" placeholder="vd: user_purchase_completed" style="width:100%"/>
        <div id="treeNameSuggest" class="autocomplete-list" style="display:none"></div>
      </div>
    </div>
    <div><label>Schema iglu (tuỳ chọn)</label><input id="treeMapSchema" placeholder="iglu:vendor/event/jsonschema/1-0-0" style="width:100%"/></div>
  </div>
  <div class="dlg-f"><button class="btn ghost" onclick="treeMappingDlg.close()">Huỷ</button><button class="btn" id="treeSaveMap">Lưu</button></div>
</dialog>

<script>
const BASE = location.pathname.replace(/\/index\.html$/,'').replace(/\/$/,'');
async function api(p,o){
  const r=await fetch(BASE+p,o);
  if(r.status===401){ me=null; renderAuth('login'); throw new Error('Phiên hết hạn'); }
  const ct=r.headers.get('content-type')||'';
  const body=ct.includes('json')?await r.json().catch(()=>({})):await r.text();
  if(!r.ok) throw new Error((body&&body.error)||('HTTP '+r.status));
  return body;
}
const $=(s)=>document.querySelector(s);
function toast(msg,kind){
  let t=document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast';
    t.style.cssText='position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:50;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;color:#fff;box-shadow:0 6px 24px rgba(0,0,0,.4);opacity:0;transition:opacity .18s';
    document.body.appendChild(t); }
  t.style.background = kind==='err' ? 'var(--danger)' : 'var(--accent2)';
  t.textContent=msg; t.style.opacity='1';
  clearTimeout(t._h); t._h=setTimeout(()=>{t.style.opacity='0';},1800);
}
const esc=(s)=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtAgo=(ms)=>{if(!ms)return'—';const s=(Date.now()-ms)/1000;if(s<60)return Math.floor(s)+'s';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h';return Math.floor(s/86400)+'d';};
const fmtTime=(ms)=>new Date(ms).toLocaleString('vi-VN',{hour12:false});
// Short, readable session id for tracing one session across tabs.
const shortSid=(s)=>s?('#'+String(s).slice(0,8)):'—';

// Friendly screen labels for the current project (class name → Vietnamese),
// loaded once when a project opens. screenLabel('HomeScreen') → 'Trang chủ' or
// '' if unmapped. screenDisplay() builds the "ClassName - Nhãn" display string.
let _screenLabels = {};
// Currently selected user filter (user_id), shared across Sessions + Wireframe.
// '' = all users. Cache the project's user list so the selector is instant.
let _userFilter = '';
let _usersCache = { pid:null, users:[] };
async function loadUsers(pid){
  if(_usersCache.pid===pid) return _usersCache.users;
  const r = await api(`/api/projects/${pid}/users`).catch(()=>({users:[]}));
  _usersCache = { pid, users: r.users||[] };
  return _usersCache.users;
}
// A <select> of users (id + epcode + counts) that drives _userFilter. onChange
// re-renders the current tab. Returns the HTML; call wireUserSelect() after.
function userSelectHtml(users){
  const opts = ['<option value="">Tất cả user</option>'].concat(users.map(u=>{
    const lbl = `${u.username}${u.epcode?` · ${u.epcode}`:''} (${u.session_count} session)`;
    return `<option value="${esc(u.user_id)}" ${u.user_id===_userFilter?'selected':''}>${esc(lbl)}</option>`;
  })).join('');
  return `<select id="userSelect" style="height:30px;max-width:340px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:0 8px;font-size:12px">${opts}</select>`;
}
const screenLabel = (name)=> (name && _screenLabels[name]) || '';
const screenDisplay = (name)=>{
  const lbl = screenLabel(name);
  return lbl ? `${name} - ${lbl}` : (name||'');
};
// Text used for searching a screen: both the class name and its label.
const screenSearchText = (name)=> ((name||'') + ' ' + screenLabel(name)).toLowerCase();
// A flow signature "A>B>C" → label each hop ("Trang chủ>..."), keeping the
// leading "/>" route prefix intact. Falls back to the raw name when unmapped.
// Friendly flow signature. Each hop is the screen label (if mapped) else the
// raw route name. Hops are joined with a small accent arrow so the journey
// reads naturally left → right.
const FLOW_ARROW = '<span style="color:var(--accent);font-weight:600;margin:0 4px">→</span>';
const flowDisplay = (sig)=> String(sig||'').split('>').map(seg=>{
  const name = seg.replace(/^\/?>?/,'').trim();
  const lbl = screenLabel(name);
  return esc(lbl ? lbl : seg);
}).join(FLOW_ARROW);
function evTag(r){
  let p=r.properties; if(typeof p==='string'){try{p=JSON.parse(p);}catch(_){p={};}}
  p=p||{};
  const tag=(t,color)=>` <span style="font-size:10px;padding:1px 5px;border-radius:4px;background:${color};color:#fff;vertical-align:middle">${t}</span>`;
  let out='';
  if(r.event_name==='crash' && (p.crash_on_launch===true||p.crash_on_launch==='true')) out+=tag('on-launch','#b91c1c');
  if(r.event_name==='notification' && p.state) out+=tag(p.state,{foreground:'#2563eb',background:'#6b7280',silent:'#7c3aed'}[p.state]||'#6b7280');
  return out;
}

let route = {name:'projects', pid:null, tab:'sessions'};
// Hash routing — so Telegram (and anyone else) can deep-link straight into a
// project / tab / session. Patterns:
//   #/p/<pid>                 → project, default tab (sessions)
//   #/p/<pid>/<tab>           → project on a specific tab (sessions|flows|logs|...)
//   #/p/<pid>/sessions/<sid>  → open session detail IDE for one session
//   #/cms                     → admin CMS
//   #/                        → projects list
// Updating the hash should NOT recursively rerender (history.replaceState
// silently keeps the URL in sync without firing hashchange).
let _suppressHashChange = false;
function routeToHash(r){
  if(r.name==='cms') return '#/cms';
  if(r.name==='project' && r.pid){
    let h = `#/p/${r.pid}`;
    if(r.tab && r.tab!=='sessions') h += `/${r.tab}`;
    else if(r.openSid) h += `/sessions/${encodeURIComponent(r.openSid)}`;
    return h;
  }
  return '#/';
}
function hashToRoute(){
  const h = (location.hash || '').replace(/^#/, '');
  const m = h.match(/^\/p\/(\d+)(?:\/([^/]+))?(?:\/([^/]+))?/);
  if(m){
    const pid = parseInt(m[1], 10);
    const seg2 = m[2], seg3 = m[3];
    // /p/<pid>/sessions/<sid> opens the IDE drawer for that session.
    if(seg2 === 'sessions' && seg3) return {name:'project', pid, tab:'sessions', openSid: decodeURIComponent(seg3)};
    if(seg2) return {name:'project', pid, tab: seg2};
    return {name:'project', pid, tab:'sessions'};
  }
  if(/^\/cms/.test(h)) return {name:'cms'};
  return null;   // no hash → caller picks the default
}
function go(r){
  route={...route,...r};
  const newHash = routeToHash(route);
  if(location.hash !== newHash){
    _suppressHashChange = true;
    history.replaceState(null, '', newHash);
    _suppressHashChange = false;
  }
  // If a session deep-link was requested, render the project first, then open
  // the IDE drawer once the SPA shell has mounted.
  const openSid = route.openSid;
  if(openSid) delete route.openSid;
  render().then(()=>{
    if(openSid && route.name==='project' && route.pid){
      openSessionIDE(route.pid, openSid).catch(()=>{});
    }
  });
}
window.addEventListener('hashchange', ()=>{
  if(_suppressHashChange) return;
  const r = hashToRoute();
  if(r) go(r);
});

$('#navProjects').onclick=()=>go({name:'projects'});
$('#navCms').onclick=()=>go({name:'cms'});

async function render(){
  try{
    if(route.name==='projects'){ $('#crumb').textContent=''; return await renderProjects(); }
    if(route.name==='project'){ return await renderProject(); }
    if(route.name==='cms'){ $('#crumb').textContent='· CMS'; return await renderCMS(); }
  }catch(e){
    $('#view').innerHTML=`<div class="panel" style="padding:20px"><b style="color:var(--danger)">Lỗi</b><pre style="white-space:pre-wrap;color:var(--muted)">${esc(e&&e.stack||e)}</pre></div>`;
  }
}

function gradeColor(g){return {A:'var(--accent2)',B:'var(--accent)',C:'var(--warn)',D:'var(--danger)','N/A':'var(--muted)'}[g]||'var(--muted)';}
function scoreBar(h){
  return `<div style="display:flex;align-items:center;gap:8px">
    <div style="width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;border:3px solid ${gradeColor(h.grade)};color:${gradeColor(h.grade)}">${h.grade}</div>

// ── Report charts on the project overview ─────────────────────────────────
//
// Three area charts under the stat cards: Users / Sessions / Crash rate
// (crashes-per-session, %). Range is selectable (7d default, 24h, 30d).
// Hover any point → tooltip with the date + value.
//
// Pure SVG; no chart-lib dep. Reads /projects/:id/stats-series which is
// ETag-cached so range switches are instant after first load.
const _statsRanges = [
  { key: '7d',  label: '7 ngày',  days: 7,  bucket: 'day' },
  { key: '24h', label: '24 giờ',  days: 1,  bucket: 'day' },   // same endpoint w/ days=1 still buckets by day; the 24h granularity is on the roadmap
  { key: '30d', label: '30 ngày', days: 30, bucket: 'day' },
];
let _statsRange = '7d';
let _statsTip = null;   // DOM ref for the floating tooltip (one instance reused)

async function renderStatsCharts(pid) {
  const row = document.getElementById('statsChartsRow');
  if (!row) return;
  // Skeleton first so the page doesn't shift when data lands.
  row.innerHTML = _statsRanges.map(() => '').join('') ||
    '<div class="muted" style="grid-column:1/-1;font-size:11px;padding:8px">Đang tải biểu đồ…</div>';

  const range = _statsRanges.find((r) => r.key === _statsRange) || _statsRanges[0];
  let data;
  try { data = await api(`/api/projects/${pid}/stats-series?days=${range.days}`); }
  catch (e) {
    row.innerHTML =
      `<div style="grid-column:1/-1;color:var(--danger);font-size:12px">Không tải được chart: ${esc(e.message || e)}</div>`;
    return;
  }
  const buckets = data.buckets || [];
  if (!buckets.length) { row.innerHTML = ''; return; }

  // 3 cards, same shape. Each prints a tiny header (label + sum) + the SVG.
  const sumUsers          = buckets.reduce((a, b) => a + (b.users            || 0), 0);
  const sumSessions       = buckets.reduce((a, b) => a + (b.sessions         || 0), 0);
  const sumCrashes        = buckets.reduce((a, b) => a + (b.crashes          || 0), 0);
  const sumCrashedSessions = buckets.reduce((a, b) => a + (b.crashed_sessions || 0), 0);
  // Window-wide "% of sessions that hit ≥1 crash". Stays in 0–100%, unlike
  // crashes/sessions which exceeds 100% when one bad session fires 10+ crashes.
  const wAvgCrash = sumSessions > 0
    ? Math.round((sumCrashedSessions / sumSessions) * 1000) / 10
    : 0;

  const charts = [
    {
      title: 'Users',
      total: sumUsers,
      values: buckets.map((b) => b.users || 0),
      stroke: 'var(--accent)',      // blue
      fill:   'rgba(91,140,255,0.25)',
      suffix: '',
    },
    {
      title: 'Sessions',
      total: sumSessions,
      values: buckets.map((b) => b.sessions || 0),
      stroke: 'var(--accent2)',     // green
      fill:   'rgba(39,215,150,0.25)',
      suffix: '',
    },
    {
      // % of sessions that hit ≥1 crash — capped 0..100, easier to read
      // than raw crashes/sessions which can exceed 100% for chatty crashes.
      title: '% Session bị crash',
      total: `${wAvgCrash}%`,
      values: buckets.map((b) => b.crash_per_session_pct || 0),
      stroke: 'var(--danger)',
      fill:   'rgba(239,68,68,0.25)',
      suffix: '%',
      // Raw counts so "0% nhưng có 3 crash hôm nay" is still visible if
      // the day had 0 sessions to divide by.
      meta:   `${sumCrashedSessions}/${sumSessions} session bị crash · ${sumCrashes} crash event`,
    },
  ];

  // Range toggle is one row above the charts, full-width across the grid.
  // Click → re-render. Same fetch will 304 if the data didn't change.
  const tabs = _statsRanges.map((r) => `
    <button class="stats-range" data-r="${r.key}"
      style="border:none;background:${r.key === _statsRange ? 'var(--accent)' : 'transparent'};
             color:${r.key === _statsRange ? '#fff' : 'var(--muted)'};
             padding:3px 10px;font-size:11px;cursor:pointer;border-radius:6px">
      ${r.label}
    </button>`).join('');

  const days = buckets.map((b) => b.day);
  row.innerHTML = `
    <div style="grid-column:1/-1;display:flex;align-items:center;gap:8px;margin-bottom:-6px">
      <span class="muted" style="font-size:11px">Báo cáo</span>
      <span style="display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:2px">${tabs}</span>
    </div>
    ${charts.map((c, idx) => `
      <div class="card" style="padding:14px">
        <div style="display:flex;align-items:baseline;gap:8px">
          <div class="k">${esc(c.title)}</div>
          <span style="margin-left:auto;font-size:18px;font-weight:700;color:${c.stroke}">${esc(String(c.total))}</span>
        </div>
        ${c.meta ? `<div class="muted" style="font-size:10.5px;margin-top:2px">${esc(c.meta)}</div>` : ''}
        <div data-chart="${idx}" style="margin-top:8px;position:relative">${
          areaChartSvg(c.values, { stroke: c.stroke, fill: c.fill, days, suffix: c.suffix })
        }</div>
      </div>`).join('')}`;

  // Range toggle wiring.
  row.querySelectorAll('.stats-range').forEach((b) => {
    b.onclick = () => { _statsRange = b.dataset.r; renderStatsCharts(pid); };
  });
  // Hover tooltip: delegated on the row so we only wire 3 mousemove handlers
  // instead of (range_days * 3) per-point listeners.
  row.querySelectorAll('[data-chart]').forEach((wrap) => {
    wireChartHover(wrap);
  });
}

// Build an area chart as one SVG string. Smooth-ish: we connect points with
// a Catmull-Rom → Bezier conversion so the line reads as a curve without
// requiring an external lib. fill = the area below the line; stroke = the
// line itself; points get 0-radius circles that become hover handles via JS.
function areaChartSvg(values, opts = {}) {
  const w = 380, h = 96, pad = 8;
  const n = values.length || 1;
  const max = Math.max(1, ...values);              // never divide-by-zero
  const stepX = (w - pad * 2) / Math.max(1, n - 1);
  const xs = values.map((_, i) => pad + i * stepX);
  const ys = values.map((v) => h - pad - (v / max) * (h - pad * 2));

  // Catmull-Rom → cubic Bezier path for the stroke.
  const linePath = (() => {
    if (xs.length === 1) {
      return `M${xs[0]},${ys[0]} L${xs[0]},${ys[0]}`;
    }
    let d = `M${xs[0]},${ys[0]}`;
    for (let i = 0; i < xs.length - 1; i++) {
      const x0 = xs[i - 1] ?? xs[i];
      const y0 = ys[i - 1] ?? ys[i];
      const x1 = xs[i],     y1 = ys[i];
      const x2 = xs[i + 1], y2 = ys[i + 1];
      const x3 = xs[i + 2] ?? x2;
      const y3 = ys[i + 2] ?? y2;
      // Standard Catmull-Rom (alpha 0.5 / centripetal) → bezier control points.
      const cp1x = x1 + (x2 - x0) / 6;
      const cp1y = y1 + (y2 - y0) / 6;
      const cp2x = x2 - (x3 - x1) / 6;
      const cp2y = y2 - (y3 - y1) / 6;
      d += ` C${cp1x},${cp1y} ${cp2x},${cp2y} ${x2},${y2}`;
    }
    return d;
  })();
  // Area path = line path then close back along the baseline.
  const areaPath = `${linePath} L${xs[xs.length - 1]},${h - pad} L${xs[0]},${h - pad} Z`;

  // Hidden hit-targets at every datapoint so the hover tooltip has something
  // to anchor to. 12px wide invisible rects between adjacent points work
  // better than circles for narrow charts (no dead space between dots).
  const hitW = stepX;
  const hits = xs.map((x, i) => {
    const left = i === 0 ? 0 : x - hitW / 2;
    const width = i === 0 ? hitW / 2
                 : (i === xs.length - 1 ? hitW / 2 : hitW);
    return `<rect class="ac-hit" data-i="${i}" x="${left}" y="0" width="${width}" height="${h}"
      fill="transparent" pointer-events="all"/>`;
  }).join('');
  // Visible dots (small, semi-transparent) so points are still readable
  // when not hovered.
  const dots = xs.map((x, i) =>
    `<circle cx="${x}" cy="${ys[i]}" r="2" fill="${opts.stroke || '#999'}" fill-opacity="0.7"/>`
  ).join('');
  // Active dot (hidden until hover wires it).
  const activeDot = `<circle class="ac-active" cx="-10" cy="-10" r="4"
    fill="${opts.stroke || '#999'}" stroke="var(--bg)" stroke-width="1.5" style="display:none"/>`;

  // Pack the bucket day labels + values onto the SVG via data-* on hits so
  // the hover handler doesn't need a closure into the JS world.
  const meta = JSON.stringify({
    days: opts.days || [], values, suffix: opts.suffix || '',
  }).replace(/'/g, '&#39;');
  return `<svg class="area-chart" viewBox="0 0 ${w} ${h}" width="100%" height="${h}"
    preserveAspectRatio="none" data-meta='${meta}' style="display:block">
    <path d="${areaPath}" fill="${opts.fill || 'rgba(91,140,255,0.2)'}" stroke="none"/>
    <path d="${linePath}" fill="none" stroke="${opts.stroke || '#5b8cff'}" stroke-width="1.6" stroke-linejoin="round"/>
    ${dots}
    ${activeDot}
    ${hits}
  </svg>`;
}

// Attach hover wiring to one chart wrapper. The tooltip is a singleton
// floating div anchored to body — created lazily, reused across charts.
function wireChartHover(wrap) {
  const svg = wrap.querySelector('svg.area-chart');
  if (!svg) return;
  let meta;
  try { meta = JSON.parse(svg.dataset.meta || '{}'); } catch (_) { meta = {}; }
  const days = meta.days || [];
  const values = meta.values || [];
  const suffix = meta.suffix || '';
  const active = svg.querySelector('.ac-active');
  const hits   = svg.querySelectorAll('.ac-hit');

  const showTip = (i, ev) => {
    if (!_statsTip) {
      _statsTip = document.createElement('div');
      _statsTip.style.cssText =
        'position:fixed;z-index:120;background:var(--panel2);border:1px solid var(--line);'
        + 'border-radius:6px;padding:6px 10px;font-size:11px;pointer-events:none;'
        + 'box-shadow:0 4px 14px rgba(0,0,0,.25);color:var(--text);min-width:120px';
      document.body.appendChild(_statsTip);
    }
    _statsTip.innerHTML =
      `<div class="muted" style="font-size:10px;margin-bottom:2px">${esc(days[i] || '')}</div>
       <div style="font-weight:700">${esc(String(values[i] ?? 0))}${esc(suffix)}</div>`;
    _statsTip.style.display = 'block';
    _statsTip.style.left = (ev.clientX + 12) + 'px';
    _statsTip.style.top  = (ev.clientY + 12) + 'px';
    // Pin the active dot on the line via the SVG's logical x at index i.
    const bbox = svg.getBoundingClientRect();
    const w = 380, h = 96, pad = 8;
    const n = values.length || 1;
    const stepX = (w - pad * 2) / Math.max(1, n - 1);
    const max = Math.max(1, ...values);
    const x = pad + i * stepX;
    const y = h - pad - ((values[i] || 0) / max) * (h - pad * 2);
    active.setAttribute('cx', x);
    active.setAttribute('cy', y);
    active.style.display = '';
    // No-op silencers for unused width/height refs so linters don't complain.
    void bbox;
  };
  const hide = () => {
    if (_statsTip) _statsTip.style.display = 'none';
    active.style.display = 'none';
  };
  hits.forEach((hit) => {
    hit.addEventListener('mousemove', (ev) => showTip(+hit.dataset.i, ev));
    hit.addEventListener('mouseleave', hide);
  });
  svg.addEventListener('mouseleave', hide);
}

// ---------- remote config editor (Snowplow / Firebase / SDK) ----------
//
// Per-flavor overrides: each provider block carries an optional
// `flavor_overrides: { dev|staging|beta|production: { … } }`. The editor
// shows the BASE values + a "Override per flavor" expander; the app side
// resolves the right block by passing ?flavor=… to /config.
const FLAVORS = ['dev', 'staging', 'beta', 'production'];

// JS replica of the Flutter SnowplowProvider's blueprint resolver +
// entity builder — used by the "🧪 Test với event name" preview to show
// the operator the EXACT Snowplow payload the app will fire, without
// having to install + run the build. Keep in sync with
// unitrack_snowplow/lib/unitrack_snowplow.dart's _resolveBlueprintId +
// _buildEntity + _pullField + _cleanedEventData.
function previewSnowplowPayload(eventName, props, ctx) {
  const { blueprints, entities, mapj, globals, device } = ctx;
  const readDotted = (bag, key) => {
    if (!key) return null;
    const parts = String(key).split('.');
    let cur = bag;
    for (const p of parts) {
      if (cur && typeof cur === 'object') cur = cur[p];
      else return null;
      if (cur == null) return null;
    }
    return cur;
  };
  const pullField = (field, eventProps) => {
    const from = field.from || 'literal';
    const key  = field.key  || '';
    let raw;
    if      (from === 'globals')    raw = readDotted(globals, key);
    else if (from === 'device')     raw = readDotted(device, key);
    else if (from === 'props')      raw = readDotted(eventProps, key);
    else if (from === 'event_name') raw = eventName;
    else if (from === 'literal')    raw = field.value;
    if (raw != null && String(raw).length > 0) return raw;
    if (field.default === 'now') return new Date().toISOString();
    return field.default ?? null;
  };
  const buildEntity = (entityId) => {
    const ent = entities[entityId];
    if (!ent || !ent.schema) return null;
    const data = {};
    let any = false;
    const fields = ent.fields || {};
    for (const [k, spec] of Object.entries(fields)) {
      const v = pullField(spec || {}, props);
      if (v != null && String(v).length > 0) any = true;
      data[k] = v == null ? '' : v;
    }
    if (!any) return null;
    return { schema: ent.schema, data };
  };
  // Resolve blueprint: exact > wildcard `prefix_*`.
  let blueprintId = mapj[eventName];
  if (!blueprintId) {
    for (const [pat, id] of Object.entries(mapj)) {
      if (pat.endsWith('*') && eventName.startsWith(pat.slice(0, -1))) { blueprintId = id; break; }
    }
  }
  const blueprint = blueprintId ? blueprints[blueprintId] : null;
  if (!blueprint) {
    return {
      type: 'structured',
      reason: 'no blueprint matched — will fall back to Structured event',
      event_name: eventName,
      props,
    };
  }
  // Strip "_..." prefixed keys from the event data (they're inputs for
  // entities, not part of the event's own schema).
  const cleanedData = {};
  for (const [k, v] of Object.entries(props)) if (!k.startsWith('_')) cleanedData[k] = v ?? '';
  const attach = blueprint.attach_entities || [];
  const contexts = attach.map(buildEntity).filter(Boolean);
  return {
    type: 'self_describing',
    blueprint_id: blueprintId,
    snowplow_event: { schema: blueprint.schema, data: cleanedData },
    contexts,
    skipped_entities: attach.filter((id) => !buildEntity(id)),
  };
}

      toast(added > 0 ? `Đã thêm ${added} wildcard (chưa lưu)` : 'Map đã đủ');

      mapSeedBtn.disabled = false; mapSeedBtn.textContent = '✨ Sinh wildcard từ event đã thấy';
    }
  };

  // operator sees the exact Snowplow payload BEFORE the app fires it.
  // No round-trip to the SDK; pure preview from the textareas + a fake
  // globals/device blob filled with placeholders the operator can edit.
  const testBtn = document.getElementById('cfSpTestRun');
  if (testBtn) testBtn.onclick = () => {
    const out = document.getElementById('cfSpTestOut');
    const name = (document.getElementById('cfSpTestName').value || '').trim();
    if (!name) { toast('Nhập event name', 'err'); return; }

    try { mapj       = JSON.parse(document.getElementById('cfSpEventBpMap').value || '{}'); } catch (_) { toast('Map JSON lỗi', 'err'); return; }
    const fakeGlobals = {
      user: { userName: 'ISC01.DEMO', staffEmp: '00000000' },
      flavor: 'staging', imei: 'demo-imei',
    };
    const fakeDevice = {
      platform: 'iOS', device_name: 'iPhone 15', app_version: '2.3.1.9',
    };
    const result = previewSnowplowPayload(name, props, { blueprints, entities, mapj, globals: fakeGlobals, device: fakeDevice });
    out.style.display = 'block';
    out.textContent = JSON.stringify(result, null, 2);
  };
  */

  // Firebase file drag-drop → parse json/plist, fill inputs.
  const drop=$('#cfFbDrop');
  ['dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.style.borderColor='var(--accent)';}));
  drop.addEventListener('dragleave',()=>drop.style.borderColor='var(--line)');
  drop.addEventListener('drop',e=>{
    e.preventDefault();drop.style.borderColor='var(--line)';
    const f=e.dataTransfer.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=()=>{ try{ fillFirebaseFromFile(f.name, r.result); toast('Đã đọc '+f.name);}catch(err){toast('File không hợp lệ','err');} };
    r.readAsText(f);
  });
  function fillFirebaseFromFile(name, text){
    if(name.endsWith('.json')){
      const j=JSON.parse(text); const cli=(j.client&&j.client[0])||{};
      $('#cfFbApp').value   = cli.client_info?.mobilesdk_app_id || '';
      $('#cfFbSender').value= j.project_info?.project_number || '';
      $('#cfFbKey').value   = (cli.api_key&&cli.api_key[0]?.current_key) || '';
      $('#cfFbProj').value  = j.project_info?.project_id || '';
      $('#cfFbBundle').value= cli.client_info?.android_client_info?.package_name || '';
    } else { // .plist (XML) — pull values by key
      const get=(k)=>{const m=text.match(new RegExp('<key>'+k+'</key>\\s*<string>([^<]*)</string>'));return m?m[1]:'';};
      $('#cfFbApp').value   = get('GOOGLE_APP_ID');
      $('#cfFbSender').value= get('GCM_SENDER_ID');
      $('#cfFbKey').value   = get('API_KEY');
      $('#cfFbProj').value  = get('PROJECT_ID');
      $('#cfFbBundle').value= get('BUNDLE_ID');
    }
  }

  $('#cfSave').onclick=async()=>{
    // Build the base block then attach flavor_overrides if any flavor box has
    // content. The server treats flavor_overrides as opaque JSON and only
    // strips it on the app-facing read.
    // Snowplow TrackerConfiguration flags — same names the Flutter SDK exposes
    // via SnowplowOptions. Reading the checkbox each save keeps the round-trip
    // simple (no diff tracking needed).
    const optKeys = ['base64Encoding','platformContext','applicationContext','sessionContext',
                     'screenContext','lifecycleAutotracking','screenEngagementAutotracking'];
    const spOpts = Object.fromEntries(optKeys.map((k) =>
      [k, document.getElementById('cfSpOpt_' + k)?.checked === true]));
    // Parse each blueprint/entity/map JSON textarea. Invalid JSON falls back
    // to {} with a toast — don't wipe the whole form because of one typo.
    const parseJsonOr = (id, fallback) => {
      const raw = (document.getElementById(id)?.value || '').trim();
      if (!raw) return fallback;
      try { return JSON.parse(raw); }
      catch (_) { toast(`JSON ở ${id} không hợp lệ — bỏ qua`, 'err'); return fallback; }
    };

    // Convention layer — vendor + version + per-kind event name overrides.
    // Empty input = keep the SDK default; we drop blanks here so the saved
    // map only carries genuine overrides (smaller wire payload, easier diff).
    const conventionKinds = ['click', 'result', 'screen_view', 'crash', 'api'];
    const eventNames = Object.fromEntries(
      conventionKinds
        .map((k) => [k, ($('#cfSpEvName_' + k)?.value || '').trim()])
        .filter(([_, v]) => v)
    );

    // Custom convention kind rows — append below the 5 built-in kinds. Each
    // row registers another kind in event_names; the code-gen CLI reads this
    // list to emit a `tracking<Kind>(…)` helper. Empty resolved = the SDK
    // uses the kind name itself as the event name. Skip rows missing the
    // kind input; deduplicate on kind (last row wins).
    document.querySelectorAll('#cfSpEvBody tr[data-builtin="0"]').forEach((tr) => {
      const kind     = (tr.querySelector('.cf-sp-ev-kind')?.value     || '').trim();
      const resolved = (tr.querySelector('.cf-sp-ev-resolved')?.value || '').trim();
      // Persist the kind even when resolved is empty — the SDK falls back
      // to the kind itself; the operator-supplied resolved is only an override.
      if (kind) eventNames[kind] = resolved || kind;
    });

    // Auto-attached entities: walk every row of the dynamic table. Skip rows
    // missing either the name or the schema URI; deduplicate by name (last
    // row wins) so a fat-fingered repeat doesn't break the SDK lookup.
    const spEntities = {};
    document.querySelectorAll('#cfSpEntBody tr').forEach((tr) => {
      const name   = (tr.querySelector('.cf-sp-ent-name')?.value   || '').trim();
      const schema = (tr.querySelector('.cf-sp-ent-schema')?.value || '').trim();
      if (name && schema) spEntities[name] = schema;
    });

    // Per-platform override — only persist a block when at least one of its
    // fields is non-empty. Keeps the saved config small + easy to diff.
    const platOv = (epId, appId) => {
      const ep = ($('#' + epId)?.value || '').trim();
      const ap = ($('#' + appId)?.value || '').trim();
      return (ep || ap) ? { endpoint: ep || undefined, appId: ap || undefined } : undefined;
    };
    const iosOv = platOv('cfSpIosEp', 'cfSpIosApp');
    const andOv = platOv('cfSpAndEp', 'cfSpAndApp');

    const snowplow = { enabled:$('#cfSpOn').checked, endpoint:$('#cfSpEp').value.trim(), appId:$('#cfSpApp').value.trim(),
      userContext: parseKV('#cfSpCtx'),
      iglu_vendor:     $('#cfSpIgluVendor').value.trim() || undefined,
      default_version: $('#cfSpDefVersion').value.trim() || undefined,
      event_names:     eventNames,
      entities:        spEntities,
      options: spOpts };
    if (iosOv) snowplow.ios     = iosOv;
    if (andOv) snowplow.android = andOv;
    const spOv = collectFlavorOverrides('Sp'); if (spOv) snowplow.flavor_overrides = spOv;

    const firebase = { enabled:$('#cfFbOn').checked,
      options:{ appId:$('#cfFbApp').value.trim(), gcmSenderId:$('#cfFbSender').value.trim(), apiKey:$('#cfFbKey').value.trim(),
        projectId:$('#cfFbProj').value.trim(), bundleId:$('#cfFbBundle').value.trim() },
      superProperties:parseKV('#cfFbSuper'), userProperties:parseKV('#cfFbUser') };
    const fbOv = collectFlavorOverrides('Fb'); if (fbOv) firebase.flavor_overrides = fbOv;

    // Tracing block (was missing from the save handler before this commit —
    // editing it on the portal had no effect).
    const tracing = {
      enabled: $('#cfTrOn').checked,
      header_name: $('#cfTrHdr').value.trim() || 'traceparent',
      allowlist_hosts: $('#cfTrHosts').value.split('\n').map(s=>s.trim()).filter(Boolean),
      sampled: $('#cfTrSampled').checked,
    };
    const trOv = collectFlavorOverrides('Tr'); if (trOv) tracing.flavor_overrides = trOv;

    const body = {
      endpoint: $('#cfEndpoint').value.trim(),
      sdk_config: { batchSize:+$('#cfBatch').value, flushIntervalMs:+$('#cfFlush').value, logLevel:$('#cfLog').value,
        autoCapture:$('#cfAuto').checked, trackScreens:$('#cfScreens').checked, trackTaps:$('#cfTaps').checked, trackNetwork:$('#cfNet').checked,
        // Wire-taxonomy overrides for screen lifecycle. Empty string = SDK
        // keeps its default (no start/end emit, swizzler fires legacy name).
        screen_start_event: $('#cfScreenStart').value.trim(),
        screen_end_event:   $('#cfScreenEnd').value.trim(),
        screen_load_event:  $('#cfScreenLoad').value.trim(),
      },
      snowplow, firebase, tracing,
    };
    const r=await api(`/api/projects/${pid}/config`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    toast('Đã lưu config (v'+r.version+')'); renderConfig(pid);
  };

  // ── Export: download the whole config + sp_event_maps as a portable .json.
  // The bundle is what /export emits; same payload an import on another
  // project will accept. Triggers a real download via <a download> rather than
  // a server attachment because the SPA already holds the session cookie and
  // we want the user-friendly filename derived from project name.
  $('#cfExport').onclick = async () => {
    try {
      // Hit the server endpoint so the filename + Content-Disposition come
      // from the same source of truth as the JSON payload — keeps a future
      // schema-version bump in one place.
      const r = await fetch(`/api/projects/${pid}/config/export`, { credentials: 'same-origin' });
      if (!r.ok) { toast('Export thất bại: HTTP ' + r.status, 'err'); return; }
      const blob = await r.blob();
      // Honour the Content-Disposition filename if present, fall back to a
      // pid-based one for older browsers that lop it off.
      let filename = `unitrack-config-pid${pid}.json`;
      const cd = r.headers.get('Content-Disposition') || '';
      const m = cd.match(/filename="?([^";]+)"?/);
      if (m) filename = m[1];
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      toast('Đã export: ' + filename);
    } catch (e) {
      toast('Export lỗi: ' + (e && e.message || e), 'err');
    }
  };

  // ── Import: open the hidden file picker, read the file, POST to /import.
  $('#cfImport').onclick = () => $('#cfImportFile').click();
  $('#cfImportFile').onchange = async (ev) => {
    const f = ev.target.files && ev.target.files[0];
    if (!f) return;
    ev.target.value = ''; // reset so picking the same file twice re-fires
    let bundle;
    try { bundle = JSON.parse(await f.text()); }
    catch (e) { toast('File không phải JSON hợp lệ', 'err'); return; }
    if (!bundle || bundle.bundle_kind !== 'unitrack_project_config') {
      toast('File không phải UniTrack config bundle', 'err'); return;
    }
    const fromName = bundle.exported_from && bundle.exported_from.name;
    if (!confirm(
      `Import config từ "${fromName || 'unknown'}" vào project hiện tại?\n\n` +
      `• Replace: sdk_config, snowplow, firebase, tracing, rules, event_registry, sp_event_maps\n` +
      `• Bump config version (app sẽ tự pull lại lần fetch tới)`
    )) return;
    try {
      const r = await api(`/api/projects/${pid}/config/import`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(bundle),
      });
      const sections = (r.imported && r.imported.sections) || [];
      const spCount = (r.imported && r.imported.sp_event_maps) || 0;
      toast(`Đã import (v${r.version}): ${sections.length} mục + ${spCount} sp_event_map`);
      renderConfig(pid);
    } catch (e) {
      toast('Import lỗi: ' + (e && e.message || e), 'err');
    }
  };
}

// ── Flows tab: usage + crash/stuck rate per flow (Phase 2) ─────────────────
// Tab Flows: each flow rendered as a visual chain of screen chips (Home → List
// → Detail) with a usage bar + crash/stuck badges. Far easier to scan than a
// dense number table.
function flowChips(sig){
  if(sig==='(no_screens)') return '<span class="muted" style="font-size:12px">(không đi qua màn nào)</span>';
  const steps = sig.split('>');
  return steps.map((s,i)=>`
    <span style="display:inline-flex;align-items:center">
      <span style="background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px 9px;font-size:12px;white-space:nowrap">${esc(s)}</span>
      ${i<steps.length-1?'<span style="color:var(--accent);margin:0 4px">→</span>':''}
    </span>`).join('');
}
async function renderFlows(pid){
  const flows=await api(`/api/projects/${pid}/flows`);
  const maxUsage=flows.reduce((m,f)=>Math.max(m,f.session_count),0)||1;
  // Risk badge: red when crash/stuck is high, amber when moderate, hidden when clean.
  const badge=(label,count,rate)=>{
    if(!count) return '';
    const c = rate>=20?'var(--danger)': rate>=5?'var(--warn)':'var(--muted)';
    return `<span style="font-size:11px;padding:2px 8px;border-radius:6px;background:${c}22;color:${c};border:1px solid ${c}55;white-space:nowrap">${label} ${count} · ${rate}%</span>`;
  };
  $('#tabBody').innerHTML=`
    <div class="filter-bar"><span class="muted" style="font-size:12px;align-self:center">
      ${flows.length} flow — xếp theo lượt dùng. Mỗi dòng là một hành trình màn hình; nhãn đỏ = hay crash/stuck.
    </span></div>
    <div style="max-height:62vh;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px">
      ${flows.length?flows.map(f=>`
        <div style="background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1;min-width:200px">
              ${flowChips(f.flow_signature)}
            </div>
            <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
              ${badge('⚠ crash',f.crash_count,f.crash_rate)}
              ${badge('🕐 stuck',f.terminate_count,f.stuck_rate)}
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted)">
            <div style="display:flex;align-items:center;gap:8px;flex:1;max-width:340px">
              <div style="flex:1;height:8px;background:var(--panel2);border-radius:4px;overflow:hidden">
                <div style="height:100%;width:${Math.round(f.session_count/maxUsage*100)}%;background:var(--accent);border-radius:4px"></div>
              </div>
              <b style="color:var(--text)">${f.session_count}</b> session (${f.usage_pct}%)
            </div>
            <span>⏱ TB ${f.avg_duration_ms!=null?fmtDur(f.avg_duration_ms):'—'}</span>
            <span>kết thúc tại <b style="color:var(--text)">${esc(f.last_screen)||'—'}</b></span>
          </div>
        </div>`).join(''):'<div class="empty">Chưa có flow. Cần session đã reconstruct (tab Sessions).</div>'}
    </div>`;
}

// ── Wireframe tab: flow graph + heatmap (Wireframe Phase 1) ────────────────
// Layout: BFS from entry_screen assigns each node a column (depth) and a row
// within that column. Render as SVG: rect nodes (size ∝ visits, fill by
// stuck_score) + curved edges (width ∝ count, arrowhead) + legend + hover tip.
function layoutGraph(g){
  const adj = new Map();         // screen → [neighbour]
  for(const e of g.edges){
    if(!adj.has(e.from)) adj.set(e.from, []);
    adj.get(e.from).push(e.to);
  }
  // BFS from entry (fallback: most-visited node). Unreached nodes get their
  // own next column so they still render.
  const level = new Map();       // screen → column index
  const start = g.entry_screen || (g.nodes[0] && g.nodes[0].screen);
  const queue = [];
  if(start){ level.set(start, 0); queue.push(start); }
  while(queue.length){
    const s = queue.shift();
    for(const n of (adj.get(s)||[])){
      if(!level.has(n)){ level.set(n, level.get(s)+1); queue.push(n); }
    }
  }
  // Place any isolated nodes (no path from entry) in the last column.
  let maxCol = 0; for(const v of level.values()) if(v>maxCol) maxCol = v;
  for(const n of g.nodes) if(!level.has(n.screen)) level.set(n.screen, maxCol+1);
  // Rows: within each column, order by visits desc.
  const cols = new Map();        // col → [{screen,visits}]
  for(const n of g.nodes){
    const c = level.get(n.screen);
    if(!cols.has(c)) cols.set(c, []);
    cols.get(c).push(n);
  }
  for(const arr of cols.values()) arr.sort((a,b)=>b.visits-a.visits);

  // Pixel positions. Wider columns + taller rows so edges have room to curve
  // without overlapping.
  const COL_W=260, ROW_H=140, NODE_W=150, NODE_H=64;
  const pos = new Map();         // screen → {x,y}
  for(const [c,arr] of cols){
    arr.forEach((n,i)=>{
      pos.set(n.screen, { x: 60 + c*COL_W, y: 60 + i*ROW_H });
    });
  }
  const maxLevel = Math.max(0, ...[...level.values()]);
  const cw = (maxLevel+1)*COL_W + 60 + NODE_W;
  const maxRows = Math.max(1, ...[...cols.values()].map(a=>a.length));
  const ch = maxRows*ROW_H + 120;
  // level map lets the renderer tell forward edges (col→col+) from back-edges
  // (col→col- or same col) and route them differently to avoid overlap.
  return { pos, level, NODE_W, NODE_H, cw, ch };
}

// Map stuck_score (0..1) to a fill color (green → yellow → red).
function stuckColor(score){
  if(score >= 0.7) return '#dc2626';   // red
  if(score >= 0.4) return '#f59e0b';   // amber
  if(score >= 0.15) return '#facc15';  // yellow
  return '#16a34a';                    // green
}

// Health classification for a screen node — used to colour the *label* of a
// node (in both the aggregate graph and the per-session overlay) so the
// visual scan answers "where's the problem?" without reading numbers.
//
// Inputs aren't always all known (e.g. the overlay has crash_count + per-card
// duration, the aggregate has stuck_score + crash_count). Both call sites pass
// what they have and let the helper fall back gracefully.
//
//   crash/stuck → red   (#ef4444)  — known crash on this screen OR strong stuck signal
//   nghẽn       → amber (#fbbf24)  — taking unusually long / mid stuck score
//   theo dõi    → cyan  (#7dd3fc)  — engaged screen worth watching (mid usage)
//   ổn          → text  (default)  — healthy
function nodeLabelColor({ crashed = false, stuckScore = 0, dwellMs = 0,
                          screenAvgDwellMs = 0, eventCount = 0 } = {}){
  if (crashed || stuckScore >= 0.5) return '#ef4444';
  // "Nghẽn" — user is stuck on the screen significantly longer than that
  // screen's typical dwell (or > 8s when we have no baseline), AND the
  // screen has some activity (not just an idle background tab).
  const longDwell = dwellMs > 0 &&
    ((screenAvgDwellMs > 0 && dwellMs > screenAvgDwellMs * 2)
      || (screenAvgDwellMs === 0 && dwellMs > 8000));
  if (longDwell || stuckScore >= 0.2) return '#fbbf24';
  // "Theo dõi" — busy screen that's still healthy. Bumps it visually so a 12
  // sự kiện · 8 network screen stands out from a flyover.
  if (eventCount >= 6) return '#7dd3fc';
  return 'var(--text)';
}

// Tiny legend chip — reused by the aggregate filter-bar AND the overlay band
// so both views speak the same language (theo dõi / nghẽn / crash·stuck).
function nodeLabelLegendHtml(){
  const chip = (color, txt) =>
    `<span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);margin-right:10px">
       <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${color}"></span>${txt}
     </span>`;
  return chip('#7dd3fc','theo dõi') + chip('#fbbf24','nghẽn') + chip('#ef4444','crash / stuck');
}

// Heatmap color: cold (blue) → warm (orange) → hot (red) by a 0..1 score.
function heatColor(h){
  if(h >= 0.75) return '#dc2626';   // hot
  if(h >= 0.45) return '#f97316';   // warm
  if(h >= 0.2)  return '#f59e0b';   // mild
  if(h > 0)     return '#3b82f6';   // cool
  return '#475569';                 // none
}
let _wfMode = 'flow';   // 'flow' = stuck graph, 'heat' = engagement heatmap
async function renderWireframe(pid){
  // Each render builds a fresh SVG, so any cached "base height" from a
  // previous render is stale — clear it so the next session overlay measures
  // off the new SVG, not the old one.
  _wfBaseSvgHeight = null;
  const users = await loadUsers(pid);
  const qs = _userFilter ? `?user=${encodeURIComponent(_userFilter)}` : '';
  const g = await api(`/api/projects/${pid}/flowgraph${qs}`);
  if(!g.nodes || !g.nodes.length){
    $('#tabBody').innerHTML=`
      <div class="filter-bar" style="gap:10px;align-items:center">
        <span class="muted" style="font-size:12px">👤 User:</span>${userSelectHtml(users)}
      </div>
      <div class="empty">Chưa có hành trình cho bộ lọc này. Cần session journey (tab Sessions).</div>`;
    const sel0=document.getElementById('userSelect');
    if(sel0) sel0.onchange=()=>{ _userFilter=sel0.value; renderWireframe(pid); };
    return;
  }
  const { pos, level, NODE_W, NODE_H, cw, ch } = layoutGraph(g);
  const maxVisits = Math.max(...g.nodes.map(n=>n.visits)) || 1;
  const maxEdge   = Math.max(...g.edges.map(e=>e.count), 1);

  // Build edges (curved path) BEFORE nodes so nodes render on top. Route by
  // direction to avoid overlap:
  //  • forward (to a later column): smooth S-curve between right→left sides
  //  • back / same-level: a curve bowing BELOW the nodes, drawn amber so it's
  //    distinct from forward flow
  //  • self-loop (A→A): a small loop above the node
  // When several edges share the same pair of rows, fan them out with a small
  // vertical offset so they don't stack on one line.
  const pairSeen = new Map();   // "fromY-toY" → running offset index
  const edgeSvg = g.edges.map(e=>{
    const a=pos.get(e.from), b=pos.get(e.to);
    if(!a||!b) return '';
    const w = 1.2 + (e.count/maxEdge)*4.5;
    const op = 0.4 + (e.count/maxEdge)*0.5;
    const common = `data-from="${esc(e.from)}" data-to="${esc(e.to)}" data-count="${e.count}" data-ms="${e.avg_ms}" stroke-width="${w.toFixed(1)}" stroke-opacity="${op.toFixed(2)}" fill="none"`;

    // Self-loop.
    if(e.from===e.to){
      const cx=a.x+NODE_W/2, top=a.y;
      const d=`M${cx-18},${top} C${cx-40},${top-46} ${cx+40},${top-46} ${cx+18},${top}`;
      return `<path d="${d}" stroke="#a78bfa" ${common} marker-end="url(#arrowBack)"/>`;
    }

    const lf=level.get(e.from), lt=level.get(e.to);
    const forward = lt>lf;
    // Slight fan-out offset for parallel edges between the same rows.
    const key=`${Math.round(a.y)}-${Math.round(b.y)}-${forward}`;
    const idx=(pairSeen.get(key)||0); pairSeen.set(key, idx+1);
    const off=idx*14;

    if(forward){
      const x1=a.x+NODE_W, y1=a.y+NODE_H/2;
      const x2=b.x,        y2=b.y+NODE_H/2;
      const mx=(x1+x2)/2;
      const d=`M${x1},${y1} C${mx},${y1+off} ${mx},${y2+off} ${x2},${y2}`;
      return `<path d="${d}" stroke="#5b8cff" ${common} marker-end="url(#arrow)"/>`;
    } else {
      // Back / same-level: exit bottom of `from`, bow downward, enter bottom of `to`.
      const x1=a.x+NODE_W/2, y1=a.y+NODE_H;
      const x2=b.x+NODE_W/2, y2=b.y+NODE_H;
      const dip=Math.max(40, 50+off);
      const my=Math.max(y1,y2)+dip;
      const d=`M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`;
      return `<path d="${d}" stroke="#f59e0b" ${common} stroke-dasharray="5,4" marker-end="url(#arrowBack)"/>`;
    }
  }).join('');

  const heatMode = _wfMode==='heat';
  const nodeSvg = g.nodes.map(n=>{
    const p=pos.get(n.screen); if(!p) return '';
    // Flow mode: size by visits, color by stuck_score. Heatmap mode: size +
    // color by engagement heat (how heavily the user uses this screen).
    const size = heatMode ? (0.75 + (n.heat||0)*0.6) : (0.75 + (n.visits/maxVisits)*0.5);
    const w = NODE_W*size, h = NODE_H*size;
    const x = p.x + (NODE_W-w)/2, y = p.y + (NODE_H-h)/2;
    const fill = heatMode ? heatColor(n.heat||0) : stuckColor(n.stuck_score);
    const fillOp = heatMode ? (0.12 + (n.heat||0)*0.55) : 0.18;   // hotter = more solid
    const labelMax = 16;
    const lbl = screenLabel(n.screen);
    const shown = lbl || n.screen;
    const label = shown.length>labelMax ? shown.slice(0,labelMax-1)+'…' : shown;
    const badge = n.crash_count>0 ? '⚠ ' : '';
    const sub = heatMode
      ? `${n.tap_count} tap · ${n.visits} session`
      : `${n.visits} session · exit ${n.exit_pct}%`;
    // Tint the title by health (crash → red, stuck → amber, busy → cyan,
    // else default). Aggregate has stuck_score + crash_count + tap_count.
    const lblColor = nodeLabelColor({
      crashed:    n.crash_count > 0,
      stuckScore: n.stuck_score || 0,
      eventCount: n.tap_count || 0,
    });
    return `<g class="wf-node" data-screen="${esc(n.screen)}" data-visits="${n.visits}" data-exits="${n.exits}" data-exit-pct="${n.exit_pct}" data-crash="${n.crash_count}" data-stuck="${n.stuck_score}" data-dwell="${n.avg_dwell_ms}" data-taps="${n.tap_count||0}" data-heat="${n.heat||0}" style="cursor:pointer">
      <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="${fill}" fill-opacity="${fillOp.toFixed(2)}" stroke="${fill}" stroke-width="2"/>
      <text x="${p.x+NODE_W/2}" y="${p.y+NODE_H/2-4}" text-anchor="middle" fill="${lblColor}" font-size="13" font-weight="600">${badge}${esc(label)}</text>
      <text x="${p.x+NODE_W/2}" y="${p.y+NODE_H/2+14}" text-anchor="middle" fill="var(--muted)" font-size="11">${sub}</text>
    </g>`;
  }).join('');

  // Right sidebar content depends on the mode:
  //  • flow → session list (click to replay)
  //  • heat → button heatmap (most-tapped element_keys for the user)
  let rightTitle, rightBody;
  if(heatMode){
    const els = g.elements || [];
    rightTitle = '🔥 Button được dùng nhiều nhất';
    rightBody = els.length ? els.slice(0,60).map(e=>{
      const c = heatColor(e.heat);
      return `<div style="padding:8px 10px;border-bottom:1px solid var(--line)">
        <div style="display:flex;align-items:center;gap:8px;font-size:12px">
          <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(e.element_key)}">${esc(e.element_key)}</span>
          <b style="color:${c}">${e.taps}</b>
        </div>
        <div style="height:6px;border-radius:4px;background:var(--line);margin-top:4px;overflow:hidden"><div style="height:100%;width:${Math.max(6,e.heat*100)}%;background:${c}"></div></div>
        <div class="muted" style="font-size:10px;margin-top:2px">${esc(screenLabel(e.screen)||e.screen)}</div>
      </div>`;
    }).join('') : '<div class="empty" style="padding:20px;font-size:12px">Chưa có lượt tap nào.</div>';
  } else {
    const sessResp = await api(`/api/projects/${pid}/sessions${qs}`).catch(()=>({sessions:[]}));
    const sessions = (sessResp.sessions||[]).slice(0, 200);
    rightTitle = 'Sessions — click để xem chi tiết';
    rightBody = sessions.length ? sessions.map(s=>{
      const dot = s.crashed ? '#dc2626' : (s.ended_reason==='inferred_terminate' ? '#f59e0b' : '#5b8cff');
      return `<div class="wf-sess" data-sid="${esc(s.session_id)}" style="padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:12px">
        <div style="display:flex;justify-content:space-between;gap:6px;align-items:center">
          <span style="color:${dot};font-weight:600">●</span>
          <span class="mono" style="color:var(--accent2)">${shortSid(s.session_id)}</span>
          <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right" class="mono muted">${esc((s.flow_signature||'').slice(0,24))||'(no flow)'}</span>
        </div>
        <div class="muted" style="font-size:10px;margin-top:2px">${s.started_at?fmtTime(s.started_at):''} · ${fmtDur(s.duration_ms)} · ${esc(s.ended_reason)}</div>
      </div>`;
    }).join('') : '<div class="empty" style="padding:20px;font-size:12px">Chưa có session</div>';
  }

  // Legend reflects the SAME palette nodeLabelColor uses, so a red label on
  // a card means the same thing as a red dot in the legend. Heatmap mode
  // keeps its own scale (cold → hot) because that's about traffic, not health.
  const legend = heatMode
    ? `<span class="muted" style="font-size:11px;display:flex;gap:10px;align-items:center">Mức dùng:
        <span><span style="display:inline-block;width:10px;height:10px;background:#3b82f6;border-radius:50%;vertical-align:middle"></span> ít</span>
        <span><span style="display:inline-block;width:10px;height:10px;background:#f59e0b;border-radius:50%;vertical-align:middle"></span> vừa</span>
        <span><span style="display:inline-block;width:10px;height:10px;background:#f97316;border-radius:50%;vertical-align:middle"></span> nhiều</span>
        <span><span style="display:inline-block;width:10px;height:10px;background:#dc2626;border-radius:50%;vertical-align:middle"></span> rất nhiều</span>
      </span>`
    : `<span class="muted" style="font-size:11px;display:flex;gap:10px;align-items:center">
        <span><span style="display:inline-block;width:10px;height:10px;background:#94a3b8;border-radius:50%;vertical-align:middle"></span> ổn</span>
        <span><span style="display:inline-block;width:10px;height:10px;background:#7dd3fc;border-radius:50%;vertical-align:middle"></span> theo dõi</span>
        <span><span style="display:inline-block;width:10px;height:10px;background:#fbbf24;border-radius:50%;vertical-align:middle"></span> nghẽn</span>
        <span><span style="display:inline-block;width:10px;height:10px;background:#ef4444;border-radius:50%;vertical-align:middle"></span> crash/stuck</span>
      </span>`;

  $('#tabBody').innerHTML = `
   <div id="wfWrap">
    <div class="filter-bar" style="gap:10px;align-items:center;flex-wrap:wrap">
      <span class="muted" style="font-size:12px">👤</span>${userSelectHtml(users)}
      <span style="display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden">
        <button id="wfModeFlow" style="border:none;padding:6px 12px;font-size:12px;cursor:pointer;background:${heatMode?'var(--bg)':'var(--accent)'};color:${heatMode?'var(--muted)':'#fff'}">Luồng (flow)</button>
        <button id="wfModeHeat" style="border:none;padding:6px 12px;font-size:12px;cursor:pointer;background:${heatMode?'var(--accent)':'var(--bg)'};color:${heatMode?'#fff':'var(--muted)'}">🔥 Heatmap</button>
      </span>
      <button class="btn ghost sm" id="wfFsBtn" title="Mở rộng / thu gọn">⛶ Toàn màn hình</button>
      <span class="muted" style="font-size:12px;margin-left:auto">${g.totals.sessions} session · ${g.totals.screens} màn · ${g.totals.taps||0} tap · entry: <b>${esc(g.entry_screen)||'—'}</b></span>
      ${legend}
    </div>
    <div class="wf-grid" style="display:grid;grid-template-columns:1fr 300px;grid-template-rows:1fr auto;gap:0;max-height:70vh">
      <div class="wf-pan" id="wfPan" style="border-right:1px solid var(--line)">
        <div class="wf-zoom">
          <button id="wfZoomIn" title="Phóng to">+</button>
          <button id="wfZoomOut" title="Thu nhỏ">−</button>
          <button id="wfZoomFit" title="Vừa khung" style="font-size:11px">fit</button>
        </div>
        <svg id="wfSvg" width="${cw}" height="${ch+160}" xmlns="http://www.w3.org/2000/svg" style="display:block">
          <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 Z" fill="#5b8cff"/>
            </marker>
            <marker id="arrowBack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 Z" fill="#f59e0b"/>
            </marker>
          </defs>
          ${edgeSvg}
          ${nodeSvg}
          <!-- Replay overlay (hidden until a session is selected) -->
          <g id="wfReplay" style="display:none">
            <circle id="wfRipple" r="0" fill="#27d796" fill-opacity="0.35" stroke="#27d796" stroke-width="2"/>
            <circle id="wfCursor" r="10" fill="#27d796" stroke="#fff" stroke-width="2"/>
            <text id="wfStuckLabel" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626" style="display:none"/>
          </g>
        </svg>
        <div id="wfTip" style="position:absolute;display:none;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;pointer-events:none;z-index:7;max-width:240px"></div>
      </div>
      <div style="overflow:auto;background:var(--panel)">
        <div style="padding:10px 12px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--line);background:var(--panel2)">${rightTitle}</div>
        <div id="wfSessList">${rightBody}</div>
      </div>
      <!-- Replay control bar — ẨN ĐỂ DEMO SẠCH. Element vẫn render để
           replay engine không lỗi NPE khi truy cập wfPlay/wfSeek/wfNow,
           chỉ giấu khỏi UI thuyết trình. -->
      <div id="wfCtrl" style="display:none;grid-column:1/-1;background:var(--panel);border-top:1px solid var(--line);padding:10px 14px;gap:10px;align-items:center;font-size:12px;flex-wrap:wrap">
        <button class="btn sm" id="wfPlay" style="min-width:64px" disabled>▶ Play</button>
        <span id="wfTime" class="mono muted" style="min-width:90px">0.0s / 0.0s</span>
        <input id="wfSeek" type="range" min="0" max="1000" value="0" style="flex:1;min-width:160px" disabled/>
        <span class="muted" style="font-size:11px">Tốc độ:</span>
        <select id="wfSpeed" style="height:28px" title="Tốc độ phát lại">
          <option value="0.25">0.25x</option><option value="0.5">0.5x</option>
          <option value="1" selected>1x</option><option value="2">2x</option>
          <option value="4">4x</option><option value="8">8x</option>
        </select>
        <span id="wfNow" class="muted" style="min-width:160px;text-align:right;font-size:11px">— chọn 1 session để replay —</span>
      </div>
    </div>
   </div>`;

  // User selector + mode toggle handlers.
  const usel=document.getElementById('userSelect');
  if(usel) usel.onchange=()=>{ _userFilter=usel.value; renderWireframe(pid); };
  const mf=document.getElementById('wfModeFlow'), mh=document.getElementById('wfModeHeat');
  if(mf) mf.onclick=()=>{ _wfMode='flow'; renderWireframe(pid); };
  if(mh) mh.onclick=()=>{ _wfMode='heat'; renderWireframe(pid); };

  // ── Pan / zoom on the graph + fullscreen toggle ─────────────────────────
  const pan = document.getElementById('wfPan');
  const svgEl = document.getElementById('wfSvg');
  const wrap = document.getElementById('wfWrap');
  let tx=0, ty=0, scale=1;
  const applyTransform = ()=>{ svgEl.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`; };
  const fit = ()=>{
    // Fit the whole graph into the pan viewport.
    const vw = pan.clientWidth, vh = pan.clientHeight;
    const gw = svgEl.width.baseVal.value || cw, gh = svgEl.height.baseVal.value || ch;
    scale = Math.min(1, Math.min(vw/gw, vh/gh) * 0.96) || 1;
    tx = Math.max(0, (vw - gw*scale)/2); ty = 16;
    applyTransform();
  };
  const zoomBy = (factor, cxPx, cyPx)=>{
    const prev = scale;
    scale = Math.max(0.2, Math.min(3, scale*factor));
    // Zoom toward the cursor point (keep that point stable).
    if(cxPx!=null){ tx = cxPx - (cxPx - tx) * (scale/prev); ty = cyPx - (cyPx - ty) * (scale/prev); }
    applyTransform();
  };
  document.getElementById('wfZoomIn').onclick  = ()=> zoomBy(1.2, pan.clientWidth/2, pan.clientHeight/2);
  document.getElementById('wfZoomOut').onclick = ()=> zoomBy(1/1.2, pan.clientWidth/2, pan.clientHeight/2);
  document.getElementById('wfZoomFit').onclick = fit;
  // Drag to pan.
  let dragging=false, sx=0, sy=0, stx=0, sty=0;
  pan.addEventListener('mousedown',(e)=>{
    if(e.target.closest('.wf-zoom') || e.target.closest('#wfCtrl')) return;
    dragging=true; pan.classList.add('dragging'); sx=e.clientX; sy=e.clientY; stx=tx; sty=ty;
  });
  window.addEventListener('mousemove',(e)=>{ if(!dragging)return; tx=stx+(e.clientX-sx); ty=sty+(e.clientY-sy); applyTransform(); });
  window.addEventListener('mouseup',()=>{ dragging=false; pan.classList.remove('dragging'); });
  // Wheel to zoom (ctrl/cmd not required); plain wheel scrolls vertically too.
  pan.addEventListener('wheel',(e)=>{
    e.preventDefault();
    const r = pan.getBoundingClientRect();
    zoomBy(e.deltaY<0?1.1:1/1.1, e.clientX-r.left, e.clientY-r.top);
  }, { passive:false });
  // Fullscreen toggle (also fits the graph when entering).
  const fsBtn = document.getElementById('wfFsBtn');
  const setFs = (on)=>{
    wrap.classList.toggle('wf-fs', on);
    if(fsBtn) fsBtn.textContent = on ? '✕ Thu gọn' : '⛶ Toàn màn hình';
    setTimeout(fit, 30);
  };
  if(fsBtn) fsBtn.onclick = ()=> setFs(!wrap.classList.contains('wf-fs'));
  // ESC exits fullscreen.
  const escFs = (e)=>{ if(e.key==='Escape' && wrap.classList.contains('wf-fs')) setFs(false); };
  document.addEventListener('keydown', escFs);
  // Initial fit so the whole graph is visible.
  setTimeout(fit, 30);

  // ── tooltip handlers ─────────────────────────────────────────────────────
  const tip = document.getElementById('wfTip');
  const svg = document.getElementById('wfSvg');
  const showTip = (html, evt)=>{
    tip.innerHTML = html;
    const r = svg.getBoundingClientRect();
    tip.style.left = (evt.clientX - r.left + 14) + 'px';
    tip.style.top  = (evt.clientY - r.top  + 14) + 'px';
    tip.style.display = 'block';
  };
  const hideTip = ()=>{ tip.style.display='none'; };
  svg.querySelectorAll('.wf-node').forEach(g=>{
    g.addEventListener('mousemove',(ev)=>{
      const d=g.dataset;
      const dwell = d.dwell>0 ? fmtDur(+d.dwell) : '—';
      const lblTip = screenLabel(d.screen);
      showTip(`<b>${esc(d.screen)}</b>${lblTip?`<br><span style="color:var(--accent2)">${esc(lblTip)}</span>`:''}<br>
        Visits: ${d.visits}<br>
        Tap: ${d.taps||0}<br>
        Thoát tại đây: ${d.exits} (${d.exitPct}%)<br>
        ${d.crash>0?'<span style="color:var(--danger)">⚠ Crash: '+d.crash+'</span><br>':''}
        Dwell TB: ${dwell}<br>
        ${_wfMode==='heat'?'Mức dùng (heat): '+Math.round((+d.heat)*100)+'%':'Stuck score: '+d.stuck}`, ev);
    });
    g.addEventListener('mouseleave', hideTip);
  });
  svg.querySelectorAll('path[data-from]').forEach(p=>{
    p.addEventListener('mousemove',(ev)=>{
      const d=p.dataset;
      showTip(`<b>${esc(d.from)} → ${esc(d.to)}</b><br>
        Lượt chuyển: ${d.count}<br>
        Trung bình: ${d.ms>0?fmtDur(+d.ms):'—'}`, ev);
    });
    p.addEventListener('mouseleave', hideTip);
  });

  // ── Wire session sidebar → replay (Phase 2) ─────────────────────────────
  // Dwell baseline per node from the flow graph — used to flag "stuck" frames
  // during replay (a step lingers far longer than that node's typical dwell).
  const dwellBaseline = {};
  for (const n of g.nodes) dwellBaseline[n.screen] = n.avg_dwell_ms || 0;
  // Compact node geometry (centre points) for the replay cursor.
  const nodePos = {};
  for (const n of g.nodes) {
    const p = pos.get(n.screen);
    if (p) nodePos[n.screen] = { cx: p.x + NODE_W/2, cy: p.y + NODE_H/2 };
  }
  document.querySelectorAll('.wf-sess').forEach(el=>{
    el.onclick = ()=> startReplay(pid, el.dataset.sid, nodePos, dwellBaseline);
  });
}

// ── Replay engine: drive the wireframe cursor along a session's journey ────
let _wfReplayState = null;   // { steps, nodePos, dwellBaseline, t0, paused, speed, raf, totalMs }

function stopReplay(){
  if(_wfReplayState && _wfReplayState.raf) cancelAnimationFrame(_wfReplayState.raf);
  _wfReplayState = null;
  const r = document.getElementById('wfReplay'); if(r) r.style.display='none';
  // Disable (don't hide) the control bar so it stays visible.
  for(const id of ['wfPlay','wfSeek']) {
    const el = document.getElementById(id); if(el) el.disabled = true;
  }
  const t = document.getElementById('wfTime'); if(t) t.textContent = '0.0s / 0.0s';
  const n = document.getElementById('wfNow'); if(n) n.textContent = '— chọn 1 session để replay —';
  const p = document.getElementById('wfPlay'); if(p) p.textContent = '▶ Play';
  const seek = document.getElementById('wfSeek'); if(seek) seek.value = 0;
  // Also clear the per-session journey overlay (see drawJourneyOverlay).
  clearSessionJourneyOverlay();
  // Clear any stuck highlight applied to nodes during replay.
  document.querySelectorAll('#wfSvg .wf-node rect').forEach(rect=>{
    rect.style.filter = '';
  });
}

// ── Per-session journey overlay drawn underneath the aggregate flow graph ─
// The aggregate (overview) graph still shows all sessions. When a single
// session is picked, render its own compact chain — its OWN nodes + arrows —
// below the overview so the focused session is visible separately from the
// crowd. Clicking a node opens the detail drawer.
let _wfSessionOverlayPid = null;
function clearSessionJourneyOverlay(){
  const g = document.getElementById('wfSessionJourney');
  if(g) g.remove();
  // Shrink the SVG back to its pre-overlay height so the canvas doesn't
  // accumulate empty space across sessions. _wfBaseSvgHeight is null when no
  // overlay has been drawn yet (or after renderWireframe reset it).
  const svg = document.getElementById('wfSvg');
  if (svg && _wfBaseSvgHeight != null) svg.setAttribute('height', _wfBaseSvgHeight);
}
// Cached SVG height before this overlay was added, so each redraw extends
// from the same base instead of compounding the height every time a new
// session is picked.
let _wfBaseSvgHeight = null;

function drawSessionJourneyOverlay(replaySegs, sid){
  clearSessionJourneyOverlay();
  const svg = document.getElementById('wfSvg'); if(!svg) return;
  const cw  = svg.width.baseVal.value;
  // First overlay of this render establishes the base height; subsequent
  // re-draws (different session) measure off it, not off the previous
  // overlay's extended height.
  if (_wfBaseSvgHeight == null) _wfBaseSvgHeight = svg.height.baseVal.value;
  const ch = _wfBaseSvgHeight;

  // Collapse adjacent same-screen steps so the chain has 1 node per screen.
  // Keep aggregated stats (events + networks + time range) per collapsed node
  // — we render those as extra rows on the node and the replay engine uses
  // them to highlight the active overlay node.
  const screens = [];
  for(const s of replaySegs){
    const last = screens[screens.length-1];
    if(last && last.screen === s.screen){
      last.last_ts = s.last_ts || s.start_ts || last.last_ts;
      // Track the segment object so the replay cursor can jump to its overlay node.
      last.refs.push(s);
    } else {
      screens.push({
        screen: s.screen,
        start_ts: s.start_ts,
        last_ts: s.last_ts || s.start_ts,
        refs: [s],
      });
    }
  }
  if(!screens.length) return;

  // Count events + network per collapsed screen so each node card can show
  // "N sự kiện · M network". Events = taps + business events (NOT screen_view
  // itself which is just the entry marker). Networks = network_request /
  // network_error count.
  const isNetEvent = (n) => n === 'network_request' || n === 'network_error';
  const ERR_EVENTS = new Set(['crash','application_error','json_parse_error']);
  for (const sc of screens) {
    let events = 0, nets = 0, crashed = false;
    for (const r of sc.refs) {
      for (const e of (r.events || [])) {
        if (isNetEvent(e.event_name)) {
          nets++;
          // status >= 400 / explicit error → treat as a problem on this screen
          if (e.event_name === 'network_error') crashed = true;
        } else if (e.event_name !== 'screen_view' && e.event_name !== 'screen_load_completed') {
          events++;
          if (ERR_EVENTS.has(e.event_name)) crashed = true;
        }
      }
    }
    sc.eventCount = events;
    sc.netCount   = nets;
    sc.crashed    = crashed;
  }
  // Compute the exit time for each screen: when the user moved on (i.e. the
  // NEXT screen's start_ts). For the last screen, fall back to its last_ts.
  // dwell_ms (how long the user stayed on this screen) feeds nodeLabelColor's
  // "nghẽn" decision when a screen takes unusually long compared to the
  // session's other screens.
  for (let i = 0; i < screens.length; i++) {
    screens[i].exit_ts = (i + 1 < screens.length) ? screens[i + 1].start_ts : screens[i].last_ts;
    screens[i].dwell_ms = Math.max(0, (screens[i].exit_ts || screens[i].start_ts) - screens[i].start_ts);
  }
  // Median dwell of this session — used as "normal" baseline; a screen
  // significantly above it is the "nghẽn" candidate. Median (not mean) so a
  // single 30-minute background event doesn't poison the baseline.
  const dwells = screens.map(s => s.dwell_ms).filter(d => d > 0).sort((a,b)=>a-b);
  const medianDwell = dwells.length ? dwells[Math.floor(dwells.length / 2)] : 0;

  // Layout: a node card with 3 text rows (name / counts / time range) needs
  // more vertical room than before. Width too — labels like "10:14:32 → 10:14:35"
  // are wider than the screen name.
  const NODE_W = 170, NODE_H = 70, GAP_X = 24, GAP_Y = 28;
  const perRow = Math.max(1, Math.floor((cw - 60) / (NODE_W + GAP_X)));
  const rows = Math.ceil(screens.length / perRow);

  // Top padding inside the overlay band; the band starts at BAND_TOP_OFFSET
  // BELOW the existing graph so the focused session sits in its own lane.
  const BAND_TOP_OFFSET = 24;      // visual gap from the aggregate graph
  const TITLE_H = 22;               // room for the "Hành trình session …" label
  const BAND_PAD_Y = 14;            // padding inside the band, top+bottom each
  const bandTop = ch + BAND_TOP_OFFSET;
  const bandH = TITLE_H + BAND_PAD_Y + rows * NODE_H + (rows - 1) * GAP_Y + BAND_PAD_Y;

  // place(i) → top-left of node i, relative to the SVG origin.
  const place = (i) => {
    const row = Math.floor(i / perRow);
    const col = i % perRow;
    return {
      x: 30 + col * (NODE_W + GAP_X),
      y: bandTop + TITLE_H + BAND_PAD_Y + row * (NODE_H + GAP_Y),
    };
  };
  // Node centre (used as the replay cursor target for the overlay row).
  const centreOf = (i) => {
    const p = place(i);
    return { cx: p.x + NODE_W / 2, cy: p.y + NODE_H / 2 };
  };

  const ns = 'http://www.w3.org/2000/svg';
  const layer = document.createElementNS(ns, 'g');
  layer.setAttribute('id','wfSessionJourney');

  // Dim green arrow marker for this overlay only. The aggregate graph's
  // #arrow uses blue (#5b8cff); we keep it untouched and add our own so the
  // session chain reads as a quieter secondary layer.
  let svgDefs = svg.querySelector('defs');
  if (svgDefs && !svgDefs.querySelector('#arrowSj')) {
    const m = document.createElementNS(ns, 'marker');
    m.setAttribute('id','arrowSj');
    m.setAttribute('viewBox','0 0 10 10');
    m.setAttribute('refX','9'); m.setAttribute('refY','5');
    m.setAttribute('markerWidth','5'); m.setAttribute('markerHeight','5');
    m.setAttribute('orient','auto-start-reverse');
    const head = document.createElementNS(ns,'path');
    head.setAttribute('d','M0,0 L10,5 L0,10 Z');
    head.setAttribute('fill','#27d79699');
    m.appendChild(head);
    svgDefs.appendChild(m);
  }

  // Faint backdrop band so the overlay reads as a separate "lane" below the
  // aggregate graph (instead of overlapping it like before).
  const band = document.createElementNS(ns,'rect');
  band.setAttribute('x','12'); band.setAttribute('y', bandTop);
  band.setAttribute('width', cw - 24); band.setAttribute('height', bandH);
  band.setAttribute('rx','12');
  band.setAttribute('fill','#27d79611'); band.setAttribute('stroke','#27d79655');
  band.setAttribute('stroke-dasharray','6,4');
  layer.appendChild(band);

  const title = document.createElementNS(ns,'text');
  title.setAttribute('x','22'); title.setAttribute('y', bandTop + 16);
  title.setAttribute('font-size','11'); title.setAttribute('fill','#27d796');
  title.setAttribute('font-weight','700');
  title.textContent = `Hành trình session ${shortSid(sid)} (${screens.length} màn)`;
  layer.appendChild(title);
  // Inline legend on the right of the title — same colours nodeLabelColor uses.
  // SVG <text> can't easily host dots so we render small <circle> + <text>
  // pairs inline, each at its own x offset (anchored to the band's right edge).
  const legendItems = [
    { color: '#7dd3fc', label: 'theo dõi' },
    { color: '#fbbf24', label: 'nghẽn' },
    { color: '#ef4444', label: 'crash / stuck' },
  ];
  // Right-align: place from the right edge, walking leftward. Each item gets
  // (text width estimate + 6px gap + 6px dot + 6px text gap) ~= label.length*6+18.
  let xRight = cw - 22;
  for (let i = legendItems.length - 1; i >= 0; i--) {
    const it = legendItems[i];
    const slot = it.label.length * 6 + 22;
    xRight -= slot;
    const dot = document.createElementNS(ns, 'circle');
    dot.setAttribute('cx', xRight); dot.setAttribute('cy', bandTop + 12);
    dot.setAttribute('r', 4); dot.setAttribute('fill', it.color);
    layer.appendChild(dot);
    const txt = document.createElementNS(ns, 'text');
    txt.setAttribute('x', xRight + 8); txt.setAttribute('y', bandTop + 16);
    txt.setAttribute('font-size','10.5'); txt.setAttribute('fill','var(--muted)');
    txt.textContent = it.label;
    layer.appendChild(txt);
  }

  // Arrows between consecutive screens.
  // - Same row → straight horizontal line, right edge → left edge of next.
  // - Row wrap → orthogonal "elbow" path that exits the right edge, travels
  //   DOWN into the corridor between rows, then LEFT along the corridor's
  //   midline (so it can't overlap any node), then comes UP into the next
  //   row's first node. The previous Bezier was a single curve through the
  //   diagonal middle and chopped right across the row beneath it.
  const CORNER_R = 8;                          // visual corner radius
  for(let i = 1; i < screens.length; i++){
    const a = place(i-1), b = place(i);
    const ay = a.y + NODE_H / 2;
    const by = b.y + NODE_H / 2;
    const path = document.createElementNS(ns,'path');
    let d;
    if (Math.abs(ay - by) < 1) {
      // Same-row straight arrow.
      d = `M${a.x + NODE_W},${ay} L${b.x - 4},${by}`;
    } else {
      // Wrap path uses the inter-row corridor: vertical midpoint between this
      // node's row bottom and the next row's top is guaranteed to be empty
      // (place() spaces rows with GAP_Y).
      const rowGapTop = a.y + NODE_H;          // bottom of source node
      const rowGapBot = b.y;                   // top of dest node
      const corrY = (rowGapTop + rowGapBot) / 2;   // midline of the corridor

      // Exit the right edge of the source, run a bit further right (so the
      // arrow head clears the card), then drop into the corridor.
      const exitX = a.x + NODE_W + 18;
      // Enter the left edge of the destination from a tiny bit to its left.
      const enterX = b.x - 18;

      // Orthogonal polyline with rounded corners. Q (quadratic bezier) corners
      // use the rowGap midline as the control point so the bend reads as a
      // smooth 90° arc instead of a sharp angle.
      d = [
        `M${a.x + NODE_W},${ay}`,
        `L${exitX - CORNER_R},${ay}`,
        `Q${exitX},${ay} ${exitX},${ay + CORNER_R}`,    // top-right corner
        `L${exitX},${corrY - CORNER_R}`,
        `Q${exitX},${corrY} ${exitX - CORNER_R},${corrY}`,   // bottom-right corner
        `L${enterX + CORNER_R},${corrY}`,
        `Q${enterX},${corrY} ${enterX},${corrY + CORNER_R}`, // bottom-left corner
        `L${enterX},${by - CORNER_R}`,
        `Q${enterX},${by} ${enterX + CORNER_R},${by}`,       // top-left corner
        `L${b.x - 4},${by}`,
      ].join(' ');
    }
    path.setAttribute('d', d);
    // Thinner + dashed + dimmer than the nodes — the chain is context, the
    // cards are what the user reads. Dash 4-on-3-off so the line stays
    // legible at small zoom without screaming for attention.
    path.setAttribute('stroke','#27d79688'); path.setAttribute('stroke-width','1.2');
    path.setAttribute('stroke-dasharray','4,3');
    path.setAttribute('fill','none'); path.setAttribute('marker-end','url(#arrowSj)');
    layer.appendChild(path);
  }

  // Time formatter for the per-node "entered → exited" row. Show HH:mm:ss
  // (sessions span minutes/hours, not days), and dash when missing.
  const fmtHMS = (ms) => ms ? new Date(ms).toLocaleTimeString('vi-VN', { hour12: false }) : '—';

  // Node cards with three rows of text.
  screens.forEach((sc, i) => {
    const p = place(i);
    const c = centreOf(i);
    // Stash the centre on the source segments so the replay cursor knows
    // where to land for THIS screen on the overlay.
    for (const r of sc.refs) r.overlayPos = c;

    const g = document.createElementNS(ns, 'g');
    g.setAttribute('class','wf-sj-node');
    g.setAttribute('data-overlay-screen', sc.screen);
    g.style.cursor = 'pointer';

    // Health-tinted label (red = crash/stuck, amber = nghẽn, cyan = theo dõi).
    // Pass medianDwell as the per-screen baseline so the comparison is
    // intra-session — a 5s screen in a session of 1s-screens reads as "nghẽn"
    // even when 5s wouldn't qualify in absolute terms.
    const lblColor = nodeLabelColor({
      crashed:           sc.crashed,
      dwellMs:           sc.dwell_ms,
      screenAvgDwellMs:  medianDwell,
      eventCount:        sc.eventCount + sc.netCount,
    });
    const borderColor = sc.crashed ? '#ef4444' : '#27d796';

    const rect = document.createElementNS(ns,'rect');
    rect.setAttribute('x', p.x); rect.setAttribute('y', p.y);
    rect.setAttribute('width', NODE_W); rect.setAttribute('height', NODE_H);
    rect.setAttribute('rx','8'); rect.setAttribute('fill', sc.crashed ? '#ef444422' : '#27d79622');
    rect.setAttribute('stroke', borderColor); rect.setAttribute('stroke-width','1.5');
    g.appendChild(rect);

    // Row 1: screen name (label resolved through screen_labels map).
    const lbl = screenLabel(sc.screen) || sc.screen;
    const shown = lbl.length > 20 ? lbl.slice(0, 19) + '…' : lbl;
    const t1 = document.createElementNS(ns,'text');
    t1.setAttribute('x', p.x + NODE_W / 2); t1.setAttribute('y', p.y + 18);
    t1.setAttribute('text-anchor','middle'); t1.setAttribute('font-size','12');
    t1.setAttribute('font-weight','600'); t1.setAttribute('fill', lblColor);
    t1.textContent = (sc.crashed ? '⚠ ' : '') + shown;
    g.appendChild(t1);

    // Row 2: event + network counts.
    const t2 = document.createElementNS(ns,'text');
    t2.setAttribute('x', p.x + NODE_W / 2); t2.setAttribute('y', p.y + 36);
    t2.setAttribute('text-anchor','middle'); t2.setAttribute('font-size','10.5');
    t2.setAttribute('fill','#9fbcff');
    t2.textContent = `${sc.eventCount} sự kiện · ${sc.netCount} network`;
    g.appendChild(t2);

    // Row 3: entered → exited time range. Dim grey so it doesn't fight with
    // the counts above.
    const t3 = document.createElementNS(ns,'text');
    t3.setAttribute('x', p.x + NODE_W / 2); t3.setAttribute('y', p.y + 54);
    t3.setAttribute('text-anchor','middle'); t3.setAttribute('font-size','10');
    t3.setAttribute('fill','var(--muted)');
    t3.setAttribute('font-family','ui-monospace,monospace');
    t3.textContent = `${fmtHMS(sc.start_ts)} → ${fmtHMS(sc.exit_ts)}`;
    g.appendChild(t3);

    g.addEventListener('click', (ev) => {
      ev.stopPropagation();
      openSessionDetailDrawer(sc.screen, replaySegs);
    });
    layer.appendChild(g);
  });

  svg.appendChild(layer);
  // Always extend the SVG so the overlay band has room — the previous
  // version drew on TOP of the aggregate graph, which is what made the
  // session chain visually collide with the flow.
  svg.setAttribute('height', bandTop + bandH + 20);
}

// Drawer with one screen's actions + network — reuses showIDEDetailScreen.
function openSessionDetailDrawer(screen, replaySegs){
  // Build a buildSessionTree-shaped seg for the clicked screen by collecting
  // every replay segment with the same screen name.
  const events = [];
  for(const s of replaySegs) if(s.screen===screen) events.push(...(s.events||[]));
  if(!events.length) return;
  // Sort by ts (replay segs may interleave) and rebuild via buildSessionTree.
  events.sort((a,b)=>(a.ts||0)-(b.ts||0));
  const tree = buildSessionTree(events);
  const seg = tree.find(t=>t.screen===screen) || tree[0];
  if(!seg) return;
  closeAllUtilDialogs();
  const dlg = document.createElement('dialog'); dlg.id='wfDetailDlg'; dlg.className='ut-util-dlg';
  dlg.style.cssText='width:520px;max-width:92vw;max-height:80vh;padding:0;z-index:100;'
    +'display:flex;flex-direction:column;overflow:hidden';
  dlg.innerHTML = `<div class="dlg-h" style="flex:0 0 auto">📱 Chi tiết màn
      <button class="wfd-close" style="background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer">×</button></div>
    <div id="wfDetailBody" class="dlg-b" style="flex:1 1 auto;min-height:0;overflow-y:auto"></div>`;
  document.body.appendChild(dlg);
  try { dlg.showModal(); } catch(_){ dlg.setAttribute('open',''); }
  const kill = ()=>{ try{ dlg.close(); }catch(_){}; dlg.remove(); };
  dlg.querySelector('.wfd-close').onclick = kill;
  dlg.onclick = (e)=>{ if(e.target===dlg) kill(); };
  // Render inline (same shape as showIDEDetailScreen — actions + network chips).
  const body = document.getElementById('wfDetailBody');
  const _acts=[], _nets=[];
  const tEvt = (n)=>new Date(n).toLocaleTimeString('vi-VN',{hour12:false});
  const netChip = (networks, ctx)=>{
    const gid=_nets.length; _nets.push({networks, action: ctx});
    const hasErr = networks.some(n=>n.net_error||(n.status>=400));
    const c = hasErr?'var(--warn)':'#79c0ff';
    return `<span class="wfd-net" data-gid="${gid}" style="display:inline-block;cursor:pointer;background:${c}22;border:1px solid ${c}66;color:${c};border-radius:6px;padding:1px 8px;font-size:11px;font-weight:600">🌐 network [${networks.length}]${hasErr?' ⚠':''}</span>`;
  };
  const screenNets=[]; const realActs=[];
  for(const a of seg.actions){ if(a.standaloneNet) screenNets.push(...a.networks); else realActs.push(a); }
  const actHtml = realActs.map(a=>{
    const isTap=isTapName(a.event_name);
    const danger=a.event_name==='crash'||a.event_name==='application_error'||a.event_name==='json_parse_error';
    let icon,label,color;
    if(isTap){icon='👆';label=a.element_key||'(button)';color='#5b8cff';}
    else {icon=danger?'⚠':'•';label=a.event_name;color=danger?'var(--danger)':'var(--text)';}
    const hasDetail = danger || (a.props && Object.keys(a.props).length);
    const aid=_acts.length; if(hasDetail)_acts.push(a);
    const childNet=a.networks.length?`<div style="padding:3px 0 1px 20px">${netChip(a.networks,label)}</div>`:'';
    const navHint = a.navigatesTo
      ? `<div style="padding:2px 0 0 20px;font-size:11px;color:var(--accent2)">↳ navigate to <span class="mono" style="color:var(--text)">${esc(a.navigatesTo)}</span></div>`
      : '';
    return `<div style="padding:5px 0;border-bottom:1px solid var(--line)">
      <div style="display:flex;gap:8px;align-items:center;font-size:12px">
        <span class="${hasDetail?'wfd-act':''}" ${hasDetail?`data-aid="${aid}"`:''} style="color:${color};font-weight:600;${hasDetail?'cursor:pointer':''}">${icon} ${esc(label)}${hasDetail?` <span class="muted" style="font-weight:400;font-size:10px">${danger?'xem lỗi':'chi tiết'} ⓘ</span>`:''}</span>
        <span class="muted mono" style="margin-left:auto;font-size:10px">${a.ts?tEvt(a.ts):''}</span>
      </div>${childNet}${navHint}</div>`;
  }).join('');
  const screenNetHtml = screenNets.length?`<div style="padding:5px 0;border-bottom:1px solid var(--line)"><span class="muted">┄</span> ${netChip(screenNets, seg.screen)}</div>`:'';
  const lbl = screenLabel(seg.screen);
  body.innerHTML = `
    <h3 style="margin:0 0 2px;font-size:14px">${seg.crashed?'⚠ ':''}📱 ${esc(seg.screen)}</h3>
    ${lbl?`<div style="font-size:12px;color:var(--accent2);margin-bottom:6px">${esc(lbl)}</div>`:''}
    <div class="muted" style="font-size:11px;margin-bottom:10px">${fmtTime(seg.started_at)} → ${fmtTime(seg.ended_at)} · ${fmtDur((seg.ended_at||0)-(seg.started_at||0))}</div>
    ${screenNetHtml}${actHtml||'<div class="muted" style="font-size:12px">— không có hành động —</div>'}`;
  body.querySelectorAll('.wfd-act').forEach(el=>el.onclick=(e)=>{e.stopPropagation();showActionDetail(_acts[+el.dataset.aid]);});
  body.querySelectorAll('.wfd-net').forEach(el=>el.onclick=(e)=>{e.stopPropagation();showSwfNetGroup(_nets[+el.dataset.gid]);});
}

async function startReplay(pid, sid, nodePos, dwellBaseline){
  stopReplay();
  let s;
  try { s = await api(`/api/projects/${pid}/sessions/${encodeURIComponent(sid)}`); }
  catch(e){ toast('Không tải được session','err'); return; }

  // Collapse identical consecutive screens into a single "segment" so the
  // cursor stays put while taps/network events fire ON that screen — same
  // shape buildSessionRow uses on the server. Skip lifecycle steps with no
  // screen (app_start/identify/...) — they aren't screens to land the cursor on,
  // but keep them attached to the FIRST real segment so their events still ripple.
  const journey = (s.journey || []).filter(x=>x && x.ts);
  if(!journey.length){ toast('Session không có hành trình','err'); return; }
  const withScreen = journey.filter(x=>x.screen);
  if(!withScreen.length){ toast('Session này chưa đi qua màn nào (chỉ có lifecycle event)','err'); return; }
  const segs = [];
  for(const j of withScreen){
    const last = segs[segs.length-1];
    if(last && last.screen === j.screen){
      last.last_ts = j.ts; last.events.push(j);
    } else {
      segs.push({ screen: j.screen, start_ts: j.ts, last_ts: j.ts, events: [j] });
    }
  }
  // Resolve segment positions on the graph; segments whose screen isn't in the
  // graph (rare — a screen with no transitions) fall back to the first node.
  const fallback = Object.values(nodePos)[0] || { cx: 100, cy: 100 };
  for(const seg of segs){ seg.pos = nodePos[seg.screen] || fallback; }

  const t0 = segs[0].start_ts;
  const tEnd = segs[segs.length-1].last_ts;
  const totalMs = Math.max(1, tEnd - t0);

  // Auto-pick a watchable starting speed: short sessions (a few seconds across
  // many screens) would whip by at 1x, so slow down until each screen gets
  // ~1.5s of viewing time. The user can still change speed with the dropdown.
  const wantWatchMs = segs.length * 1500;
  let autoSpeed = totalMs / wantWatchMs;            // <1 = play slower than real time
  autoSpeed = Math.min(1, Math.max(0.25, Math.round(autoSpeed*4)/4));
  const speedSel = document.getElementById('wfSpeed');
  if(speedSel){ speedSel.value = String(autoSpeed); }

  _wfReplayState = {
    segs, nodePos, dwellBaseline, totalMs,
    paused: false, speed: autoSpeed,
    sessionStartedAt: s.started_at || t0,
    startedWallClock: performance.now(),
    pausedAt: 0, raf: null,
  };

  document.getElementById('wfReplay').style.display = '';
  // Draw a session-specific journey on TOP of the overview graph so the focused
  // session is visible separately from the aggregate flow.
  drawSessionJourneyOverlay(segs, sid);
  // Enable the always-visible control bar.
  for(const id of ['wfPlay','wfSeek']) {
    const el = document.getElementById(id); if(el) el.disabled = false;
  }
  document.getElementById('wfPlay').textContent = '⏸ Pause';
  document.getElementById('wfSeek').value = 0;
  document.getElementById('wfTime').textContent = `0.0s / ${(totalMs/1000).toFixed(1)}s`;
  document.getElementById('wfNow').textContent = shortSid(sid) + ' · ' + fmtTime(_wfReplayState.sessionStartedAt);
  _wfReplayState.sid = sid;

  // Highlight the selected session in the sidebar.
  document.querySelectorAll('.wf-sess').forEach(el=>{
    el.style.background = el.dataset.sid===sid ? 'var(--panel2)' : '';
  });

  // Controls.
  document.getElementById('wfPlay').onclick = ()=>{
    const st=_wfReplayState; if(!st)return;
    if(st.paused){
      // Resume: shift wall clock so the elapsed picks up where we paused.
      st.startedWallClock = performance.now() - st.pausedAt/st.speed;
      st.paused = false;
      document.getElementById('wfPlay').textContent='⏸ Pause';
      st.raf = requestAnimationFrame(tickReplay);
    } else {
      st.paused = true;
      st.pausedAt = (performance.now() - st.startedWallClock) * st.speed;
      document.getElementById('wfPlay').textContent='▶ Play';
      if(st.raf) cancelAnimationFrame(st.raf);
    }
  };
  // (No explicit stop button — replay auto-ends at the last step. To re-watch,
  // pick a session again from the sidebar; switching sessions calls stopReplay
  // internally before binding the new one.)
  document.getElementById('wfSpeed').onchange = (ev)=>{
    const st=_wfReplayState; if(!st)return;
    const newSpeed = parseFloat(ev.target.value)||4;
    // Keep current elapsed when changing speed.
    const elapsed = st.paused ? st.pausedAt : (performance.now()-st.startedWallClock)*st.speed;
    st.speed = newSpeed;
    if(st.paused) st.pausedAt = elapsed;
    else st.startedWallClock = performance.now() - elapsed/newSpeed;
  };
  document.getElementById('wfSeek').oninput = (ev)=>{
    const st=_wfReplayState; if(!st)return;
    const frac = ev.target.value/1000;
    const elapsed = frac * st.totalMs;
    if(st.paused){ st.pausedAt = elapsed; }
    else { st.startedWallClock = performance.now() - elapsed/st.speed; }
    // Render the frame now so seeking is instant even while paused.
    renderReplayFrame(elapsed);
  };

  // Kick off.
  _wfReplayState.raf = requestAnimationFrame(tickReplay);
}

// Map a virtual elapsed-ms (since journey start) to a (segment, intra-segment
// fraction). For transitions between segments we tween the cursor along the
// straight line between the two node centres so the user sees the move.
function renderReplayFrame(elapsedMs){
  const st = _wfReplayState; if(!st) return;
  const cursor = document.getElementById('wfCursor');
  const ripple = document.getElementById('wfRipple');
  const stuckLabel = document.getElementById('wfStuckLabel');
  const seek = document.getElementById('wfSeek');
  const timeLbl = document.getElementById('wfTime');
  const nowLbl = document.getElementById('wfNow');

  const t0 = st.segs[0].start_ts;
  const tNow = t0 + Math.min(elapsedMs, st.totalMs);

  // Find the current segment (the one whose [start_ts, next.start_ts) contains tNow).
  let i = 0;
  for(; i < st.segs.length - 1; i++){
    if(st.segs[i+1].start_ts > tNow) break;
  }
  const cur = st.segs[i];
  const nxt = st.segs[i+1];
  // Prefer the OVERLAY node centre (set by drawSessionJourneyOverlay so each
  // collapsed screen has its own card) — that's what the user is actually
  // looking at when they click a session. Fall back to the aggregate graph
  // position if the overlay hasn't drawn this screen for some reason.
  const posOf = (seg) => seg ? (seg.overlayPos || seg.pos) : null;
  const curPos = posOf(cur);
  const nxtPos = posOf(nxt);
  let cx, cy;
  // Transition window: animate the move during the last 600ms of the cursor's
  // time on `cur` before tNow reaches `nxt.start_ts`. Outside that, sit on the node.
  const TRANS_MS = 600;
  if(nxt && (nxt.start_ts - tNow) < TRANS_MS && nxtPos && curPos){
    const f = 1 - (nxt.start_ts - tNow)/TRANS_MS;
    cx = curPos.cx + (nxtPos.cx - curPos.cx) * f;
    cy = curPos.cy + (nxtPos.cy - curPos.cy) * f;
  } else if (curPos) {
    cx = curPos.cx; cy = curPos.cy;
  } else {
    // Defensive — no position resolved at all; hide the cursor for this frame.
    cursor.setAttribute('cx', -100); cursor.setAttribute('cy', -100);
    return;
  }
  cursor.setAttribute('cx', cx); cursor.setAttribute('cy', cy);

  // Ripple on each non-screen_view event of the current segment, near its ts.
  // We find the latest event in `cur.events` whose ts is within 400ms of tNow.
  let rippleEv = null;
  for(const ev of cur.events){
    if(ev.event_name==='screen_view') continue;
    const dt = tNow - ev.ts;
    if(dt >= 0 && dt < 400) rippleEv = ev;
  }
  if(rippleEv && curPos){
    const dt = tNow - rippleEv.ts;
    const f = dt/400;
    ripple.setAttribute('cx', curPos.cx);
    ripple.setAttribute('cy', curPos.cy);
    ripple.setAttribute('r', 12 + f*30);
    ripple.setAttribute('fill-opacity', (0.45*(1-f)).toFixed(2));
    ripple.setAttribute('stroke', rippleEv.event_name==='crash' ? '#dc2626' : '#27d796');
  } else {
    ripple.setAttribute('r', 0);
  }

  // Stuck detection: how long have we been on this segment? If it's > max(2×
  // node baseline, 3s) AND we're not in a transition window → flag stuck.
  const onSegMs = tNow - cur.start_ts;
  const baseline = st.dwellBaseline[cur.screen] || 0;
  const stuckThresh = Math.max(3000, baseline * 2);
  const isStuck = (baseline > 0 || onSegMs > 5000) && onSegMs > stuckThresh
                  && (!nxt || (nxt.start_ts - tNow) > TRANS_MS);
  if(isStuck && curPos){
    stuckLabel.style.display = '';
    stuckLabel.setAttribute('x', curPos.cx);
    stuckLabel.setAttribute('y', curPos.cy - 32);
    stuckLabel.textContent = `⚠ đứng ${(onSegMs/1000).toFixed(0)}s`;
    // Briefly outline the node red.
    const nodeG = document.querySelector(`#wfSvg .wf-node[data-screen="${cur.screen.replace(/"/g,'\\"')}"] rect`);
    if(nodeG) nodeG.style.filter = 'drop-shadow(0 0 8px #dc2626)';
  } else {
    stuckLabel.style.display = 'none';
    document.querySelectorAll('#wfSvg .wf-node rect').forEach(r=>r.style.filter='');
  }

  // Update controls (only when not actively dragging).
  if(document.activeElement !== seek){
    seek.value = Math.round((elapsedMs/st.totalMs)*1000);
  }
  timeLbl.textContent = `${(elapsedMs/1000).toFixed(1)}s / ${(st.totalMs/1000).toFixed(1)}s`;
  nowLbl.textContent = (st.sid?shortSid(st.sid)+' · ':'') + fmtTime(st.sessionStartedAt + (tNow - t0));
}

function tickReplay(){
  const st = _wfReplayState; if(!st || st.paused) return;
  const elapsed = (performance.now() - st.startedWallClock) * st.speed;
  if(elapsed >= st.totalMs){
    renderReplayFrame(st.totalMs);
    st.paused = true; st.pausedAt = st.totalMs;
    document.getElementById('wfPlay').textContent = '▶ Replay';
    st.startedWallClock = performance.now();   // ready to resume from start if pressed
    st.pausedAt = 0;
    return;
  }
  renderReplayFrame(elapsed);
  st.raf = requestAnimationFrame(tickReplay);
}

// Build a structured tree from a session journey:
//   screen segment → actions (tap / custom event) each with child network calls.
// A network_request is attached to the most recent action on the same screen
// within NET_WINDOW_MS (it was "triggered by" that tap); otherwise it sits as a
// standalone action on the screen. Network steps carry no screen, so they
// inherit the screen that was active when they fired.
const NET_WINDOW_MS = 6000;
function buildSessionTree(journey){
  // Screen lifecycle events are navigation markers, not user actions — keep
  // them out of the per-screen action list. (screen_start/screen_end are the
  // default names; a renamed pair is detected below by its props shape.)
  const PASSIVE = new Set(['screen_view','screen_load_completed','screen_end','screen_start','session_start','session_started','session_end','session_ended','app_start','app_foreground','app_background']);
  // First pass: assign every step an effective screen (network inherits current).
  let curScreen = null;
  const steps = journey.map(j=>{
    if(j.screen) curScreen = j.screen;
    return { ...j, _screen: j.screen || curScreen || '(trước khi vào màn)' };
  });
  // Group into consecutive screen segments.
  const segs = [];
  for(const st of steps){
    const last = segs[segs.length-1];
    if(last && last.screen===st._screen) last.steps.push(st);
    else segs.push({ screen: st._screen, steps:[st] });
  }
  // Within each segment, turn steps into actions + attach networks to the
  // nearest preceding action.
  for(const seg of segs){
    seg.actions = [];
    seg.crashed = false;
    // Segment time span (for the real-time timeline).
    seg.started_at = seg.steps.length ? seg.steps[0].ts : null;
    seg.ended_at   = seg.steps.length ? seg.steps[seg.steps.length-1].ts : null;
    let lastAction = null;
    let lastTap = null;   // most recent button tap, to attribute errors/crashes
    for(const st of seg.steps){
      if(PASSIVE.has(st.event_name)) continue;
      const isError = st.event_name==='crash'||st.event_name==='application_error'||st.event_name==='json_parse_error';
      if(st.event_name==='crash'||st.event_name==='application_error') seg.crashed = true;
      if(st.event_name==='network_request'){
        const net = { url:st.url, method:st.method, status:st.status, duration_ms:st.duration_ms, net_error:st.net_error, ts:st.ts, request_body:st.request_body, response_body:st.response_body, req_bytes:st.req_bytes, resp_bytes:st.resp_bytes };
        if(lastAction && (st.ts - lastAction.ts) <= NET_WINDOW_MS){
          lastAction.networks.push(net);
        } else {
          seg.actions.push({ event_name:'network_request', element_key:null, ts:st.ts, networks:[net], standaloneNet:true });
        }
      } else {
        const action = { event_name:st.event_name, element_key:st.element_key, ts:st.ts, networks:[], props:st.props||null };
        if(isTapName(st.event_name)) lastTap = st;
        // Attribute an error/crash to the button tapped just before it (same screen).
        if(isError && lastTap && (st.ts - lastTap.ts) <= NET_WINDOW_MS) action.triggeredBy = lastTap.element_key || '(button)';
        lastAction = action;
        seg.actions.push(action);
      }
    }
    // "passive" = the user merely passed through (only screen_view, no taps/
    // network/custom events). Consecutive passive screens collapse into a stack.
    seg.passive = seg.actions.length === 0 && !seg.crashed;
  }

  // Navigation attribution — answers the question "what did this button do?".
  // After segs are built, walk neighbour pairs: when the next screen starts
  // within NAV_WINDOW_MS of the LAST tap on this screen, that tap caused the
  // navigation, so stamp `navigatesTo = nextScreen` on the action. Skip when
  // the gap is too large (= user just sat on the screen for a while before
  // a new transition kicked in) so we don't falsely attribute an unrelated
  // tap to a much later screen change.
  const NAV_WINDOW_MS = 4000;
  for(let i = 0; i < segs.length - 1; i++){
    const cur  = segs[i];
    const next = segs[i + 1];
    if(!next || !next.started_at) continue;
    if(cur.screen === next.screen) continue; // same screen — not a real navigation
    // Find the last real tap on this screen (skip standalone network rows
    // and screen lifecycle markers, those don't "cause" the next screen).
    let lastTap = null;
    for(let j = cur.actions.length - 1; j >= 0; j--){
      const a = cur.actions[j];
      if(a.standaloneNet) continue;
      if(isTapName(a.event_name)){ lastTap = a; break; }
    }
    if(!lastTap || !lastTap.ts) continue;
    if((next.started_at - lastTap.ts) > NAV_WINDOW_MS) continue;
    lastTap.navigatesTo = next.screen;
  }
  return segs;
}

// HTTP status → color.
function statusColor(s){
  if(s==null) return 'var(--muted)';

  if(s>=200&&s<300) return 'var(--accent2)';
  return 'var(--muted)';
}

    <span style="color:${c};font-weight:600">${n.net_error?('✕ '+esc(n.net_error)):(n.status!=null?n.status:'—')}</span>

}

async function openSessionDrawer(pid,sid){
  const s=await api(`/api/projects/${pid}/sessions/${encodeURIComponent(sid)}`);
  window._curSession = { sid, data:s };   // for "Generate wireframe session"
  $('#dBadge').textContent='session'; $('#dBadge').className='badge'; $('#dId').textContent=shortSid(sid);
  // Device metadata captured at ingest (set in DeviceInfo.swift/.kt → ut_set_device_info).
  // Prefer the cross-platform app_name + app_bundle / app_package keys; fall
  // back to bundle_id which the old SDK shipped on both platforms.
  const dev = s.device || {};
  const appBundle = dev.app_bundle || dev.app_package || dev.bundle_id || '';
  $('#dKv').innerHTML=[
    ['session id',sid],
    ['flow',s.flow_signature],
    ['bắt đầu',s.started_at?fmtTime(s.started_at):'—'],
    ['kết thúc',s.ended_at?fmtTime(s.ended_at):'—'],
    ['lý do',s.ended_reason],
    ['thời lượng',fmtDur(s.duration_ms)],
    ['app name',dev.app_name],
    ['app bundle / package', appBundle],
    ['platform',s.platform],
    ['app version',s.app_version],
    ['user',s.user_id],
  ].map(([k,v])=>`<div class="key">${k}</div><div class="mono">${esc(v)||'<span class=muted>—</span>'}</div>`).join('');

  $('#dDeviceH').textContent='HÀNH TRÌNH THEO MÀN (cây)';
  $('#dPropsH').style.display='none'; $('#dProps').style.display='none';

  const segs = buildSessionTree(s.journey||[]);
  const tEvt = (n)=>new Date(n).toLocaleTimeString('vi-VN',{hour12:false});
  const _treeActions = [];   // clickable actions (props / error)
  const _treeNetGroups = []; // clickable network groups → list drawer

  // A "network [N]" chip: click opens the network list drawer.
  const netChip = (networks, ctx)=>{
    const gid = _treeNetGroups.length; _treeNetGroups.push({ networks, action: ctx });
    const hasErr = networks.some(n=>n.net_error || (n.status>=400));
    const c = hasErr ? 'var(--warn)' : '#79c0ff';
    return `<span class="tree-net" data-gid="${gid}" style="display:inline-block;cursor:pointer;background:${c}22;border:1px solid ${c}66;color:${c};border-radius:6px;padding:1px 8px;font-size:11px;font-weight:600">🌐 network [${networks.length}]${hasErr?' ⚠':''}</span>`;
  };

  // Does an action match the search query? (label / event name / element key /
  // properties / "crash" keyword / any of its network calls' url+status+method)
  const netMatch = (n, q)=> [n.url, n.method, n.status, n.net_error].some(v=>v!=null && String(v).toLowerCase().includes(q));
  const actMatch = (a, q)=>{
    if(!q) return true;
    const danger = a.event_name==='crash'||a.event_name==='application_error'||a.event_name==='json_parse_error';
    if(q==='crash' && danger) return true;
    if((a.element_key||'').toLowerCase().includes(q)) return true;
    if((a.event_name||'').toLowerCase().includes(q)) return true;
    if(a.props && JSON.stringify(a.props).toLowerCase().includes(q)) return true;
    if(a.networks.some(n=>netMatch(n,q))) return true;
    return false;
  };

  // Render the tree, filtered by [query]. A screen shows when its name matches
  // OR it has any matching action/network. Within a matching screen, if the
  // match was on the SCREEN NAME we keep all actions; otherwise only matching ones.
  const renderTree = (query)=>{
    const q = (query||'').trim().toLowerCase();
    _treeActions.length = 0; _treeNetGroups.length = 0;
    let shown = 0;
    const segHtml = segs.map(seg=>{
      const screenHit = !q || (seg.screen||'').toLowerCase().includes(q);
      const standaloneNetActs = seg.actions.filter(a=>a.standaloneNet);
      const realActs = seg.actions.filter(a=>!a.standaloneNet);
      // Filter actions unless the screen name itself matched.
      const acts = (q && !screenHit) ? realActs.filter(a=>actMatch(a,q)) : realActs;
      // Standalone networks: keep if screen hit, no query, or a call matches.
      const screenNets = [];
      for(const a of standaloneNetActs){
        if(!q || screenHit) screenNets.push(...a.networks);
        else screenNets.push(...a.networks.filter(n=>netMatch(n,q)));
      }
      if(q && !screenHit && acts.length===0 && screenNets.length===0) return ''; // screen filtered out
      shown++;

      const actHtml = acts.map(a=>{
        const isTap = isTapName(a.event_name);
        const danger = a.event_name==='crash'||a.event_name==='application_error'||a.event_name==='json_parse_error';
        let label, icon, color;
        if(isTap){ icon='👆'; label=a.element_key||'(button)'; color='#5b8cff'; }
        else { icon=danger?'⚠':'•'; label=a.event_name; color=danger?'var(--danger)':'var(--text)'; }
        const hasDetail = danger || (a.props && Object.keys(a.props).length);
        const aid = _treeActions.length; if(hasDetail) _treeActions.push(a);
        const childNet = a.networks.length
          ? `<div style="padding:3px 0 1px 22px">${netChip(a.networks, label)}</div>` : '';
        const navHint = a.navigatesTo
          ? `<div style="padding:2px 0 0 22px;font-size:11px;color:var(--accent2)">↳ navigate to <span class="mono" style="color:var(--text)">${esc(a.navigatesTo)}</span></div>`
          : '';
        return `<div style="padding:4px 0;border-bottom:1px solid var(--line)">
          <div style="display:flex;gap:8px;align-items:center;font-size:12px">
            <span class="${hasDetail?'tree-act':''}" ${hasDetail?`data-aid="${aid}"`:''} style="color:${color};font-weight:600;${hasDetail?'cursor:pointer':''}">${icon} ${esc(label)}${hasDetail?` <span class="muted" style="font-weight:400;font-size:10px">${danger?'xem lỗi':'xem chi tiết'} ⓘ</span>`:''}</span>
            <span class="muted mono" style="margin-left:auto;font-size:10px">${a.ts?tEvt(a.ts):''}</span>
          </div>
          ${childNet}
          ${navHint}
        </div>`;
      }).join('');
      const screenNetHtml = screenNets.length
        ? `<div style="padding:4px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;font-size:12px"><span class="muted">┄</span> ${netChip(screenNets, seg.screen)}</div>` : '';
      return `<div style="border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden">
        <div style="background:var(--panel2);padding:8px 12px;display:flex;justify-content:space-between;align-items:center">
          <b style="font-size:13px">${seg.crashed?'⚠ ':''}📱 ${esc(seg.screen)}</b>
          <span class="muted" style="font-size:11px">${acts.length} hành động${screenNets.length?` · ${screenNets.length} network`:''}</span>
        </div>
        <div style="padding:6px 12px">${screenNetHtml}${actHtml || (screenNetHtml?'':'<span class="muted" style="font-size:12px">— không có hành động —</span>')}</div>
      </div>`;
    }).join('');

    const block=$('#dTree');
    block.innerHTML = segHtml || `<div class="empty" style="font-size:12px">${q?'Không có kết quả cho “'+esc(query)+'”':'— (không có bước nào)'}</div>`;
    // Wire clicks each render (DOM is rebuilt).
    block.querySelectorAll('.tree-act').forEach(el=>{
      el.onclick = (e)=>{ e.stopPropagation(); showActionDetail(_treeActions[+el.dataset.aid]); };
    });
    block.querySelectorAll('.tree-net').forEach(el=>{
      el.onclick = (e)=>{ e.stopPropagation(); showSwfNetGroup(_treeNetGroups[+el.dataset.gid]); };
    });
  };

  const block=$('#dDevice');
  block.style.whiteSpace='normal'; block.style.background='transparent'; block.style.border='none'; block.style.padding='0';
  // Search box + tree container.
  block.innerHTML = `
    <input id="dTreeSearch" placeholder="🔎 Tìm class, button, api, status, crash…"
      style="width:100%;margin-bottom:10px;font-size:12px" />
    <div id="dTree"></div>`;
  renderTree('');
  const searchEl = $('#dTreeSearch');
  let _searchTimer;
  searchEl.oninput = ()=>{ clearTimeout(_searchTimer); _searchTimer = setTimeout(()=>renderTree(searchEl.value), 120); };

  // "Generate wireframe session" button in the drawer header.
  let genBtn = document.getElementById('dGenWf');
  if(!genBtn){
    genBtn = document.createElement('button');
    genBtn.id='dGenWf'; genBtn.className='btn sm';
    genBtn.style.cssText='margin-left:auto;margin-right:8px';
    genBtn.textContent='⬡ Generate wireframe session';
    $('#dClose').parentElement.insertBefore(genBtn, $('#dClose'));
  }
  genBtn.onclick = ()=> openSessionWireframe(segs, sid);

  $('#drawer').classList.add('open');$('#scrim').classList.add('open');
}

// ── Session IDE: full-screen 3-pane view (list | wireframe+timeline | detail) ──
let _ideState = null;   // { pid, sid, sessions }
async function openSessionIDE(pid, sid){
  // Session list for the left pane (cached on state).
  let sessions = _ideState && _ideState.pid===pid ? _ideState.sessions : null;
  if(!sessions){
    const resp = await api(`/api/projects/${pid}/sessions`).catch(()=>({sessions:[]}));
    sessions = resp.sessions || [];
  }
  _ideState = { pid, sid, sessions };

  let ov = document.getElementById('ideOverlay');
  if(!ov){
    ov = document.createElement('div'); ov.id='ideOverlay';
    ov.style.cssText='position:fixed;inset:0;z-index:40;background:var(--bg);display:grid;'
      +'grid-template-rows:auto 1fr;';
    document.body.appendChild(ov);
  }
  ov.style.display='grid';
  ov.innerHTML = `
    <div style="display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel)">
      <b>Session ${shortSid(sid)}</b>
      <span class="muted" style="font-size:12px" id="ideMeta"></span>
      <span id="ideCrashBadge"></span>
      <input id="ideSearch" placeholder="🔎 Tìm màn / API / element / lỗi…" style="margin-left:auto;width:320px;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:7px 12px;font-size:12px">
      <!-- Layout button removed — wireframe capture is parked. -->
      <button class="btn ghost sm" id="ideClose">✕ Đóng</button>
    </div>
    <!-- Replay controls — ẨN ĐỂ DEMO SẠCH. Element vẫn render trong DOM
         để replay engine (idePlay/ideSeek/ideNow handler) không lỗi NPE
         khi click vào row, chỉ giấu khỏi UI thuyết trình. -->
    <div style="display:none;align-items:center;gap:10px;padding:8px 18px;border-bottom:1px solid var(--line);background:var(--panel);font-size:12px">
      <button class="btn sm" id="idePlay" style="min-width:74px" disabled>▶ Play</button>
      <button class="btn ghost sm" id="ideStop" disabled>⏹</button>
      <label style="display:flex;align-items:center;gap:5px">Tốc độ
        <select id="ideSpeed" style="background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--text);padding:3px 6px;font-size:12px">
          <option value="auto" selected>Auto (~12s)</option>
          <option value="1">1× (thời gian thật)</option>
          <option value="2">2×</option>
          <option value="5">5×</option>
          <option value="10">10×</option>
          <option value="50">50×</option>
          <option value="200">200×</option>
        </select>
      </label>
      <input id="ideSeek" type="range" min="0" max="100" value="0" step="0.1" disabled style="flex:1;accent-color:var(--accent)">
      <span id="ideNow" class="muted mono" style="min-width:120px;text-align:right">— chọn play để chạy lại session —</span>
    </div>
    <div style="display:grid;grid-template-columns:260px 1fr 380px;overflow:hidden">
      <div id="ideList" style="border-right:1px solid var(--line);overflow:auto;background:var(--panel)"></div>
      <div id="ideMain" style="overflow:auto;background:var(--bg);position:relative"></div>
      <div id="ideDetail" style="border-left:1px solid var(--line);overflow:auto;background:var(--panel);padding:16px">
        <div class="muted" style="font-size:12px">Bấm một màn ở giữa để xem chi tiết event / network của màn đó.</div>
      </div>
    </div>`;
  // Switch the overlay to 3-row grid (header / replay bar / panes) — replay
  // bar was added between, so the grid template needs the extra row.
  ov.style.gridTemplateRows = 'auto auto 1fr';
  document.getElementById('ideClose').onclick = ()=>{
    // Stop any running replay so its animation frames don't keep firing after
    // the overlay is hidden (cheap leak otherwise — RAF survives display:none).
    ideReplayCleanup();
    ov.style.display = 'none';
  };
  // Layout dialog wiring removed with the button — wireframe capture is
  // parked, openLayoutDialog/renderWireframeSvg/endpoint kept dormant in
  // case we revisit, but no UI surfaces them anymore.
  // Search box filters the middle pane (debounced); see renderIDEMain.
  const searchEl = document.getElementById('ideSearch');
  searchEl.oninput = ()=>{ clearTimeout(searchEl._h); searchEl._h=setTimeout(()=>applyIDEFilter(), 160); };

  // ── left: session navigator (current session journey) ──
  // Old version showed every session_id in the project as a flat list — useful
  // only when bouncing between sessions, but most navigation inside one
  // session means scrolling the middle pane. Repurpose the left pane to show
  // a screen-by-screen outline of the CURRENT session (📱 ScreenName, time
  // range, nested events), so the operator can see the full journey at a
  // glance, jump to a screen by clicking its outline entry, count screens /
  // time on each, and spot the crashed screen. The flat session list is
  // still reachable via the "← Danh sách" button at the top of the outline.
  const listEl = document.getElementById('ideList');
  listEl.innerHTML = '<div class="muted" style="padding:14px;font-size:12px">Đang tải hành trình…</div>';

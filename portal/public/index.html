// Filter mode for the middle pane: '' = show all, 'crash' = only crash/bug
// screens, or a free-text query from the search box.
let _ideFilter = { mode:'', q:'' };
// Apply the current search query + crash filter to the rendered rows.
function applyIDEFilter(){
  const main = document.getElementById('ideMain'); if(!main) return;
  const q = (document.getElementById('ideSearch')?.value || '').trim().toLowerCase();
  _ideFilter.q = q;
  const onlyCrash = _ideFilter.mode==='crash';
  let shown = 0;
  main.querySelectorAll('.ide-row').forEach(row=>{
    const hay = row.dataset.search || '';
    const isCrash = row.dataset.crash === '1';
    const ok = (!q || hay.includes(q)) && (!onlyCrash || isCrash);
    row.style.display = ok ? '' : 'none';
    if(ok) shown++;
  });
  const empty = main.querySelector('#ideNoMatch');
  if(empty) empty.style.display = shown? 'none':'block';
}

// Render the middle pane: a vertical timeline (real-time scaled) with screen
// cards; consecutive "passed-through" screens collapse into one stack card.
async function renderIDEMain(pid, sid){
  const main = document.getElementById('ideMain');
  main.innerHTML = '<div class="muted" style="padding:20px;font-size:12px">Đang tải…</div>';
  let s;
  try { s = await api(`/api/projects/${pid}/sessions/${encodeURIComponent(sid)}`); }
  catch(e){ main.innerHTML='<div style="color:var(--danger);padding:20px">Không tải được session</div>'; return; }
  const segs = buildSessionTree(s.journey||[]);
  window._ideSegs = segs;

  // A screen has a "bug" if it crashed, or any action on it is an error/parse
  // failure (json_parse_error doesn't set seg.crashed but is still a code bug).
  const ERR = new Set(['crash','application_error','json_parse_error']);
  const hasBug = (seg)=> seg.crashed || seg.actions.some(a=>ERR.has(a.event_name));
  let bugCount = 0;

  // Reversed timeline: newest screen on top, the session's first screen at the
  // bottom. Between screens runs a thin animated arrow that flows upward (back
  // toward the start). data-i keeps the ORIGINAL index so clicks map correctly.

  const order = segs.map((_, i)=>i).reverse();   // last → first
  const rows = order.map((i, pos)=>{
    const seg = segs[i];
    const ts = seg.started_at;
    const bug = hasBug(seg);
    if(bug) bugCount++;
    const dot = bug ? 'var(--danger)' : (seg.passive ? 'var(--muted)' : 'var(--accent)');
    const nActs = seg.actions.filter(a=>!a.standaloneNet).length;
    const nNet = seg.actions.reduce((a,x)=>a+x.networks.length,0);
    const isTop = pos===0;                 // newest (visually first)
    const isBottom = pos===order.length-1; // oldest / session start
    const lbl = screenLabel(seg.screen);
    const meta = seg.passive
      ? `<span class="muted" style="font-size:11px">lướt qua · ${fmtDur((seg.ended_at||ts)-(seg.started_at||ts))}</span>`
      : `<span class="muted" style="font-size:11px">${nActs} hành động${nNet?` · ${nNet} network`:''} · ${fmtDur((seg.ended_at||ts)-(seg.started_at||ts))}</span>`;
    // Build the searchable haystack: class name, label, element keys, API urls,
    // event names — so the search box matches across the whole screen.
    const hayParts = [seg.screen, lbl];
    for(const a of seg.actions){
      if(a.element_key) hayParts.push(a.element_key);
      if(a.event_name) hayParts.push(a.event_name);
      for(const n of a.networks){ if(n.url) hayParts.push(n.url); if(n.status) hayParts.push(String(n.status)); }
    }
    const hay = hayParts.join(' ').toLowerCase();
    const time = ts ? new Date(ts).toLocaleTimeString('vi-VN',{hour12:false}) : '';
    // Row = [time] [rail anchor — invisible, kept so arrows align under it]
    // [screen card]. The dot was removed for a tighter look; the arrow itself
    // is the visible connector.
    const rowHtml = `<div class="ide-row" data-i="${i}" data-crash="${bug?'1':'0'}" data-search="${esc(hay)}" style="display:flex;align-items:stretch;cursor:pointer">
      <div class="mono muted" style="flex:0 0 70px;font-size:11px;text-align:right;padding:6px 8px 0 0">${time}</div>
      <div class="ide-row-rail" style="flex:0 0 24px"></div>
      <div style="flex:1 1 auto;padding:1px 0 1px 8px;min-width:0">
        <div class="ide-card" style="background:var(--panel);border:1.5px solid ${bug?'var(--danger)':'var(--line)'};border-radius:8px;padding:6px 10px;${seg.passive?'opacity:.72':''}">
          <b style="font-size:13px">${bug?'⚠ ':''}📱 ${esc(seg.screen)}</b>${lbl?`<span class="muted" style="font-size:11px;font-weight:400"> - ${esc(lbl)}</span>`:''}
          ${isTop?'<span style="font-size:9px;color:var(--accent);border:1px solid var(--accent);border-radius:10px;padding:0 6px;margin-left:6px">mới nhất</span>':''}${isBottom?'<span style="font-size:9px;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:0 6px;margin-left:6px">bắt đầu</span>':''}
          <div style="margin-top:3px">${meta}</div>
        </div>
      </div>
    </div>`;
    // Arrow ▲ between this row and the next (skip on the bottom = oldest row).
    // Points UP because the timeline is reversed: newer screens are above, so
    // the arrow says "the row above me happened AFTER this one". The spacer's
    // width is set by JS (alignArrows) post-render so the chevron lands exactly
    // under the dot of the row above, regardless of surrounding layout.
    return rowHtml + (isBottom ? '' :
      '<div class="ide-arrow"><div class="ide-arrow-spacer"></div><div class="ide-arrow-chevron">▲</div></div>');
  }).join('');
  main.innerHTML = `<div style="padding:18px 16px 40px">${rows||'<div class="muted">— không có màn —</div>'}
    <div id="ideNoMatch" class="muted" style="display:none;padding:20px;font-size:12px">Không có màn nào khớp bộ lọc.</div></div>`;

  // Align each arrow EXACTLY under the rail anchor of the row above it.
  // Measured from the DOM (no CSS box-model guessing), so it stays centered no
  // matter what container wraps the IDE (3-pane, fullscreen, narrow window).
  const alignArrows = () => {
    main.querySelectorAll('.ide-arrow').forEach((arr) => {
      const prevRow = arr.previousElementSibling;
      if (!prevRow) return;
      const rail = prevRow.querySelector('.ide-row-rail');
      const spacer = arr.querySelector('.ide-arrow-spacer');
      const chevron = arr.querySelector('.ide-arrow-chevron');
      if (!rail || !spacer || !chevron) return;
      const arrLeft = arr.getBoundingClientRect().left;
      const railRect = rail.getBoundingClientRect();
      const railCenter = railRect.left + railRect.width / 2;
      const chevW = chevron.getBoundingClientRect().width;
      const w = railCenter - arrLeft - chevW / 2;
      spacer.style.width = Math.max(0, w) + 'px';
    });
  };
  // First pass — fonts may not have loaded yet, so re-measure on next frame and
  // again after fonts are ready (chevron width depends on font metrics).
  alignArrows();
  requestAnimationFrame(alignArrows);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(alignArrows);
  // Re-align on window resize.
  if (main._alignArrows) window.removeEventListener('resize', main._alignArrows);
  main._alignArrows = alignArrows;
  window.addEventListener('resize', alignArrows);

  // App name lives on the session's device blob (ingest captures one event's
  // `device` JSON, /sessions/:sid surfaces it). Stick it at the head of the
  // ideMeta line when present so the operator sees "Mobi X Staging · 12 màn"
  // instead of just counts.
  const ideAppName = s.device && s.device.app_name ? s.device.app_name : '';
  document.getElementById('ideMeta').textContent =
    (ideAppName ? ideAppName + ' · ' : '')
    + `${segs.length} màn · ${fmtDur(s.duration_ms)} · ${s.ended_reason}`;

  // Crash/bug badge in the header — click toggles the "only buggy screens" filter.
  const badge = document.getElementById('ideCrashBadge');
  if(badge){
    if(bugCount){
      const on = _ideFilter.mode==='crash';
      badge.innerHTML = `<span id="ideCrashToggle" title="Bấm để lọc màn crash/bug" style="cursor:pointer;user-select:none;font-size:12px;font-weight:600;border-radius:20px;padding:3px 11px;background:${on?'var(--danger)':'var(--danger)22'};color:${on?'#fff':'var(--danger)'};border:1px solid var(--danger)">⚠ ${bugCount} crash/bug${on?' ✕':''}</span>`;
      document.getElementById('ideCrashToggle').onclick = ()=>{
        _ideFilter.mode = _ideFilter.mode==='crash' ? '' : 'crash';
        renderIDEMain(pid, sid);   // re-render to refresh the badge state + rows
      };
    } else { badge.innerHTML = ''; }
  }

  // Click a row → highlight + show that screen's detail in the right pane.
  // Also pause any running replay so manual exploration doesn't get yanked
  // away by the next replay tick.
  main.querySelectorAll('.ide-row').forEach(el=>{
    el.onclick = ()=>{
      main.querySelectorAll('.ide-row .ide-card').forEach(c=>c.style.outline='');
      el.querySelector('.ide-card').style.outline = '2px solid var(--accent)';
      showIDEDetailScreen(segs[+el.dataset.i]);
      if (_ideReplay && !_ideReplay.paused) ideReplayPause();
    };
  });

  // Re-apply any active search query + crash filter to the freshly rendered rows.
  applyIDEFilter();

  // Wire the replay bar to this session's segments. Replay drives the SAME DOM
  // rows the user can also click — no parallel timeline, no separate cursor —
  // so search/filter highlights stay consistent.
  ideReplayBind(pid, sid, segs);
}

// ── IDE session replay engine ─────────────────────────────────────────────
// Drives the middle timeline at real (or scaled) timing so the operator can
// "watch the session happen" without scrubbing manually. The user can pause
// with the Play button (toggles to Pause), jump with the seek slider, or pick
// a fixed speed. "Auto" targets a total play time of ~12s regardless of
// session length so 3-hour sessions become watchable.
let _ideReplay = null;   // { segs, dur, t0, accum, paused, speedRaw, raf, pid, sid }
const IDE_AUTO_TARGET_MS = 12_000;   // tune to taste

function ideReplayBind(pid, sid, segs) {
  // Reset any prior replay state attached to the previous session.
  ideReplayCleanup();

  const playable = segs.filter(s => s.started_at != null);
  const enable = playable.length >= 2;   // single-screen session = nothing to "play"
  const playBtn = document.getElementById('idePlay');
  const stopBtn = document.getElementById('ideStop');
  const seekEl  = document.getElementById('ideSeek');
  const speedEl = document.getElementById('ideSpeed');
  const nowEl   = document.getElementById('ideNow');
  if (!playBtn) return;

  for (const el of [playBtn, stopBtn, seekEl]) el.disabled = !enable;
  if (!enable) {
    nowEl.textContent = playable.length ? '— phiên 1 màn, không có gì để replay —'
                                        : '— chưa có timestamp —';
    return;
  }

  // Real-time duration of the journey (last segment start – first segment start).
  const t0 = playable[0].started_at;
  const tN = playable[playable.length - 1].started_at;
  const dur = Math.max(1, tN - t0);

  _ideReplay = { pid, sid, segs: playable, t0, dur, accum: 0,
                 paused: true, speedRaw: speedEl.value, raf: 0, lastFrame: 0 };
  nowEl.textContent = '0% · 0ms / ' + fmtDur(dur);
  seekEl.value = 0;

  playBtn.onclick = () => {
    if (!_ideReplay) return;
    if (_ideReplay.paused) ideReplayResume();
    else                   ideReplayPause();
  };
  stopBtn.onclick = () => ideReplayStop();
  speedEl.onchange = () => {
    if (!_ideReplay) return;
    _ideReplay.speedRaw = speedEl.value;
  };
  // Dragging the seek bar pauses + jumps; release continues if was playing.
  seekEl.oninput = () => {
    if (!_ideReplay) return;
    const pct = parseFloat(seekEl.value) / 100;
    _ideReplay.accum = pct * _ideReplay.dur;
    ideReplayApply();   // visual update without advancing time
  };
}

// Pick the scale: "auto" maps total real duration → IDE_AUTO_TARGET_MS, with
// a floor of 1× (don't slow down short sessions) and a ceiling of 500× (very
// long sessions stay at 500× rather than blurring past). Numeric values use
// the dropdown verbatim (1× = real time, 50× = 50ms per real second, …).
function ideReplaySpeed() {
  if (!_ideReplay) return 1;
  const raw = _ideReplay.speedRaw;
  if (raw === 'auto') {
    return Math.max(1, Math.min(500, _ideReplay.dur / IDE_AUTO_TARGET_MS));
  }
  return Math.max(0.1, parseFloat(raw) || 1);
}

function ideReplayResume() {
  if (!_ideReplay || !_ideReplay.paused) return;
  _ideReplay.paused = false;
  _ideReplay.lastFrame = performance.now();
  document.getElementById('idePlay').textContent = '⏸ Pause';
  const tick = (now) => {
    const st = _ideReplay; if (!st || st.paused) return;
    const dt = now - st.lastFrame;
    st.lastFrame = now;
    st.accum = Math.min(st.dur, st.accum + dt * ideReplaySpeed());
    ideReplayApply();
    if (st.accum >= st.dur) { ideReplayPause(); return; }
    st.raf = requestAnimationFrame(tick);
  };
  _ideReplay.raf = requestAnimationFrame(tick);
}
function ideReplayPause() {
  if (!_ideReplay) return;
  _ideReplay.paused = true;
  if (_ideReplay.raf) cancelAnimationFrame(_ideReplay.raf);
  _ideReplay.raf = 0;
  const btn = document.getElementById('idePlay');
  if (btn) btn.textContent = '▶ Play';
}
function ideReplayStop() {
  if (!_ideReplay) return;
  ideReplayPause();
  _ideReplay.accum = 0;
  ideReplayApply();
}
function ideReplayCleanup() {
  if (_ideReplay && _ideReplay.raf) cancelAnimationFrame(_ideReplay.raf);
  _ideReplay = null;
  // Drop any replay highlight so a re-render doesn't show stale outlines.
  document.querySelectorAll('.ide-row .ide-card.ide-replay-on')
    .forEach(el => el.classList.remove('ide-replay-on'));
}

// Find the segment that's "active" at the current accumulated time, update
// the seek slider + label, highlight that row, and scroll it into view.
// The timeline is rendered newest-on-top, so the active row moves UP as
// replay advances — natural reading order for "watch what just happened".
function ideReplayApply() {
  const st = _ideReplay; if (!st) return;
  const tNow = st.t0 + st.accum;
  // Pick the latest segment whose started_at <= tNow. Binary-search would be
  // cleaner but segs here are <100 in practice; linear is fast enough.
  let idx = 0;
  for (let i = 0; i < st.segs.length; i++) {
    if (st.segs[i].started_at <= tNow) idx = i; else break;
  }
  const main = document.getElementById('ideMain');
  if (!main) return;
  // The middle pane is rendered from window._ideSegs (full segment array).
  // `st.segs` is the subset with timestamps; map back by object identity
  // because filter() preserved the references.
  const seg = st.segs[idx];
  const row = [...main.querySelectorAll('.ide-row')].find(r => {
    const i = +r.dataset.i;
    return window._ideSegs && window._ideSegs[i] === seg;
  });

  main.querySelectorAll('.ide-row .ide-card.ide-replay-on')
    .forEach(el => el.classList.remove('ide-replay-on'));
  if (row) {
    const card = row.querySelector('.ide-card');
    if (card) card.classList.add('ide-replay-on');
    // Keep the active row centred-ish in view; behavior:smooth would lag at
    // high speed, so jump instantly and let the eye track.
    row.scrollIntoView({ block: 'center', behavior: 'auto' });
  }

  const seekEl = document.getElementById('ideSeek');
  if (seekEl && document.activeElement !== seekEl) {
    seekEl.value = (st.accum / st.dur * 100).toFixed(1);
  }
  const nowEl = document.getElementById('ideNow');
  if (nowEl) {
    const speed = ideReplaySpeed();
    const speedTxt = st.speedRaw === 'auto' ? `${speed.toFixed(0)}× (auto)` : `${st.speedRaw}×`;
    nowEl.textContent =
      `${Math.round(st.accum / st.dur * 100)}% · ${fmtDur(st.accum)} / ${fmtDur(st.dur)} · ${speedTxt}`;
  }
}

// Right pane: detail of one screen — its actions + nested network calls.
function showIDEDetailScreen(seg){
  const d = document.getElementById('ideDetail');
  const _acts=[], _nets=[];
  const tEvt = (n)=>new Date(n).toLocaleTimeString('vi-VN',{hour12:false});
  const netChip = (networks, ctx)=>{
    const gid=_nets.length; _nets.push({networks, action:ctx});
    const hasErr = networks.some(n=>n.net_error||(n.status>=400));
    const c = hasErr?'var(--warn)':'#79c0ff';
    return `<span class="ide-net" data-gid="${gid}" style="display:inline-block;cursor:pointer;background:${c}22;border:1px solid ${c}66;color:${c};border-radius:6px;padding:1px 8px;font-size:11px;font-weight:600">🌐 network [${networks.length}]${hasErr?' ⚠':''}</span>`;
  };
  const screenNets=[]; const realActs=[];
  for(const a of seg.actions){ if(a.standaloneNet) screenNets.push(...a.networks); else realActs.push(a); }
  const actHtml = realActs.map(a=>{
    const isTap=a.event_name==='tap';
    const danger=a.event_name==='crash'||a.event_name==='application_error'||a.event_name==='json_parse_error';
    let icon,label,color;
    if(isTap){icon='👆';label=a.element_key||'(button)';color='#5b8cff';}
    else {icon=danger?'⚠':'•';label=a.event_name;color=danger?'var(--danger)':'var(--text)';}
    const hasDetail = danger || (a.props && Object.keys(a.props).length);
    const aid=_acts.length; if(hasDetail)_acts.push(a);
    const childNet=a.networks.length?`<div style="padding:3px 0 1px 20px">${netChip(a.networks,label)}</div>`:'';
    return `<div style="padding:5px 0;border-bottom:1px solid var(--line)">
      <div style="display:flex;gap:8px;align-items:center;font-size:12px">
        <span class="${hasDetail?'ide-act':''}" ${hasDetail?`data-aid="${aid}"`:''} style="color:${color};font-weight:600;${hasDetail?'cursor:pointer':''}">${icon} ${esc(label)}${hasDetail?` <span class="muted" style="font-weight:400;font-size:10px">${danger?'xem lỗi':'chi tiết'} ⓘ</span>`:''}</span>
        <span class="muted mono" style="margin-left:auto;font-size:10px">${a.ts?tEvt(a.ts):''}</span>
      </div>${childNet}</div>`;
  }).join('');
  const screenNetHtml = screenNets.length?`<div style="padding:5px 0;border-bottom:1px solid var(--line)"><span class="muted">┄</span> ${netChip(screenNets, seg.screen)}</div>`:'';
  const lbl = screenLabel(seg.screen);
  d.innerHTML = `<h3 style="margin:0 0 2px;font-size:14px">${seg.crashed?'⚠ ':''}📱 ${esc(seg.screen)}</h3>
    ${lbl?`<div style="font-size:12px;color:var(--accent2);margin-bottom:4px">${esc(lbl)}</div>`:''}
    <div class="muted" style="font-size:11px;margin-bottom:10px">${fmtTime(seg.started_at)} → ${fmtTime(seg.ended_at)} · ${fmtDur((seg.ended_at||0)-(seg.started_at||0))}</div>
    ${screenNetHtml}${actHtml||'<div class="muted" style="font-size:12px">— không có hành động —</div>'}`;
  d.querySelectorAll('.ide-act').forEach(el=>el.onclick=(e)=>{e.stopPropagation();showActionDetail(_acts[+el.dataset.aid]);});
  d.querySelectorAll('.ide-net').forEach(el=>el.onclick=(e)=>{e.stopPropagation();showSwfNetGroup(_nets[+el.dataset.gid]);});
}

// Popup showing an action's properties, or — for crash/error/parse failures —
// a human-readable cause + which button triggered it + bad-data preview.
// Tear down EVERY action/network detail dialog in the DOM (not just the first
// match by id) and REMOVE the elements — a non-modal fallback box or a stray
// duplicate left a second popup behind the modal that couldn't be closed.
function closeAllUtilDialogs(){
  document.querySelectorAll('#actDlg, #netListDlg, dialog.ut-util-dlg').forEach(d=>{
    try { if(d.open) d.close(); } catch(_){}
    d.remove();
  });
}

function showActionDetail(a){
  if(!a) return;
  // Tear down all util dialogs first, then build fresh (see closeAllUtilDialogs).
  closeAllUtilDialogs();
  const dlg = document.createElement('dialog'); dlg.id='actDlg'; dlg.className='ut-util-dlg';
  dlg.style.cssText='width:460px;z-index:100';
  document.body.appendChild(dlg);
  const p = a.props || {};
  const isCrash = a.event_name==='crash';
  const isParse = a.event_name==='json_parse_error';
  const isErr   = a.event_name==='application_error' || isCrash || isParse;

  const isTap = a.event_name === 'tap';
  // Common context: when did this fire + on what screen + what triggered any
  // followups (network attribution). Shown above the specifics block so the
  // operator can grok "when/where" before the deeper details.
  const ctxRows = [];
  if (a.ts) ctxRows.push(['Thời điểm', new Date(a.ts).toLocaleString('vi-VN', { hour12: false }) + ` (${a.ts})`]);
  const screen = (a.props && (a.props.screen || a.props.screen_name)) || null;
  if (screen) ctxRows.push(['Màn hình', screen]);
  if (a.element_key) ctxRows.push(['Element key', a.element_key]);
  if (a.props && a.props.element_type) ctxRows.push(['Element type', a.props.element_type]);
  // class_name / framework / package come from Phase 2 of the audit fix —
  // every platform now stamps them on the tap event. Surfacing the FQCN
  // lets the operator tell "MaterialButton" from "MyCustomButton" at a
  // glance, and `package` tells whether the source is the framework or
  // the app's own code.
  if (a.props && a.props.class_name && a.props.class_name !== a.props.element_type) {
    ctxRows.push(['Class', a.props.class_name]);
  }
  if (a.props && a.props.framework) ctxRows.push(['Framework', a.props.framework]);
  if (a.props && a.props.package) ctxRows.push(['Package', a.props.package]);
  if (a.props && a.props.label && a.props.label !== a.element_key) ctxRows.push(['Label', a.props.label]);
  if (a.props && a.props.trace_id) ctxRows.push(['trace_id', a.props.trace_id]);
  if (a.props && a.props.span_id)  ctxRows.push(['span_id',  a.props.span_id]);
  if (a.triggeredBy) ctxRows.push(['Gây ra bởi', a.triggeredBy]);
  // Followup network calls — set by buildSessionTree when networks fired
  // within NET_WINDOW_MS of this action. Tap → API → response chain is the
  // most useful "what happened next" view for a tap.
  const followups = (a.networks || []).filter((n) => !!n);
  if (followups.length) ctxRows.push(['API gọi sau đó', `${followups.length} call`]);

  // For taps, the bottom-of-popup business-rule + provider-forward sections
  // do most of the work. Put a small "🏷️ Gán event nghiệp vụ →" hint near
  // the bottom of the body so the user knows the rewrite tool is one click
  // away. Wire it up after dlg is open (below).
  let body = '';
  if(isErr){
    // Diagnose the cause from the properties the SDK sent up.
    let cause, kind;
    if(isParse){
      kind = 'Parse sai dữ liệu';
      cause = p.error || p.error_message || 'Không parse được dữ liệu';
    } else if(isCrash){
      kind = 'Crash (native)';
      cause = p.signal_name ? `Tín hiệu ${p.signal_name}` : (p.message || 'Ứng dụng dừng đột ngột');
    } else {
      kind = (p.fatal===true||p.fatal==='true') ? 'Lỗi nghiêm trọng' : 'Lỗi ứng dụng';
      cause = p.message || p.error || 'Không rõ';
    }
    const rows = [
      ['Loại lỗi', kind],
      ['Nguyên nhân', cause],
      ['Domain/Module', p.domain || p.target_type || null],
      ['Do bấm nút', a.triggeredBy || null],   // set by caller when known
      ['On launch', isCrash ? (p.crash_on_launch ? 'có' : 'không') : null],
    ].filter(([,v])=>v!=null && v!=='');
    body = `<div class="kv" style="grid-template-columns:120px 1fr">
      ${rows.map(([k,v])=>`<div class="key">${k}</div><div style="${k==='Nguyên nhân'?'color:var(--danger);font-weight:600':''}">${esc(v)}</div>`).join('')}
    </div>`;
    if(isParse && (p.data_preview||p.data)){
      body += `<div class="key" style="margin-top:8px">Dữ liệu lỗi (preview)</div>
        <pre style="background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:11px;white-space:pre-wrap;word-break:break-all">${esc(p.data_preview||p.data)}</pre>`;
    }
    if(isCrash && p.stack_trace){
      body += `<div class="key" style="margin-top:8px">Stack trace</div>
        <pre style="background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:11px;max-height:200px;overflow:auto;white-space:pre-wrap">${esc(p.stack_trace)}</pre>`;
    }
    // Always show the raw properties too (collapsed feel).
    body += `<div class="key" style="margin-top:10px">Properties</div>
      <pre style="background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:11px;white-space:pre-wrap;word-break:break-word;max-height:160px;overflow:auto">${esc(JSON.stringify(p,null,2))}</pre>`;
  } else {
    // Context block first — when / where / element type / trace id — then the
    // raw properties (everything the SDK captured for this tap). Two zones so
    // an operator scanning for "where did this come from" doesn't have to dig
    // through every key.
    const ctxHtml = ctxRows.length
      ? `<div class="key" style="margin-bottom:4px">Ngữ cảnh</div>
         <div class="kv" style="grid-template-columns:140px 1fr;margin-bottom:10px;font-size:12px">
           ${ctxRows.map(([k,v]) =>
             `<div class="key">${esc(k)}</div><div class="mono" style="word-break:break-all">${esc(String(v))}</div>`).join('')}
         </div>`
      : '';

    // Followup network preview (top 5). Useful for taps: shows the API chain
    // the button kicked off without forcing the operator to leave the popup.
    let netHtml = '';
    if (followups.length) {
      const rows = followups.slice(0, 5).map((n) => {
        const path = n.url ? (() => { try { return new URL(n.url).pathname; } catch (_) { return n.url; } })() : '—';
        const ok = n.status >= 200 && n.status < 400;
        const c = n.net_error || !ok ? 'var(--danger)' : '#79c0ff';
        return `<div style="display:flex;gap:8px;font-size:11px;padding:2px 0">
          <span style="color:#79c0ff;font-weight:600">${esc(n.method || '')}</span>
          <span class="mono" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(n.url || path)}">${esc(path)}</span>
          <span style="color:${c};font-weight:700">${n.net_error ? '✕' : (n.status || '—')}</span>
        </div>`;
      }).join('');
      netHtml = `<div class="key" style="margin-top:6px">API gọi sau đó (${followups.length})</div>
        <div style="background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 10px">${rows}${
          followups.length > 5 ? `<div class="muted" style="font-size:11px;padding-top:4px">+${followups.length - 5} call khác — xem chi tiết trong session timeline</div>` : ''
        }</div>`;
    }

    // Notification-specific surfacing: pull the payload (`data`) into a
    // pretty pre block + show notification_id as its own row. Otherwise the
    // payload prints as one giant JSON-stringified line at the bottom of
    // "Properties khác" and the routing keys are unreadable.
    const isNotification = a.event_name === 'notification';
    let notifHtml = '';
    if (isNotification) {
      const nRows = [];
      if (p.state) nRows.push(['state', p.state]);
      if (p.action) nRows.push(['action', p.action]);
      if (p.notification_id) nRows.push(['notification_id', p.notification_id]);
      if (p.title) nRows.push(['title', p.title]);
      if (p.body)  nRows.push(['body',  p.body]);
      const dataObj = (p.data && typeof p.data === 'object') ? p.data : null;
      notifHtml = `<div class="key" style="margin-top:6px">Notification</div>
        <div class="kv" style="grid-template-columns:140px 1fr;font-size:12px">${
          nRows.map(([k, v]) =>
            `<div class="key">${esc(k)}</div><div class="mono" style="word-break:break-all">${esc(String(v))}</div>`).join('')
        }</div>
        ${dataObj ? `<div class="key" style="margin-top:8px">Payload (data)</div>
          <pre style="background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;font-size:11px;white-space:pre-wrap;word-break:break-word;max-height:240px;overflow:auto">${esc(JSON.stringify(dataObj, null, 2))}</pre>` : ''}`;
    }

    // Raw properties (everything else). Hide the keys we already promoted
    // into the context block so the operator isn't reading them twice. The
    // notification fields are promoted too so the JSON dump doesn't repeat them.
    const promoted = new Set(['screen','screen_name','element','element_key','element_type','label','trace_id','span_id','class_name','framework','package',
      ...(isNotification ? ['state','action','notification_id','title','body','data'] : [])]);
    const rest = Object.fromEntries(Object.entries(p).filter(([k]) => !promoted.has(k)));
    const propsHtml = Object.keys(rest).length
      ? `<div class="key" style="margin-top:10px">Properties khác</div>
         <div class="kv" style="grid-template-columns:140px 1fr;font-size:11px">${
           Object.entries(rest).map(([k,v]) =>
             `<div class="key">${esc(k)}</div><div class="mono" style="word-break:break-all">${esc(typeof v==='object'?JSON.stringify(v):String(v))}</div>`).join('')
         }</div>`
      : (ctxRows.length ? '' : '<div class="muted">Sự kiện này không truyền properties.</div>');

    // Tap-only: a quick affordance to map this element_key → a business event
    // name (the existing rewrite-rules feature). Resolved via openEventMapDialog
    // wired below. The Snowplow forwarder button below is the server-side twin:
    // same outcome, but no app rebuild — portal renames + forwards the event.
    const ruleBtn = (isTap && a.element_key)
      ? `<div style="margin-top:14px;padding-top:10px;border-top:1px dashed var(--line)">
          <div class="row" style="gap:8px;flex-wrap:wrap">
            <button class="btn ghost sm" id="actMapBtn">🏷️ Gán element key (rebuild app)…</button>
            <button class="btn ghost sm" id="actSpFwdBtn">📤 Map sang Snowplow (server-side, no rebuild)…</button>
          </div>
          <div class="muted" style="font-size:10.5px;margin-top:4px">
            <b>Rebuild</b>: rule remote-config — app pull về và đổi tên event chính nó. <br>
            <b>Server-side</b>: portal đặt 1 event_def + forward sang Snowplow collector với schema iglu đã chọn. App không cần build lại.
          </div>
        </div>`
      : '';

    body = ctxHtml + notifHtml + netHtml + propsHtml + ruleBtn;
  }

  const titleColor = isErr ? 'var(--danger)' : 'var(--accent2)';
  dlg.innerHTML = `
    <div class="dlg-h" style="color:${titleColor}">${isErr?'⚠ ':''}${esc(a.event_name)}${a.element_key?` · ${esc(a.element_key)}`:''}
      <button class="act-close" style="background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer">×</button></div>
    <div class="dlg-b">${body}<div id="actProvBlock" style="margin-top:14px"></div></div>`;
  try { dlg.showModal(); } catch(_){ dlg.setAttribute('open',''); }
  // Pull per-provider mirrors (Snowplow + Firebase) for this event so the
  // operator sees EXACTLY what each provider received. Fire-and-forget — the
  // dialog renders without it; this just augments when it lands.
  loadProviderMirrors(a).catch((_)=>{});
  // Close = remove element (✕ + backdrop), so no stray dialog lingers in the DOM.
  const kill = ()=>{ try{ dlg.close(); }catch(_){}; dlg.remove(); };
  dlg.querySelector('.act-close').onclick = kill;
  dlg.onclick = (e)=>{ if(e.target === dlg) kill(); };

  // Tap-only: wire the "Gán element key này…" button to the quick-rule dialog.
  // That dialog issues PUT /config with the merged rules list — same shape as
  // the Tree tab uses, just bound to (tap, element_key, screen) directly.
  const mapBtn = dlg.querySelector('#actMapBtn');
  if (mapBtn) mapBtn.onclick = () => {
    const screen = (a.props && (a.props.screen || a.props.screen_name)) || _ideState?.segs?.find(s => s.screen)?.screen || '';
    // Pre-fill class name from the tap props so the operator can keep the
    // narrower match without retyping. wrapper_class (CustomButton-style) wins
    // over the raw interactive type — that's the stable handle apps care about.
    const cls = (a.props && (a.props.wrapper_class || a.props.class_name)) || '';
    openQuickRuleDialog({
      pid: route?.pid,
      matchEvent: 'tap',
      matchScreen: screen,
      matchElementKey: a.element_key,
      matchClassName: cls,
      onSaved: () => { kill(); toast('Đã gán event nghiệp vụ — rebuild app sẽ áp dụng'); },
    });
  };

  // Tap-only: the server-side twin. Configures an event_def + element_key
  // mapping so the portal will forward this tap to the Snowplow collector
  // under a new event name + iglu schema. The app keeps shipping "tap"
  // events as before — the rename happens in maybeForwardToSnowplow.
  const spFwdBtn = dlg.querySelector('#actSpFwdBtn');
  if (spFwdBtn) spFwdBtn.onclick = () => {
    const screen = (a.props && (a.props.screen || a.props.screen_name)) || _ideState?.segs?.find(s => s.screen)?.screen || '';
    const suggested = 'ev_click_' + String(a.element_key || '').replace(/[^a-zA-Z0-9_]+/g, '_').toLowerCase();
    openSnowplowMapDialog({
      pid: route?.pid,
      elementKey: a.element_key,
      screen,
      suggestedName: suggested,
      onSaved: () => { kill(); toast('Đã gán Snowplow — lần tap kế tiếp portal tự forward'); },
    });
  };
}

// Quick mapping dialog: build ONE rewrite rule (tap@screen/element → toName)
// and PUT it into project_config.rules. Reuses the same merge behaviour as
// the tree tab — remove any existing rule with the same match keys, then
// append the new one.
function openQuickRuleDialog({ pid, matchEvent, matchScreen, matchElementKey, matchClassName, onSaved }) {
  if (!pid) return;
  closeAllUtilDialogs();
  const dlg = document.createElement('dialog'); dlg.id = 'quickRuleDlg'; dlg.className = 'ut-util-dlg';
  dlg.style.cssText = 'width:480px;max-width:92vw;z-index:110';
  dlg.innerHTML = `
    <div class="dlg-h">🏷️ Gán event nghiệp vụ
      <button class="qr-close" style="background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer">×</button></div>
    <div class="dlg-b">
      <div class="muted" style="font-size:11px;margin-bottom:10px">
        Khi app rebuild + pull lại config, mọi <b>${esc(matchEvent)}</b> trên
        màn <span class="mono">${esc(matchScreen || '(bất kỳ)')}</span>
        ${matchElementKey ? `vào <span class="mono">${esc(matchElementKey)}</span>` : ''}
        sẽ được đổi tên thành event dưới đây. Class widget thu hẹp phạm vi theo
        component (vd chỉ <span class="mono">CustomButton</span>), bỏ trống = match mọi class.
      </div>
      <label style="font-size:12px">Tên event nghiệp vụ</label>
      <input id="qrToName" placeholder="vd: cart_open" style="width:100%" autocomplete="off"/>
      <label style="font-size:12px;margin-top:8px">
        Class widget (tuỳ chọn — chặn nhầm khi nhiều nơi cùng label)
        <span class="muted" style="font-weight:400">— vd <span class="mono">CustomButton</span>, <span class="mono">ElevatedButton</span></span>
      </label>
      <input id="qrClassName" placeholder="vd: CustomButton" value="${esc(matchClassName || '')}" style="width:100%" autocomplete="off"/>
      <label style="font-size:12px;margin-top:8px">Schema iglu (tuỳ chọn — Snowplow self-describing)</label>
      <input id="qrSchema" placeholder="iglu:com.acme/cart_open/jsonschema/1-0-0" style="width:100%" autocomplete="off"/>
      <div class="row" style="margin-top:14px;justify-content:flex-end;gap:8px">
        <button class="btn ghost sm qr-cancel">Huỷ</button>
        <button class="btn sm" id="qrSave">Lưu rule</button>
      </div>
    </div>`;
  document.body.appendChild(dlg);
  try { dlg.showModal(); } catch (_) { dlg.setAttribute('open',''); }
  const kill = () => { try { dlg.close(); } catch (_) {} dlg.remove(); };
  dlg.querySelector('.qr-close').onclick = kill;
  dlg.querySelector('.qr-cancel').onclick = kill;
  dlg.onclick = (e) => { if (e.target === dlg) kill(); };
  dlg.querySelector('#qrToName').focus();

  dlg.querySelector('#qrSave').onclick = async () => {
    const toName = dlg.querySelector('#qrToName').value.trim();
    if (!toName) { toast('Nhập tên event nghiệp vụ', 'err'); return; }
    const schema = dlg.querySelector('#qrSchema').value.trim();
    const className = dlg.querySelector('#qrClassName').value.trim();
    // Pull current rules so we don't wipe siblings.
    let rules = [];
    try {
      const c = await api(`/api/projects/${pid}/config`);
      rules = c.rules || [];
    } catch (_) {}
    // Replace any existing rule with the same match keys (incl. class_name)
    // — apps that re-open the dialog with the same triple should overwrite
    // their previous entry instead of accumulating duplicates.
    rules = rules.filter((r) => !(
      r.match_event === matchEvent
      && (r.match_screen || '') === (matchScreen || '')
      && (r.match_element_key || '') === (matchElementKey || '')
      && (r.match_class_name || '') === (className || '')
    ));
    const rule = { match_event: matchEvent, to_name: toName };
    if (matchScreen) rule.match_screen = matchScreen;
    if (matchElementKey) rule.match_element_key = matchElementKey;
    if (className) rule.match_class_name = className;
    if (schema) rule.add_props = { _schema: schema };
    rules.push(rule);
    await api(`/api/projects/${pid}/config`,
      { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ rules }) });
    kill();
    if (onSaved) onSaved();
  };
}

// Server-side Snowplow mapping dialog. Different from openQuickRuleDialog —
// that one writes a remote-config rule and requires the app to pull + apply.
// This writes an event_def + element_key mapping so the portal renames + relays
// the event to the Snowplow collector at ingest time, without the app even
// knowing. When the app later wires UniTrack.track(<new_name>, ...) directly
// at the call site, the by-event_name resolver path takes over and this
// mapping becomes a no-op (handled by maybeForwardToSnowplow).
async function openSnowplowMapDialog({ pid, elementKey, screen, suggestedName, onSaved }) {
  if (!pid || !elementKey) return;
  closeAllUtilDialogs();
  const dlg = document.createElement('dialog'); dlg.id = 'spMapDlg'; dlg.className = 'ut-util-dlg';
  dlg.style.cssText = 'width:560px;max-width:92vw;z-index:110';
  // Entity names must match the builders in snowplow.js (ENTITY_BUILDERS).
  // Keep this list in sync — anything added there needs a checkbox here.
  const ENTITY_OPTS = [
    { id: 'user_context', label: 'user_context — username, device, app_version' },
    { id: 'core_action',  label: 'core_action — start_time (wall-clock)' },
  ];
  dlg.innerHTML = `
    <div class="dlg-h">📤 Map tap → Snowplow event (server-side)
      <button class="sp-close" style="background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer">×</button></div>
    <div class="dlg-b">
      <div class="muted" style="font-size:11px;margin-bottom:10px">
        Mọi tap có <span class="mono">element_key=${esc(elementKey)}</span>
        ${screen ? `trên màn <span class="mono">${esc(screen)}</span>` : ''}
        sẽ được portal forward sang Snowplow collector dưới tên + schema dưới đây.
        App <b>không cần</b> build lại.
      </div>
      <label style="font-size:12px">Tên event Snowplow</label>
      <input id="spName" placeholder="vd: ev_click_show_testautomations" value="${esc(suggestedName || '')}" style="width:100%" autocomplete="off"/>
      <label style="font-size:12px;margin-top:8px">Schema iglu (self-describing)</label>
      <input id="spSchema" placeholder="iglu:vn.fpt.ftel.snowplow/ev_click/jsonschema/1-0-0" style="width:100%" autocomplete="off"/>
      <label style="font-size:12px;margin-top:8px">Entities đính kèm</label>
      <div id="spEntities" style="display:flex;flex-direction:column;gap:6px;margin-top:4px">
        ${ENTITY_OPTS.map((o) => `
          <label style="font-size:12px;display:flex;gap:6px;align-items:center;font-weight:400">
            <input type="checkbox" data-ent="${esc(o.id)}" ${o.id === 'user_context' ? 'checked' : ''}/>
            <span class="mono">${esc(o.id)}</span>
            <span class="muted" style="font-size:10.5px">— ${esc(o.label.split('—')[1] || '')}</span>
          </label>`).join('')}
      </div>
      <label style="font-size:12px;margin-top:10px;display:flex;gap:6px;align-items:center;font-weight:400">
        <input type="checkbox" id="spForward" checked/>
        Bật forward ngay (off = lưu config nhưng chưa relay)
      </label>
      <div class="row" style="margin-top:14px;justify-content:flex-end;gap:8px">
        <button class="btn ghost sm sp-cancel">Huỷ</button>
        <button class="btn sm" id="spSave">Lưu mapping</button>
      </div>
    </div>`;
  document.body.appendChild(dlg);
  try { dlg.showModal(); } catch (_) { dlg.setAttribute('open',''); }
  const kill = () => { try { dlg.close(); } catch (_) {} dlg.remove(); };
  dlg.querySelector('.sp-close').onclick = kill;
  dlg.querySelector('.sp-cancel').onclick = kill;
  dlg.onclick = (e) => { if (e.target === dlg) kill(); };
  dlg.querySelector('#spName').focus();

  dlg.querySelector('#spSave').onclick = async () => {
    const name = dlg.querySelector('#spName').value.trim();
    const schema = dlg.querySelector('#spSchema').value.trim();
    const forward = dlg.querySelector('#spForward').checked;
    if (!name) { toast('Nhập tên event Snowplow', 'err'); return; }
    if (forward && !schema) { toast('Cần schema iglu khi bật forward', 'err'); return; }
    const entities = Array.from(dlg.querySelectorAll('#spEntities input[type=checkbox]:checked'))
      .map((i) => i.dataset.ent);
    try {
      // 1) Upsert event_def with the Snowplow config.
      const def = await api(`/api/projects/${pid}/defs`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },

      if (!def || !def.id) throw new Error('def_save_failed');
      // 2) Wire element_key → this def (drag-drop equivalent). Any prior
      //    mapping for this element_key is overwritten by the API ON CONFLICT.
      await api(`/api/projects/${pid}/mappings`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ element_key: elementKey, event_def_id: def.id }),
      });
      kill();
      if (onSaved) onSaved();
    } catch (e) {
      toast('Lưu mapping thất bại: ' + (e.message || e), 'err');
    }
  };
}

function renderCrashReport(pid, data, killFn) {
  const body = document.getElementById('crashBody');
  if (!body) return;
  // Override the inherited `.dlg-b` flex-column on this container — flex
  // siblings get height:0 by default in a vertical flex layout and that
  // collapsed every crash row to a thin line (the "16 rows, no content"
  // symptom). Block layout lets each row claim its natural height.
  body.style.display = 'block';
  body.style.gap = '0';
  if (!data.groups || !data.groups.length) {
    body.innerHTML = '<div class="muted">Không có crash nào (data.total_crashes = 0).</div>';
    return;
  }
  const fmtAgo = (ts) => {
    const d = Date.now() - ts;
    if (d < 60_000) return Math.round(d / 1000) + 's trước';
    if (d < 3600_000) return Math.round(d / 60_000) + ' phút trước';
    if (d < 86400_000) return Math.round(d / 3600_000) + ' giờ trước';
    return Math.round(d / 86400_000) + ' ngày trước';
  };
  // Header summary: total + group count.
  const header = `
    <div style="display:flex;gap:16px;align-items:baseline;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--line)">
      <div><span style="font-size:24px;font-weight:700;color:var(--danger)">${data.total_crashes}</span>
        <span class="muted" style="font-size:11px;margin-left:4px">tổng crash</span></div>
      <div><span style="font-size:18px;font-weight:600">${data.group_count}</span>
        <span class="muted" style="font-size:11px;margin-left:4px">loại lỗi khác nhau</span></div>
      <span class="muted" style="font-size:11px;margin-left:auto">Sắp xếp theo tần suất</span>
    </div>`;
  // Each group rendered collapsed; expand toggles the detail panel inline.
  const groups = data.groups.map((g, i) => {
    const sessionsHtml = g.recent_sessions.map((s) => `
      <a class="cr-sess" data-sid="${esc(s.session_id)}"
         style="display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border:1px solid var(--line);
                border-radius:14px;font-size:11px;cursor:pointer;background:var(--bg);text-decoration:none;color:var(--text)">
        <span class="mono" style="color:var(--accent2)">${esc(shortSid(s.session_id))}</span>
        <span class="muted">${s.user_id ? esc(s.user_id) + ' · ' : ''}${fmtAgo(s.timestamp)}</span>
      </a>`).join('');
    // Pull the stack out of the sample's properties (if any) — present at
    // crash time as `stack_trace` (Flutter exception) or `stack` (native).
    const p = g.sample.properties || {};
    const stack = p.stack_trace || p.stack || p.callstack || null;
    const extraProps = Object.fromEntries(
      Object.entries(p).filter(([k]) => !['stack_trace','stack','callstack','message','error','exception','signal_name','screen','screen_name','session_id','user_id'].includes(k))
    );
    const propsHtml = Object.keys(extraProps).length
      ? `<div class="key" style="margin-top:10px">Properties khác</div>
         <div class="kv" style="grid-template-columns:140px 1fr;font-size:11px">${
           Object.entries(extraProps).map(([k, v]) =>
             `<div class="key">${esc(k)}</div><div class="mono" style="word-break:break-all">${esc(typeof v === 'object' ? JSON.stringify(v) : String(v))}</div>`).join('')
         }</div>`
      : '';
    return `
      <div class="cr-group" data-i="${i}" style="border:1px solid var(--line);border-radius:8px;margin-bottom:10px;overflow:hidden">
        <div class="cr-head" data-i="${i}" style="display:flex;gap:10px;align-items:center;padding:10px 14px;cursor:pointer;background:var(--panel)">
          <span style="color:var(--danger);font-size:16px;flex-shrink:0">⚠</span>
          <div style="flex:1;min-width:0">
            <div style="font-weight:600;font-size:13px;color:var(--danger);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(g.message)}">${esc(g.message)}</div>
            <div class="muted" style="font-size:11px;margin-top:2px">
              📱 <span class="mono">${esc(g.screen)}</span> ·
              ${g.platform || ''}
            </div>
          </div>
          <div style="text-align:right;flex-shrink:0">
            <div><span style="font-size:18px;font-weight:700;color:var(--danger)">${g.count}</span>
              <span class="muted" style="font-size:10px">crash</span></div>
            <div class="muted" style="font-size:10px">${g.session_count} session · ${g.user_count} user</div>
          </div>
          <span class="cr-caret" style="color:var(--muted);font-size:14px;width:14px;text-align:center">▸</span>
        </div>
        <div class="cr-detail" data-i="${i}" style="display:none;padding:12px 14px;border-top:1px solid var(--line);background:var(--bg)">
          <div class="muted" style="font-size:11px;margin-bottom:8px">
            Lần đầu: <span class="mono">${fmtTime(g.first_seen)}</span> ·
            Gần nhất: <span class="mono">${fmtTime(g.last_seen)}</span> ·
            App version: <span class="mono">${esc(g.sample.app_version || '—')}</span>
          </div>
          ${stack ? `<div class="key">Stack trace</div>
            <pre style="background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;
                        font-size:11px;max-height:280px;overflow:auto;white-space:pre-wrap;word-break:break-word;margin:4px 0 10px">${esc(stack)}</pre>` : ''}
          ${propsHtml}
          ${g.recent_sessions.length ? `<div class="key" style="margin-top:12px">Session gần nhất bị crash</div>
            <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px">${sessionsHtml}</div>
            <div class="muted" style="font-size:10px;margin-top:6px">Bấm 1 session để mở session detail</div>` : ''}
        </div>
      </div>`;
  }).join('');
  body.innerHTML = header + groups;

  // Wire expand/collapse + session deep-link.
  body.querySelectorAll('.cr-head').forEach((h) => {
    h.onclick = () => {
      const i = h.dataset.i;
      const detail = body.querySelector(`.cr-detail[data-i="${i}"]`);
      const caret  = h.querySelector('.cr-caret');
      const open = detail.style.display === 'none' || !detail.style.display;
      detail.style.display = open ? 'block' : 'none';
      if (caret) caret.textContent = open ? '▾' : '▸';
    };
  });
  body.querySelectorAll('.cr-sess').forEach((a) => {
    a.onclick = (ev) => {
      ev.preventDefault();
      // Close the crash dialog so the IDE overlay isn't fighting it for focus.
      if (killFn) killFn();
      openSessionIDE(pid, a.dataset.sid).catch(() => {});
    };
  });
}

  document.body.appendChild(dlg);
  try { dlg.showModal(); } catch (_) { dlg.setAttribute('open',''); }
  const kill = () => { try { dlg.close(); } catch (_) {} dlg.remove(); };
  dlg.querySelector('.lay-close').onclick = kill;
  dlg.onclick = (e) => { if (e.target === dlg) kill(); };

  let data;
  try { data = await api(`/api/projects/${pid}/sessions/${encodeURIComponent(sid)}/layouts`); }

  ).join('');

  const labelsToggle = document.getElementById('layShowLabels');

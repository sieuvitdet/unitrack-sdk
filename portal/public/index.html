<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<title>Mobix · Event Tracking</title>
<style>
  :root{--bg:#0b0e14;--panel:#141925;--panel2:#1b2231;--line:#283044;--text:#e6e9ef;
    --muted:#8b94a7;--accent:#5b8cff;--accent2:#27d796;--warn:#ffb454;--danger:#ff6b6b;--chip:#222a3a;}
  *{box-sizing:border-box;}
  body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);}
  a{color:var(--accent);text-decoration:none;cursor:pointer;}
  header{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5;}
  header .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:700;color:#08111f;}
  header h1{font-size:16px;margin:0;font-weight:600;}
  header .crumb{color:var(--muted);font-size:13px;margin-left:4px;}
  header .live{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);}
  /* The [hidden] attribute must win over the display:flex/inline above, or the
     nav + logout box show even when logged out. */
  [hidden]{display:none !important;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--accent2);animation:pulse 2s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(39,215,150,.5)}70%{box-shadow:0 0 0 8px rgba(39,215,150,0)}100%{box-shadow:0 0 0 0 rgba(39,215,150,0)}}
  .wrap{padding:22px;max-width:1400px;margin:0 auto;}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;}
  .btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line);}
  .btn.sm{padding:5px 10px;font-size:12px;}
  .btn.danger{background:var(--danger);}
  input,select{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font-size:13px;outline:none;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:18px;}
  .panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0;padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:20px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;}
  .card .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px;}
  .card .v{font-size:24px;font-weight:700;margin-top:6px;}
  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line);}
  td{padding:9px 14px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top;}
  tr.click:hover{background:var(--panel2);cursor:pointer;}
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;background:var(--chip);color:var(--accent);white-space:nowrap;}
  .badge.flutter{color:#7ee787;}.badge.native_ios{color:#a5a5ff;}.badge.native_android{color:#7ee787;}.badge.react_native{color:#79c0ff;}
  .badge.crash,.badge.json_parse_error,.badge.network_error{color:var(--danger);background:#2a1620;}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;}
  .muted{color:var(--muted);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start;}
  @media(max-width:920px){.grid2{grid-template-columns:1fr;}}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .keybox{background:#0e1320;border:1px dashed var(--line);border-radius:8px;padding:8px 10px;font-family:ui-monospace,monospace;font-size:12px;color:var(--accent2);word-break:break-all;}
  .tabs{display:flex;gap:6px;padding:0 16px;border-bottom:1px solid var(--line);}
  .tab{padding:11px 12px;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;}
  .tab.active{color:var(--text);border-bottom-color:var(--accent);}
  .empty{padding:40px;text-align:center;color:var(--muted);}
  /* drag-drop */
  .deflist{display:flex;flex-direction:column;gap:8px;padding:14px 16px;}
  .def{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;cursor:grab;display:flex;justify-content:space-between;align-items:center;}
  .def:active{cursor:grabbing;}
  .def .nm{font-weight:600;color:var(--accent2);}
  .elrow{transition:background .15s;}
  .elrow.drop{background:rgba(91,140,255,.18);outline:2px dashed var(--accent);}
  .pill{background:var(--chip);border-radius:6px;padding:1px 8px;font-size:11px;}
  dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:0;width:440px;max-width:92vw;}
  dialog::backdrop{background:rgba(0,0,0,.5);}
  .dlg-h{padding:16px;border-bottom:1px solid var(--line);font-weight:600;}
  .dlg-b{padding:16px;display:flex;flex-direction:column;gap:12px;}
  .dlg-f{padding:14px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}
  label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px;}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,60vw);max-width:96vw;background:var(--panel);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .2s;z-index:20;display:flex;flex-direction:column;}
  @media(max-width:760px){.drawer{width:96vw;}}
  .drawer.open{transform:translateX(0);}
  .drawer .dh{display:flex;align-items:center;gap:10px;padding:16px;border-bottom:1px solid var(--line);}
  .drawer .dh button{margin-left:auto;background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;}
  .drawer .db{padding:16px;overflow:auto;}
  /* Wrap long JSON instead of scrolling horizontally, so values are readable. */
  .drawer pre{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:12px;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;overflow-x:hidden;}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:15;display:none;}
  .scrim.open{display:block;}
  .kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;margin-bottom:14px;font-size:13px;}
  .kv .key{color:var(--muted);}
  .kv .mono{word-break:break-word;overflow-wrap:anywhere;}
</style>
</head>
<body>
<header>
  <div class="logo">M</div>
  <h1>Event Tracking</h1>
  <span class="crumb" id="crumb"></span>
  <span style="margin-left:18px" id="nav" hidden><a id="navProjects">Dự án</a> <span id="navCmsWrap">· <a id="navCms">CMS tổng quan</a></span></span>
  <div class="live" id="userBox" hidden><span class="muted" id="userEmail"></span> · <a id="logout">Đăng xuất</a></div>
</header>
<div class="wrap" id="view">
  <!-- Static login form: visible immediately, works even if JS is blocked
       (posts as a normal form). JS upgrades it to the SPA flow when it runs. -->
  <div id="bootLogin" style="max-width:380px;margin:8vh auto">
    <div class="panel" id="bootLoginPanel" style="padding:0">
      <h2>Đăng nhập <span style="font-size:11px;color:var(--muted);font-weight:400">v17</span></h2>
      <form method="POST" action="auth/login-form" style="padding:18px;display:flex;flex-direction:column;gap:12px">
        <div><label>Email</label><input name="email" type="email" required placeholder="ban@email.com" style="width:100%"/></div>
        <div><label>Mật khẩu</label><input name="password" type="password" required placeholder="••••••" style="width:100%"/></div>
        <button class="btn" type="submit">Đăng nhập</button>
        <div class="muted" style="font-size:13px;text-align:center">
          Chưa có tài khoản? <a href="?signup=1">Đăng ký</a>
        </div>
      </form>
    </div>
    <div class="panel" id="bootSignupPanel" style="padding:0;display:none">
      <h2>Đăng ký tài khoản</h2>
      <form method="POST" action="auth/signup-form" style="padding:18px;display:flex;flex-direction:column;gap:12px">
        <div><label>Email</label><input name="email" type="email" required placeholder="ban@email.com" style="width:100%"/></div>
        <div><label>Mật khẩu</label><input name="password" type="password" required minlength="6" placeholder="tối thiểu 6 ký tự" style="width:100%"/></div>
        <button class="btn" type="submit">Đăng ký</button>
        <div class="muted" style="font-size:13px;text-align:center">
          Đã có tài khoản? <a href="?">Đăng nhập</a>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer">
  <div class="dh"><span class="badge" id="dBadge">event</span><span class="mono muted" id="dId"></span><button id="dClose">×</button></div>
  <div class="db">
    <div class="kv" id="dKv"></div>
    <h2 style="font-size:12px;color:var(--muted);margin:0 0 6px">DEVICE</h2><pre id="dDevice"></pre>
    <h2 style="font-size:12px;color:var(--muted);margin:14px 0 6px">PROPERTIES</h2><pre id="dProps"></pre>
  </div>
</div>

<!-- new project dialog -->
<dialog id="projDlg">
  <div class="dlg-h">Tạo dự án mới</div>
  <div class="dlg-b">
    <div><label>Tên dự án</label><input id="pName" placeholder="Mobix Shop" style="width:100%"/></div>
    <div><label>App bundle / package</label><input id="pBundle" placeholder="asia.mobix.shop" style="width:100%"/></div>
    <div><label>Loại source</label>
      <select id="pType" style="width:100%">
        <option value="native_ios">Native iOS</option>
        <option value="native_android">Native Android</option>
        <option value="flutter">Flutter</option>
        <option value="react_native">React Native</option>
      </select></div>
  </div>
  <div class="dlg-f"><button class="btn ghost" onclick="projDlg.close()">Huỷ</button><button class="btn" id="pCreate">Tạo</button></div>
</dialog>

<script>
// The static #bootLogin form is already on screen and fully functional via a
// plain form POST. JS only ENHANCES — it must never blank the page out from
// under that form. We leave #view untouched until we know the user is authed.
const BASE = location.pathname.replace(/\/index\.html$/,'').replace(/\/$/,'');
async function api(p,o){
  const r=await fetch(BASE+p,o);
  if(r.status===401){ me=null; renderAuth('login'); throw new Error('Phiên hết hạn, vui lòng đăng nhập lại'); }
  const ct=r.headers.get('content-type')||'';
  const body=ct.includes('json')?await r.json().catch(()=>({})):await r.text();
  if(!r.ok) throw new Error((body&&body.error)||('HTTP '+r.status));
  return body;
}
const $=(s)=>document.querySelector(s);
// Brief confirmation toast (bottom-center). Used e.g. after a mapping is saved.
function toast(msg,kind){
  let t=document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast';
    t.style.cssText='position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:50;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;color:#fff;box-shadow:0 6px 24px rgba(0,0,0,.4);opacity:0;transition:opacity .18s';
    document.body.appendChild(t); }
  t.style.background = kind==='err' ? 'var(--danger)' : 'var(--accent2)';
  t.textContent=msg; t.style.opacity='1';
  clearTimeout(t._h); t._h=setTimeout(()=>{t.style.opacity='0';},1800);
}
const esc=(s)=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtAgo=(ms)=>{if(!ms)return'—';const s=(Date.now()-ms)/1000;if(s<60)return Math.floor(s)+'s';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h';return Math.floor(s/86400)+'d';};
const fmtTime=(ms)=>new Date(ms).toLocaleString('vi-VN',{hour12:false});
// Small inline tags derived from an event's properties, shown next to the event
// name in the log table (so you see key context without opening the drawer).
function evTag(r){
  let p=r.properties; if(typeof p==='string'){try{p=JSON.parse(p);}catch(_){p={};}}
  p=p||{};
  const tag=(t,color)=>` <span style="font-size:10px;padding:1px 5px;border-radius:4px;background:${color};color:#fff;vertical-align:middle">${t}</span>`;
  let out='';
  if(r.event_name==='crash' && (p.crash_on_launch===true||p.crash_on_launch==='true')) out+=tag('on-launch','#b91c1c');
  if(r.event_name==='notification' && p.state) out+=tag(p.state,{foreground:'#2563eb',background:'#6b7280',silent:'#7c3aed'}[p.state]||'#6b7280');
  if(r.event_name==='notification' && p.action==='opened') out+=tag('opened','#059669');
  return out;
}

let route = {name:'projects', pid:null, tab:'logs'};
function go(r){route={...route,...r};render();}

// ---------- router ----------
$('#navProjects').onclick=()=>go({name:'projects'});
$('#navCms').onclick=()=>go({name:'cms'});

async function render(){
  try{
    if(route.name==='projects'){ $('#crumb').textContent=''; return await renderProjects(); }
    if(route.name==='project'){ return await renderProject(); }
    if(route.name==='cms'){ $('#crumb').textContent='· CMS'; return await renderCMS(); }
  }catch(e){
    $('#view').innerHTML=`<div class="panel" style="padding:20px"><b style="color:var(--danger)">Lỗi hiển thị</b><pre style="white-space:pre-wrap;color:var(--muted)">${esc(e&&e.stack||e)}</pre></div>`;
  }
}

// ---------- CMS overview ----------
function gradeColor(g){return {A:'var(--accent2)',B:'var(--accent)',C:'var(--warn)',D:'var(--danger)','N/A':'var(--muted)'}[g]||'var(--muted)';}
function scoreBar(h){
  return `<div style="display:flex;align-items:center;gap:8px">
    <div style="width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;border:3px solid ${gradeColor(h.grade)};color:${gradeColor(h.grade)}">${h.grade}</div>
    <div><div style="font-weight:700;font-size:16px">${h.score}<span class="muted" style="font-size:12px">/100</span></div>
    <div class="muted" style="font-size:11px">${esc(h.verdict)}</div></div></div>`;
}
async function renderCMS(){
  const data=await api('/api/cms/overview');
  const t=data.totals;
  $('#view').innerHTML=`
    <h2 style="margin:0 0 16px;border:none;padding:0;text-transform:none;font-size:18px;color:var(--text);letter-spacing:0">CMS — Tổng quan tất cả dự án</h2>
    <div class="cards">
      <div class="card"><div class="k">Dự án</div><div class="v">${t.projects}</div></div>
      <div class="card"><div class="k">Tổng events</div><div class="v">${t.events.toLocaleString()}</div></div>
      <div class="card"><div class="k">Cần chú ý</div><div class="v" style="color:${t.needs_attention?'var(--warn)':'inherit'}">${t.needs_attention}</div></div>
      <div class="card"><div class="k">Naming warnings</div><div class="v" style="color:${t.naming_warnings?'var(--danger)':'inherit'}">${t.naming_warnings}</div></div>
    </div>
    <div class="panel"><table>
      <thead><tr><th>Dự án</th><th>Source</th><th>Events</th><th>Định nghĩa</th><th>Naming</th><th>Health Score</th><th></th></tr></thead>
      <tbody>${data.projects.length?data.projects.map(p=>`
        <tr>
          <td class="click" data-id="${p.id}"><b>${esc(p.name)}</b><div class="muted mono" style="font-size:11px">${esc(p.app_bundle)||''}</div></td>
          <td><span class="badge ${esc(p.source_type)}">${esc(p.source_type)||'—'}</span></td>
          <td>${p.total_events}</td>
          <td>${p.elements_defined}/${p.elements_total} <span class="muted">(${p.definition_rate}%)</span></td>
          <td>${p.naming_warnings?`<span style="color:var(--danger)">⚠ ${p.naming_warnings}</span>`:'<span style="color:var(--accent2)">✓</span>'}</td>
          <td>${scoreBar(p.health)}</td>
          <td style="white-space:nowrap">
            <a class="btn ghost sm" onclick="go({name:'project',pid:${p.id},tab:'logs'})">Mở</a>
            <a class="btn ghost sm" href="${BASE}/api/projects/${p.id}/export">⬇ Excel</a>
          </td>
        </tr>`).join(''):'<tr><td colspan=7 class=empty>Chưa có dự án.</td></tr>'}
      </tbody></table></div>
    <div class="panel"><h2>Chi tiết score (click dự án ở trên để mở)</h2>
      <div style="padding:14px 16px" class="muted">Health Score = Coverage 30% · Naming 20% · Diversity 15% · Crash 20% · Activity 15%</div>
    </div>`;
  document.querySelectorAll('.click[data-id]').forEach(el=>el.onclick=()=>go({name:'project',pid:el.dataset.id,tab:'logs'}));
}

// ---------- projects list ----------
async function renderProjects(){
  const projs = await api('/api/projects');
  $('#view').innerHTML = `
    <div class="row" style="justify-content:space-between;margin-bottom:16px">
      <h2 style="margin:0;border:none;padding:0;text-transform:none;font-size:18px;color:var(--text);letter-spacing:0">Dự án</h2>
      <button class="btn" id="newProj">+ Dự án mới</button>
    </div>
    <div class="panel">
      <table><thead><tr><th>Tên</th><th>Bundle</th><th>Source</th><th>Events</th><th>API key</th><th></th></tr></thead>
      <tbody>${projs.length?projs.map(p=>`
        <tr class="click" data-id="${p.id}">
          <td><b>${esc(p.name)}</b></td>
          <td class="mono muted">${esc(p.app_bundle)||'—'}</td>
          <td><span class="badge ${esc(p.source_type)}">${esc(p.source_type)||'—'}</span></td>
          <td>${p.event_count}</td>
          <td><span class="keybox">${esc(p.api_key)}</span></td>
          <td><button class="btn ghost sm del" data-id="${p.id}">Xoá</button></td>
        </tr>`).join(''):'<tr><td colspan="6" class="empty">Chưa có dự án. Tạo dự án để lấy API key.</td></tr>'}
      </tbody></table>
    </div>`;
  $('#newProj').onclick=()=>{ $('#pName').value='';$('#pBundle').value='';$('#projDlg').showModal(); };
  document.querySelectorAll('tr.click').forEach(tr=>tr.onclick=(e)=>{ if(e.target.closest('.del'))return; go({name:'project',pid:tr.dataset.id,tab:'logs'}); });
  document.querySelectorAll('.del').forEach(b=>b.onclick=async(e)=>{ e.stopPropagation(); if(confirm('Xoá dự án này?')){ await fetch(`${BASE}/api/projects/${b.dataset.id}`,{method:'DELETE'}); renderProjects(); }});
}

$('#pCreate').onclick=async()=>{
  const body={name:$('#pName').value.trim(),app_bundle:$('#pBundle').value.trim(),source_type:$('#pType').value};
  if(!body.name)return;
  await api('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  $('#projDlg').close(); renderProjects();
};

// ---------- project detail ----------
async function renderProject(){
  const pid=route.pid;
  const [p,stats]=await Promise.all([api(`/api/projects/${pid}`),api(`/api/projects/${pid}/stats`)]);
  $('#crumb').innerHTML=`· <a onclick="go({name:'projects'})">Dự án</a> / ${esc(p.name)}`;
  $('#view').innerHTML=`
    <div class="row" style="justify-content:space-between;margin-bottom:16px">
      <div class="row">
        <a onclick="go({name:'projects'})">← Dự án</a>
        <h2 style="margin:0;border:none;padding:0;text-transform:none;font-size:18px;color:var(--text);letter-spacing:0">${esc(p.name)}</h2>
        <span class="badge ${esc(p.source_type)}">${esc(p.source_type)}</span>
      </div>
      <div class="row">
        <span class="keybox" title="API key">${esc(p.api_key)}</span>
        <button class="btn ghost sm" id="provBtn">⚙ Providers</button>
        <a class="btn ghost sm" href="${BASE}/api/projects/${pid}/export">⬇ Export Excel</a>
      </div>
    </div>
    <div class="panel" id="provPanel" style="display:none;padding:16px;margin-bottom:16px">
      <b>Providers — forward & xem log đa nguồn</b>
      <div class="muted" style="font-size:12px;margin:6px 0 12px">
        Khi bật, portal hiển thị log từ provider tương ứng (nhãn màu trong bảng Log).
      </div>
      <label class="row" style="gap:8px"><input type="checkbox" id="provSnow"> Snowplow</label>
      <div id="snowCfg" style="margin:6px 0 12px 24px">
        <div class="muted" style="font-size:12px">Snowplow collector endpoint của bạn (trỏ tracker tới đây):</div>
        <div class="keybox mono" style="display:block;margin:4px 0">${location.origin}${BASE}/sp/${esc(p.api_key)}</div>
        <div class="muted" style="font-size:12px;margin-top:6px">Forward tới collector THẬT (để trống = chỉ thu ở portal):</div>
        <input id="spForward" placeholder="https://collector-that.cua-ban.com" style="width:100%;margin-top:4px" value="${esc(p.sp_forward_url||'')}"/>
      </div>

// ---------- class → event tree ----------
// Parent = screen (screen_name); children = events on that screen, grouped by
// event_name + element_key. Built from received logs. Each leaf can be assigned
// a business name + schema into the event registry (writes config).
async function renderTree(pid){
  const [rows, cfg] = await Promise.all([
    api(`/api/projects/${pid}/events?limit=2000`),
    api(`/api/projects/${pid}/config`),
  ]);
  const rules = cfg.rules || [];
  // Find a rewrite rule matching this exact leaf (event + screen + element).
  const ruleFor = (ev, screen, elem) => rules.find(r =>
    r.match_event===ev &&
    (!r.match_screen || r.match_screen===screen) &&
    (!r.match_element_key || r.match_element_key===elem));

  // Events with no active screen (session_started, app_foreground, notification
  // permission, …) are fired before/around the UI — group them under one label.
  const LIFECYCLE = '(App lifecycle / pre-UI)';
  // Strip any Swift module prefix ("MyApp.HomeVC" → "HomeVC") so old logs that
  // recorded the qualified name group with the new bare-name logs.
  const cleanScreen = (s) => s ? String(s).split('.').pop() : '';

  // Group: screen → leafKey → {event_name, element, type, hits, lastTs}
  const tree = {};
  for(const r of rows){
    const screen = cleanScreen(r.screen_name || r.screen) || LIFECYCLE;
    let p=r.properties; if(typeof p==='string'){try{p=JSON.parse(p)}catch(_){p={}}}
    const elem = r.element_key || (p&&(p.url))|| '';
    const type = (p&&p.extra&&p.extra.type) || r.class_name || '';
    const leafKey = r.event_name + (elem?('|'+elem):'');
    tree[screen] = tree[screen] || {};
    const leaf = tree[screen][leafKey] || {event_name:r.event_name, screen, element:elem, type, hits:0, last:0};
    leaf.hits++; if(r.timestamp>leaf.last) leaf.last=r.timestamp;
    tree[screen][leafKey]=leaf;
  }

  // Real screens A→Z, with the lifecycle bucket pinned to the bottom.
  const screens = Object.keys(tree).sort((a,b)=>
    a===LIFECYCLE?1 : b===LIFECYCLE?-1 : a.localeCompare(b));
  $('#tabBody').innerHTML = `
    <div style="padding:14px 16px">
      <div class="muted" style="font-size:12px;margin-bottom:10px">
        Cấu trúc tracking dựng từ log: <b>màn hình</b> (cha) → <b>event</b> (con).
        Bấm “gán” để map 1 event auto-capture (tap/screen/network) → <b>tên nghiệp vụ</b>.
        SDK đổi tên ngay tại app khi kéo config về — <b>không cần code/build lại</b>.
      </div>
      ${screens.length? screens.map(s=>{
        const leaves = Object.values(tree[s]).sort((a,b)=>b.hits-a.hits);
        return `<div class="treeScreen" style="margin-bottom:10px">
          <div class="row" style="gap:8px;padding:8px 10px;background:var(--panel2);border-radius:8px;cursor:pointer" data-screen>
            <span style="font-weight:600">▾ ${esc(s)}</span>
            <span class="pill">${leaves.length} event</span>
          </div>
          <div class="treeKids" style="padding:4px 0 4px 16px">
            ${leaves.map((l,i)=>{
              const rule = ruleFor(l.event_name, l.screen, l.element);
              return `<div class="row" style="gap:10px;padding:5px 8px;justify-content:space-between">
                <div>
                  <span class="badge ${esc(l.event_name)}">${esc(l.event_name)}</span>
                  ${l.element?`<span class="mono muted" style="font-size:11px"> ${esc(l.element)}</span>`:''}
                  ${l.type?`<span class="muted" style="font-size:11px"> · ${esc(l.type)}</span>`:''}
                  ${rule?` <span style="color:var(--accent2);font-size:11px">→ ${esc(rule.to_name)}</span>`:''}
                </div>
                <div class="row" style="gap:8px">
                  <span class="pill">${l.hits}</span>
                  <button class="btn ghost sm treeAssign" data-ev="${esc(l.event_name)}" data-screen="${esc(l.screen)}" data-elem="${esc(l.element)}">${rule?'sửa':'gán'}</button>
                  ${rule?`<button class="btn ghost sm treeUnassign" data-to="${esc(rule.to_name)}">×</button>`:''}
                </div>
              </div>`;
            }).join('')}
          </div>
        </div>`;
      }).join('') : '<div class="empty">Chưa có log để dựng cây. Chạy app để thu event.</div>'}
    </div>`;

  // collapse/expand
  document.querySelectorAll('[data-screen].row').forEach(()=>{}); // (no-op safety)
  document.querySelectorAll('.treeScreen > [data-screen]').forEach(h=>h.onclick=()=>{
    const k=h.nextElementSibling; k.style.display = k.style.display==='none'?'block':'none';
    const sp=h.querySelector('span'); sp.textContent = sp.textContent.replace(/^[▾▸]/, k.style.display==='none'?'▸':'▾');
  });

  // assign → write a rewrite RULE (match event+screen+element → business name).
  document.querySelectorAll('.treeAssign').forEach(b=>b.onclick=async()=>{
    const ev=b.dataset.ev, screen=b.dataset.screen, elem=b.dataset.elem;
    const existing=ruleFor(ev,screen,elem);
    const toName=prompt(`Map "${ev}"${elem?(' ['+elem+']'):''} trên màn "${screen}" → tên nghiệp vụ:`, existing?existing.to_name:'');
    if(!toName) return;
    const schema=prompt('Schema iglu (tuỳ chọn, để trống nếu không):', existing?(existing.add_props&&existing.add_props._schema)||'':'')||'';
    // remove any prior rule for this same match, then add the new one
    const next = rules.filter(r=>!(r.match_event===ev && (r.match_screen||'')===(screen||'') && (r.match_element_key||'')===(elem||'')));
    const rule = { match_event:ev, to_name:toName };
    if(screen && screen!==LIFECYCLE) rule.match_screen=screen;
    if(elem) rule.match_element_key=elem;
    if(schema) rule.add_props={ _schema:schema };
    next.push(rule);
    await api(`/api/projects/${pid}/config`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({rules:next})});
    toast('Đã lưu rule'); renderTree(pid);
  });
  document.querySelectorAll('.treeUnassign').forEach(b=>b.onclick=async()=>{
    const next=rules.filter(r=>r.to_name!==b.dataset.to);
    await api(`/api/projects/${pid}/config`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({rules:next})});
    toast('Đã gỡ rule'); renderTree(pid);
  });
}

      <div class="muted" style="font-size:12px;margin-bottom:6px">Kéo-thả <b>google-services.json</b> hoặc <b>GoogleService-Info.plist</b> vào ô dưới để tự điền:</div>
      <div id="cfFbDrop" style="border:1px dashed var(--line);border-radius:8px;padding:14px;text-align:center;color:var(--muted);margin-bottom:8px">Thả file vào đây</div>
      <div class="row" style="gap:10px;flex-wrap:wrap">
        <div style="flex:1;min-width:200px"><label>GOOGLE_APP_ID (appId)</label><input id="cfFbApp" style="width:100%" value="${esc(fbo.appId||'')}"/></div>
        <div style="flex:1;min-width:160px"><label>GCM_SENDER_ID</label><input id="cfFbSender" style="width:100%" value="${esc(fbo.gcmSenderId||'')}"/></div>
      </div>
      <div class="row" style="gap:10px;flex-wrap:wrap;margin-top:8px">
        <div style="flex:1;min-width:160px"><label>API_KEY</label><input id="cfFbKey" style="width:100%" value="${esc(fbo.apiKey||'')}"/></div>
        <div style="flex:1;min-width:140px"><label>PROJECT_ID</label><input id="cfFbProj" style="width:100%" value="${esc(fbo.projectId||'')}"/></div>
        <div style="flex:1;min-width:140px"><label>BUNDLE_ID</label><input id="cfFbBundle" style="width:100%" value="${esc(fbo.bundleId||'')}"/></div>
      </div>
      <label style="margin-top:8px">superProperties (mọi event)</label>
      <textarea id="cfFbSuper" style="width:100%;height:56px;font-family:ui-monospace,monospace">${esc(kvText(fb.superProperties))}</textarea>
      <label>userProperties (audience)</label>
      <textarea id="cfFbUser" style="width:100%;height:56px;font-family:ui-monospace,monospace">${esc(kvText(fb.userProperties))}</textarea>

      <hr style="border:none;border-top:1px solid var(--line);margin:16px 0">
      <h3 style="margin:0 0 4px;font-size:14px">Event registry</h3>
      <div class="muted" style="font-size:12px;margin-bottom:6px">Danh sách event hợp lệ + schema. (Gán nhanh ở tab “Cây class → event”.)</div>
      <pre id="cfReg" style="background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:140px;overflow:auto">${esc(JSON.stringify(c.event_registry||[],null,2))}</pre>

      <h3 style="margin:14px 0 4px;font-size:14px">Rewrite rules (Phase 2)</h3>
      <div class="muted" style="font-size:12px;margin-bottom:6px">SDK đổi event auto-capture → tên nghiệp vụ ngay tại app. Tạo/sửa ở tab “Cây class → event”.</div>
      <pre style="background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:140px;overflow:auto">${esc(JSON.stringify(c.rules||[],null,2))}</pre>

      <div class="row" style="margin-top:16px"><button class="btn" id="cfSave">Lưu config</button></div>
    </div>`;

  // parse key=value textarea → object
  const parseKV=(id)=>{const o={};$(id).value.split('\n').forEach(l=>{const i=l.indexOf('=');if(i>0)o[l.slice(0,i).trim()]=l.slice(i+1).trim();});return o;};

  // Firebase file drag-drop → parse json/plist, fill inputs.
  const drop=$('#cfFbDrop');
  ['dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.style.borderColor='var(--accent)';}));
  drop.addEventListener('dragleave',()=>drop.style.borderColor='var(--line)');
  drop.addEventListener('drop',e=>{
    e.preventDefault();drop.style.borderColor='var(--line)';
    const f=e.dataTransfer.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=()=>{ try{ fillFirebaseFromFile(f.name, r.result); toast('Đã đọc '+f.name);}catch(err){toast('File không hợp lệ','err');} };
    r.readAsText(f);
  });
  function fillFirebaseFromFile(name, text){
    if(name.endsWith('.json')){
      const j=JSON.parse(text); const cli=(j.client&&j.client[0])||{};
      $('#cfFbApp').value   = cli.client_info?.mobilesdk_app_id || '';
      $('#cfFbSender').value= j.project_info?.project_number || '';
      $('#cfFbKey').value   = (cli.api_key&&cli.api_key[0]?.current_key) || '';
      $('#cfFbProj').value  = j.project_info?.project_id || '';
      $('#cfFbBundle').value= cli.client_info?.android_client_info?.package_name || '';
    } else { // .plist (XML) — pull values by key
      const get=(k)=>{const m=text.match(new RegExp('<key>'+k+'</key>\\s*<string>([^<]*)</string>'));return m?m[1]:'';};
      $('#cfFbApp').value   = get('GOOGLE_APP_ID');
      $('#cfFbSender').value= get('GCM_SENDER_ID');
      $('#cfFbKey').value   = get('API_KEY');
      $('#cfFbProj').value  = get('PROJECT_ID');
      $('#cfFbBundle').value= get('BUNDLE_ID');
    }
  }

  $('#cfSave').onclick=async()=>{
    const body={
      endpoint: $('#cfEndpoint').value.trim(),
      sdk_config:{ batchSize:+$('#cfBatch').value, flushIntervalMs:+$('#cfFlush').value, logLevel:$('#cfLog').value,
        autoCapture:$('#cfAuto').checked, trackScreens:$('#cfScreens').checked, trackTaps:$('#cfTaps').checked, trackNetwork:$('#cfNet').checked },
      snowplow:{ enabled:$('#cfSpOn').checked, endpoint:$('#cfSpEp').value.trim(), appId:$('#cfSpApp').value.trim(),
        userContextSchema:$('#cfSpSchema').value.trim()||undefined, userContext:parseKV('#cfSpCtx') },
      firebase:{ enabled:$('#cfFbOn').checked,
        options:{ appId:$('#cfFbApp').value.trim(), gcmSenderId:$('#cfFbSender').value.trim(), apiKey:$('#cfFbKey').value.trim(),
          projectId:$('#cfFbProj').value.trim(), bundleId:$('#cfFbBundle').value.trim() },
        superProperties:parseKV('#cfFbSuper'), userProperties:parseKV('#cfFbUser') },
    };
    const r=await api(`/api/projects/${pid}/config`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    toast('Đã lưu config (v'+r.version+')'); renderConfig(pid);
  };
}

// ---------- drawer ----------
function openDrawer(r){
  if(!r)return;
  $('#dBadge').textContent=r.event_name;$('#dBadge').className='badge '+r.event_name;$('#dId').textContent=r.event_id;
  $('#dKv').innerHTML=[['screen',r.screen_name||r.screen],['class',r.class_name],['element',r.element_key],['session',r.session_id],['user',r.user_id],['platform',r.platform],['app version',r.app_version],['time',fmtTime(r.timestamp)]]
    .map(([k,v])=>`<div class="key">${k}</div><div class="mono">${esc(v)||'<span class=muted>—</span>'}</div>`).join('');
  $('#dDevice').textContent=r.device?JSON.stringify(r.device,null,2):'— (chưa có metadata)';
  $('#dProps').textContent=JSON.stringify(r.properties,null,2);
  $('#drawer').classList.add('open');$('#scrim').classList.add('open');
}
$('#dClose').onclick=()=>{$('#drawer').classList.remove('open');$('#scrim').classList.remove('open');};
$('#scrim').onclick=()=>$('#dClose').click();

// live refresh (only the logs tab, when no drawer open)
setInterval(()=>{ if(me&&route.name==='project'&&route.tab==='logs'&&!$('#drawer').classList.contains('open')) renderLogs(route.pid); },5000);

// ---------- auth gate ----------
let me=null;
async function boot(){
  // Static-form view state from the query string (no JS dependency to switch).
  const isSignup=/[?&]signup=1/.test(location.search);
  const lp=document.getElementById('bootLoginPanel'), sp=document.getElementById('bootSignupPanel');
  if(lp&&sp){ lp.style.display=isSignup?'none':''; sp.style.display=isSignup?'':'none'; }
  // Show an error left by a failed form-POST.
  if(/[?&]err=/.test(location.search)){
    const panel=isSignup?sp:lp;
    if(panel && !panel.querySelector('.bootErr')){
      const taken=/[?&]err=taken/.test(location.search);
      const d=document.createElement('div');
      d.className='bootErr'; d.style.cssText='color:var(--danger);font-size:13px;padding:0 18px 14px;text-align:center';
      d.textContent=isSignup?(taken?'Email đã tồn tại':'Email không hợp lệ hoặc mật khẩu quá ngắn'):'Sai email hoặc mật khẩu';
      panel.appendChild(d);
    }
  }
  try{
    const r=await fetch(BASE+'/auth/me');
    if(r.ok){ me=await r.json(); onAuthed(); }
    // Not authed: leave the static login form as-is (it works without JS).
  }catch(e){ /* network error — keep the static form visible */ }
}
function onAuthed(){
  $('#nav').hidden=false;
  $('#userBox').hidden=false;
  $('#userEmail').textContent=me.email+(me.role==='admin'?' (admin)':'');
  $('#navCmsWrap').style.display = me.role==='admin' ? '' : 'none';
  go({name: me.role==='admin' ? 'cms' : 'projects'});
}
$('#logout').onclick=async()=>{
  try{ await fetch(BASE+'/auth/logout',{method:'POST'}); }catch(e){}
  me=null;
  renderAuth('login');
};

function renderAuth(mode){
  $('#nav').hidden=true; $('#userBox').hidden=true; $('#crumb').textContent='';
  $('#view').innerHTML=`
    <div style="max-width:380px;margin:8vh auto">
      <div class="panel" style="padding:0">
        <h2>${mode==='login'?'Đăng nhập':'Đăng ký tài khoản'}</h2>
        <div style="padding:18px;display:flex;flex-direction:column;gap:12px">
          <div><label>Email</label><input id="aEmail" type="email" placeholder="ban@email.com" style="width:100%"/></div>
          <div><label>Mật khẩu</label><input id="aPass" type="password" placeholder="••••••" style="width:100%"/></div>
          <div id="aErr" style="color:var(--danger);font-size:13px;min-height:16px"></div>
          <button class="btn" id="aSubmit">${mode==='login'?'Đăng nhập':'Đăng ký'}</button>
          <div class="muted" style="font-size:13px;text-align:center">
            ${mode==='login'
              ? 'Chưa có tài khoản? <a id="toSignup">Đăng ký</a>'
              : 'Đã có tài khoản? <a id="toLogin">Đăng nhập</a>'}
          </div>
        </div>
      </div>
    </div>`;
  const submit=async()=>{
    const email=$('#aEmail').value.trim(), password=$('#aPass').value;
    const r=await fetch(`${BASE}/auth/${mode}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    const d=await r.json().catch(()=>({}));
    if(r.ok){ me=d; onAuthed(); }
    else $('#aErr').textContent={invalid_credentials:'Sai email hoặc mật khẩu',email_taken:'Email đã tồn tại',weak_password:'Mật khẩu tối thiểu 6 ký tự',invalid_email:'Email không hợp lệ'}[d.error]||'Lỗi, thử lại';
  };
  $('#aSubmit').onclick=submit;
  $('#aPass').addEventListener('keydown',e=>{if(e.key==='Enter')submit();});
  $('#toSignup')&&($('#toSignup').onclick=()=>renderAuth('signup'));
  $('#toLogin')&&($('#toLogin').onclick=()=>renderAuth('login'));
}

boot();
</script>
</body>

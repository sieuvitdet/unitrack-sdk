<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<title>Mobix · Event Tracking</title>
<style>
  :root{--bg:#0b0e14;--panel:#141925;--panel2:#1b2231;--line:#283044;--text:#e6e9ef;
    --muted:#8b94a7;--accent:#5b8cff;--accent2:#27d796;--warn:#ffb454;--danger:#ff6b6b;--chip:#222a3a;}
  *{box-sizing:border-box;}
  body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);}
  a{color:var(--accent);text-decoration:none;cursor:pointer;}
  header{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5;}
  header .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:700;color:#08111f;}
  header h1{font-size:16px;margin:0;font-weight:600;}
  header .crumb{color:var(--muted);font-size:13px;margin-left:4px;}
  header .live{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);}
  [hidden]{display:none !important;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--accent2);animation:pulse 2s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(39,215,150,.5)}70%{box-shadow:0 0 0 8px rgba(39,215,150,0)}100%{box-shadow:0 0 0 0 rgba(39,215,150,0)}}
  .wrap{padding:22px;max-width:1400px;margin:0 auto;}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;transition:opacity .15s;}
  .btn:hover{opacity:.9;}
  .btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line);}
  .btn.sm{padding:5px 10px;font-size:12px;}
  .btn.danger{background:var(--danger);}
  input,select,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font-size:13px;outline:none;}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:18px;}
  .panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0;padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:20px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;}
  .card .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px;}
  .card .v{font-size:24px;font-weight:700;margin-top:6px;}
  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line);}
  td{padding:9px 14px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top;}
  tr.click:hover{background:var(--panel2);cursor:pointer;}
  tr.click{cursor:pointer;transition:background .1s;}
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;background:var(--chip);color:var(--accent);white-space:nowrap;}
  .badge.flutter{color:#7ee787;}.badge.native_ios{color:#a5a5ff;}.badge.native_android{color:#7ee787;}.badge.react_native{color:#79c0ff;}
  .badge.crash,.badge.json_parse_error,.badge.network_error{color:var(--danger);background:#2a1620;}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;}
  .muted{color:var(--muted);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start;}
  @media(max-width:920px){.grid2{grid-template-columns:1fr;}}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .keybox{background:#0e1320;border:1px dashed var(--line);border-radius:8px;padding:8px 10px;font-family:ui-monospace,monospace;font-size:12px;color:var(--accent2);word-break:break-all;}
  .tabs{display:flex;gap:6px;padding:0 16px;border-bottom:1px solid var(--line);}
  .tab{padding:11px 12px;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;}
  .tab.active{color:var(--text);border-bottom-color:var(--accent);}
  .empty{padding:40px;text-align:center;color:var(--muted);}
  .deflist{display:flex;flex-direction:column;gap:8px;padding:14px 16px;}
  .def{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;cursor:grab;display:flex;justify-content:space-between;align-items:center;}
  .def:active{cursor:grabbing;}
  .def .nm{font-weight:600;color:var(--accent2);}
  .elrow{transition:background .15s;}
  .elrow.drop{background:rgba(91,140,255,.18);outline:2px dashed var(--accent);}
  .pill{background:var(--chip);border-radius:6px;padding:1px 8px;font-size:11px;}
  dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:0;width:480px;max-width:92vw;}
  dialog::backdrop{background:rgba(0,0,0,.5);}
  .dlg-h{padding:16px;border-bottom:1px solid var(--line);font-weight:600;display:flex;justify-content:space-between;align-items:center;}
  .dlg-b{padding:16px;display:flex;flex-direction:column;gap:12px;max-height:60vh;overflow-y:auto;}
  .dlg-f{padding:14px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}
  label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px;}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(860px,70vw);max-width:96vw;background:var(--panel);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .2s;z-index:20;display:flex;flex-direction:column;}
  @media(max-width:760px){.drawer{width:96vw;}}
  .drawer.open{transform:translateX(0);}
  .drawer .dh{display:flex;align-items:center;gap:10px;padding:16px;border-bottom:1px solid var(--line);}
  .drawer .dh button{margin-left:auto;background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;}
  .drawer .db{padding:16px;overflow:auto;}
  .drawer pre{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:12px;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;overflow-x:hidden;}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:15;display:none;}
  .scrim.open{display:block;}
  .kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;margin-bottom:14px;font-size:13px;}
  .kv .key{color:var(--muted);}
  .kv .mono{word-break:break-word;overflow-wrap:anywhere;}
  .filter-bar{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .filter-bar input,.filter-bar select{height:32px;font-size:12px;padding:6px 10px;}
  .autocomplete-list{position:absolute;background:var(--panel2);border:1px solid var(--line);border-radius:6px;max-height:200px;overflow-y:auto;z-index:10;min-width:200px;}
  .autocomplete-list .item{padding:8px 12px;cursor:pointer;font-size:12px;}
  .autocomplete-list .item:hover{background:var(--panel);color:var(--accent2);}
  .relative{position:relative;}
</style>
</head>
<body>
<header>
  <div class="logo">M</div>
  <h1>Event Tracking</h1>
  <span class="crumb" id="crumb"></span>
  <span style="margin-left:18px" id="nav" hidden><a id="navProjects">Dự án</a> <span id="navCmsWrap">· <a id="navCms">CMS tổng quan</a></span></span>
  <div class="live" id="userBox" hidden><span class="muted" id="userEmail"></span> · <a id="logout">Đăng xuất</a></div>
</header>
<div class="wrap" id="view">
  <div style="max-width:380px;margin:8vh auto;display:none" id="bootSplash">
    <div class="panel" style="padding:20px;text-align:center;color:var(--muted)">Đang tải...</div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer">
  <div class="dh"><span class="badge" id="dBadge">event</span><span class="mono muted" id="dId"></span><button id="dClose">×</button></div>
  <div class="db">
    <div class="kv" id="dKv"></div>
    <h2 id="dDeviceH" style="font-size:12px;color:var(--muted);margin:0 0 6px">DEVICE</h2><pre id="dDevice"></pre>
    <h2 id="dPropsH" style="font-size:12px;color:var(--muted);margin:14px 0 6px">PROPERTIES</h2><pre id="dProps"></pre>
  </div>
</div>

<dialog id="projDlg">
  <div class="dlg-h">Tạo dự án mới<button onclick="projDlg.close()" style="background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer">×</button></div>
  <div class="dlg-b">
    <div><label>Tên dự án</label><input id="pName" placeholder="Mobix Shop" style="width:100%"/></div>
    <div><label>App bundle / package</label><input id="pBundle" placeholder="asia.mobix.shop" style="width:100%"/></div>
    <div><label>Loại source</label>
      <select id="pType" style="width:100%">
        <option value="native_ios">Native iOS</option>
        <option value="native_android">Native Android</option>
        <option value="flutter">Flutter</option>
        <option value="react_native">React Native</option>
      </select></div>
  </div>
  <div class="dlg-f"><button class="btn ghost" onclick="projDlg.close()">Huỷ</button><button class="btn" id="pCreate">Tạo</button></div>
</dialog>

<dialog id="treeMappingDlg">
  <div class="dlg-h">Gán event<button onclick="treeMappingDlg.close()" style="background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer">×</button></div>
  <div class="dlg-b">
    <div class="muted" style="font-size:12px;margin-bottom:10px" id="treeMappingInfo"></div>
    <div><label>Tên nghiệp vụ</label>
      <div class="relative">
        <input id="treeMapName" placeholder="vd: user_purchase_completed" style="width:100%"/>
        <div id="treeNameSuggest" class="autocomplete-list" style="display:none"></div>
      </div>
    </div>
    <div><label>Schema iglu (tuỳ chọn)</label><input id="treeMapSchema" placeholder="iglu:vendor/event/jsonschema/1-0-0" style="width:100%"/></div>
  </div>
  <div class="dlg-f"><button class="btn ghost" onclick="treeMappingDlg.close()">Huỷ</button><button class="btn" id="treeSaveMap">Lưu</button></div>
</dialog>

<script>
const BASE = location.pathname.replace(/\/index\.html$/,'').replace(/\/$/,'');
async function api(p,o){
  const r=await fetch(BASE+p,o);
  if(r.status===401){ me=null; renderAuth('login'); throw new Error('Phiên hết hạn'); }
  const ct=r.headers.get('content-type')||'';
  const body=ct.includes('json')?await r.json().catch(()=>({})):await r.text();
  if(!r.ok) throw new Error((body&&body.error)||('HTTP '+r.status));
  return body;
}
const $=(s)=>document.querySelector(s);
function toast(msg,kind){
  let t=document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast';
    t.style.cssText='position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:50;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;color:#fff;box-shadow:0 6px 24px rgba(0,0,0,.4);opacity:0;transition:opacity .18s';
    document.body.appendChild(t); }
  t.style.background = kind==='err' ? 'var(--danger)' : 'var(--accent2)';
  t.textContent=msg; t.style.opacity='1';
  clearTimeout(t._h); t._h=setTimeout(()=>{t.style.opacity='0';},1800);
}
const esc=(s)=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtAgo=(ms)=>{if(!ms)return'—';const s=(Date.now()-ms)/1000;if(s<60)return Math.floor(s)+'s';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h';return Math.floor(s/86400)+'d';};
const fmtTime=(ms)=>new Date(ms).toLocaleString('vi-VN',{hour12:false});
// Short, readable session id for tracing one session across tabs.
const shortSid=(s)=>s?('#'+String(s).slice(0,8)):'—';
function evTag(r){
  let p=r.properties; if(typeof p==='string'){try{p=JSON.parse(p);}catch(_){p={};}}
  p=p||{};
  const tag=(t,color)=>` <span style="font-size:10px;padding:1px 5px;border-radius:4px;background:${color};color:#fff;vertical-align:middle">${t}</span>`;
  let out='';
  if(r.event_name==='crash' && (p.crash_on_launch===true||p.crash_on_launch==='true')) out+=tag('on-launch','#b91c1c');
  if(r.event_name==='notification' && p.state) out+=tag(p.state,{foreground:'#2563eb',background:'#6b7280',silent:'#7c3aed'}[p.state]||'#6b7280');
  return out;
}

let route = {name:'projects', pid:null, tab:'sessions'};
function go(r){route={...route,...r};render();}

$('#navProjects').onclick=()=>go({name:'projects'});
$('#navCms').onclick=()=>go({name:'cms'});

async function render(){
  try{
    if(route.name==='projects'){ $('#crumb').textContent=''; return await renderProjects(); }
    if(route.name==='project'){ return await renderProject(); }
    if(route.name==='cms'){ $('#crumb').textContent='· CMS'; return await renderCMS(); }
  }catch(e){
    $('#view').innerHTML=`<div class="panel" style="padding:20px"><b style="color:var(--danger)">Lỗi</b><pre style="white-space:pre-wrap;color:var(--muted)">${esc(e&&e.stack||e)}</pre></div>`;
  }
}

function gradeColor(g){return {A:'var(--accent2)',B:'var(--accent)',C:'var(--warn)',D:'var(--danger)','N/A':'var(--muted)'}[g]||'var(--muted)';}
function scoreBar(h){
  return `<div style="display:flex;align-items:center;gap:8px">
    <div style="width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;border:3px solid ${gradeColor(h.grade)};color:${gradeColor(h.grade)}">${h.grade}</div>
    <div><div style="font-weight:700;font-size:16px">${h.score}<span class="muted" style="font-size:12px">/100</span></div>
    <div class="muted" style="font-size:11px">${esc(h.verdict)}</div></div></div>`;
}
async function renderCMS(){
  const data=await api('/api/cms/overview');
  const t=data.totals;
  $('#view').innerHTML=`
    <h2 style="margin:0 0 16px;border:none;padding:0;text-transform:none;font-size:18px;color:var(--text);letter-spacing:0">CMS — Tổng quan tất cả dự án</h2>
    <div class="cards">
      <div class="card"><div class="k">Dự án</div><div class="v">${t.projects}</div></div>
      <div class="card"><div class="k">Tổng events</div><div class="v">${t.events.toLocaleString()}</div></div>
      <div class="card"><div class="k">Cần chú ý</div><div class="v" style="color:${t.needs_attention?'var(--warn)':'inherit'}">${t.needs_attention}</div></div>
      <div class="card"><div class="k">Naming warnings</div><div class="v" style="color:${t.naming_warnings?'var(--danger)':'inherit'}">${t.naming_warnings}</div></div>
    </div>
    <div class="panel"><table>
      <thead><tr><th>Dự án</th><th>Source</th><th>Events</th><th>Định nghĩa</th><th>Health Score</th><th></th></tr></thead>
      <tbody>${data.projects.length?data.projects.map(p=>`
        <tr class="click">
          <td onclick="go({name:'project',pid:${p.id},tab:'sessions'})"><b>${esc(p.name)}</b><div class="muted mono" style="font-size:11px">${esc(p.app_bundle)||''}</div></td>
          <td><span class="badge ${esc(p.source_type)}">${esc(p.source_type)||'—'}</span></td>
          <td>${p.total_events}</td>
          <td>${p.elements_defined}/${p.elements_total}</td>
          <td>${scoreBar(p.health)}</td>
          <td style="white-space:nowrap"><a class="btn ghost sm" onclick="go({name:'project',pid:${p.id}})">Mở</a></td>
        </tr>`).join(''):'<tr><td colspan=6 class=empty>Chưa có dự án.</td></tr>'}
      </tbody></table></div>`;
}

async function renderProjects(){
  const projs = await api('/api/projects');
  $('#view').innerHTML = `
    <div class="row" style="justify-content:space-between;margin-bottom:16px">
      <h2 style="margin:0;border:none;padding:0;text-transform:none;font-size:18px;color:var(--text)">Dự án</h2>
      <button class="btn" id="newProj">+ Dự án mới</button>
    </div>
    <div class="panel">
      <table><thead><tr><th>Tên</th><th>Bundle</th><th>Source</th><th>Events</th><th>API key</th><th></th></tr></thead>
      <tbody>${projs.length?projs.map(p=>`
        <tr class="click" data-id="${p.id}">
          <td><b>${esc(p.name)}</b></td>
          <td class="mono muted">${esc(p.app_bundle)||'—'}</td>
          <td><span class="badge ${esc(p.source_type)}">${esc(p.source_type)||'—'}</span></td>
          <td>${p.event_count}</td>
          <td><span class="keybox">${esc(p.api_key)}</span></td>
          <td><button class="btn ghost sm del" data-id="${p.id}">Xoá</button></td>
        </tr>`).join(''):'<tr><td colspan="6" class="empty">Chưa có dự án.</td></tr>'}
      </tbody></table>
    </div>`;
  $('#newProj').onclick=()=>{ $('#pName').value='';$('#pBundle').value='';$('#projDlg').showModal(); };
  document.querySelectorAll('tr.click').forEach(tr=>tr.onclick=(e)=>{ if(e.target.closest('.del'))return; go({name:'project',pid:tr.dataset.id}); });
  document.querySelectorAll('.del').forEach(b=>b.onclick=async(e)=>{ e.stopPropagation(); if(confirm('Xoá dự án này?')){ await fetch(`${BASE}/api/projects/${b.dataset.id}`,{method:'DELETE'}); renderProjects(); }});
}

$('#pCreate').onclick=async()=>{
  const body={name:$('#pName').value.trim(),app_bundle:$('#pBundle').value.trim(),source_type:$('#pType').value};
  if(!body.name)return;
  await api('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  $('#projDlg').close(); renderProjects();
};

const PROVIDER_COLORS={unitrack:'#2563eb',snowplow:'#16a34a',firebase:'#d97706'};
function providerBadge(p){
  const c=PROVIDER_COLORS[p]||'#6b7280';
  return `<span style="font-size:10px;padding:1px 6px;border-radius:4px;background:${c};color:#fff">${esc(p||'unitrack')}</span>`;
}

async function renderProject(){
  const pid=route.pid;
  const [p,stats]=await Promise.all([api(`/api/projects/${pid}`),api(`/api/projects/${pid}/stats`)]);
  $('#crumb').innerHTML=`· <a onclick="go({name:'projects'})">Dự án</a> / ${esc(p.name)}`;
  $('#view').innerHTML=`
    <div class="row" style="justify-content:space-between;margin-bottom:16px">
      <div class="row">
        <a onclick="go({name:'projects'})">← Dự án</a>
        <h2 style="margin:0;border:none;padding:0;text-transform:none;font-size:18px;color:var(--text)">${esc(p.name)}</h2>
        <span class="badge ${esc(p.source_type)}">${esc(p.source_type)}</span>
      </div>
      <div class="row">
        <span class="keybox" title="API key">${esc(p.api_key)}</span>
        <a class="btn ghost sm" href="${BASE}/api/projects/${pid}/export">⬇ Export Excel</a>
      </div>
    </div>
    <div class="cards">
      <div class="card"><div class="k">Events</div><div class="v">${stats.total}</div></div>
      <div class="card"><div class="k">Sessions</div><div class="v">${stats.sessions}</div></div>
      <div class="card"><div class="k">Users</div><div class="v">${stats.users}</div></div>
      <div class="card"><div class="k">Crashes</div><div class="v" style="color:${stats.crashes?'var(--danger)':'inherit'}">${stats.crashes}</div></div>
    </div>
    <div class="panel">
      <div class="tabs">
        <div class="tab ${route.tab==='logs'?'active':''}" data-tab="logs">Log events</div>
        <div class="tab ${(!route.tab||route.tab==='sessions')?'active':''}" data-tab="sessions">Sessions</div>
        <div class="tab ${route.tab==='agent'?'active':''}" data-tab="agent">Agent</div>
        <div class="tab ${route.tab==='tree'?'active':''}" data-tab="tree">Cây class → event</div>
      </div>
      <div id="tabBody"></div>
    </div>`;
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>go({tab:t.dataset.tab}));
  if(route.tab==='logs') renderLogs(pid);
  else if(route.tab==='agent') renderAgent(pid);
  else if(route.tab==='tree') renderTree(pid);
  else renderSessions(pid);   // default tab = Sessions
}

// ── Agent tab: root-agent config + reports (Phase 3/4/5) ───────────────────
async function renderAgent(pid){
  const [cfg, reports] = await Promise.all([
    api(`/api/projects/${pid}/agent`),
    api(`/api/projects/${pid}/reports`),
  ]);
  const v=(x)=>esc(x||'');
  $('#tabBody').innerHTML=`
    <div style="padding:16px;max-width:820px">
      <div class="muted" style="font-size:12px;margin-bottom:14px">
        Root agent của dự án: định kỳ phân tích sessions/flows → gọi LLM → gửi báo cáo.
        Bí mật (API key, Telegram token) chỉ hiển thị dạng che; để trống = giữ nguyên.
      </div>
      <label class="row" style="gap:6px;display:inline-flex;margin-bottom:12px">

// ── Flows tab: usage + crash/stuck rate per flow (Phase 2) ─────────────────
// Tab Flows: each flow rendered as a visual chain of screen chips (Home → List
// → Detail) with a usage bar + crash/stuck badges. Far easier to scan than a
// dense number table.
function flowChips(sig){
  if(sig==='(no_screens)') return '<span class="muted" style="font-size:12px">(không đi qua màn nào)</span>';
  const steps = sig.split('>');
  return steps.map((s,i)=>`
    <span style="display:inline-flex;align-items:center">
      <span style="background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px 9px;font-size:12px;white-space:nowrap">${esc(s)}</span>
      ${i<steps.length-1?'<span style="color:var(--accent);margin:0 4px">→</span>':''}
    </span>`).join('');
}
async function renderFlows(pid){
  const flows=await api(`/api/projects/${pid}/flows`);
  const maxUsage=flows.reduce((m,f)=>Math.max(m,f.session_count),0)||1;
  // Risk badge: red when crash/stuck is high, amber when moderate, hidden when clean.
  const badge=(label,count,rate)=>{
    if(!count) return '';
    const c = rate>=20?'var(--danger)': rate>=5?'var(--warn)':'var(--muted)';
    return `<span style="font-size:11px;padding:2px 8px;border-radius:6px;background:${c}22;color:${c};border:1px solid ${c}55;white-space:nowrap">${label} ${count} · ${rate}%</span>`;
  };
  $('#tabBody').innerHTML=`
    <div class="filter-bar"><span class="muted" style="font-size:12px;align-self:center">
      ${flows.length} flow — xếp theo lượt dùng. Mỗi dòng là một hành trình màn hình; nhãn đỏ = hay crash/stuck.
    </span></div>
    <div style="max-height:62vh;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px">
      ${flows.length?flows.map(f=>`
        <div style="background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1;min-width:200px">
              ${flowChips(f.flow_signature)}
            </div>
            <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
              ${badge('⚠ crash',f.crash_count,f.crash_rate)}
              ${badge('🕐 stuck',f.terminate_count,f.stuck_rate)}
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted)">
            <div style="display:flex;align-items:center;gap:8px;flex:1;max-width:340px">
              <div style="flex:1;height:8px;background:var(--panel2);border-radius:4px;overflow:hidden">
                <div style="height:100%;width:${Math.round(f.session_count/maxUsage*100)}%;background:var(--accent);border-radius:4px"></div>
              </div>
              <b style="color:var(--text)">${f.session_count}</b> session (${f.usage_pct}%)
            </div>
            <span>⏱ TB ${f.avg_duration_ms!=null?fmtDur(f.avg_duration_ms):'—'}</span>
            <span>kết thúc tại <b style="color:var(--text)">${esc(f.last_screen)||'—'}</b></span>
          </div>
        </div>`).join(''):'<div class="empty">Chưa có flow. Cần session đã reconstruct (tab Sessions).</div>'}
    </div>`;
}

// ── Wireframe tab: flow graph + heatmap (Wireframe Phase 1) ────────────────
// Layout: BFS from entry_screen assigns each node a column (depth) and a row
// within that column. Render as SVG: rect nodes (size ∝ visits, fill by
// stuck_score) + curved edges (width ∝ count, arrowhead) + legend + hover tip.
function layoutGraph(g){
  const adj = new Map();         // screen → [neighbour]
  for(const e of g.edges){
    if(!adj.has(e.from)) adj.set(e.from, []);
    adj.get(e.from).push(e.to);
  }
  // BFS from entry (fallback: most-visited node). Unreached nodes get their
  // own next column so they still render.
  const level = new Map();       // screen → column index
  const start = g.entry_screen || (g.nodes[0] && g.nodes[0].screen);
  const queue = [];
  if(start){ level.set(start, 0); queue.push(start); }
  while(queue.length){
    const s = queue.shift();
    for(const n of (adj.get(s)||[])){
      if(!level.has(n)){ level.set(n, level.get(s)+1); queue.push(n); }
    }
  }
  // Place any isolated nodes (no path from entry) in the last column.
  let maxCol = 0; for(const v of level.values()) if(v>maxCol) maxCol = v;
  for(const n of g.nodes) if(!level.has(n.screen)) level.set(n.screen, maxCol+1);
  // Rows: within each column, order by visits desc.
  const cols = new Map();        // col → [{screen,visits}]
  for(const n of g.nodes){
    const c = level.get(n.screen);
    if(!cols.has(c)) cols.set(c, []);
    cols.get(c).push(n);
  }
  for(const arr of cols.values()) arr.sort((a,b)=>b.visits-a.visits);

  // Pixel positions. Wider columns + taller rows so edges have room to curve
  // without overlapping.
  const COL_W=260, ROW_H=140, NODE_W=150, NODE_H=64;
  const pos = new Map();         // screen → {x,y}
  for(const [c,arr] of cols){
    arr.forEach((n,i)=>{
      pos.set(n.screen, { x: 60 + c*COL_W, y: 60 + i*ROW_H });
    });
  }
  const maxLevel = Math.max(0, ...[...level.values()]);
  const cw = (maxLevel+1)*COL_W + 60 + NODE_W;
  const maxRows = Math.max(1, ...[...cols.values()].map(a=>a.length));
  const ch = maxRows*ROW_H + 120;
  // level map lets the renderer tell forward edges (col→col+) from back-edges
  // (col→col- or same col) and route them differently to avoid overlap.
  return { pos, level, NODE_W, NODE_H, cw, ch };
}

// Map stuck_score (0..1) to a fill color (green → yellow → red).
function stuckColor(score){
  if(score >= 0.7) return '#dc2626';   // red
  if(score >= 0.4) return '#f59e0b';   // amber
  if(score >= 0.15) return '#facc15';  // yellow
  return '#16a34a';                    // green
}

async function renderWireframe(pid){
  const g = await api(`/api/projects/${pid}/flowgraph`);
  if(!g.nodes || !g.nodes.length){
    $('#tabBody').innerHTML=`<div class="empty">Chưa có flow graph. Cần session journey (tab Sessions). App build mới sẽ gửi dữ liệu để dựng wireframe.</div>`;
    return;
  }
  const { pos, level, NODE_W, NODE_H, cw, ch } = layoutGraph(g);
  const maxVisits = Math.max(...g.nodes.map(n=>n.visits)) || 1;
  const maxEdge   = Math.max(...g.edges.map(e=>e.count), 1);

  // Build edges (curved path) BEFORE nodes so nodes render on top. Route by
  // direction to avoid overlap:
  //  • forward (to a later column): smooth S-curve between right→left sides
  //  • back / same-level: a curve bowing BELOW the nodes, drawn amber so it's
  //    distinct from forward flow
  //  • self-loop (A→A): a small loop above the node
  // When several edges share the same pair of rows, fan them out with a small
  // vertical offset so they don't stack on one line.
  const pairSeen = new Map();   // "fromY-toY" → running offset index
  const edgeSvg = g.edges.map(e=>{
    const a=pos.get(e.from), b=pos.get(e.to);
    if(!a||!b) return '';
    const w = 1.2 + (e.count/maxEdge)*4.5;
    const op = 0.4 + (e.count/maxEdge)*0.5;
    const common = `data-from="${esc(e.from)}" data-to="${esc(e.to)}" data-count="${e.count}" data-ms="${e.avg_ms}" stroke-width="${w.toFixed(1)}" stroke-opacity="${op.toFixed(2)}" fill="none"`;

    // Self-loop.
    if(e.from===e.to){
      const cx=a.x+NODE_W/2, top=a.y;
      const d=`M${cx-18},${top} C${cx-40},${top-46} ${cx+40},${top-46} ${cx+18},${top}`;
      return `<path d="${d}" stroke="#a78bfa" ${common} marker-end="url(#arrowBack)"/>`;
    }

    const lf=level.get(e.from), lt=level.get(e.to);
    const forward = lt>lf;
    // Slight fan-out offset for parallel edges between the same rows.
    const key=`${Math.round(a.y)}-${Math.round(b.y)}-${forward}`;
    const idx=(pairSeen.get(key)||0); pairSeen.set(key, idx+1);
    const off=idx*14;

    if(forward){
      const x1=a.x+NODE_W, y1=a.y+NODE_H/2;
      const x2=b.x,        y2=b.y+NODE_H/2;
      const mx=(x1+x2)/2;
      const d=`M${x1},${y1} C${mx},${y1+off} ${mx},${y2+off} ${x2},${y2}`;
      return `<path d="${d}" stroke="#5b8cff" ${common} marker-end="url(#arrow)"/>`;
    } else {
      // Back / same-level: exit bottom of `from`, bow downward, enter bottom of `to`.
      const x1=a.x+NODE_W/2, y1=a.y+NODE_H;
      const x2=b.x+NODE_W/2, y2=b.y+NODE_H;
      const dip=Math.max(40, 50+off);
      const my=Math.max(y1,y2)+dip;
      const d=`M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`;
      return `<path d="${d}" stroke="#f59e0b" ${common} stroke-dasharray="5,4" marker-end="url(#arrowBack)"/>`;
    }
  }).join('');

  const nodeSvg = g.nodes.map(n=>{
    const p=pos.get(n.screen); if(!p) return '';
    const size = 0.75 + (n.visits/maxVisits)*0.5;   // 0.75x..1.25x scale
    const w = NODE_W*size, h = NODE_H*size;
    const x = p.x + (NODE_W-w)/2, y = p.y + (NODE_H-h)/2;
    const fill = stuckColor(n.stuck_score);
    const labelMax = 16;
    const label = n.screen.length>labelMax ? n.screen.slice(0,labelMax-1)+'…' : n.screen;
    const badge = n.crash_count>0 ? '⚠ ' : '';
    return `<g class="wf-node" data-screen="${esc(n.screen)}" data-visits="${n.visits}" data-exits="${n.exits}" data-exit-pct="${n.exit_pct}" data-crash="${n.crash_count}" data-stuck="${n.stuck_score}" data-dwell="${n.avg_dwell_ms}" style="cursor:pointer">
      <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="${fill}" fill-opacity="0.18" stroke="${fill}" stroke-width="2"/>
      <text x="${p.x+NODE_W/2}" y="${p.y+NODE_H/2-4}" text-anchor="middle" fill="var(--text)" font-size="13" font-weight="600">${badge}${esc(label)}</text>
      <text x="${p.x+NODE_W/2}" y="${p.y+NODE_H/2+14}" text-anchor="middle" fill="var(--muted)" font-size="11">${n.visits} session · exit ${n.exit_pct}%</text>
    </g>`;
  }).join('');

  // Fetch session list for the replay sidebar in parallel with rendering.
  const sessResp = await api(`/api/projects/${pid}/sessions`).catch(()=>({sessions:[]}));
  const sessions = (sessResp.sessions||[]).slice(0, 200);
  // Sidebar: newest first, badge crash/stuck.
  const sessListHtml = sessions.length ? sessions.map(s=>{
    const dot = s.crashed ? '#dc2626' : (s.ended_reason==='inferred_terminate' ? '#f59e0b' : '#5b8cff');
    return `<div class="wf-sess" data-sid="${esc(s.session_id)}" style="padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:12px">
      <div style="display:flex;justify-content:space-between;gap:6px;align-items:center">
        <span style="color:${dot};font-weight:600">●</span>
        <span class="mono" style="color:var(--accent2)">${shortSid(s.session_id)}</span>
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right" class="mono muted">${esc((s.flow_signature||'').slice(0,24))||'(no flow)'}</span>
      </div>
      <div class="muted" style="font-size:10px;margin-top:2px">${s.started_at?fmtTime(s.started_at):''} · ${fmtDur(s.duration_ms)} · ${esc(s.ended_reason)}</div>
    </div>`;
  }).join('') : '<div class="empty" style="padding:20px;font-size:12px">Chưa có session</div>';

  $('#tabBody').innerHTML = `
    <div class="filter-bar" style="justify-content:space-between">
      <span class="muted" style="font-size:12px">
        ${g.totals.sessions} session · ${g.totals.screens} màn · ${g.totals.transitions} chuyển màn · entry: <b>${esc(g.entry_screen)||'—'}</b>
      </span>
      <span class="muted" style="font-size:11px;display:flex;gap:10px;align-items:center">
        <span><span style="display:inline-block;width:10px;height:10px;background:#16a34a;border-radius:50%;vertical-align:middle"></span> ổn</span>
        <span><span style="display:inline-block;width:10px;height:10px;background:#facc15;border-radius:50%;vertical-align:middle"></span> theo dõi</span>
        <span><span style="display:inline-block;width:10px;height:10px;background:#f59e0b;border-radius:50%;vertical-align:middle"></span> nghẽn</span>
        <span><span style="display:inline-block;width:10px;height:10px;background:#dc2626;border-radius:50%;vertical-align:middle"></span> crash/stuck</span>
      </span>
    </div>
    <div style="display:grid;grid-template-columns:1fr 280px;gap:0;max-height:70vh">
      <div style="position:relative;overflow:auto;background:var(--bg);border-right:1px solid var(--line)">
        <svg id="wfSvg" width="${cw}" height="${ch+160}" xmlns="http://www.w3.org/2000/svg" style="display:block">
          <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 Z" fill="#5b8cff"/>
            </marker>
            <marker id="arrowBack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 Z" fill="#f59e0b"/>
            </marker>
          </defs>
          ${edgeSvg}
          ${nodeSvg}
          <!-- Replay overlay (hidden until a session is selected) -->
          <g id="wfReplay" style="display:none">
            <circle id="wfRipple" r="0" fill="#27d796" fill-opacity="0.35" stroke="#27d796" stroke-width="2"/>
            <circle id="wfCursor" r="10" fill="#27d796" stroke="#fff" stroke-width="2"/>
            <text id="wfStuckLabel" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626" style="display:none"/>
          </g>
        </svg>
        <div id="wfTip" style="position:absolute;display:none;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;pointer-events:none;z-index:5;max-width:240px"></div>
        <!-- Replay controls (visible only during replay) -->
        <div id="wfCtrl" style="display:none;position:sticky;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;align-items:center;font-size:12px">
          <button class="btn sm" id="wfPlay" style="min-width:60px">▶ Play</button>
          <span id="wfTime" class="mono muted" style="min-width:80px">0.0s / 0.0s</span>
          <input id="wfSeek" type="range" min="0" max="1000" value="0" style="flex:1"/>
          <select id="wfSpeed" style="height:28px">
            <option value="1">1x</option><option value="2">2x</option>
            <option value="4" selected>4x</option><option value="8">8x</option><option value="16">16x</option>
          </select>
          <span id="wfNow" class="muted" style="min-width:140px;text-align:right"></span>
          <button class="btn ghost sm" id="wfStop">✕</button>
        </div>
      </div>
      <div style="overflow:auto;max-height:70vh;background:var(--panel)">
        <div style="padding:10px 12px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--line);background:var(--panel2)">Sessions — click để replay</div>
        <div id="wfSessList">${sessListHtml}</div>
      </div>
    </div>`;

  // ── tooltip handlers ─────────────────────────────────────────────────────
  const tip = document.getElementById('wfTip');
  const svg = document.getElementById('wfSvg');
  const showTip = (html, evt)=>{
    tip.innerHTML = html;
    const r = svg.getBoundingClientRect();
    tip.style.left = (evt.clientX - r.left + 14) + 'px';
    tip.style.top  = (evt.clientY - r.top  + 14) + 'px';
    tip.style.display = 'block';
  };
  const hideTip = ()=>{ tip.style.display='none'; };
  svg.querySelectorAll('.wf-node').forEach(g=>{
    g.addEventListener('mousemove',(ev)=>{
      const d=g.dataset;
      const dwell = d.dwell>0 ? fmtDur(+d.dwell) : '—';
      showTip(`<b>${esc(d.screen)}</b><br>
        Visits: ${d.visits}<br>
        Thoát tại đây: ${d.exits} (${d.exitPct}%)<br>
        ${d.crash>0?'<span style="color:var(--danger)">⚠ Crash: '+d.crash+'</span><br>':''}
        Dwell TB: ${dwell}<br>
        Stuck score: ${d.stuck}`, ev);
    });
    g.addEventListener('mouseleave', hideTip);
  });
  svg.querySelectorAll('path[data-from]').forEach(p=>{
    p.addEventListener('mousemove',(ev)=>{
      const d=p.dataset;
      showTip(`<b>${esc(d.from)} → ${esc(d.to)}</b><br>
        Lượt chuyển: ${d.count}<br>
        Trung bình: ${d.ms>0?fmtDur(+d.ms):'—'}`, ev);
    });
    p.addEventListener('mouseleave', hideTip);
  });

  // ── Wire session sidebar → replay (Phase 2) ─────────────────────────────
  // Dwell baseline per node from the flow graph — used to flag "stuck" frames
  // during replay (a step lingers far longer than that node's typical dwell).
  const dwellBaseline = {};
  for (const n of g.nodes) dwellBaseline[n.screen] = n.avg_dwell_ms || 0;
  // Compact node geometry (centre points) for the replay cursor.
  const nodePos = {};
  for (const n of g.nodes) {
    const p = pos.get(n.screen);
    if (p) nodePos[n.screen] = { cx: p.x + NODE_W/2, cy: p.y + NODE_H/2 };
  }
  document.querySelectorAll('.wf-sess').forEach(el=>{
    el.onclick = ()=> startReplay(pid, el.dataset.sid, nodePos, dwellBaseline);
  });
}

// ── Replay engine: drive the wireframe cursor along a session's journey ────
let _wfReplayState = null;   // { steps, nodePos, dwellBaseline, t0, paused, speed, raf, totalMs }

function stopReplay(){
  if(_wfReplayState && _wfReplayState.raf) cancelAnimationFrame(_wfReplayState.raf);
  _wfReplayState = null;
  const r = document.getElementById('wfReplay'); if(r) r.style.display='none';
  const c = document.getElementById('wfCtrl');   if(c) c.style.display='none';
  // Clear any stuck highlight applied to nodes during replay.
  document.querySelectorAll('#wfSvg .wf-node rect').forEach(rect=>{
    rect.style.filter = '';
  });
}

async function startReplay(pid, sid, nodePos, dwellBaseline){
  stopReplay();
  let s;
  try { s = await api(`/api/projects/${pid}/sessions/${encodeURIComponent(sid)}`); }
  catch(e){ toast('Không tải được session','err'); return; }

  // Collapse identical consecutive screens into a single "segment" so the
  // cursor stays put while taps/network events fire ON that screen — same
  // shape buildSessionRow uses on the server. Skip lifecycle steps with no
  // screen (app_start/identify/...) — they aren't screens to land the cursor on,
  // but keep them attached to the FIRST real segment so their events still ripple.
  const journey = (s.journey || []).filter(x=>x && x.ts);
  if(!journey.length){ toast('Session không có hành trình','err'); return; }
  const withScreen = journey.filter(x=>x.screen);
  if(!withScreen.length){ toast('Session này chưa đi qua màn nào (chỉ có lifecycle event)','err'); return; }
  const segs = [];
  for(const j of withScreen){
    const last = segs[segs.length-1];
    if(last && last.screen === j.screen){
      last.last_ts = j.ts; last.events.push(j);
    } else {
      segs.push({ screen: j.screen, start_ts: j.ts, last_ts: j.ts, events: [j] });
    }
  }
  // Resolve segment positions on the graph; segments whose screen isn't in the
  // graph (rare — a screen with no transitions) fall back to the first node.
  const fallback = Object.values(nodePos)[0] || { cx: 100, cy: 100 };
  for(const seg of segs){ seg.pos = nodePos[seg.screen] || fallback; }

  const t0 = segs[0].start_ts;
  const tEnd = segs[segs.length-1].last_ts;
  const totalMs = Math.max(1, tEnd - t0);

  _wfReplayState = {
    segs, nodePos, dwellBaseline, totalMs,
    paused: false, speed: parseFloat(document.getElementById('wfSpeed').value)||4,
    sessionStartedAt: s.started_at || t0,
    startedWallClock: performance.now(),
    pausedAt: 0, raf: null,
  };

  document.getElementById('wfReplay').style.display = '';
  const ctrl = document.getElementById('wfCtrl');
  ctrl.style.display = 'flex';
  document.getElementById('wfPlay').textContent = '⏸ Pause';
  document.getElementById('wfSeek').value = 0;
  document.getElementById('wfTime').textContent = `0.0s / ${(totalMs/1000).toFixed(1)}s`;
  document.getElementById('wfNow').textContent = shortSid(sid) + ' · ' + fmtTime(_wfReplayState.sessionStartedAt);
  _wfReplayState.sid = sid;

  // Highlight the selected session in the sidebar.
  document.querySelectorAll('.wf-sess').forEach(el=>{
    el.style.background = el.dataset.sid===sid ? 'var(--panel2)' : '';
  });

  // Controls.
  document.getElementById('wfPlay').onclick = ()=>{
    const st=_wfReplayState; if(!st)return;
    if(st.paused){
      // Resume: shift wall clock so the elapsed picks up where we paused.
      st.startedWallClock = performance.now() - st.pausedAt/st.speed;
      st.paused = false;
      document.getElementById('wfPlay').textContent='⏸ Pause';
      st.raf = requestAnimationFrame(tickReplay);
    } else {
      st.paused = true;
      st.pausedAt = (performance.now() - st.startedWallClock) * st.speed;
      document.getElementById('wfPlay').textContent='▶ Play';
      if(st.raf) cancelAnimationFrame(st.raf);
    }
  };
  document.getElementById('wfStop').onclick = stopReplay;
  document.getElementById('wfSpeed').onchange = (ev)=>{
    const st=_wfReplayState; if(!st)return;
    const newSpeed = parseFloat(ev.target.value)||4;
    // Keep current elapsed when changing speed.
    const elapsed = st.paused ? st.pausedAt : (performance.now()-st.startedWallClock)*st.speed;
    st.speed = newSpeed;
    if(st.paused) st.pausedAt = elapsed;
    else st.startedWallClock = performance.now() - elapsed/newSpeed;
  };
  document.getElementById('wfSeek').oninput = (ev)=>{
    const st=_wfReplayState; if(!st)return;
    const frac = ev.target.value/1000;
    const elapsed = frac * st.totalMs;
    if(st.paused){ st.pausedAt = elapsed; }
    else { st.startedWallClock = performance.now() - elapsed/st.speed; }
    // Render the frame now so seeking is instant even while paused.
    renderReplayFrame(elapsed);
  };

  // Kick off.
  _wfReplayState.raf = requestAnimationFrame(tickReplay);
}

// Map a virtual elapsed-ms (since journey start) to a (segment, intra-segment
// fraction). For transitions between segments we tween the cursor along the
// straight line between the two node centres so the user sees the move.
function renderReplayFrame(elapsedMs){
  const st = _wfReplayState; if(!st) return;
  const cursor = document.getElementById('wfCursor');
  const ripple = document.getElementById('wfRipple');
  const stuckLabel = document.getElementById('wfStuckLabel');
  const seek = document.getElementById('wfSeek');
  const timeLbl = document.getElementById('wfTime');
  const nowLbl = document.getElementById('wfNow');

  const t0 = st.segs[0].start_ts;
  const tNow = t0 + Math.min(elapsedMs, st.totalMs);

  // Find the current segment (the one whose [start_ts, next.start_ts) contains tNow).
  let i = 0;
  for(; i < st.segs.length - 1; i++){
    if(st.segs[i+1].start_ts > tNow) break;
  }
  const cur = st.segs[i];
  const nxt = st.segs[i+1];
  let cx, cy;
  // Transition window: animate the move during the last 600ms of the cursor's
  // time on `cur` before tNow reaches `nxt.start_ts`. Outside that, sit on the node.
  const TRANS_MS = 600;
  if(nxt && (nxt.start_ts - tNow) < TRANS_MS && nxt.pos && cur.pos){
    const f = 1 - (nxt.start_ts - tNow)/TRANS_MS;
    cx = cur.pos.cx + (nxt.pos.cx - cur.pos.cx) * f;
    cy = cur.pos.cy + (nxt.pos.cy - cur.pos.cy) * f;
  } else {
    cx = cur.pos.cx; cy = cur.pos.cy;
  }
  cursor.setAttribute('cx', cx); cursor.setAttribute('cy', cy);

  // Ripple on each non-screen_view event of the current segment, near its ts.
  // We find the latest event in `cur.events` whose ts is within 400ms of tNow.
  let rippleEv = null;
  for(const ev of cur.events){
    if(ev.event_name==='screen_view') continue;
    const dt = tNow - ev.ts;
    if(dt >= 0 && dt < 400) rippleEv = ev;
  }
  if(rippleEv){
    const dt = tNow - rippleEv.ts;
    const f = dt/400;
    ripple.setAttribute('cx', cur.pos.cx);
    ripple.setAttribute('cy', cur.pos.cy);
    ripple.setAttribute('r', 12 + f*30);
    ripple.setAttribute('fill-opacity', (0.45*(1-f)).toFixed(2));
    ripple.setAttribute('stroke', rippleEv.event_name==='crash' ? '#dc2626' : '#27d796');
  } else {
    ripple.setAttribute('r', 0);
  }

  // Stuck detection: how long have we been on this segment? If it's > max(2×
  // node baseline, 3s) AND we're not in a transition window → flag stuck.
  const onSegMs = tNow - cur.start_ts;
  const baseline = st.dwellBaseline[cur.screen] || 0;
  const stuckThresh = Math.max(3000, baseline * 2);
  const isStuck = (baseline > 0 || onSegMs > 5000) && onSegMs > stuckThresh
                  && (!nxt || (nxt.start_ts - tNow) > TRANS_MS);
  if(isStuck){
    stuckLabel.style.display = '';
    stuckLabel.setAttribute('x', cur.pos.cx);
    stuckLabel.setAttribute('y', cur.pos.cy - 32);
    stuckLabel.textContent = `⚠ đứng ${(onSegMs/1000).toFixed(0)}s`;
    // Briefly outline the node red.
    const nodeG = document.querySelector(`#wfSvg .wf-node[data-screen="${cur.screen.replace(/"/g,'\\"')}"] rect`);
    if(nodeG) nodeG.style.filter = 'drop-shadow(0 0 8px #dc2626)';
  } else {
    stuckLabel.style.display = 'none';
    document.querySelectorAll('#wfSvg .wf-node rect').forEach(r=>r.style.filter='');
  }

  // Update controls (only when not actively dragging).
  if(document.activeElement !== seek){
    seek.value = Math.round((elapsedMs/st.totalMs)*1000);
  }
  timeLbl.textContent = `${(elapsedMs/1000).toFixed(1)}s / ${(st.totalMs/1000).toFixed(1)}s`;
  nowLbl.textContent = (st.sid?shortSid(st.sid)+' · ':'') + fmtTime(st.sessionStartedAt + (tNow - t0));
}

function tickReplay(){
  const st = _wfReplayState; if(!st || st.paused) return;
  const elapsed = (performance.now() - st.startedWallClock) * st.speed;
  if(elapsed >= st.totalMs){
    renderReplayFrame(st.totalMs);
    st.paused = true; st.pausedAt = st.totalMs;
    document.getElementById('wfPlay').textContent = '▶ Replay';
    st.startedWallClock = performance.now();   // ready to resume from start if pressed
    st.pausedAt = 0;
    return;
  }
  renderReplayFrame(elapsed);
  st.raf = requestAnimationFrame(tickReplay);
}

// ── Sessions tab: reconstructed journey timeline (Phase 1) ─────────────────
const SESSION_REASON_COLORS={
  background_timeout:'#6b7280', timeout:'#6b7280', manual_reset:'#7c3aed',
  inferred_terminate:'#d97706', active:'#16a34a',

  return `<span style="font-size:10px;padding:1px 6px;border-radius:4px;background:${c};color:#fff">${esc(r||'—')}</span>`;
}
const fmtDur=(ms)=>{ if(ms==null)return'—'; const s=Math.round(ms/1000); if(s<60)return s+'s'; const m=Math.floor(s/60); return m+'m '+(s%60)+'s'; };
